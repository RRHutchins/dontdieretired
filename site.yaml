# ---------------------------------------------------------------
# Don't Die Retired — site configuration
# Fill in the IDs as each account is created. Empty = feature hidden.
# ---------------------------------------------------------------
site:
  name: "Don't Die Retired"
  tagline: "Don't retire from life. This is the time to make the most of it."
  url: "https://dontdieretired.com"
  description: "For anyone who has no intention of slowing down: lifelong movers and people who never got round to it. Real stories, practical plans and daily encouragement to do more, not less, with the years ahead."
  language: "en-GB"
  author: "The Don't Die Retired team"
  contact_email: "hello@dontdieretired.com"
  twitter_handle: "@dontdieretired"

analytics:
  # Choose ONE. Plausible is privacy-friendly and needs no consent banner for basic stats.
  plausible_script_id: "pa-WyPF-52dfInzrW0cQCydh"   # from Plausible > Site settings > Site installation (leave "" to disable)
  ga4_id: ""                                 # e.g. G-XXXXXXXXXX
  hotjar_or_clarity_id: ""                   # Microsoft Clarity project id (free heatmaps)

ads:
  enabled: false                             # set true once AdSense/Ezoic approved
  network: "adsense"                         # adsense | ezoic | mediavine | raptive
  adsense_client: ""                         # e.g. ca-pub-1234567890123456
  slots:
    in_article: ""                           # AdSense slot ids
    sidebar: ""
    footer: ""

affiliates:
  amazon_uk_tag: "dontdieretired-21"         # Amazon Associates UK tracking id
  amazon_us_tag: "dontdieretired-20"
  viator_pid: ""                             # Viator Partner Program id (experiences/lessons); appended to local listings marked aff: viator
  getyourguide_partner_id: ""                # GetYourGuide Partner id; appended to listings marked aff: getyourguide
  disclosure: "Some links on this page are affiliate links. If you buy through them we may earn a small commission at no extra cost to you. We only recommend things we would use ourselves."

newsletter:
  provider: "buttondown"                     # buttondown | beehiiv | mailerlite | kit
  form_action: "https://buttondown.com/api/emails/embed-subscribe/dontdieretired"
  list_name: "The Second Start — free weekly email"
  lead_magnet: "Free: the 7-Day Restart Plan (PDF)"
  paid_tier_url: ""                          # Buttondown/Beehiiv paid subscription link
  paid_tier_price: "£4/month"

products:
  platform: "gumroad"                        # gumroad | lemonsqueezy | payhip
  store_url: "https://dontdieretired.gumroad.com"
  store_live: false                          # set true once every product in content/products.yaml exists on Gumroad at its URL; until then buttons say "Notify me"

feedback:
  # "Your say" page (/your-say/): interests, votes, suggestions. Needs the Cloudflare Pages Function in functions/api
  # (D1 database bound as DB, secrets SALT and ADMIN_TOKEN). Set live: true once /api/say answers; that adds it to nav and sitemap.
  live: false
  endpoint: "/api"

membership:
  platform: "kofi"                           # kofi | patreon | buymeacoffee
  url: "https://ko-fi.com/dontdieretired"
  price: "£5/month"
  name: "The Restart Circle"

sponsorship:
  media_kit_url: "/sponsor/"
  rate_card:
    - {item: "Sponsored article (written by us, clearly labelled)", price: "from £250"}
    - {item: "Newsletter sponsor slot", price: "from £150"}
    - {item: "Video/short-form mention", price: "from £200"}
    - {item: "Monthly category sponsorship", price: "from £600"}

social:
  facebook: "https://facebook.com/dontdieretired"
  instagram: "https://instagram.com/dontdieretired"
  x: "https://x.com/dontdieretired"
  youtube: "https://youtube.com/@dontdieretired"
  pinterest: "https://pinterest.com/dontdieretired"
  tiktok: "https://tiktok.com/@dontdieretired"
  scheduler: "buffer"                        # buffer | publer | zapier — used by RUNBOOK

audience_segments:
  - {id: "restarter", label: "The Restarter", blurb: "I've been inactive for a while and want a gentle, realistic way back.", tags: [beginner, walking, strength, mindset]}
  - {id: "mover", label: "The Mover", blurb: "I'm already active and want the next challenge.", tags: [running, swimming, cycling, endurance, competition]}
  - {id: "learner", label: "The Learner", blurb: "I want to keep my mind sharp — study, skills, creativity.", tags: [learning, brain, creativity, purpose, science, nature, ai]}
  - {id: "carer", label: "The Carer", blurb: "I look after someone and need ways to stay well myself.", tags: [walking, mindset, community, beginner, nature]}
  - {id: "changer", label: "The Career Changer", blurb: "I'm not done working — I want a new venture or purpose.", tags: [business, purpose, learning, community]}

categories:
  move: {label: "Move", blurb: "Strength, walking, swimming, cycling and balance — from whatever starting point you're at."}
  eat: {label: "Eat", blurb: "Protein, bones, fibre and cooking well for one or two — food that keeps you strong."}
  think: {label: "Think", blurb: "Learning, memory, study and creativity at any age."}
  money: {label: "Money", blurb: "Pensions, Social Security, downsizing, scams and making it last. General information, not financial advice."}
  earn: {label: "Earn", blurb: "Second careers, job hunting, freelancing and side businesses."}
  connect: {label: "Connect", blurb: "Friends, clubs, volunteering, grandchildren and the people who keep us going."}
  travel: {label: "Travel", blurb: "Slow travel, walking holidays, trains, insurance and going solo."}
  tech: {label: "Tech", blurb: "Phones, online banking, scams and staying in touch — without the jargon."}
  ai: {label: "AI", blurb: "Artificial intelligence in plain words: how to use it well, how to check it, and how not to be fooled by it."}
  explore: {label: "Explore", blurb: "Science, nature and the outdoors — birds, stars, rocks, rivers, and the projects you can join."}
  stories: {label: "Real Stories", blurb: "Real, sourced stories of people who started late and went far."}
