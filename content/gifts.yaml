# Gift ideas hub (/gifts/). RUNBOOK §6v. Robin, 19 Nov 2026: "a section or hub that helps people select and buy presents
# for friends and family that want to do activities, or they want to do activities. Make it so it is favourable for searches
# and easy for people to share what they find as suggestions."
#
# RULES
# - Every idea is an activity from content/challenges.yaml (`id`), so its facts, kit, reviewers' picks and official links
#   come from that activity and were checked there. This file adds only the gift's name (`gift`), and optionally `book`:
#   searches on Viator or GetYourGuide for a bookable class or trip, used only when the activity has no `book` of its own.
#   They are searches, labelled as searches: never say a specific experience exists, its price or that we tried it.
# - No prices, no "best", no "most popular", no delivery promises (Amazon refuses our fetch tools, so we cannot see dates).
# - Never lead with an age. "Retirement" is allowed because it is an occasion people search for, not a description of the reader.
# - `season` (Christmas wording, the home-page tile and the nav link) runs from `season.from` to `season.until`; after that
#   the pages stay up with year-round wording (birthdays, retirement, thank-yous).

season:
  from: "2026-11-19"
  until: "2026-12-25"
  name: Christmas

hub:
  h1_season: "Christmas presents for people who love doing things"
  h1: "Presents for people who love doing things"
  seo_title_season: "Christmas gift ideas: experiences and kit for doers"
  seo_title: "Activity gift ideas: experiences, classes and kit"
  description_season: "Christmas present ideas for people who would rather do something than own something: classes, days out, trips and the kit to go with them. Make a shortlist and share it, or drop a hint."
  description: "Present ideas for people who would rather do something than own something: classes, days out, trips and the kit to go with them. Make a shortlist and share it, or drop a hint."
  lead: "For the walker, the swimmer, the potter-in-waiting and the one who keeps saying they'll learn the piano. Pick an interest, save the ideas you like, then send the list on."
  intro:
  - Each idea here is something to do, with the ways to give it underneath. Some can be booked as a class, day out or trip; some need a piece of kit to get going; and some cost nothing at all, in which case the present is your company and a promise to go along.
  - Every idea links to our full page on the activity, with how to start, where to go and what to check first. The kit suggestions come from those pages, and where an independent reviewer has named a top pick, we show their pick and their words, not ours.

