  - tier: value
    name: Mammut Sertig III Mid GTX
    label: Best Value Walking Boot
    quote: This has recently become our favourite good value option.
    reviewer: OutdoorsMagic
    review: {title: "Best Walking Boots of 2026 | Fully Tested and Rated by Our Experts", url: "https://outdoorsmagic.com/article/best-walking-boots/", checked: "2026-11-17"}
    buy: https://www.amazon.co.uk/s?k=Mammut+Sertig+III+Mid+GTX

# Added for the gift ideas hub (RUNBOOK §6v, 19 Nov 2026). Same rules as above.
telescopes:
  item: Telescope
  why: A telescope is the gift that shows Saturn's rings and the Moon's craters for the first time. A wider front lens (the aperture) gathers more light; a motorised mount finds and follows objects for you.
  options:
  - tier: good
    name: Celestron NexStar 4SE
    label: Best for beginners
    quote: A great scope for beginners, the Celestron NexStar 4SE is easy to use and set up, it produces clear and bright images
    reviewer: Space.com
    review: {title: "Best telescopes 2026: Observe planets, stars and galaxies", url: "https://www.space.com/15693-telescopes-beginners-telescope-reviews-buying-guide.html", checked: "2026-11-19"}
    buy: https://www.amazon.co.uk/s?k=Celestron+NexStar+4SE
  - tier: value
    name: Celestron Inspire 100AZ
    label: Best budget telescope
    quote: The Celestron Inspire 100AZ is a great beginner scope for anyone just getting started with astronomy
    reviewer: Space.com
    review: {title: "Best telescopes 2026: Observe planets, stars and galaxies", url: "https://www.space.com/15693-telescopes-beginners-telescope-reviews-buying-guide.html", checked: "2026-11-19"}
    buy: https://www.amazon.co.uk/s?k=Celestron+Inspire+100AZ

running-watch:
  item: Running watch
  why: A GPS watch records distance, pace and heart rate on every run, which makes progress easy to see. Check it pairs with the phone they already use.
  options:
  - tier: top
    name: Garmin Forerunner 70
    label: Best overall
    quote: The Garmin Forerunner 70 is the running watch we'd recommend to most people because it nails the things that actually matter.
    reviewer: TechRadar
    review: {title: "The best running watch 2026: GPS watches for all budgets", url: "https://www.techradar.com/best/running-watches", checked: "2026-11-19"}
