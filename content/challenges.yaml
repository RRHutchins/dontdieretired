- id: walk-across-a-tidal-causeway
  title: Cross the tidal causeway to Holy Island
  category: travel
  kind: experience
  effort: gentle
  cost: low
  time: afternoon
  setting: outdoors
  company: either
  regions:
  - uk
  places: [north-east]
  why: Twice a day the sea covers the road to Holy Island, also called Lindisfarne, off the Northumberland coast, so every visit has to be timed around the tide. Northumberland County Council publishes safe crossing times for the causeway road, and separate warnings for the marked walking route over the sands.
  start:
  - Look up the safe crossing times for your date on Northumberland County Council's Holy Island page.
  - Plan to cross the road well inside the safe window, allowing the extra half hour the council advises.
  - Walk the marked route over the sands only in daylight, on a falling tide and with someone who knows it.
  links:
  - label: Northumberland County Council Holy Island causeway safe crossing times
    url: https://holyislandcrossingtimes.northumberland.gov.uk
    region: uk
    checked: '2026-10-08'
  safety: The tide comes in quickly over the causeway and sands, so never start a crossing outside the published safe times.
