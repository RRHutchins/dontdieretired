  seo_title: 'Watercolour painting for beginners: kit and classes'
  description: 'How to start watercolour painting: the paper, paints and brushes beginners are asked to buy, what a class costs in the UK and US, and the honest hard parts.'
  detail:
  - h: What you need
    list:
    - Watercolour paper. One US college's list asks for 140 (lb) cold or hot press paper, which is 300 gsm, and says that if you splurge on anything, splurge on paper.
    - 'Paints: a pan set or tubes. Brockenhurst College asks for the three primaries plus black; Clark College suggests a set of 12 or more.'
    - Round and flat brushes in several sizes, such as 2, 4, 6, 8 and 10.
    - A palette with a large mixing well, a water pot, an HB pencil and an eraser. Brockenhurst also asks for masking fluid and tape.
    after: Clark College reminds students that all supplies are recommendations and that it is fine if sizes or colours are a little different.
  - h: What it's really like
    p:
    - 'Country Life''s guide puts it simply: the basics of watercolour are simple, but a little tuition never goes amiss. Its tips from the painter Gerard Stamp are to keep to four or five colours, mix
      more paint than you think you need, and work from light to dark with big washes.'
    - The honest hard part is the paper. A paper supplier's guide says paper of 140 lb or lighter needs stretching to stop it buckling when wet; heavier paper used on a board may not. A beginners' class
      covers this in the first weeks.
  - h: Classes and costs
    table:
      head:
