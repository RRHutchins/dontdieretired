# Fifty at Fifty: the activity catalogue (/list/). RUNBOOK §6h. (The file keeps its old name; readers see "activities".)
# RULES: an id is permanent (readers' saved lists point at it): never change or reuse one. Every link was fetched
# on its `checked` date and found to be what the label says. No event dates or prices. `why` leads with what is
# interesting and never mentions age. Optional: guide / story (article slugs), local (content/local.yaml id), season, safety,
# collection (a named group with its own page: see COLLECTIONS in build.py; today only military).
- id: paras-10
  title: Take on the PARAS' 10
  category: move
  kind: event
  effort: demanding
  cost: low
  time: months
  setting: outdoors
  company: either
  regions:
  - uk
  collection: military
  why: This 10-mile endurance race is based on the 10 miler from The Parachute Regiment's P Company test week, and it is open to the public. You can run it, or enter the TAB and cover the same course in boots carrying a 35lb pack.
  start:
  - Read the official site and choose between the Run, the TAB and the canicross category.
  - Pick a live event such as Catterick, or the virtual option, and enter online.
  - Build up to ten miles on hilly ground, adding boots and a loaded pack gradually if you choose the TAB.
  links:
  - label: PARAS' 10 official site (run by SUPPORT OUR PARAS)
    url: https://www.paras10.com/
    region: uk
    checked: '2026-10-06'
  story: karl-bushby-walk-home-channel
  story_note: Karl Bushby was a British paratrooper before he set out to walk home from Chile. He has no connection with this event; we link his story because it shows where that kind of training can lead.
- id: kitesurfing-lesson
  title: Take a kitesurfing lesson
  category: move
  kind: skill
  effort: demanding
  cost: mid
  time: afternoon
  setting: outdoors
  company: others
  season: Spring to autumn in the UK
  regions:
  - anywhere
  why: Flying a power kite on a beach teaches you to read the wind in a way few other sports do. A first lesson covers kite control and safety on the sand before you go near a board.
  start:
  - Contact British Kitesports or look up an IKO centre to find a recognised school near a beach you can reach.
  - Book a beginner lesson and ask what kit and wetsuit the school provides.
  - Keep a second date free, as lessons move when the wind does not cooperate.
  links:
  - label: British Kitesports Association (UK governing body)
    url: https://www.britishkitesports.org/
    region: uk
    checked: '2026-10-06'
  - label: International Kiteboarding Organization (IKO)
    url: https://www.ikointl.com/
    region: any
    checked: '2026-10-06'
  safety: Learn with a recognised school rather than teaching yourself, as kites generate serious power in strong wind.
- id: indoor-climbing
  title: Try indoor rock climbing
  category: move
  kind: experience
  effort: moderate
  cost: low
  time: afternoon
  setting: indoors
  company: either
  regions:
  - uk
  - us
  why: Every route on a climbing wall is a puzzle you solve with your whole body, and the grades let you start very gently. Walls are sociable places where strangers happily share how they got up a tricky section.
  start:
  - Use the BMC or USA Climbing finder to locate a wall or gym near you.
  - Book a taster or induction session, which includes shoe and harness hire at most walls.
  - Start on the easiest bouldering or top-rope routes and climb down as well as up.
