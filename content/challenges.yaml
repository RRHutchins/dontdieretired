  why: The highest mountain in Eryri National Park has several distinct paths to the top, so you can choose a route that suits you. On a clear day the view runs from the mountains to the sea.
  start:
  - Read the Eryri National Park Authority page and choose a path that matches your experience.
  - Plan how you will reach the start, as car parks such as Pen y Pass fill early.
  - Check the forecast and the park's ground conditions report the day before you go.
