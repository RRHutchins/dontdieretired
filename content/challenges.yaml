  - name: Non-slip deck shoes
    why: the roof and gunwales get slippery
    url: https://www.amazon.co.uk/s?k=non+slip+deck+shoes
  inspire:
  - kind: read
    person: Jon Reynolds, York
    line: Spent about ten years exploring England's canals and rivers on his 52ft narrowboat Borderline, covering more than 7,000 miles and 3,500 locks.
    title: 'There and back again: an epic canal journey'
    outlet: Canal & River Trust
    url: https://canalrivertrust.org.uk/news-and-views/blogs/waterfront/there-and-back-again-an-epic-canal-journey
    checked: '2026-11-05'
  seo_title: 'Canal boat holiday for beginners: locks, routes, costs'
  description: 'Your first narrowboat holiday: no licence needed, how far you get at 4 mph, how to work a lock safely, easy first routes and what a week costs.'
  detail:
  - h: What it's really like
    p:
    - 'You don''t need a licence or any experience to take a hire boat out. The hire company gives you a detailed explanation, including the safety information, when you arrive: how to steer, the simple
      checks to do each morning and how to work a lock. Then the boat is yours.'
    - The pace is the point. The speed limit on narrow canals is 4 mph, and you will travel at 3 to 4 mph. Hire companies generally do not allow cruising after dark, so check the small print. Most of the
      work, and most of the fun, is at the locks, where the crew winds the paddles and pushes the gates while the steerer brings the boat in. The Canal & River Trust looks after more than 2,000 miles of
      canals and rivers in England and Wales.
  - h: How far you will get
    p:
    - 'Two rules of thumb are worth knowing. ABC Boat Hire adds the number of locks to the miles and divides by three to get hours: 12 miles and 9 locks makes about seven hours. The Inland Waterways Association
      allows 3 miles an hour and ten minutes for each lock. The Canal & River Trust says each lock will take at least 15 minutes.'
    - 'ABC suggests planning no more than about eight hours'' cruising in a day. On a first trip, plan less than you think: a route with few locks leaves time to stop at the pub, walk the towpath and moor
      up somewhere quiet.'
  - h: Easy routes for a first trip
    table:
      head:
      - Canal
      - Stretch
      - Locks
      rows:
      - - Monmouthshire & Brecon
        - Brecon to Pontymoile Basin, 35 miles
        - Few
      - - Ashby Canal
        - 22 miles
        - None
      - - Shropshire Union
        - Brewood to Shebdon, about 6 hours
        - '1'
      - - Kennet & Avon
        - Bradford on Avon to Bath, about 6 hours
        - '1'
      - - Llangollen Canal
        - From Chirk, over the Chirk and Pontcysyllte aqueducts
        - '4'
      - - Trent & Mersey
        - To Fradley Junction and back, about 12 hours
        - 5 each way
    after: 'The Pontcysyllte Aqueduct, completed in 1805 and one of Thomas Telford''s greatest works, is the longest and highest in the UK: 1,007 feet (307 metres) long and 127 feet (39 metres) above the
      River Dee, and part of a UNESCO World Heritage Site. For a stretch on a later trip, the Caen Hill flight at Devizes on the Kennet & Avon has 16 locks in a steep line, 29 in the whole flight, and takes
      five to six hours; boats must enter by 2pm from April to September and by 1pm from October to March.'
  - h: Working a lock safely
    list:
    - Check the lock first, and let any boat already coming through finish before you start.
    - Keep the back of the boat well forward of the cill, the ledge below the top gates. If the boat starts to tilt on it, close all the paddles straight away.
    - 'Never try to hold the boat with a rope alone: take one turn round a bollard, and keep your fingers clear of the rope and the bollard.'
    - 'Use a windlass that fits the spindle snugly, always use the safety catch on the paddle gear, and never leave the windlass on the spindle: a flying windlass can cause serious injury.'
    - Children, non-swimmers and anyone boating alone should wear a lifejacket whenever they are on deck, and the Trust says it is always safer for everyone to wear one.
    - If someone falls in, never jump in after them. Stop the engine, close the paddles, keep them in sight and throw a line or lifebuoy.
  - h: What it costs and when to go
    p:
    - The main hire season runs from about March to October or November. Prices rise sharply in summer. ABC Boat Hire put a week at around £959 in low season and upwards of £2,899 in peak summer in July
      2026, with short breaks, Thursday to Monday or Monday to Friday, from around £688. Drifters, which hires from 35 bases in England, Scotland and Wales, lists 2027 short breaks from £650 for a boat
      for four and weeks from £900. Tuition is included, and fuel is usually paid by deposit. Ask the hire firm about parking, fuel and the damage waiver before you book.
    - In the United States, the Erie Canalway in New York lists firms that hire English-style narrowboats and cruisers for several days, with lessons in steering, docking and working the locks before you
      set off.
  faq:
  - q: Do you need a licence to drive a canal boat?
    a: No. The Canal & River Trust says you don't need a licence or permit to drive a holiday boat, and the hire company teaches you before you leave.
  - q: How fast do canal boats go?
    a: The speed limit on narrow canals is 4 mph, and you will usually travel at 3 to 4 mph.
  - q: How long does it take to go through a lock?
    a: The Canal & River Trust says at least 15 minutes for each one. The Inland Waterways Association's planning rule allows ten minutes a lock.
  - q: How much does a canal boat holiday cost?
    a: For 2026 and 2027, the big hire firms list short breaks from about £650 to £690 and weeks from about £900 to £960 in low season, rising to well over £2,000 for a week in summer.
  - q: Do you have to wear a lifejacket on a canal boat?
    a: The Canal & River Trust's handbook says children, non-swimmers and lone boaters should wear one whenever they are on deck, and that it is always safer to wear one. ABC Boat Hire, for one, lends buoyancy
      aids free.
  - q: Can you drive a canal boat at night?
    a: Usually not. The Canal & River Trust's handbook says hire companies do not permit cruising after dark; check your hire firm's terms.
