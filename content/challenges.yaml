  category: move
  kind: event
  effort: demanding
  cost: low
  time: months
  setting: outdoors
  company: either
  season: Spring to autumn
  regions:
  - uk
  why: A sportive is a signposted, non-competitive road ride with feed stops, so you can take on a long route without navigating or carrying everything yourself. Most offer several distances, and British Cycling grades events so you can judge the difficulty beforehand.
  start:
  - Browse British Cycling's sportives page and read its guide to sportive grading.
  - Enter the shortest route at an event within easy reach of home.
  - Build your longest ride up steadily and practise eating and drinking on the bike.
