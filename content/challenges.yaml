  seo_title: 'Piano lessons for adult beginners: what to expect'
  description: What adult beginners' piano classes cover, whether you need a piano at home, what group classes and teachers cost, and how to find a teacher.
  detail:
  - h: What it's really like
    p:
    - City Lit splits its piano teaching into levels that roughly match the ABRSM grades. Year 1 (classes 1A to 1C) starts with complete beginners and ends with simple pieces played hands together; Year
      2 works up to grade 1 pieces. The first level, 1A, covers posture and hand shape, fingering in C position, note names and the treble and bass clefs.
    - In-person classes take up to 15 students, each at a digital piano with headphones. Online classes need your own instrument. For home practice City Lit prefers an acoustic piano but says a digital
      one suits beginners up to about its fourth level, and it suggests budgeting about £12 a term for music books.
    - Expect steady rather than fast progress. Beverly Zweiben, interviewed by the Washington Post about ten years after her first lesson, was working on a Bartók piece called Slow Dance.
  - h: Ways in compared
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - City Lit, London
        - 'Piano/keyboards 1A: 11 weekly 90-minute group classes for absolute beginners'
        - £249, or £199 senior on daytime classes and £174 concession (autumn 2025 listing)
      - - Shoreline Community College continuing education
        - 'Adult Piano - Beginner: seven 50-minute Monday evening classes, winter 2026'
        - $299
      - - Private teacher (UK)
        - One-to-one lessons; EPTA UK lists member teachers by town and county, including online teachers
        - Set by each teacher; EPTA's page gives no fees
      - - Private teacher (US)
        - One-to-one lessons; MTNA's finder searches by zip code and teaching area, with an online lessons option
        - Set by each teacher; MTNA's page gives no fees
    after: MTNA's advice is to interview several teachers before choosing, ask for their written studio policy, ask how much daily practice they expect, and ask if you can attend a student recital.
  faq:
  - q: Do I need a piano at home to learn the piano?
    a: For practice, yes. City Lit says a digital piano suits beginners up to about its fourth level and advises full-size keys and 88 of them. Its in-person classes provide a digital piano and headphones
      for each student.
  - q: Can adults learn piano in a group class?
    a: Yes. City Lit runs beginners' piano classes of up to 15 students, and some US community colleges run adult beginner classes through their continuing education programmes.
  - q: How much do adult piano lessons cost?
    a: As last listed, City Lit's 11-week beginners' class was £249 and Shoreline Community College's seven-week adult class $299. Private teachers set their own fees, so ask before booking.
  - q: How do I find a good piano teacher?
    a: Search EPTA UK's directory in the UK or MTNA's finder in the US. MTNA suggests interviewing several teachers and asking about their training, studio policy and practice expectations.
