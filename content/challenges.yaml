  seo_title: 'Linocut for beginners: kit, cutting safely and classes'
  description: 'How to make your first linocut: the tools and kit you need, how to cut safely, the steps from drawing to print, and where to find a class in the UK and US.'
  detail:
  - h: How a linocut is made
    list:
    - Draw your design on the lino.
    - Cut round the shapes with a V tool, then clear larger areas with a U tool. Whatever you cut away stays white.
    - Roll a thin layer of ink onto an inking plate, then onto the block.
    - Lay paper on the block and rub the back with a baren or a spoon, then peel it off. Plain 80 gsm copy paper is fine to start.
    after: That is the method set out in a printmaking supplier's beginners' guide, which lists lino, cutting tools, a roller, ink, an inking plate and paper as the kit. A press is not needed.
  - h: The honest hard parts
    p:
    - The tools are sharp. One supplier's guide says to hold the handle in your palm rather than like a pencil and keep your other hand behind the blade. Another says always cut away from yourself, use
      a bench hook to stop the block slipping, and keep tools sharp, since a blunt tool needs more force and is harder to control.
    - Do not carve too deep, or you can go right through the lino. Cheap lino can crumble, and harder lino may need warming, for example for about 30 seconds with a hairdryer.
    table:
      head:
      - Class
      - Format
      - Cost (as last listed)
      rows:
      - - City Lit, London
        - Evening linocut and woodblock courses
        - £249, or £199 senior and £162 concession
      - - Pyramid Atlantic, Maryland
        - One six-hour beginners' day, materials included
        - $184, including a $25 materials fee
      - - Penland School of Craft, North Carolina
        - Workshops of four days and longer; beginners welcome
        - See the school's page
  faq:
  - q: What do I need to start linocut?
    a: Lino, a set of cutting tools, a roller, block printing ink, an inking plate and paper. A baren or a spoon does the job of a press.
  - q: How do I cut lino safely?
    a: Hold the tool in your palm, always cut away from yourself, keep your other hand behind the blade and use a bench hook to hold the block.
  - q: Do I need a printing press for linocut?
    a: No. You can print by rubbing the back of the paper with a baren, a spoon or your hand.
  - q: Which lino tools should a beginner buy?
    a: One supplier suggests a handle with interchangeable blades to start, with a V tool for outlines and a U tool for clearing.
