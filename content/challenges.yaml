  seo_title: 'W Trek Torres del Paine: how to book, and the itinerary'
  description: How to book and plan the W Trek in Torres del Paine, with the route and distances, campsites and refugios, park tickets, the Base Torres climb and seasons.
  detail:
  - h: What the W is really like
    p:
    - The W is a linear route of about 70 km (43 miles) through Torres del Paine National Park in Chilean Patagonia. Its three "arms" run up to the base of the granite towers, into the Valle del Francés
      and out to Glacier Grey, and you finish a long way from where you started. Chile's tourism board describes it as four to six days of demanding walking, with days of up to eight hours.
    - Chile Travel's own five-day plan starts at the Laguna Amarga gate, about two hours by road from Puerto Natales. Day one walks to Refugio Central; day two climbs to the Base of the Towers and back,
      which takes eight to ten hours; day three follows Lago Nordenskjöld to Los Cuernos or the Francés sector; day four climbs the Valle del Francés, with your big pack left at Campamento Italiano, then
      carries on to Paine Grande; day five is a round trip of about eight hours to the Grey viewpoints before the catamaran across Lago Pehoé to Pudeto and the bus out.
    - Puerto Natales itself is about three hours (250 km, 155 miles) by road from Punta Arenas airport, and Puerto Natales has its own airfield with direct flights, mainly in high season.
  - h: Book your nights first, then the park ticket
    p:
    - Book every night before anything else. The park's mountain protocol says you need a confirmed campsite or refugio reservation for each night, and without one you cannot stay more than a day on the
      W. Chile Travel suggests booking six months or more ahead.
    - Different companies run different sites. Vertice runs Paine Grande, Grey, Dickson and Los Perros, and says none of its sites can be reached by car; Paine Grande is reached by the Lago Pehoé boat and
      Grey by the Lago Grey boat plus a walk along the beach. Other campsites and huts on the W are run by Las Torres Patagonia.
    - 'The entry ticket comes from CONAF, the national parks service, and is sold online only, in advance, at pasesparques.cl. Since 1 May 2026 there are two kinds: a one-day ticket, and a ticket for two
      or more days that covers up to ten days in a row. Prices are listed on that site. There is no internet at the park entrance, so carry it printed or as a screenshot.'
    - You register on the way in at one of three gates (Laguna Amarga, Sarmiento or Serrano), and the ranger posts on the trails keep sign-in books asking for your name, document number, where you are staying
      and when you expect to leave.
    - The catamaran from Pudeto to Paine Grande takes about 30 minutes and was last listed at 27,000 Chilean pesos for 2025-26. You need the ticket's QR code and your ID to board.
  - h: The hard parts
    list:
    - Wind. The path to the Base of the Towers crosses the Paso de los Vientos, a narrow, exposed stretch where you can expect wind, and rangers can close any sector at once if conditions turn dangerous.
    - Weather that changes by the hour. Las Torres Patagonia warns of cold wind in the morning and strong sun later; one Irish Times writer went from sunscreen to snow within minutes.
    - The final climb to the towers. The last section, La Morrena, is a steep, rocky moraine with no shade. The route tops out at about 850 metres (2,790 feet), and the round trip from Hotel Las Torres
      is 22 km (13.7 miles), about eight hours.
    - Long days with fixed hours. Walking outside the park's set hours or at night is not allowed, so plan each day to finish in time.
    - Logistics. The W ends far from where it starts, so buses, the Pehoé catamaran and your bookings all have to line up.
  - h: When to go and what to carry
    p:
    - Chile Travel recommends spring and summer in the southern hemisphere. Winter rules normally start on 1 May (in 2026 CONAF started them on 27 April because of the weather), and in winter anyone on
      the W or the Base Torres trail must have a CONAF-approved guide.
    - Pack layers (thermal, fleece and waterproof), high-cut waterproof walking boots that are already broken in, a hat, gloves and sunscreen. Carry a refillable bottle (you can fill it at Refugio Chileno
      on the way to the towers) and a bag for all your rubbish, as there are no bins on the trail. Poles help on the moraine and the descents. In winter conditions the park adds microspikes, gloves and
      goggles to its kit list. Fires are banned.
  - h: Refugios, camping, a guide, a day hike or the O
    table:
      head:
      - Option
      - Length (as listed)
      - What you book
      - What you carry
      - Good to know
      rows:
      - - Independent with refugios
        - 4 to 6 days; about 70 km (43 miles)
        - A refugio bed for every night
        - Clothes and trail food
        - The five-day Chile Travel plan uses Central, Los Cuernos or Francés, and Paine Grande
      - - Independent camping
        - 4 to 6 days; about 70 km (43 miles)
        - A campsite pitch for every night
        - Tent, stove and food
        - 'The same rule applies: no reservation means no more than one day on the W'
      - - Guided tour
        - Set by the operator
        - Check what the tour includes
        - Depends on the tour
        - Required by CONAF in winter on the W and Base Torres; the park suggests accredited guides at other times
      - - Day hike to Base Torres only
        - 22 km (13.7 miles) round trip; about 8 hours
        - Park entry ticket; no overnight booking
        - Day pack
        - Starts from Hotel Las Torres; its Welcome Center opens at 9am
      - - The O circuit
        - 9 days; 93 km (58 miles)
        - Every campsite or refugio before you enter the park
        - Full pack
        - Crosses the John Gardner Pass at 1,200 m (3,940 ft) on a 10 to 12 hour day; rated as needing very good fitness and experience
    after: Which way round? Chile Travel's itinerary runs east to west, starting at Laguna Amarga with the towers and ending with the boat from Paine Grande. Walk it the other way and you start with the
      catamaran from Pudeto and finish at the towers. Whichever you choose, your bookings must match the order you walk, so fix the direction before you reserve.
  faq:
  - q: How many days do you need for the W Trek?
    a: Chile Travel describes the W as four to six days of walking. Its own day-by-day itinerary takes five days and four nights.
  - q: How long is the W Trek in km and miles?
    a: About 70 km (43 miles), as Chile Travel gives it. It is a linear route, so you finish at a different point from where you start.
  - q: Do you need reservations to hike the W Trek?
    a: Yes. CONAF requires a confirmed campsite or refugio reservation for every night, and without one you cannot stay more than one day on the W.
  - q: How do I buy a Torres del Paine entrance ticket?
    a: Online only, in advance, from CONAF at pasesparques.cl. Since 1 May 2026 there is a one-day ticket and a ticket for two or more days that is valid for up to ten days in a row.
  - q: How long is the hike to Base Torres?
    a: Las Torres Patagonia gives 22 km (13.7 miles) there and back from Hotel Las Torres, about four hours each way. The last stretch is a steep, rocky moraine.
  - q: Can you hike the W Trek in winter?
    a: Only with a guide. From the start of the winter season, normally 1 May, CONAF requires anyone on the W or the Base Torres trail to have an approved guide.
