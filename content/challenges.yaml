  - h: What it's really like
    p:
    - You start with the machine, not the dress. Morley College's one-day introduction covers setting up the machine, its features, sorting out common errors and sewing sample stitches. Abingdon & Witney's
      dressmaking course for beginners spends its first term on threading, tension, needles, maintenance and the machine's attachments, and its main project is a tote bag. It is part one of three.
    - Patterns and fabric come next. North Seattle College's beginners' class covers reading a pattern, choosing fabric and laying it out, with three projects sewn in class from fabric and patterns the
