  seo_title: 'Botanical illustration courses for beginners: UK and US'
  description: How to start botanical illustration, from a two-day beginners' course at a botanic garden to certificates and diplomas, with costs in the UK and US.
  detail:
  - h: What it's really like
    p:
    - It starts with drawing, not painting. The Royal Botanic Garden Edinburgh's two-day introduction has you look closely at plant specimens and make accurate measured drawings, then use tone to make them
      look three-dimensional. Kew's five-day Fundamentals course covers drawing flowers and leaves using measurement and perspective, then watercolour and colour mixing.
    - The longer routes are a serious commitment. RBGE's online Diploma in Botanical Illustration takes three years, recommends around 20 hours of study a week, is not designed for beginners, and costs
      £4,950; RBGE recommends its Certificate first. The Society of Botanical Artists' distance learning diploma runs for 27 months, with 12 assignments posted to tutors for critique.
    - Most courses expect you to bring your own materials. RBGE tells students what to buy before the course starts, and Kew links to a separate materials list.
  - h: Ways in, side by side
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - Royal Botanic Garden Edinburgh
        - Introduction to Botanical Drawing, two days, 21 and 22 November 2026; 14 places
        - £140, or £126 for RBGE members
      - - Kew Gardens, London
        - Fundamentals of botanical illustration, five days; suitable for beginners (last run February 2026)
        - £470, or £460 for Kew members
      - - City Lit, London
        - Drawing from plants and flowers, from January 2027
        - £349, or £279 senior and £227 concession
      - - Lewis Ginter Botanical Garden, Virginia
        - Certificate of at least 303 hours; start with Introduction to Botanical Drawing I or Botanical Art History
        - Certificate enrolment free; classes $12 to $15 an hour plus materials
    after: The Society of Botanical Artists' 27-month diploma is taught by post, in graphite, pen and ink and a choice of watercolour, gouache or coloured pencil. Ask the Society for current fees.
  faq:
  - q: Can a beginner learn botanical illustration?
    a: Yes. RBGE's two-day introduction is a beginners' course, and Kew's Fundamentals course says it suits beginners. Diplomas such as RBGE's are not designed for beginners.
  - q: Do I need to be able to paint to learn botanical illustration?
    a: No. RBGE's introduction is a drawing course using measurement and tone. Kew's Fundamentals course starts with drawing and then moves on to watercolour and colour mixing.
  - q: How long does a botanical illustration diploma take?
    a: RBGE's online diploma takes three years at around 20 hours a week. The Society of Botanical Artists' distance learning diploma runs for 27 months.
  - q: How much does a botanical illustration course cost?
    a: As last listed, £140 for RBGE's two-day introduction, £470 for Kew's five-day course, $12 to $15 an hour for classes at Lewis Ginter in Virginia, and £4,950 for RBGE's diploma.
