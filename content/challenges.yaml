  why: On a beginners' course you design a small panel, cut the glass, lead it up, solder the joints and take home a window piece that catches the light. Colleges and arts centres teach it from scratch.
  start:
  - Read the British Society of Master Glass Painters' list of short courses, or search for a stained glass class at a US arts centre.
  - Check which method the course teaches, leaded or copper foil, and what materials are included.
  - Bring sturdy closed shoes and an apron, and read the course's safety notes about lead.
