        - Workshops, including a December series of two-hour practical sessions at the RWS Gallery
        - See the events page
      - - Anne Arundel Community College, Maryland
        - Afternoon classes; no prior art experience required
        - From $142, including a $25 fee
  faq:
  - q: What watercolour paper should a beginner use?
    a: One US college asks for 140 lb (300 gsm) cold or hot press paper. A paper supplier says paper of 140 lb or lighter needs stretching to stop it buckling; heavier paper on a board may not.
  - q: How many colours do I need to start watercolour?
    a: Fewer than you think. Country Life's guide says four or five are quite enough; Brockenhurst College asks beginners for the three primaries plus black.
  - q: Do I need any art experience for a watercolour class?
    a: No. Anne Arundel Community College's beginners' class says no prior art experience is required and all levels are welcome.
  - q: Is watercolour hard for beginners?
    a: The basics are simple, according to Country Life's guide, but a little tuition helps, especially with washes and paper.
