  safety: The track crosses an active volcanic area and the weather changes fast; stay on the marked track and away from steam vents, and in winter go with a guide.
  seo_title: 'Tongariro Alpine Crossing: booking, how hard, what to bring'
  description: How hard the Tongariro Alpine Crossing is, how to book it for free, shuttles and parking, winter rules, and how it compares with the Northern Circuit.
  detail:
  - h: What it's really like
    p:
    - The crossing is a one-way day walk across the volcanic heart of Tongariro National Park, which was set up in 1894 and in 1993 became the first site listed as a World Heritage cultural landscape. Figures
      for its length vary slightly between sources, from 19.4 to 20.4 km (about 12 to 12.7 miles). It starts at 1,120 metres (3,675 feet) in the Mangatepōpō Valley and finishes at Ketetahi Road at 760 metres
      (2,493 feet), with about 1,196 metres (3,924 feet) of climbing and descending in between.
    - The first stretch is gentle, fairly flat and boardwalked in wet places; its first 5.4 km (3.4 miles) is shared with the Soda Springs Walk. Then comes the Devil's Staircase, a steep climb from about
      1,400 to 1,600 metres (4,593 to 5,249 feet), to the flat floor of South Crater. An exposed ridge leads up to Red Crater, the high point at 1,886 metres (6,188 feet). From there you drop down loose
      scree to Ngā Rotopounamu, the Emerald Lakes, whose colour comes from minerals leached out of the rock, then pass Blue Lake before a long zig-zag descent, with views over Lake Rotoaira and Lake Taupō,
      into forest at Ketetahi.
    - The mountains and waters are sacred to Ngāti Hikairo ki Tongariro of Ngāti Tūwharetoa, who act as kaitiaki (guardians). DOC asks walkers not to touch or enter any of the lakes or streams. Blue Lake
      is tapu, and the Tongariro Crossing site says it is disrespectful to touch, enter, eat or drink around its shores. The Ketetahi springs are on private land, so stay on the track.
  - h: The hard parts
    p:
    - 'DOC rates the fitness needed as high and the gradient as steep and undulating. The Mountain Safety Council says the crossing has had more search and rescues than any other walking track in New Zealand:
      292 people over seven years, and nearly a fifth of all tramper search and rescues in the country in the 2016-17 summer. It names the weather, rough ground and the length of the day as the main hazards.'
    - Two sections catch people out. The loose rock on the steep slopes of Red Crater is, in DOC's words, a major slip hazard on the way down to the Emerald Lakes. And the long zig-zag steps off the northern
      slopes are hard on weaker knees at the end of the day. Very cold temperatures, strong wind, heavy rain and poor visibility are common even in summer. Be ready to turn back if conditions turn or you
      are moving too slowly; the Tongariro Crossing site advises against going if winds of 60 km/h or more are forecast.
    - It is also an active volcanic area. DOC says an eruption is unlikely but possible, the steam vents are very hot, the ground near them can be unstable, and severe burns are possible.
  - h: Booking, shuttles and parking
    p:
    - DOC recommends that everyone using any part of the track books, and a booking is needed to use a shuttle or guided walk. As last listed, there is no cost to book. Because the walk is one way, DOC
      says a shuttle from a nearby town is the best way to reach it, at about NZ$40 as last listed. In summer there is no parking at the Mangatepōpō car park for people doing the crossing; the Tongariro
      Crossing site says a four-hour limit applies at both the Mangatepōpō and Ketetahi road ends from mid-October to May. There is a private car park near the Ketetahi end, and DOC does not recommend parking
      on state highways.
    - Toilets are roughly every one to two hours along the track. If there is a queue at the start, there are public toilets at Mangatepōpō Hut on a short side track; the next on the track are just past
      Soda Springs. Bring your own toilet paper.
  - h: What to carry
    list:
    - Two to three litres of water each. DOC says the water along the track is not safe to drink.
    - In summer, everything on DOC's day hikes gear list, which its track page links to.
    - In winter (May to late October), DOC adds waterproof trousers, crampons, an ice axe, a helmet, an avalanche transceiver, probe and shovel, a personal locator beacon, a head torch and a map and compass
      or GPS.
    - A charged phone, plus the NIWA park forecast and GeoNet volcanic alert level checked before you go.
  - h: The real choices
    table:
      head:
      - Option
      - Distance and time
      - Booking and cost (as last listed)
      - Who it suits
      rows:
      - - Summer crossing on your own (November to April)
        - 19.4 to 20.4 km (12 to 12.7 miles), one way; 7 to 8 hours
        - Free DOC booking; shuttle about NZ$40
        - Fit walkers happy with a long day in mountain weather
      - - Guided winter crossing (May to late October)
        - Same route; DOC says allow 9 hours
        - DOC booking needed for a guided trip; DOC lists the guiding companies
        - Anyone without alpine skills who wants to cross in snow and ice
      - - Tongariro Northern Circuit
        - 35.5 km (22 miles) for 2026/27; 3 to 4 days
        - Huts or campsites must be booked year-round; adult hut NZ$66 a night (international) or NZ$44 (New Zealander), 23 October to 30 April
        - Walkers who want to stay out overnight in huts
      - - Soda Springs Walk
        - Shares the first 5.4 km (3.4 miles); about 2 hours return
        - Not stated
        - A taste of the crossing without the climb
      - - Taranaki Falls Walk
        - 2-hour loop from Whakapapa Village to a 20-metre (66-foot) waterfall
        - No booking mentioned
        - An easy walk on a poor-weather day
    after: DOC says it is best to go with a guide in winter, when the track has ice, snow and avalanche risk and shuttles generally do not run; guided trips include transport. The Northern Circuit shares
      the Mangatepōpō to Emerald Lakes section with the crossing, and a circuit hut or campsite booking covers it. As last listed, DOC said the circuit was not running as a Great Walk while Oturere Hut
      is replaced, that the Great Walk would be available for 2026/27, and that the Whakapapa Village to Mangatepōpō section stays closed after the 2025 fire, so the circuit starts at Mangatepōpō car park.
      Check the DOC page before you plan.
  faq:
  - q: Do you need to book the Tongariro Alpine Crossing?
    a: DOC recommends that everyone books, and you must book to use a shuttle or a guided walk. As last listed, booking is free.
  - q: How hard is the Tongariro Crossing?
    a: DOC rates it as needing high fitness, with steep and undulating ground and about 1,196 metres (3,924 feet) of height change. The steep Devil's Staircase climb and the loose descent from Red Crater
      are the hardest parts.
  - q: How long is the Tongariro Alpine Crossing?
    a: About 19.4 to 20.4 km (12 to 12.7 miles) one way, depending on the source. DOC allows seven to eight hours from November to April and nine hours from May to October.
  - q: Can you park at the start of the Tongariro Crossing?
    a: Not in summer. DOC says there is no parking for crossing walkers at Mangatepōpō in summer, so most people use a shuttle; there is a private car park near the Ketetahi end.
  - q: Can you do the Tongariro Alpine Crossing in winter?
    a: Only with alpine skills, equipment and experience, as there is ice, snow and avalanche risk from May to late October. DOC says it is best to go with a guide.
  - q: Is there water on the Tongariro Crossing?
    a: No safe drinking water. DOC says to carry two to three litres each.
