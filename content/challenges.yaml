  title: Walk the Tongariro Alpine Crossing
  category: move
  kind: experience
  effort: demanding
  cost: mid
  time: weeks
  setting: outdoors
  company: either
  season: November to April without alpine skills; May to October is winter
  regions:
  - world
  places:
  - NZL
  why: This one-way crossing in New Zealand's Tongariro National Park climbs to Red Crater at 1,886 metres (6,188 feet), past steaming vents, lava flows and the vivid Emerald Lakes. The Department of Conservation
    allows seven to eight hours in summer and asks for high fitness.
  start:
  - Read the Department of Conservation's track page and book your walk, which is free and needed for shuttles.
  - Book a shuttle, as there is no visitor parking at the Mangatepōpō start in summer.
  - Check the NIWA forecast the evening before, and on the morning check DOC's "Not Recommended Today" advisory (issued at 6am in summer); walk another time if it says not today.
  links:
  - label: Department of Conservation, Tongariro Alpine Crossing
    url: https://doc.govt.nz/parks-and-recreation/places-to-go/central-north-island/places/tongariro-national-park/things-to-do/tracks/tongariro-alpine-crossing
