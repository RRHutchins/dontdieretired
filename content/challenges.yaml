    url: https://www.nationaltrail.co.uk/en_GB/trails/hadrians-wall-path/trail-information/
    region: uk
    checked: '2026-11-02'
  safety: Two low stretches on the Solway coast can flood at high tide, so check tide times before that section.
  photo_file: "File:Hadrian's Wall at Cawfields - geograph.org.uk - 3175284.jpg"
  photo_caption: "Hadrian's Wall at Cawfields, 2012."
  photo_alt: "A low stone wall runs over green grassland to a crag above a small lake."
  photo_checked: '2026-11-01'
  inspire:
  - kind: read
    person: Warren Callender, with Craig and Glynn Abbott
    line: Walked the Hadrian's Wall Path with two friends at 15 miles a day for a week, carrying 18kg packs, and raised more than £1,600 for Pendleside Hospice.
    title: Hiking trio complete Hadrian's Wall challenge for Pendleside Hospice
    outlet: Burnley Express
    url: https://burnleyexpress.net/news/people/hiking-trio-complete-hadrians-wall-challenge-for-pendleside-hospice-3296981
    checked: '2026-11-02'
  seo_title: "Walking Hadrian's Wall Path: days, sections and tips"
  description: How to walk Hadrian's Wall Path, 84 miles in six or seven days, with the six sections, the best months, the Passport, getting there and the Solway tides.
  detail:
  - h: What it's like
    p:
    - The path runs 84 miles (135 km) coast to coast across northern England beside Hadrian's Wall, a UNESCO World Heritage Site, through moorland and rolling fields. It starts at the Roman fort of Segedunum in Wallsend, near Newcastle, and ends at Bowness-on-Solway beyond Carlisle. The official guidebook describes it east to west, and the path is a little longer than the wall itself, which was 80 Roman miles long.
    - National Trails says anyone reasonably fit should manage it, but that it is not an easy walk. The 23 miles (37 km) between Chollerford and Birdoswald are a switchback of short climbs and descents, and the highest point, Windshields Crags, is 345 metres (1,131 feet). Most of the path is grass; only the Tyneside section is tarmac.
  - h: The six sections
    table:
      head: [Section, What to expect]
      rows:
      - [Wallsend to Heddon-on-the-Wall, Starts at Segedunum fort; the Tyneside stretch is the only part on tarmac]
      - [Heddon-on-the-Wall to Chollerford, Leaving Tyneside behind on the way to Chollerford]
      - [Chollerford to Steel Rigg, From Wall-mile 35 the classic switchback of the central section comes into view]
      - [Steel Rigg to Walton, Over Windshields Crags; from Walltown Crags you can see southern Scotland and the North Pennines]
      - [Walton to Carlisle, The last standing stretch of wall going west is at Hare Hill]
      - [Carlisle to Bowness-on-Solway, Two stretches at sea level flood at high tide; the last Passport stamp is at Bowness]
    after: National Trails suggests experienced walkers allow six or seven days for the whole path, plus time for the Roman sites. A day on the central section, between Chollerford and Walton, is the classic taste of it.
  - h: When to go, and the Passport
    p:
    - Walk between May and October, when the ground is normally dry; late July and August are the busiest weeks. Walking on dry ground matters here because the path crosses buried archaeology.
    - For the same conservation reason, the Passport season runs from Easter to the end of October. You collect stamps at stations along the way, and at Bowness-on-Solway you can buy a badge and certificate. Passports are sold online and at places on the route, including Segedunum, The Sill and Walltown.
  - h: Getting there and where to stay
    list:
    - The start at Wallsend is a ten-minute Metro ride from Newcastle station. The Tyne Valley railway between Newcastle and Carlisle stops at Corbridge, Hexham and Haltwhistle.
    - The seasonal AD122 Hadrian's Wall bus is the main service along the wall; check Go North East for current times. Bowness-on-Solway has no car park, so use the 93 bus.
    - Accommodation near the path fills up quickly. Book ahead, and start on a weekday if you can.
    - There are plenty of campsites, but there is normally no right to wild camp, so ask the landowner first.
  - h: What to carry, and the tides
    p:
    - Take a map or guidebook (and consider a compass), good footwear, waterproofs, warm layers, water and plasters for your feet. Mobile signal is weakest in the high central section, so charge your phone fully and, if you walk alone, tell someone your plans.
    - Between Dykesfield and Drumburgh, and between Port Carlisle and Bowness-on-Solway, the path is at sea level and can flood. Avoid those stretches for an hour either side of high tide, using the Silloth tide tables or the notice boards at Dykesfield and Bowness.
  faq:
  - q: How long does it take to walk Hadrian's Wall Path?
    a: National Trails suggests experienced walkers allow six or seven days for the whole 84 miles (135 km), with extra time for the Roman forts and museums.
  - q: When is the best time to walk Hadrian's Wall?
    a: May to October, when the ground is normally dry. Avoid late July and August if you want quieter paths.
  - q: Which direction should I walk Hadrian's Wall Path?
    a: Either works, but the official guidebook describes it east to west, from Wallsend to Bowness-on-Solway.
  - q: Is Hadrian's Wall Path hard?
    a: Anyone reasonably fit should manage it, but it is not easy. The central section between Chollerford and Birdoswald is a long run of short, steep ups and downs.
  - q: Can you wild camp on Hadrian's Wall Path?
    a: Normally not without permission, as there is no right to wild camp. There are plenty of campsites along the way.
