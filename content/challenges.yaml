  seo_title: 'Knitting and crochet groups: how to find one and start'
  description: How to find a knit and natter or crochet group, what to bring, free learn-to-knit and crochet guides, whether crochet is easier, and what guilds cost.
  detail:
  - h: What it's really like
    p:
    - 'A typical library group is two hours of knitting, a cuppa and conversation: Staffordshire''s Norton Canes library describes its Friday afternoon knit and natter as free, as long as you bring your
      own knitting. The Knitting & Crochet Guild, a UK charity run by volunteers, has branches that meet regularly and points to local knit and natter groups too.'
    - Getting started costs little. AARP's guide says all you need is yarn and a pair of needles, and that the idea knitting is hard is wrong. The Craft Yarn Council's Learning Center and the Guild's downloadable
      Start to Crochet guide teach the first stitches.
  - h: Knitting or crochet?
    table:
      head:
      - ''
      - Knitting
      - Crochet
      rows:
      - - Tools
        - A pair of needles
        - One hook; a basic set covers most projects
      - - How stitches work
        - Stitches pass from one needle to the other
        - No transferring of stitches between tools
      - - Who it suits
        - People who want more tools and more complex designs
        - Beginners who want convenience; called slightly more accessible
    after: 'The comparison is from a Martha Stewart guide. Joining a guild is optional: the Crochet Guild of America is $35 a year digital or $40 traditional, and US guilds such as The Knitting Guild Association
      have local chapters across the country.'
  faq:
  - q: Where can I find a knitting group near me?
    a: Ask your library, many of which run free knit and natter groups, or use the Knitting & Crochet Guild's list of branches in the UK and guild chapters in the US.
  - q: Is crochet easier than knitting?
    a: One guide suggests crochet for beginners who want convenience and versatility, calling it slightly more accessible, because you use one hook and do not pass stitches between tools.
  - q: What do I need to start knitting?
    a: Yarn and a pair of needles. AARP's guide says you can use expensive or inexpensive materials.
  - q: Are knitting groups free?
    a: 'Many are. Library knit and natter groups are often free: you just bring your own knitting.'
