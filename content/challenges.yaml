  story: natalie-grabow-oldest-woman-ironman-80
  seo_title: "How to do your first triathlon: distances and training"
  description: Super sprint or sprint? Triathlon distances explained, the kit you really need, how to train three days a week, and how transitions work on the day.
  detail:
  - h: What it's like
    p:
    - A triathlon is a swim, then a bike ride, then a run, with the clock running through the two changeovers, called transitions. The swim can be in a pool, a lake or the sea. Short beginner events are designed as a way in; as Triathlon Ireland's development coach puts it, beginners are genuinely welcome.
    - The part that surprises people is the run. Running straight off the bike feels heavy and uncoordinated at first; USA Triathlon describes the feeling of running on numb feet and legs. Practising it in training takes most of the shock away.
  - h: Choosing a distance
    table:
      head: [Format, Swim, Bike, Run, Typical finish]
      rows:
      - [Super sprint, "400 m (16 lengths of a 25 m pool)", 10 km (6.2 miles), 2.5 km (1.5 miles), 45 to 60 minutes]
      - [Sprint, "400 m in a pool or 750 m in open water", 20 km (12.4 miles), 5 km (3.1 miles), 75 to 90 minutes]
      - [Standard (Olympic), 1.5 km (just under 1 mile), 40 km (25 miles), 10 km (6.2 miles), 2½ to 3 hours]
    after: British Triathlon suggests starting with the shorter distances and building up. A super sprint is aimed at beginners, and a sprint is a good first event and a chance to practise transitions. In the UK, GO TRI events are relaxed, short and open to all abilities, and include duathlons (run and bike) and aquathlons (swim and run). Races beyond these introductory events need a race licence, bought for the day or through membership.
  - h: What you need
    list:
    - One bike in good working order. Triathlon Ireland says a road, hybrid or mountain bike is fine.
    - A properly fitted helmet, fastened before you even touch your bike in transition.
    - A swimsuit or tri suit, goggles and a swim cap, and a wetsuit if the swim is in open water.
    - Running shoes, and padded cycling shorts for comfort on the bike.
    - Nice to have but not needed, a race belt for your number, elastic laces, a bottle cage, a puncture repair kit and sunglasses.
  - h: How to train
    p:
    - Triathlon Ireland's coaches suggest regular sessions rather than long, hard ones. With three days a week, that means one or two swims working on technique, one steady ride (a gym bike will do in bad weather) and two runs, one easy and one a little faster. Sessions of 30 to 45 minutes are enough to start.
    - They put eight weeks as ideal for a sprint, though six-week programmes also work. The first four weeks build general fitness, weeks five and six make the sessions longer, and the last two practise the race itself, including transitions.
    - Practise a "brick", a ride followed straight away by a short run of about 10 minutes. USA Triathlon's beginner brick is a 30-minute ride, a quick change and a 10-minute easy run. Ride the last part of the bike in an easier gear, then shorten your stride and keep the first half mile to a mile controlled.
    - Build water confidence in the pool first, working on breathing and staying calm, with lessons if you need them. Move to open water later, with a wetsuit, a tow float and someone watching from the bank.
  - h: How transitions work
    list:
    - "Swim to bike (T1): take off your wetsuit, goggles and cap and leave them neatly in your space, then put on your helmet and fasten it before you touch the bike. Push the bike to the mount line and get on only once you are past it."
    - "Bike to run (T2): get off before the dismount line, rack your bike, and only then take off your helmet. Change shoes if you rode in cycling shoes, and go."
  faq:
  - q: What is a sprint triathlon?
    a: A 400 m pool swim or 750 m open water swim, a 20 km (12.4 mile) ride and a 5 km (3.1 mile) run. British Triathlon puts the typical finish at 75 to 90 minutes.
  - q: How long does it take to train for a first triathlon?
    a: Triathlon Ireland's coaches say eight weeks is ideal for a sprint, though six-week programmes also work. A super sprint is shorter still.
  - q: Do I need a special bike for a triathlon?
    a: No. A road, hybrid or mountain bike is fine as long as it is in good working order, with a properly fitted helmet.
  - q: Do I need a wetsuit for a triathlon?
    a: For an open water swim, Triathlon Ireland lists one as essential. For a pool swim, a swimsuit or tri suit, goggles and a cap are enough.
  - q: What is a brick session in triathlon?
    a: A bike ride followed straight away by a run, so your legs get used to the change. A short run of about 10 minutes after a ride is enough to start.
