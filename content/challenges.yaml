- id: tile-a-table-with-the-hat
  title: Cover a table with the hat tile
  category: think
  kind: project
  effort: gentle
  cost: free
  time: weeks
  setting: indoors
  company: either
  collection: arts
  regions:
  - anywhere
  why: The hat is a 13-sided shape that covers a flat surface without gaps but never in a repeating pattern, the first single tile known to do so. Its authors' page has a browser app that builds patches of hats and saves them as pictures, so the only kit you need is a printer, card and scissors.
  start:
  - Open the hat page and try the browser app, or the Mathigon polypad it links to, to see how the tiles fit.
  - Save a patch as a picture, print it and cut out 30 tiles from thin card.
  - Fit them together on a table, flipping tiles where you need to, and photograph the biggest patch you make.
  links:
