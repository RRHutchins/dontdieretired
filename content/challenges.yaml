  seo_title: 'Stained glass courses for beginners: what you make'
  description: What a beginners' stained glass course teaches, the panel you make, lead safety, lead came or copper foil, costs in the UK and US, and how to find a class.
  detail:
  - h: What it's really like
    p:
    - West Dean College's beginners' course takes you through glass cutting, design, choosing glass, leading, soldering, cementing and finishing, and you make a panel about 30 cm square or 25 by 40 cm.
      Morley College in London has students make a small practice panel first, then design their own.
    - 'Expect a lot of standing. The two methods you will hear about are lead came and copper foil: one glass supplier says lead came is easier for simple patterns, while copper foil takes more technique
      and time, and suggests trying both on small pieces.'
  - h: Lead and safety
    list:
    - Lead and solder are a lead source. Michigan's health department advises washing your hands before eating or drinking, working in a well-ventilated space away from the home, and washing work clothes
      separately.
    - West Dean asks pregnant or breastfeeding students to talk to their GP (family doctor) first; Morley does not recommend its course in pregnancy.
    - Wear sturdy closed shoes, tie back long hair and avoid loose clothing and dangling jewellery. West Dean asks students to bring a face mask for cementing and cleaning.
  - h: Courses and costs
    table:
      head:
      - Where
      - Format
      - Cost (as last listed)
      rows:
      - - West Dean College, West Sussex
        - Residential short course, 9.15am to 5pm daily; glass and materials included
        - £671, accommodation extra
      - - Morley College, London
        - Eleven weekly three-hour sessions; tools and materials for the first panel provided
        - £430, or £325 concession
      - - Visual Arts Center of Richmond, Virginia
        - 'Weekly evening class in the copper-foil method: cutting, foiling, soldering and framing'
        - $360, or $324 for members, plus fees
    after: The British Society of Master Glass Painters lists short courses by region but does not vet or recommend them, and advises checking that a glass course really covers stained glass.
  faq:
  - q: Is stained glass hard to learn?
    a: The basics can be learned on a short course. One supplier says lead came is easier for simple patterns, and copper foil takes more technique.
  - q: Is the lead in stained glass dangerous?
    a: Lead is a hazard. Wash your hands before eating or drinking, work in a ventilated space and wash work clothes separately; if you are pregnant, talk to your doctor before a course.
  - q: What will I make on a beginners' stained glass course?
    a: Usually one small panel. West Dean's is about 30 cm square or 25 by 40 cm; Morley students make a practice panel and then one of their own design.
  - q: How long does a stained glass course take?
    a: From a few days residential, as at West Dean, to eleven weekly sessions of three hours at Morley College.
