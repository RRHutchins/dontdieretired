  seo_title: 'Acrylic painting classes for beginners: what to expect'
  description: What a beginners' acrylic painting class covers, the brushes and paints you are asked to bring, and what courses cost in London and New York.
  detail:
  - h: What it's really like
    p:
    - Tate describes acrylic as a water-based, fast-drying paint, first made in the 1950s, that uses a synthetic resin to bind the pigment. Thinned with water it can look like watercolour; used thick it
      can look like oil. Once dry it is waterproof. David Hockney was an early champion and used it for some of his best-known 1960s pictures.
    - Beginners' classes are mostly about looking and mixing. Morley College's Painting for Beginners starts with acrylic and also covers watercolour and oil, and has you practise different brushes and
      marks while painting objects, images and portraits from observation. 92NY's beginners' class covers basic forms, perspective, value and tone, texture and the basics of colour theory.
    - Most courses expect you to bring your own kit. Morley's list asks for red, yellow and blue plus black and white, hog or synthetic round, flat and filbert brushes in several sizes, a water jar, kitchen
      towel, a B pencil and a pad of A3 acrylic paper or canvas boards.
  - h: Ways in, side by side
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - City Lit, London
        - Painting for beginners, including acrylic from still life; four dates from January 2027
        - £179, or £143 senior and £116 concession
      - - Morley College, London
        - Painting for Beginners, ten Wednesday evenings of three hours, starting with acrylic; from January 2027
        - £450, or £340 concession
      - - 92NY, New York
        - Acrylic Painting for Absolute Beginners, weekly classes from November to December; no experience necessary
        - $350 for the two-hour evening classes, $420 for the two-and-a-half-hour daytime ones
    after: Check whether materials are included. Morley's page lists everything as something to bring; 92NY links to a separate supply list.
  faq:
  - q: Is acrylic easier than watercolour for beginners?
    a: They behave differently. Tate says acrylic dries fast and is waterproof once dry, and that with water it can be made to look like watercolour or oil. Morley College's beginners' course starts with
      acrylic before watercolour and oil.
  - q: What do I need for an acrylic painting class?
    a: 'A typical list from Morley College: red, yellow and blue paint plus black and white, round, flat and filbert brushes, a water jar, kitchen towel, a B pencil and A3 acrylic paper or canvas boards.'
  - q: Do I need any experience for a beginners' acrylic class?
    a: No. 92NY's Acrylic Painting for Absolute Beginners says no experience is necessary, and Morley's course suits beginners and people wanting a refresher.
  - q: How much does an acrylic painting course cost?
    a: As last listed, City Lit's Painting for beginners is £179 (less for seniors and concessions), Morley's ten-week course is £450, and 92NY's beginners' class in New York is $350 to $420.
