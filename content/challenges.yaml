  seo_title: 'Interrail pass guide: prices, seniors, reservations'
  description: 'How an Interrail pass works now that anyone can buy one: flexi and continuous passes, the senior discount, seat reservations, and when a pass pays.'
  detail:
  - h: How the pass works now
    p:
    - Eurail and Interrail merged on 9 September 2026. Since then anyone can buy an Interrail pass, whatever their nationality or country of residence. One Global Pass covers 33 countries.
    - There are two kinds of pass. A flexi pass gives you a number of travel days within a longer period (4, 5 or 7 days in a month, or 10 or 15 days in two months). A continuous pass lets you travel every
      day for 15 days, 22 days, or one, two or three months. A travel day runs from midnight to 11.59pm local time, and on most trains you simply add the journey to the app.
    - If you live in one of the 33 countries, the pass covers one journey out of your own country and one back in, each with as many connections as you need to cross the border.
  - h: What it costs
    table:
      head:
      - Global Pass
      - Adult, 2nd class
      - Senior (60+), 2nd class
      - Adult, 1st class
      rows:
      - - 4 days in 1 month
        - €283
        - €255
        - €367
      - - 7 days in 1 month
        - €381
        - €343
        - €495
      - - 15 days in 2 months
        - €553
        - €498
        - €718
      - - 22 days continuous
        - €586
        - €527
        - €761
      - - 1 month continuous
        - €696
        - €626
        - €904
    after: These are the euro fares on a 2026 Global Pass price list published by CFR Călători, Romania's state railway, which sells the pass. Interrail's own site shows today's price in your currency.
      Travellers who are 60 or over on the first day of the pass get 10% off; 12 to 27-year-olds get 25% off, and up to two children aged 4 to 11 travel free with one adult. A 1st class pass is valid in
      both classes.
  - h: 'Seat reservations: where you pay extra'
    table:
      head:
      - Reservations are…
      - Countries (Interrail's list)
      rows:
      - - Needed on most long-distance trains
        - Croatia, France, Greece, Hungary, Italy, Norway, Poland, Romania, Serbia, Slovakia, Spain, Sweden, Türkiye
      - - Mostly optional
        - Austria, Czechia, Estonia, Finland, Germany, Great Britain, Ireland, Lithuania, Luxembourg, Montenegro, North Macedonia, Portugal, Slovenia
      - - Rarely or never needed
        - Belgium, Bosnia-Herzegovina, Bulgaria, Denmark, Latvia, the Netherlands, Switzerland
    after: Every night train and most high-speed trains need a reservation. Interrail's indicative fees include €10 to €20 for a French TGV INOUI, €13 for an Italian Frecciarossa and €10 for a Spanish AVE
      in 2nd class. Germany now requires reservations on many ICE trains from 1 June to 1 September. Eurostar has special pass-holder fares, €35 in Standard and €40 in Plus between London and France or
      Belgium, but they are limited and sell out, so book early.
  - h: Is a pass worth it?
    p:
    - 'Not always. The Man in Seat 61, the independent rail guide, is blunt: the cheapest advance tickets for each journey cost less than a pass. But a pass can beat tickets bought at short notice, and
      it is much cheaper than fully flexible fares on most longer journeys. Stringing together a stack of advance tickets for a long trip may save money, but Seat 61 calls that risky.'
    - So a pass suits a trip with many stops, where you want to decide as you go, and especially one through countries where reservations are optional. If you will mostly ride French, Italian or Spanish
      high-speed trains, add €10 or more per journey for reservations, as Seat 61 suggests, before you compare.
  - h: Night trains and travel days
    list:
    - A night train that leaves before midnight uses one travel day, the day it leaves, as long as you do not change trains after midnight.
    - Changing trains after midnight uses two travel days.
    - You cannot take a night train on the last day your pass is valid.
    - Every night train needs a reservation, so book the sleeper or couchette as soon as your dates are firm.
  faq:
  - q: Can Americans buy an Interrail pass?
    a: Yes. Since Eurail and Interrail merged on 9 September 2026, anyone can buy an Interrail pass regardless of nationality or where they live.
  - q: Is there a senior discount on Interrail?
    a: Yes. If you are 60 or over on the day the pass starts, you get 10% off the adult price.
  - q: Do I need seat reservations with an Interrail pass?
    a: For all night trains and most high-speed trains, yes, and in France, Italy and Spain for most long-distance trains. In Austria, Switzerland and the Netherlands most trains need none.
  - q: Is Interrail cheaper than buying tickets?
    a: Not if you book the cheapest advance tickets for each journey. A pass usually beats tickets bought at short notice and fully flexible fares, and it lets you change plans as you go.
  - q: Can I use my Interrail pass in my own country?
    a: A Global Pass covers one journey out of your country of residence and one back in. If you live outside the 33 countries, that rule does not apply to you.
  - q: Can I use Interrail on the Eurostar?
    a: Pass holders can book special Eurostar fares, €35 in Standard or €40 in Plus between London and France or Belgium. Seats are limited, so book well ahead.
