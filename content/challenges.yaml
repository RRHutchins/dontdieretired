    url: https://cs.uwaterloo.ca/~csk/hat/
    region: any
    checked: '2026-10-11'
  story: david-smith-hat-einstein-tile
  story_note: David Smith, who found the hat, cut 60 of them from card to see how they fitted, Quanta Magazine reported. He is one of the four authors of the page linked here.
- id: hold-a-five-minute-plank
  title: Hold a plank for five minutes
  category: move
  kind: skill
  effort: moderate
  cost: free
  time: weeks
  setting: indoors
  company: either
  regions:
  - anywhere
  why: A plank works the whole trunk with no kit, and a clock makes every gain easy to see. Five continuous minutes on your forearms and toes is a real milestone, and you can read or listen to something while you build up to it.
  start:
  - Learn the shape from the NHS physiotherapy guide linked here, starting with short holds, against a worktop or on your knees if you need to.
  - Time one hold in good form and write it down.
  - Three times a week, do four holds with a rest between, and add 15 to 30 seconds to one long hold each week until you reach five minutes.
  safety: Check with your GP (family doctor) first if you have a heart condition, high blood pressure or a back or shoulder problem, and keep breathing steadily through every hold.
