  seo_title: 'Bookbinding classes for beginners: what you learn and cost'
  description: What a beginners' bookbinding course teaches, the tools to bring, whether materials are included, and what classes cost in the UK and US.
  detail:
  - h: What it's really like
    p:
    - Beginners learn to fold and sew paper into sections, then make soft and hard covers from paper, cloth and board. City Lit's six-week course also covers non-adhesive bindings, single-section sewing,
      simple boxes and why the grain direction of paper matters.
    - It rewards care more than strength. City Lit says you need some manual dexterity and attention to detail, and should be able to follow simple instructions and do simple measuring and sums. Morley
      College notes that you work standing up, so raise any difficulty with standing before you enrol.
    - The Society of Bookbinders keeps a list of courses by county, and the Guild of Book Workers keeps a list of over 130 teachers and schools. The Guild says it makes no claims about the teachers listed,
      so contact them before you book.
  - h: Ways in and what they cost
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - Morley College, London
        - 'Bookbinding, Beginner and Intermediate: five Wednesday evenings, 2.5 hours each; buy materials at class'
        - £195, or £145 concession
      - - City Lit, London
        - 'Beginners'' bookbinding: six Fridays, 10.30 to 16.30; project materials included'
        - £399, or £319 senior and £259 concession
      - - Center for Book Arts, New York
        - 'Bookbinding I: Intro to Softcover Binding, a weekend class; evening series also listed'
        - $445 for a weekend class; $550 for an evening series (2025 classes)
    after: The Guild of Book Workers' list also names Penland School of Craft and John C. Campbell Folk School in North Carolina, and North Bennet Street School in Boston, among the places that teach book
      arts.
  faq:
  - q: Is bookbinding hard to learn?
    a: Beginners' courses start with folding and sewing simple books. City Lit says you need some manual dexterity, attention to detail and simple measuring skills.
  - q: What tools do I need to start bookbinding?
    a: Morley College suggests a notebook, pencil, rubber, metal ruler, craft knife, bone folder and scissors if you have them. City Lit's bindery has most hand tools.
  - q: Are materials included in a bookbinding course?
    a: It varies. City Lit includes project materials in the fee, while Morley College says you can buy materials and tools at the first class.
  - q: How do I find a bookbinding class near me?
    a: In the UK, the Society of Bookbinders lists courses by county. In the US, the Guild of Book Workers keeps a list of teachers and schools organised by location.
