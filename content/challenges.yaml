  seo_title: "What is parkrun? How the free weekly 5k works"
  description: How parkrun works, the free Saturday 5k you can run, jog or walk, from registering for your barcode to the first-timers' briefing, results and junior parkrun.
  detail:
  - h: What it is
    p:
    - parkrun is a free 5 km (3.1 mile) event every Saturday morning, organised by local volunteers in parks in 22 countries. You can walk, jog or run it, there is no time limit, and every event has a volunteer tail walker, so nobody finishes last.
    - It began in Bushy Park, Teddington, on 2 October 2004, with 13 runners, five volunteers, a stopwatch and washers from a hardware shop as finish tokens. As more people have come to walk and jog it, the average finish time has slowed, from 22 minutes 17 seconds in 2005 to 32 minutes 30 seconds in 2020.
  - h: Your first parkrun, step by step
    list:
    - Register once, free, on the parkrun site for your country. You get a personal barcode that works at every parkrun in the world.
    - Find an event near you by postcode, town or event name, and aim to arrive 15 to 20 minutes before the start. There is no signing in.
    - Most events hold a short welcome for first-timers 10 to 15 minutes before the start, where you can ask questions and hear about the course. Then the run director gives a briefing and counts down from three.
    - The course is signposted and marshals line the route, so you do not need a map. Be considerate to other people using the park.
    - At the finish, stay in order in the funnel and take a finish token. Volunteers scan your barcode and the token. If you forget your barcode you can still take part, but you will not get a time.
    - Your time and position arrive by email or text, usually within 48 hours.
  - h: When it starts
    table:
      head: [Where, What, When]
      rows:
      - [England and Wales, 5 km parkrun, Saturday 9am]
      - [Scotland and Northern Ireland, 5 km parkrun, Saturday 9.30am]
      - [United States, 5 km parkrun, Saturday morning; check your event's page]
      - [UK and Ireland and Australia only, 2 km junior parkrun for 4 to 14 year olds, Sunday]
    after: Check the page for the event you choose before you go.
  - h: Volunteering, and building up to it
    p:
    - Every event is run by volunteers, from the run director to the barcode scanners, marshals and tail walker, and parkrun says no experience is needed for any role. Volunteering is a way to take part on a week you are not walking or running.
    - If 5 km feels a long way, walk it, or mix walking and running; parkrun says stopping, run-walking or doing part of the course is all fine. To build up to running the whole way, the NHS Couch to 5K plan is a free place to start.
  faq:
  - q: Is parkrun free?
    a: Yes. It is free to register and free to take part, every week.
  - q: Can you walk a parkrun?
    a: Yes. Walking, jogging and running are all welcome, there is no cut-off time, and a volunteer tail walker always finishes last.
  - q: What time does parkrun start?
    a: 9am in England and Wales and 9.30am in Scotland and Northern Ireland, on Saturday mornings. In the US and elsewhere it is Saturday morning; check your event's page for the time.
  - q: Do I need to register for parkrun?
    a: Once only. Registering gives you a barcode that you can use every week at any parkrun in the world.
  - q: What is junior parkrun?
    a: A free 2 km event on Sundays for 4 to 14 year olds, held in the UK, Ireland and Australia.
  - q: How long do parkrun results take?
    a: Results are processed after everyone has finished and usually arrive by email or text within 48 hours.
  sources:
  - label: parkrun UK blog, How does parkrun actually work? (9 February 2023)
    url: https://blog.parkrun.com/uk/2023/02/09/how-does-parkrun-actually-work/
    checked: '2026-11-02'
