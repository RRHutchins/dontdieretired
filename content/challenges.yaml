  seo_title: 'Guitar lessons for adult beginners: classes and costs'
  description: How to start the guitar as an adult beginner, which guitar to bring, why fingertips hurt at first, and what college classes cost in the UK and US.
  detail:
  - h: What it's really like
    p:
    - Beginners' classes start with tuning, hand position and a set of common chords, then add strumming patterns, tablature (TAB, a simple way of writing where to put your fingers) and songs. Abingdon
      & Witney's class also teaches reading music; Imperial's covers pop, rock, blues and folk and asks for short nails.
    - 'The hard part comes first: sore fingertips. Fender says the soreness can last a week or more and eases as calluses form. Its advice is to play a little every day, about 10 to 15 minutes, to press
      no harder than you need, and to have a shop check the action (the height of the strings above the neck) if fretting feels hard.'
    - Nylon-string classical guitars are easier on the fingers than steel-string acoustics, Fender says, and electrics use lighter strings again. All three classes below ask you to bring your own guitar,
      and two specify an acoustic. If you want classical guitar, City Lit runs a separate course from 1A for complete beginners upwards.
  - h: Ways in compared
    table:
