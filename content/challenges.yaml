  seo_title: "Camino from Sarria: last 100 km, stamps and Compostela"
  description: How to walk the last 100 km of the Camino to Santiago from Sarria, with the stages, the two stamps a day, how to get the Compostela and when to go.
  detail:
  - h: What it's like
    p:
    - In 2025 the Pilgrim's Reception Office in Santiago issued 530,919 Compostelas, the certificate of the pilgrimage, and 93 per cent of those pilgrims arrived on foot. Sarria, on the French Way, is by far the most popular starting point, chosen by 31 per cent; Sarria, Ferrol, Vigo and Tui or Valença together account for 51 per cent.
    - It is busiest in summer: 83 per cent of pilgrims reach Santiago between May and October. There is no compulsory starting point, and the office puts the average day on foot at 25 km (15.5 miles).
  - h: Sarria to Santiago in stages
    table:
      head: [Stage, Distance]
      rows:
      - [Sarria to Ferreiros, 12.9 km (8 miles)]
      - [Ferreiros to Gonzar, 17.2 km (10.7 miles)]
      - [Gonzar to Palas de Rei, 16.9 km (10.5 miles)]
      - [Palas de Rei to Melide, 14.4 km (8.9 miles)]
      - [Melide to Arzúa, 14.1 km (8.8 miles)]
      - [Arzúa to Rúa, 17.7 km (11 miles)]
      - [Rúa to Santiago de Compostela, 21 km (13 miles)]
    after: This seven-stage itinerary, listed on Spain's official tourism site, totals about 114 km (71 miles) and keeps most days near 15 km (9 miles). At the Pilgrim's Office average of 25 km a day the same distance takes four to five days, so choose the pace that suits you and book beds to match.
  - h: The rules for the Compostela
    list:
    - Walk at least the last 100 km continuously on the same recognised route, with the final stage ending at the cathedral. By bicycle the minimum is 200 km. If you start walking outside Spain on a recognised route, at least 70 km must be in Spain.
    - Carry a pilgrim credential (Credencial) issued by the cathedral or an authorised organisation, such as the Pilgrim's Office itself or, in the US, American Pilgrims on the Camino. You also need it to stay in the pilgrim hostels.
    - Collect at least two dated stamps a day, one at the start and one at the end of each stage. Churches, hostels, hotels and town halls along the way have them.
    - Register online before you collect the Compostela, then take a ticket with a QR code at the office in Rúa Carretas. It opens every day from 9am to 7pm except 25 December and 1 January, and at busy times it cannot promise same-day collection.
    - The Compostela is for pilgrims who walk for religious or spiritual reasons. A separate certificate of distance, from the cathedral chapter, records the kilometres, your starting point and your route, and is asked for at the same desk.
  faq:
  - q: How far is it from Sarria to Santiago?
    a: Just over the 100 km minimum. The seven-stage itinerary on Spain's official tourism site adds up to about 114 km (71 miles).
  - q: How many stamps do I need per day on the Camino?
    a: At least two a day over the last 100 km, one at the start and one at the end of each stage, each with the date.
  - q: Do I have to be religious to get the Compostela?
    a: The Pilgrim's Office gives the Compostela to people who make the pilgrimage for religious or spiritual reasons. Anyone can also ask for the certificate of distance, which records how far you travelled.
  - q: Can I cycle the Camino and still get a Compostela?
    a: Yes. By bicycle you need to cover at least the last 200 km, under the same rules as walkers.
  - q: Where do I get a pilgrim credential?
    a: From the Pilgrim's Office in Santiago or an organisation it authorises. In the US, American Pilgrims on the Camino issues them.
  - q: When is the Camino busiest?
    a: 83 per cent of pilgrims arrive in Santiago between May and October, so spring and late autumn are quieter.
  sources:
