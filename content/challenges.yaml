  seo_title: 'Learn the ukulele: which size, first chords and groups'
  description: 'How to start the ukulele: which size to buy, what a starter costs, how quickly you can play, free beginners'' courses, and how to find a group to play with.'
  detail:
  - h: What it's really like
    p:
    - The u3a, which runs ukulele groups across the UK, says you can start from absolute zero, need no music reading, and can play in just a few lessons, beginning with three or four easy chords. Its downloadable
      beginners' course covers choosing and tuning, strumming and the first 16 chords, and a second stage moves on to barre chords and fingerpicking.
    - 'The honest part, in the u3a''s words: competence comes only from practice. Groups mostly strum chords to songs from the 1920s to today, reading from song sheets; one ukulele magazine notes that groups
      which only strum can sound monotonous, and some clubs add a workshop or an open mic.'
  - h: Which ukulele to buy
    table:
      head:
      - Size
      - Notes
      rows:
      - - Soprano
        - The smallest, about 21 inches (53 cm) long; the usual first choice
      - - Concert
        - A little bigger; try it if your hands feel cramped on a soprano
      - - Tenor
        - Larger again, tuned the same as soprano and concert (G-C-E-A)
      - - Baritone
        - About 30 inches (76 cm), tuned like the top four strings of a guitar
    after: 'The u3a says £35 will buy a starter instrument and an electronic tuner. A beginners'' guide warns against the very cheapest toy instruments, whose unstable tuning pegs can make a beginner think
      the problem is them. In the US, check your library: Nashville Public Library lends a ukulele, case, tuner and booklet for three weeks.'
  faq:
  - q: Is the ukulele easy to learn?
    a: The u3a says you can play in just a few lessons, starting from absolute zero with three or four easy chords and no need to read music.
  - q: Which ukulele size should a beginner buy?
    a: A soprano, the smallest at about 21 inches. If your hands feel cramped, try a concert.
  - q: How much does a beginner ukulele cost?
    a: The u3a says about £35 buys a starter instrument and an electronic tuner. Avoid the very cheapest, which may not stay in tune.
  - q: Where can I find a ukulele group?
    a: Ask your local u3a, whose ukulele groups run across the country, or look for groups on Meetup and at your library.
