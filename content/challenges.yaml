  start:
  - Read the park's Angels Landing permit page and enter the seasonal lottery in the window before the season you want.
  - If you miss out, enter the day-before lottery while you are near the park, or hike to Scout Lookout, which needs no permit.
  - 'Start early from the Grotto trailhead with plenty of water: the park advises at least a gallon (about 4 litres) per person per day.'
