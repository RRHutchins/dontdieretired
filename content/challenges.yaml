  seo_title: 'Willow basket making for beginners: classes and costs'
  description: What a beginners' willow basket class teaches, what you make, whether the willow is included, the tools to buy, and what classes cost in the UK and US.
  detail:
  - h: What it's really like
    p:
    - A first basket follows a set order. City Lit's beginners pair a base, insert the stakes, then work the upsett and wale, weave the sides and finish with a simple border, ending up with a small basket
      for bread or fruit.
    - Willow has to be prepared before you weave it. The John C. Campbell Folk School's week covers growing, harvesting, sorting and soaking willow as well as weaving, and one UK course asks students to
      buy and prepare their own willow after guidance.
    - It takes some strength in the hands. City Lit notes that willow basketry needs some physical strength. Easton College asks students on its five-week course to buy secateurs and a small shop knife.
  - h: Ways in and what they cost
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - City Lit, London
        - 'Make a willow basket in two evenings: two three-hour sessions; materials provided; all levels'
        - £129 (same for full, senior and concession)
      - - Easton College, Norwich
        - 'Willow Basketry: five Tuesday evenings; a tension tray, a berry basket, a plant support and a basket base and an asymmetric hand basket'
        - Fee to be confirmed
      - - John C. Campbell Folk School, North Carolina
        - 'Stake & Strand Willow Baskets: a week; two or three baskets depending on skill; all levels'
        - $870 tuition, plus $200 materials
    after: City Lit's last listed dates were in 2025, so check for new runs. The Basketmakers' Association lists workshops run by its members around the UK, though its listings do not always show level
      or price.
  faq:
  - q: How long does it take to make a willow basket?
    a: A small one can be done on a beginners' class. City Lit's course makes a bread or fruit basket in two three-hour evenings.
  - q: Do I need to soak willow before weaving?
    a: Willow is soaked to prepare it for weaving. The John C. Campbell Folk School's willow class teaches sorting and soaking alongside weaving.
  - q: What tools do I need for willow basket making?
    a: Classes usually provide what you need on the day. Easton College asks students to buy secateurs and a small shop knife for its course.
  - q: Is willow basket weaving hard on the hands?
    a: It needs some strength. City Lit says so in its course notes and suggests contacting the department first if you are concerned.
