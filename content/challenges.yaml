  why: Carve a design into a block of lino, roll ink over it and press paper onto it, and you can pull the same picture again and again. A one-day class or a short evening course is enough to go home with
    your own block and prints.
  start:
  - Book a beginners' linocut or relief printmaking class at an adult education college or a print studio.
  - Bring a few drawings or photos to work from.
  - Once you have the knack, buy a small starter kit and keep printing at the kitchen table.
