  seo_title: 'Calligraphy for beginners: pens, paper and courses'
  description: 'How to start calligraphy: which hand to learn first, the pens, nibs and paper beginners use, how often to practise, and where to find a class or group.'
  detail:
  - h: What you need
    list:
    - A pen. North Seattle College's beginners' class uses a Pilot Parallel pen. A calligraphy supplier suggests a William Mitchell Round Hand nib for broad-edged lettering, or a Nikko G nib for pointed-pen
      styles such as Copperplate.
    - Smooth calligraphy paper or a good layout pad. The same supplier says printer paper will feather and bleed with most calligraphy inks.
  - h: What it's really like
    p:
    - 'CLAS admits calligraphy can be frustrating when a nib will not work or you cannot fit a reservoir, and its beginners'' guides page has videos on ink flow and tips for left-handers. A supplier''s
      guide suggests short, regular practice: 15 to 20 minutes, three or four times a week.'
    table:
      head:
      - Way in
      - Format
      - Cost (as last listed)
      rows:
      - - CLAS LiveOnline (UK, online)
        - Beginners' courses of four two-hour sessions in Foundational, Roman Capitals or Copperplate
        - £95 members, £120 non-members
      - - City Lit, London
        - Ten three-hour sessions for complete beginners; no equipment needed for the first
        - £499, or £399 senior
      - - Society of Scribes and Illuminators
        - A 24-lesson correspondence course in four units, or a Fellow as a private tutor
        - £250 a unit of six lessons; tutors £60 an hour (£50 for members)
      - - Washington Calligraphers Guild (US)
        - A list of teachers and classes, including community colleges and Smithsonian Associates
        - See each class
  faq:
  - q: What pen should a beginner use for calligraphy?
    a: A Pilot Parallel pen is used on North Seattle College's beginners' class. For dip pens, one supplier suggests a William Mitchell Round Hand nib for broad-edged lettering.
  - q: Is calligraphy hard to learn?
    a: It takes patience. CLAS says it can be frustrating when you cannot get a nib working or fit a reservoir, and a supplier suggests short, regular practice.
  - q: Can I learn calligraphy online?
    a: Yes. CLAS runs LiveOnline beginners' courses, and the Society of Scribes and Illuminators has a 24-lesson correspondence course.
  - q: What paper is best for calligraphy practice?
    a: Smooth calligraphy paper or a good layout pad. Printer paper feathers and bleeds with most calligraphy inks.
