  places: [yorkshire]
  why: Pen-y-ghent, Whernside and Ingleborough are usually climbed in a single day on a 24-mile circuit with about 5,000 feet of ascent. The route follows public rights of way and open access land, so there is nothing to book and you can start anywhere on the loop.
  start:
  - Read the Yorkshire Dales National Park Authority's Walking the Yorkshire Three Peaks page and download its route map or GPX file.
  - Buy the OS Explorer OL2 map, learn to use it with a compass and walk each peak separately first.
  - Choose a long summer day, check the forecast and leave your route plan with someone.
