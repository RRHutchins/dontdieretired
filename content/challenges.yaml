  detail:
  - h: What it's really like
    p:
    - A beginners' course starts with simple objects. City Lit's Drawing for beginners works through mark-making, tone from light to dark, the way light falls on basic forms, positive and negative space,
      and simple composition. It is aimed at people with little or no drawing experience, and paper and drawing media are provided.
    - Some courses are more traditional. A Cumbrian adult learning course has beginners copy a lithograph from the Charles Bargue drawing course, with lessons in measuring, proportion and using tone to
      make forms look solid. 92NY in New York covers line, shape, shadow, value, tone, form and perspective, with demonstrations and critiques.
    - The hard part is that three evenings is only a start. City Lit points students on to Drawing 1, Life drawing for beginners or Portraits 1, and the Art Students League in New York runs classes month
      by month with no entrance requirements, so you can keep going.
