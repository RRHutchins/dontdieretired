  - kind: read
    person: Deirdre O'Shea, of Killarney, Co Kerry
    line: Was one of the few people inside the Newgrange chamber at the 2023 winter solstice, with her mother Cecilia, and watched it fill with light as the sun rose.
    title: Onlookers observe 'magical' Winter Solstice at Newgrange
    outlet: RTÉ News
    url: https://www.rte.ie/news/leinster/2023/1221/1423137-winter-solstice
    checked: '2026-11-07'
  seo_title: 'Stonehenge solstice sunrise: times, parking and rules'
  description: 'How to see the solstice sunrise at Stonehenge: winter 2026 times, free entry, parking and buses, what you cannot bring, and other ancient sites to try.'
  detail:
  - h: What it's really like
    p:
    - At the solstice, English Heritage opens Stonehenge free of charge and lets people walk up to the stone circle itself. On an ordinary day, getting inside the circle means booking a guided Stone Circle
      Experience. The next solstice opening is the winter gathering on Tuesday 22 December 2026, with sunrise at about 8:09am.
    - 'The Royal Observatory Greenwich puts the solstice itself at 8.50pm GMT on Monday 21 December, so the celebration is the sunrise that follows. It is a crowded, dark, early start: the car park opens
      at 5:15am, the queue to get in by car can last up to two hours, and Wiltshire Police and the ambulance service are on site.'
    - Go with the right spirit. English Heritage asks visitors to respect others, because for many people who come, Stonehenge is a sacred place. You may not touch or climb on the stones, and any chair
      has to stay at least 2 metres (about 6 feet) away from standing or fallen stones.
  - h: Winter solstice 2026 at a glance
    table:
      head:
      - What
      - Detail
      rows:
      - - Date
        - Tuesday 22 December 2026
      - - Entry
        - Free
      - - Car park opens
        - 5:15am
      - - Last parking for the sunrise
        - 7:00am
      - - Sunrise
        - About 8:09am
      - - Last parking admission
        - 9:00am
      - - Everyone out of the car park
        - By 11:00am
      - - Parking
        - 'Must be booked ahead: £16 a car or van, £21 a motorhome, £5 a motorbike; a few Blue Badge spaces at £16'
      - - Watch from home
        - Free livestream on the official Stonehenge and English Heritage Facebook pages and the English Heritage YouTube channel
    after: These are English Heritage's own times, checked on 7 November 2026, and it calls them approximate. Check its Winter Solstice 2026 page before you set off. It also warns about fake pages and scammers,
      so book parking only through English Heritage.
  - h: Getting there without a car
    p:
    - 'English Heritage strongly advises against driving: sat navs are unreliable because of temporary road closures, and drivers have to follow the yellow "Solstice – Ticket Holders" signs. Salisbury Reds
      runs special buses from Salisbury railway station and the city centre (New Canal) through Amesbury to Stonehenge, with times on the Salisbury Reds website. There are taxis at Salisbury station, but
      book one ahead.'
    - Stonehenge is a 2½ mile (4 km) walk from Amesbury. From the visitor centre a shuttle bus runs to the stone circle, or the walk takes 25 to 30 minutes on the signed pedestrian route.
  - h: What you can and cannot bring
    list:
    - No drugs or alcohol anywhere on the site. Alcohol is taken off you.
    - No camping, tents, sleeping bags or duvets. Sleeping on the ground is a trip hazard.
    - No glass, which can hurt the livestock and wildlife.
    - No drones, bladed items or naked flames, including candles and fireworks, and no smoking or vaping in the stone circle.
    - Small bags only, about 30 x 25 x 15 cm (12 x 10 x 6 inches), which may be searched. No large umbrellas.
    - No pets except assistance dogs.
    - Acoustic instruments are fine; amplified music is not.
    - Outdoor chairs only, kept at least 2 metres from the stones. Take your rubbish home, or bag it and bin it at a marked point.
  - h: Other places to see the solstice sun
    table:
      head:
      - Place
      - What happens
      - How to go
      rows:
      - - Stonehenge, Wiltshire (any time of year)
        - 'The Stone Circle Experience: an hour inside the circle with a guide, early morning or evening, at most 52 people'
        - Book ahead, from £70 an adult and £40 for ages 5 to 17; booking to March 2027, none in October or November
      - - Avebury, Wiltshire (National Trust)
        - The Trust calls the summer solstice an extremely busy time; there is no camping and the stones may not be climbed
        - Bus 49 or 42 to the Red Lion (the 42 does not run on Sundays); parking £8 all day
      - - Newgrange, Co Meath, Ireland
        - On winter solstice mornings, 19 to 23 December, sunlight enters the passage tomb through the roof box above the entrance; on the shortest day it shines in for 17 minutes
        - 'A public lottery: 38 winners, each with a guest; 34,263 people entered for 2026'
      - - Maeshowe, Orkney
        - The setting sun shines down the passage for about three weeks either side of the winter solstice
        - Timed tickets; Historic Environment Scotland suggests the 2pm tour, late November to mid-January
      - - Castlerigg, near Keswick, Cumbria
        - 38 standing stones about 4,500 years old, in a ring of fells
        - Free, open at any reasonable time in daylight; limited parking, or about 30 minutes on foot from Keswick
      - - Calanais, Isle of Lewis
        - Neolithic standing stones with over 5,000 years of history, reached through the visitor centre
        - Book through Urras nan Tursachan; an entry fee was approved in November 2025, with prices still to be published
      - - Cahokia Mounds, Illinois, US
        - A free sunrise talk by an archaeologist at the reconstructed Woodhenge, on the Sunday closest to each solstice and equinox
        - Free entry and parking, no booking; check the events page for the date
    after: Newgrange's 2026 draw has already been made; the Office of Public Works will livestream the 2026 solstice on Monday 21 December. Cahokia asks that no ceremonies are held at its observances, out
      of respect for Native American cultures.
  faq:
  - q: When is the winter solstice at Stonehenge in 2026?
    a: English Heritage opens Stonehenge for the winter solstice on Tuesday 22 December 2026, with sunrise at about 8:09am. The solstice itself falls at 8.50pm GMT on Monday 21 December.
  - q: Is the Stonehenge solstice free?
    a: 'Entry is free. If you drive, you must book parking ahead: £16 for a car or van, £21 for a motorhome and £5 for a motorbike.'
  - q: Can you touch the stones at Stonehenge on the solstice?
    a: No. English Heritage asks you not to touch or climb on the stones, and to keep chairs at least 2 metres away from them.
  - q: When is the summer solstice in 2027?
    a: The Royal Observatory Greenwich gives Monday 21 June 2027. On 7 November 2026 English Heritage had not yet published its 2027 arrangements, so check its solstice page in the spring.
  - q: Can I watch the Stonehenge solstice sunrise online?
    a: Yes. English Heritage livestreams it free on the official Stonehenge and English Heritage Facebook pages and the English Heritage YouTube channel.
  - q: Can you go inside the Stonehenge circle on a normal day?
    a: Only on English Heritage's Stone Circle Experience, a guided hour outside normal opening times, from £70 for an adult. It is booking to March 2027, with no visits in October or November.
  safety: 'It is dark and crowded before dawn: keep to the signed pedestrian routes, leave candles and anything with a flame at home, and find a steward, police officer or ambulance crew if you need help.'
