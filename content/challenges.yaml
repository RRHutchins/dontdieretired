  inspire:
  - kind: read
    person: Judith, from Walsall
    line: Started with one-minute runs in a Couch to 5K group, went on to parkruns, 10Ks and two half marathons, and now leads new runners in the group.
    title: "Judith: From Couch to 5K to half marathons"
    outlet: Triathlon Trust
    url: https://triathlontrust.org/uncategorized/judith-from-couch-to-5k-to-half-marathons/
    checked: '2026-11-01'
  seo_title: "Couch to 5K: the NHS nine-week plan explained"
  description: How the free NHS Couch to 5K plan builds week by week, what to wear and eat, what to do if a week feels too hard, and where to run next.
  detail:
  - h: What it's like
    p:
    - Couch to 5K is a free nine-week plan from the NHS (the UK health service). You run three times a week with a rest day between each run, and by the last week you are running for 30 minutes without stopping. The NHS says it is for everyone, whatever your fitness, and is aimed at complete beginners.
    - Every session starts with a five-minute brisk walk to warm up and ends with a five-minute walk to cool down. In between, the early weeks mix short runs with walking, and the walks shrink as the runs grow.
  - h: How the nine weeks build
    table:
      head: [Week, Each run, Time with warm-up and cool-down]
      rows:
      - ['1', Eight 1-minute runs with 1½-minute walks between, 28½ minutes]
      - ['2', Six 1½-minute runs with 2-minute walks between, 29 minutes]
      - ['3', "Runs of 1½ and 3 minutes, twice through, with walks between", 25 minutes]
      - ['4', "Runs of 3 and 5 minutes, twice through, with walks between", 31½ minutes]
      - ['5', "Run 1: three 5-minute runs. Run 2: two 8-minute runs. Run 3: 20 minutes without stopping", 30 to 31 minutes]
      - ['6', "Run 1: 5, 8 and 5 minutes. Run 2: two 10-minute runs. Run 3: 25 minutes without stopping", 33 to 35 minutes]
      - ['7', 25 minutes without stopping, 35 minutes]
      - ['8', 28 minutes without stopping, 38 minutes]
      - ['9', 30 minutes without stopping, 40 minutes]
    after: The third run of week 5 is the big step, your first 20 minutes with no walking. The NHS says it is fine to repeat a week, or a single run, if you are not ready to move on, and you can come back to the plan at any time.
  - h: The honest hard parts
    p:
    - The plan is gentle, but some runs will feel hard, and week 5 is where many people slow down. That is what repeating a week is for. Rest days matter too; the NHS calls them just as important as the runs, because they let your body recover and help prevent injury.
    - On the longer runs the NHS suggests breathing in for three steps and out for two, keeping your head up, back straight and shoulders relaxed. In hot weather, run in the morning while it is cooler.
  - h: What you need
    list:
    - Running shoes that support your feet, comfortable clothes you can move in, and a supportive sports bra if you need one.
    - Reflective clothing and well-lit routes if you run when it is getting dark.
    - Something to time the runs. The free NHS app (App Store and Google Play) times every run for you, with a trainer's voice in your ear, and works with your music. The NHS also has a printable plan.
    - A light snack with some carbohydrate one to two hours before, such as a banana or a slice of toast, and water for sips on warm days.
  - h: After week 9
    p:
    - The NHS points finishers towards parkrun, a free weekly 5 km event that you can walk, jog or run, with no time limit. It is a good way to keep three runs a week going with other people around you.
  faq:
  - q: How long does Couch to 5K take?
    a: Nine weeks, with three runs a week. The last week is three runs of 30 minutes without stopping, about 40 minutes with the warm-up and cool-down walks.
  - q: Can I repeat a week of Couch to 5K?
    a: Yes. The NHS says it is fine to repeat a week, or a single run, if you are not ready to move on, and you can pick the plan up again at any time.
  - q: Do I need the Couch to 5K app?
    a: No, but it helps. The free NHS app times each run and talks you through it; you can also use the printable plan and a watch or phone timer.
  - q: Should I see a doctor before starting Couch to 5K?
    a: The NHS says to speak to a GP (family doctor) first if you are worried about your health.
  - q: What should I eat before a run?
    a: The NHS suggests a light snack with some carbohydrate one to two hours before, such as a banana or a slice of toast.
  - q: What should I do after Couch to 5K?
    a: The NHS suggests parkrun, a free weekly 5 km event you can walk, jog or run with no time limit.
  sources:
  - label: NHS Better Health, Couch to 5K running plan
