  seo_title: 'Blacksmithing for beginners: forge days and courses'
  description: What happens on a beginners' blacksmithing day or course, what you make, what to wear, the safety kit forges insist on, and what it costs in the UK and US.
  detail:
  - h: What it's really like
    p:
    - 'A first day covers the basic moves: drawing out, tapering, twisting and forming hot steel. On West Dean''s one-day taster you make a barbeque toasting fork, and a bottle opener if there is time.
      Longer courses give you your own forge and anvil and build up hammer control and how to strike the anvil.'
    - It is hot, noisy work. The University of Utah course warns that it is hot and thirsty, West Dean and Brinsbury provide or lend eye and ear protection and other kit, while Utah asks you to bring leather
      gloves and safety glasses. West Dean makes steel-toe-capped boots compulsory and turns away anyone without them.
    - Clothing matters. Both West Dean and Brinsbury College rule out shorts, West Dean prefers cotton or wool to synthetics, Utah asks for natural fibres, and Brinsbury asks for denim rather than loose
      cotton.
  - h: Ways in and what they cost
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - West Dean College
        - 'Blacksmithing Experience: one day, 9:15am to 5pm; a toasting fork; fuel, steel and lunch included'
        - £206
      - - Brinsbury College
        - 'Blacksmithing Short Course: six Saturday mornings of three hours; own forge, anvil and vice; up to 10 students'
        - £750
      - - University of Utah Continuing Education, with Wasatch Forge
        - 'Blacksmithing, An Introduction: six weekly evening sessions of three hours'
        - $345 tuition plus a $100 supplies and studio fee
    after: In the US, ABANA's list of schools includes residential craft schools such as the John C. Campbell Folk School, Penland School of Craft and Peters Valley School of Craft. ABANA asks prospective
      students to do their own checks before choosing a class.
  faq:
  - q: Can a complete beginner do a blacksmithing course?
    a: Yes. West Dean's one-day experience is for complete beginners, and Brinsbury College's short course is designed for absolute beginners.
  - q: What should I wear to a blacksmithing class?
    a: Natural-fibre clothes, long trousers and sturdy safety footwear. West Dean will not let you take part without steel-toe-capped boots, and the Utah course asks you to bring leather work gloves and
      safety glasses.
  - q: What will I make on a blacksmithing taster day?
    a: A small item. West Dean's day produces a barbeque toasting fork, and a bottle opener if time allows.
  - q: How do I find blacksmithing classes near me?
    a: In the UK, the British Artist Blacksmiths Association points beginners to short taster courses through its directory. In the US, ABANA publishes a list of schools offering classes.
  safety: Courses provide or require eye and ear protection, West Dean insists on steel-toe-capped boots, and it says a tutor must supervise all work in its forge.
