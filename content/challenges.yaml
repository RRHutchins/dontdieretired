- id: drive-north-coast-500
  title: Drive the North Coast 500
  photo_file: "File:Kylesku Bridge 2016.jpg"
  photo_caption: "Kylesku Bridge in Sutherland, north-west Scotland, 2016."
  photo_alt: "A curved concrete road bridge on angled legs crossing a narrow sea loch, with gorse in flower in the foreground and hills behind."
  photo_checked: '2026-11-06'
  category: travel
  kind: experience
  effort: moderate
  cost: high
  time: weeks
  setting: outdoors
  company: either
  season: Late spring to early autumn
  regions:
  - uk
  places:
  - scotland
  why: The North Coast 500 is a 516-mile loop around the far north of Scotland, through the Black Isle, Caithness, Sutherland and Wester Ross. It strings together white beaches, bare mountains and remote
    fishing villages on roads that are often a single lane wide.
  start:
  - Read the planning pages and sample itineraries on the official North Coast 500 site and decide how many days to allow.
  - Book your overnight stops before you set off, as beds are scarce in the smaller villages.
  - Read the site's road safety advice and learn how passing places work on single-track roads.
  links:
  - label: North Coast 500 official site
    url: https://www.northcoast500.com/
    region: uk
    checked: '2026-10-07'
  - label: 'VisitScotland: North Coast 500'
    url: https://www.visitscotland.com/planning/travel-in-scotland/driving-road-trips/north-coast-500
    region: uk
    checked: '2026-11-05'
  safety: 'Much of the route is single-track road with unfenced stretches where sheep, cows and deer wander: drive slowly, pull in to passing places, never park in one, and keep large motorhomes off the
    Bealach na Bà.'
  kit:
  - name: Midge net and repellent
    why: for midges on still, damp days in the Highlands
    url: https://www.amazon.co.uk/s?k=midge+head+net+repellent
  - name: Binoculars (8x42)
    why: a common all-round size for birds and wildlife; try the weight before you buy
    url: https://www.amazon.co.uk/s?k=binoculars+8x42
  inspire:
  - kind: read
    person: Janet Kerr, a former teacher from Lochgelly, Fife
    line: Cycled the North Coast 500 on her own in nine days, setting out from Inverness and riding 87 miles on her last day.
    title: 'Inspiring cyclists: Cycling the North Coast 500 with Parkinson''s'
    outlet: Cycling UK
    url: https://www.cyclinguk.org/real-life-stories/inspiring-cyclists-cycling-north-coast-500-parkinsons
    checked: '2026-11-05'
  seo_title: 'North Coast 500: how many days, route and driving tips'
  description: 'Plan the North Coast 500: how many days to allow, which way round, when to go, single-track roads and passing places, Bealach na Bà and campervan rules.'
  detail:
  - h: What it's really like
    p:
    - The North Coast 500 is a 516-mile (830 km) loop that starts and finishes in Inverness. It runs through Inverness-shire, the Black Isle, Easter Ross, Caithness, Sutherland and Wester Ross, and you
      can drive it either way round.
    - 'The roads are the adventure. Parts of the route are single-track with passing places, long lengths are unfenced, so cows, sheep, goats and deer wander onto the road, and phone reception can be patchy,
      especially in remote areas. The route''s own road safety page puts it simply: the North Coast 500 is not a racetrack.'
  - h: How many days, and when to go
    p:
    - The official site recommends at least five to seven days, and VisitScotland says most visitors spend five to seven. The official site calls booking accommodation, vehicle hire and activities in advance
      essential.
    table:
      head:
      - Months
      - What to expect
      rows:
      - - April to June
        - One of the two windows VisitScotland suggests; midges start in May
      - - July and August
        - Within May to September, when most visitors come; midges at their peak in midsummer
      - - September and October
        - VisitScotland's other suggested window; midges until October
      - - November to March
        - The official site calls the route a year-round destination, though most visitors come from May to September
    after: Midges are worst early and late in the day, on calm, overcast days, and mainly in the west Highlands. VisitScotland suggests checking the midge forecast before you plan the day. The official
      site suggests heading up the east coast from Inverness first.
  - h: Single-track roads and passing places
    list:
    - Pull into a passing place on your left to let an oncoming car or a driver behind you get by. If the passing place is on the right, wait opposite it.
    - Give way to traffic coming uphill when you can, and reverse to a passing place if you need to.
    - Never park in a passing place.
    - On a single-track road, drive so you can stop in half the distance you can see to be clear.
    - Give cyclists at least 1.5 metres (about 5 feet) when you pass.
    - The drink-drive limit in Scotland is 22 micrograms of alcohol in 100 millilitres of breath.
  - h: The Bealach na Bà and the Drumbeg road
    p:
    - The Bealach na Bà, the pass over to Applecross, was built in 1822 and has gradients that approach 20%. The sign at the foot says it rises to 2,053 feet (626 metres) with gradients of 1 in 5 and hairpin
      bends, and is not advised for learner drivers, large vehicles or caravans.
    - 'The official site says the Bealach na Bà and the B869 Drumbeg road are not recommended for larger vehicles and motorhomes. If your motorhome is bigger than a standard VW T5 conversion (about 16 to
      18 feet, or 5 to 5.5 metres), it asks you not to attempt either: take the A832 instead of the Bealach na Bà, and the A894 instead of the Drumbeg road. Its test for any vehicle: if you cannot reverse
      accurately for several hundred yards on a narrow single-track road, choose the main road.'
  - h: Campervans, motorhomes and where to stay
    list:
    - Scotland's right of access does not include motor vehicles, so wild camping in a campervan or motorhome is not covered by the Scottish Outdoor Access Code. Wild camping is for people on foot, by bike
      or with other non-motorised transport.
    - You may rest in a designated formal lay-by, including overnight in a motorhome, but use the campsites along the route where you can; some take no bookings.
    - 'Empty chemical toilets and grey water only at a designated waste point: public toilets are not suitable.'
    - Never drive onto beaches or grass verges, and obey any parking restrictions a landowner sets.
    - Check the size of your vehicle against the route before you set off.
  faq:
  - q: How many days do you need for the NC500?
    a: The official site recommends at least five to seven days, and seven or more if you want time to stop. Most visitors spend five to seven.
  - q: How long is the North Coast 500?
    a: 516 miles (830 km), starting and finishing in Inverness.
  - q: Which way round should you drive the NC500?
    a: Either way works. The official site suggests going up the east coast from Inverness first.
  - q: Can you wild camp in a campervan on the NC500?
    a: Not under the Scottish Outdoor Access Code, which does not cover motor vehicles. Use campsites, or rest in a designated formal lay-by.
  - q: When is the best time to drive the North Coast 500?
    a: The official site says late spring and early autumn; VisitScotland suggests April to June or September and October. Midges are around from May to October.
  - q: Can you drive the Bealach na Bà in a motorhome?
    a: The official site asks drivers not to attempt it in anything bigger than a standard VW T5 conversion, about 16 to 18 feet long. Take the A832 instead.
