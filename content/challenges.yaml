- id: open-water-swim
  title: Swim in open water
  category: move
  kind: experience
  effort: moderate
  cost: low
  time: afternoon
  setting: outdoors
  company: others
  season: Summer for a first swim
  regions:
  - anywhere
  why: Swimming in a lake, river or the sea is a completely different experience from following a black line in a pool. You notice the water, the weather and the light in a way you never do indoors.
  start:
  - Read the Outdoor Swimming Society's getting started advice for the kind of water you have in mind.
  - Choose a supervised venue or lifeguarded beach and go with someone who has swum there before.
  - Get in slowly, stay close to the shore and keep your first swim short.
  links:
  - label: Outdoor Swimming Society
    url: https://www.outdoorswimmingsociety.com/
    region: uk
    checked: '2026-10-06'
  safety: Cold water affects breathing and strength quickly, so enter gradually and never swim alone.
