  seo_title: "West Highland Way: itineraries, stages and when to walk"
  description: The West Highland Way's 96 miles from Milngavie to Fort William, with five, six and seven-day itineraries, midges, camping rules and what to book first.
  detail:
  - h: What it's like
    p:
    - The West Highland Way runs 154 km (96 miles) from Milngavie, on the edge of Glasgow, to Gordon Square in Fort William. Opened in 1980, it was Scotland's first official long-distance route.
    - The country changes as you go. You cross the Highland Boundary Fault on Conic Hill, follow the shore of Loch Lomond below Ben Lomond, cross Rannoch Moor, one of the last remaining wildernesses in Europe, and climb the Devil's Staircase in Glencoe before the last stretch to Fort William. Most people take six to seven days.
    - The route is waymarked along its length, but the official site says you should still be able to use a map and compass.
  - h: Choosing an itinerary
    table:
      head: [Days, Nights at, Longest day]
      rows:
      - ["5", "Balmaha, Inverarnan, Bridge of Orchy, Kinlochleven", 21 miles (34 km)]
      - ["6", "Balmaha, Inversnaid, Crianlarich, Inveroran, Kinlochleven", 20 miles (32 km)]
      - ["7", "Drymen, Rowardennan, Inverarnan, Tyndrum, Inveroran, Kinlochleven", 19 miles (31 km)]
      - ["7", "Drymen, Rowardennan, Inverarnan, Tyndrum, Kingshouse, Kinlochleven", 19 miles (31 km)]
    after: These are the four suggested itineraries on the official site. Every one ends with the 15 miles (24 km) from Kinlochleven to Fort William. The official site warns that the northern shore of Loch Lomond, from Inversnaid to Inverarnan, is rough going and often slower than people expect, so think about the ground as well as the miles when you set each day.
  - h: When to go
    p:
    - May is the busiest month, and the official site calls spring and autumn especially beautiful. Midges are usually at their worst from June to August, within a season that runs from May to September; they are thickest at dawn and dusk, so carry repellent and a head net.
    - The site says the Way should be walked in winter only by fit walkers with good winter navigation skills.
  - h: Beds and camping
    list:
    - Beds are limited in some places, so the official site advises booking as much as you can before you go. Where nothing is free, you can take transport back to the previous night's stop.
    - The official site says to wild camp for no more than two or three nights in any one place.
    - From 1 March to 30 September camping byelaws apply in parts of Loch Lomond and The Trossachs National Park, so check the park's camping management zone information before you pitch a tent there.
    - Use a stove rather than an open fire, take everything away with you, and do not camp in the field between Gartness Road and the A811 just before Drymen, which holds sheep and cattle.
  faq:
  - q: How long does it take to walk the West Highland Way?
    a: Six to seven days on average. The official site suggests itineraries of five, six and seven days.
  - q: How long is the West Highland Way?
    a: 154 km (96 miles), from Milngavie to Fort William.
  - q: When are the midges worst on the West Highland Way?
    a: Usually from June to August, especially at dawn and dusk. The midge season runs from May to September.
  - q: Can I walk the West Highland Way with my dog?
    a: Yes, if it is under proper control. The fields before Conic Hill are closed to dogs for about six weeks of lambing, from mid-April to the end of May, and dogs should be on a lead in some areas from April to July.
  - q: Can you wild camp on the West Highland Way?
    a: Yes, for no more than two or three nights in one place. Camping byelaws apply in parts of Loch Lomond and The Trossachs National Park from 1 March to 30 September.
  - q: Is the West Highland Way waymarked?
    a: Yes, along its whole length, but carry a map and compass and know how to use them.
