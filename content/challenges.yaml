  why: Kilimanjaro, in Tanzania, is the highest mountain in Africa and the world's highest free-standing volcano, its summit at 5,895 metres (19,341 feet). There are several routes up, including Marangu, Machame, Lemosho and Rongai, and every climb is led by a licensed operator.
  start:
  - Read Kilimanjaro National Park's visitor guide and compare the routes.
  - Choose a licensed operator and an itinerary with acclimatisation days, as solo trekking is not allowed.
