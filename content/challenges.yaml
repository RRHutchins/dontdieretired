  seo_title: "Yorkshire Three Peaks walk: route, training and kit"
  description: The Yorkshire Three Peaks walk explained, with distance, climb, where to start, how to train on each peak first, what to carry and how to plan the day.
  detail:
  - h: What it's like
    p:
    - The Yorkshire Three Peaks are Pen-y-ghent, Whernside and Ingleborough, usually walked as one circular route in a single day. The Yorkshire Dales National Park Authority gives the circuit as 24 miles (38.6 km) with about 5,000 feet (1,600 metres) of climbing.
    - The traditional start is Horton-in-Ribblesdale, with Ribblehead the most popular alternative, but you can start anywhere on the loop and go either way round. The route uses public rights of way and open access land, so there is nothing to book and no permission or registration needed. It is signposted and waymarked, but the park says not to rely on that.
  - h: The honest hard parts
    p:
    - Twenty-four miles with three big climbs makes a long day. Conditions change quickly, temperatures drop sharply on the summits even on warm days, and the evening comes early outside high summer. The park recommends walking in daylight, usually between spring and late summer or early autumn.
    - Ingleborough's summit is a broad plateau where navigation is hard in cloud, and the park says many people leave it in the wrong direction each year. Mobile signal cannot be relied on, and there are no shops or bins on the route.
  - h: Build up one peak at a time
    p:
    - "The park publishes a separate walk for each peak, which makes a natural way to train: each is a good day out on its own, and together they show you most of the circuit."
    table:
      head: [Peak, Height, Single walk from, Distance]
      rows:
      - [Pen-y-ghent, "694 m (about 2,277 ft)", Horton-in-Ribblesdale, 10 km (6 miles) circuit]
      - [Whernside, The highest point in Yorkshire, Ribblehead viaduct, 12.5 km (7.5 miles)]
      - [Ingleborough, "723 m (about 2,372 ft)", Clapham, 17 km (10 miles)]
    after: Pen-y-ghent is many people's first peak, with good paths up Brackenbottom Scar and along the Pennine Way. All three starts have a station on the Settle to Carlisle line, so you can leave the car at home.
  - h: What to carry
    list:
    - OS Explorer map OL2 (Yorkshire Dales, Southern and Western) and a compass, and the skill to use them.
    - Broken-in boots, layers, waterproofs, a hat, gloves and spare warm clothing.
    - Food and water for the whole day, as there are no shops on the hills.
    - A whistle, first aid kit, torch with spare batteries, a charged phone and an emergency shelter.
    - Sun protection, and walking poles if you use them.
  - h: Planning the day
    p:
    - Horton-in-Ribblesdale has the main car park, run by the National Park Authority, which fills quickly on spring and summer Saturdays; parking at Ribblehead is limited to the lay-bys. The only public toilets on the circuit are at Horton. Check the forecast, leave your route with someone, and if you are delayed but safe, let them know so Fell Rescue is not called out. Groups can tell the park about a walk for free and receive its walk guidelines.
  faq:
  - q: How long is the Yorkshire Three Peaks walk?
    a: 24 miles (38.6 km) with about 5,000 feet (1,600 metres) of climbing, according to the Yorkshire Dales National Park Authority.
  - q: Where do you start the Yorkshire Three Peaks?
    a: The traditional start is Horton-in-Ribblesdale. Ribblehead is the most popular alternative, and you can start anywhere on the circuit in either direction.
  - q: Do I need to book or register to walk the Three Peaks?
    a: No. It follows public rights of way and open access land. Organised groups can tell the National Park Authority about their walk, which is free.
  - q: Which is the hardest of the Yorkshire Three Peaks?
    a: Each is hard in its own way. Whernside is the highest point in Yorkshire, and Ingleborough has the trickiest summit for navigation in cloud.
  - q: What map do I need for the Yorkshire Three Peaks?
    a: OS Explorer OL2, Yorkshire Dales Southern and Western. The park also publishes a route description and GPX files.
  - q: Can I get to the Yorkshire Three Peaks by train?
    a: Yes. Horton-in-Ribblesdale and Ribblehead are both stations on the Settle to Carlisle line, and both are on the circuit.
  sources:
  - label: Yorkshire Dales National Park Authority, Walking the Yorkshire Three Peaks
    url: https://www.yorkshiredales.org.uk/things-to-do/get-outdoors/yorkshire-three-peaks/walking-the-yorkshire-three-peaks/
