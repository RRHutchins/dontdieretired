    url: https://pafa-ce.coursestorm.com/course/screenprinting-and-beyond-in-person10
    region: us
    checked: '2026-11-07'
  seo_title: 'Screen printing workshops for beginners: what to expect'
  description: What happens at a beginners' screen printing workshop, what to bring and wear, and what day workshops and courses cost in the UK and US.
  detail:
  - h: What it's really like
    p:
    - 'City Lit''s course sets out the steps: make a stencil from paper, drawing or a digital file; coat the screen with light-sensitive emulsion; expose and wash out your artwork; mix the ink; then line
      up and print each colour on paper.'
    - A day workshop moves quicker. Print Club London asks you to bring your own A4 black-and-white design, and supplies the inks and paper. City Lit's one-day course has used ready-made photographic screens
      so beginners can print a two-colour image in a day.
    - Unlike a linocut, there is no block to carve: the image is carried by a stencil on the screen. PAFA's course teaches printing editions on registered paper, and notes the method also works on fabric
        and other surfaces.
  - h: Ways in and what they cost
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - Print Club London, Dalston
        - Beginners' workshop, one day; inks and paper included; no experience needed
        - £75
      - - City Lit, London
        - Screen printing workshop, two Saturdays, two weekends or five three-hour sessions; all levels
        - £229 to £349, or £183 to £279 senior and £149 to £227 concession
      - - Pennsylvania Academy of the Fine Arts, Philadelphia
        - 'Screenprinting and Beyond: 12 weekly three-hour sessions for beginners'
        - $570, including a $30 lab fee
    after: City Lit says basic Photoshop skills help but are not essential, and it does not allow open-toed shoes in the studio.
  faq:
  - q: Do I need experience to do a screen printing workshop?
    a: No. Print Club London says no experience is needed, and City Lit's workshop welcomes complete beginners.
  - q: What do I need to bring to a screen printing class?
    a: Print Club London asks for an A4 black-and-white design saved as a JPEG, PDF or PSD file on a USB stick. City Lit asks for closed footwear and provides protective equipment.
  - q: How is the stencil made in screen printing?
    a: City Lit teaches paper stencils, hand-drawn artwork and digital stencils, and how to coat a screen with light-sensitive emulsion and expose your artwork onto it.
  - q: Can you screen print on fabric?
    a: Yes. PAFA's course notes that screen printing works on paper, fabric and other surfaces.
