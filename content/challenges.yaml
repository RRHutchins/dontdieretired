  why: A knit and natter group is a cup of tea, conversation and a project on your needles, and many meet free in libraries and cafés. Guilds on both sides of the Atlantic run local branches, teach beginners
    and share free how-to guides.
  start:
  - Ask your library about a knit and natter group, or find a branch through the Knitting & Crochet Guild (UK) or a guild chapter (US).
  - Pick up a pair of needles or a crochet hook and some yarn, or learn from a free guide first.
  - Bring a simple project to the group and ask for help with the next step.
