- id: appalachian-trail-section
  title: Hike a section of the Appalachian Trail
  category: move
  kind: project
  effort: moderate
  cost: low
  time: weeks
  setting: outdoors
  company: either
  regions:
  - us
  why: The Appalachian Trail runs for more than 2,190 miles from Georgia to Maine, and you can sample it as a day hike or a few nights out. Section hikers piece the whole trail together over many years, one stretch at a time.
  start:
  - Use the Appalachian Trail Conservancy's hiking pages to pick a state and a section.
  - Choose a stretch with road access at both ends and arrange a lift or shuttle.
  - Start with a day hike or one night out before planning anything longer.
