  seo_title: 'Silver jewellery making course for beginners: what to expect'
  description: What a beginners' silver jewellery course teaches, what you make, whether the silver is included, what to wear and what it costs in the UK and US.
  detail:
  - h: What it's really like
    p:
    - The core skills are the same everywhere you look. Beginners learn to cut and saw metal, file, form and texture it, solder joins, then sand and polish. West Dean's beginners' weekend starts with a
      textured silver ring and then a second piece agreed with the tutor, such as earrings, a bracelet or another ring.
    - Not every course works in silver from the start. City Lit's six-week course has you practise on copper first, making a pendant, a ring and earrings, before you design your own piece. Silver is extra
      there, and the college says students generally spend £5 to £20 on their first pieces.
    - Expect a workshop with flames and sharp tools. West Dean asks for stout covered shoes and long hair tied back, and City Lit does not allow sandals or open shoes in its studio.
  - h: Ways in and what they cost
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - West Dean College
        - 'Jewellery making for beginners: a weekend; a textured silver ring plus one piece of your choice; silver and copper sheet, silver wire and solder included'
        - £338
      - - City Lit, London
        - 'Beginners'' jewellery I: six Sundays, 10:30 to 16:30; copper provided, silver extra'
        - £429, or £343 senior and £279 concession
      - - 92NY, New York
        - 'Jewelry for Absolute Beginners, Adult Intensive: condensed course of rings, bezels and cabochon stone settings; supply list required'
        - $715
      - - John C. Campbell Folk School, North Carolina
        - 'Beginning Jewelry: a week in copper, brass and sterling silver, including bezel setting'
        - $870 tuition, plus $75 to $95 materials
    after: Stone setting is not covered on West Dean's beginners' weekend, while 92NY includes cabochon setting and the Folk School includes stone and bezel setting. The Folk School warns that changes in
      metal prices can alter its materials estimate.
  faq:
  - q: Can a complete beginner make a silver ring?
    a: Yes. West Dean's beginners' weekend has a textured silver ring as its first step-by-step project, and City Lit's course is for complete beginners.
  - q: Is the silver included in a jewellery making course?
    a: It depends. West Dean includes a set amount of silver sheet and wire, while City Lit provides copper and asks you to buy silver, which it says usually costs £5 to £20 for a first piece.
  - q: What should I wear to a jewellery making class?
    a: Closed shoes and an apron, with long hair tied back. City Lit bans sandals and open shoes from its jewellery studio.
  - q: Do beginners learn soldering?
    a: Usually. West Dean, City Lit, 92NY and the John C. Campbell Folk School all list soldering in their beginners' courses.
