  why: At walking pace the country looks entirely different, and working your first lock as a crew is deeply satisfying. Hire firms teach you to steer before you leave, so no experience is needed.
  start:
  - Read the Canal & River Trust's guidance for first-time boaters.
  - Choose a route with a manageable number of locks and gather a crew.
  - Hire a boat, take the handover lesson and steer it yourself.
