  why: A broad-edged pen and a steady rhythm turn ordinary handwriting into lettering worth framing. Calligraphy societies run local groups, online courses and tutors for complete beginners on both sides
    of the Atlantic.
  start:
  - Find a local group or an online beginners' course through the Calligraphy and Lettering Arts Society (UK) or a guild such as the Washington Calligraphers Guild (US).
  - Start with one hand, such as Foundational or Italic, and a beginner's pen or a broad nib.
  - Practise for 15 to 20 minutes three or four times a week rather than in long sessions.
