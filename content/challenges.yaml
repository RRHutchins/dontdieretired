  seo_title: 'How to visit Antarctica: ships, ports, season and rules'
  description: 'Getting to Antarctica: ports, the summer season, why the size of your ship decides whether you land, the rules ashore and choosing an operator.'
  detail:
  - h: What it's really like
    p:
    - Almost every visitor to Antarctica arrives by sea, in the southern summer. Germany's Environment Agency puts the season at November to March, mostly in the waters of the Antarctic Peninsula, and IAATO, the tour operators' association, says 98 per cent of tourism voyages work in the Peninsula region.
    - 'It is busier than its reputation: IAATO counted 118,491 visitors in the 2024-25 season, after 122,072 the season before. Days are planned around weather and ice. The UK Foreign Office warns that landings can be difficult because of westerly winds and a lack of sheltered anchorages, so an itinerary is a set of chances rather than a timetable.'
  - h: 'The choice that matters most: the size of the ship'
    table:
      head:
      - IAATO category
      - Passengers
      - Landings
      rows:
      - - YA
        - Up to 12
        - Sailing or motor yachts
      - - C1
        - 13 to 200
        - Can land passengers
      - - C2
        - 201 to 500
        - Can land passengers
      - - CR
        - More than 500
        - 'No landings: you see Antarctica from the ship'
    after: Under the Antarctic Treaty measures summarised by Germany's Environment Agency, no more than 100 people may be ashore at once, only one ship may use a landing site at a time, and each group of up to 20 visitors goes with a trained guide. So on a larger ship that lands, passengers go ashore in turns. If standing on the continent matters to you, ask an operator for the ship's category before anything else.
  - h: Getting there
    p:
    - IAATO says most voyages leave from Ushuaia in Argentina, Punta Arenas in Chile or Montevideo in Uruguay. Trips to the Ross Sea side leave from Hobart in Tasmania or from Lyttelton or Bluff in New Zealand, and a few Peninsula voyages start or end in Cape Town or Port Elizabeth. Germany's Environment Agency notes that more visitors now arrive by plane.
    - You need no visa for Antarctica itself, but you may need one for the country you sail from, usually Argentina or Chile. Anyone on a British expedition, or taking a British ship or aircraft into Antarctica, needs a permit from the Foreign Office's Polar Regions Department; on an organised trip the tour operator usually arranges it, so ask if you are not sure.
  - h: Choosing an operator
    list:
    - Look the company up in IAATO's membership directory. Not every company that carries visitors is a member, though most are; members follow rules on staffing, distances from wildlife and waste, and have emergency plans.
    - Ask the ship's IAATO category and passenger numbers, and how many landings the itinerary plans if the weather allows.
    - Ask about the expedition team. IAATO expects at least 80 per cent of field staff to have relevant experience and half to have been to Antarctica before, and its members run talks on wildlife, geology, ice, history and the Antarctic Treaty.
    - Check that your medical and travel insurance covers the whole journey, as IAATO advises.
  - h: 'Ashore: the rules'
    list:
    - 'Keep at least 5 metres (about 16 feet) from wildlife: the precautionary distance in the Antarctic Treaty''s general guidelines for visitors.'
    - IAATO members do not allow recreational drones in Antarctica's coastal areas, and review that ban each May.
    - Follow your operator's biosecurity checks. IAATO publishes "Don't Pack a Pest" guidance and avian influenza protocols for the 2026-27 season.
  faq:
  - q: When can you visit Antarctica?
    a: In the southern summer. Germany's Environment Agency gives November to March; the UK Foreign Office says summer is November to February and the continent is inaccessible from March to October.
  - q: Can you land in Antarctica from a cruise ship?
    a: Only from ships carrying 500 passengers or fewer. IAATO says ships with more than 500 passengers may not land anyone, and under the Treaty rules no more than 100 people may be ashore at once.
  - q: Where do Antarctica cruises leave from?
    a: Mostly Ushuaia, Punta Arenas or Montevideo for the Antarctic Peninsula, and Hobart, Lyttelton or Bluff for the Ross Sea.
  - q: Do I need a visa or a permit to visit Antarctica?
    a: No visa for Antarctica itself, though you may need one for Argentina or Chile. Anyone on a British expedition or ship needs a Foreign Office permit, which tour operators usually arrange.
  - q: How many people visit Antarctica each year?
    a: IAATO counted 118,491 visitors in 2024-25 and 122,072 in 2023-24.
  - q: Can I fly a drone in Antarctica?
    a: 'Not for fun near the coast on an IAATO member''s trip: members ban recreational drones in coastal areas. Other uses need a permit.'
