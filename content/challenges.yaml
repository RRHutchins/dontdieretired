- id: see-a-total-solar-eclipse
  title: Stand in the shadow of a total solar eclipse
  category: explore
  kind: experience
  effort: moderate
  cost: high
  time: year
  setting: outdoors
  company: either
  regions:
  - anywhere
  why: For a few minutes the Moon covers the Sun completely, day turns to twilight and the corona, the Sun's outer atmosphere, becomes visible to the naked eye. Totality falls only along a narrow band of the Earth each time, so seeing one usually means travelling to meet it.
  start:
  - Open NASA's eclipses pages and find the next total solar eclipse whose track you could travel to.
