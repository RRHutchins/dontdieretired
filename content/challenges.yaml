  seo_title: 'Hiking a section of the Appalachian Trail: where to start'
  description: Five well-known Appalachian Trail sections compared, the permit each one needs, when to go, and how section hikes add up to 2,000-miler status.
  detail:
  - h: What section hiking is really like
    p:
    - 'The Appalachian Trail Conservancy (ATC) gives the official length for 2026 as 2,197.9 miles (3,537 km). The figure moves a little every year as stretches of path are rerouted and measured more accurately:
      the 2026 total grew by half a mile after a steep stretch in Virginia''s Mountain Lake Wilderness was replaced with a gentler one.'
    - A section hike is any part of that, from a day out to several weeks. You walk between road crossings, sleep in three-sided wooden lean-tos or at campsites, and refill water from springs and creeks.
      The ATC counts more than 250 shelters, on average about 8 miles (13 km) apart, and except in Great Smoky Mountains National Park they are first come, first served. The ATC still tells hikers to carry
      a tent or hammock, because shelters fill quickly.
    - The rules change as you cross from one land manager to the next. Most of the trail has no fees beyond parking at some parks, but a few places need a permit or charge for overnight sites, and those
      happen to be some of the best-known sections.
  - h: Five well-known sections compared
    table:
      head:
      - Section
      - State
      - Trail length (official figure)
      - Overnight permit or rule (as last listed)
      rows:
      - - Great Smoky Mountains National Park
        - North Carolina and Tennessee
        - Part of about 217.8 miles (350 km) on the NC/TN state line
        - 'Backcountry permit needed for every overnight stay: $8 per person per night plus a $6 fee per permit, booked on Recreation.gov up to a month ahead. If your plan includes a shelter, you must use
          it.'
      - - Shenandoah National Park
        - Virginia
        - 101 miles (163 km) through the park
        - 'Backcountry permit needed year-round: $9 per person plus a $6 reservation fee, up to 3 months ahead, and not sold in the park. Entry is $15 on foot or $30 per vehicle.'
      - - Harpers Ferry and Maryland
        - West Virginia and Maryland
        - 2.4 miles (3.9 km) in West Virginia and 40.9 miles (65.8 km) in Maryland
        - No camping in Harpers Ferry town or park; in Maryland, camping only at designated overnight sites.
      - - White Mountains
        - New Hampshire
        - 160.9 miles (259 km) in the state, 15.2 miles (24.5 km) above treeline
        - Appalachian Mountain Club high-use campsites cost about $10 per person per night, with no permit or reservation; reservations recommended at the staffed huts.
      - - 100-Mile Wilderness and Katahdin
        - Maine
        - 282 miles (454 km) in the state
        - A free Baxter State Park permit, collected in person at Katahdin Stream Campground and valid for 7 days, is needed before you climb Katahdin. Section hikers need one too.
    after: Lengths are from the ATC's state pages and the National Park Service; permit details are from the parks, Recreation.gov and the ATC. On 30 April 2026 Great Smoky Mountains added a $6 fee per
      permit, raised its A.T. thru-hiker pass from $40 to $44.50 and moved permits to Recreation.gov. Check each park's own page before you book.
  - h: The hard parts
    p:
    - The ATC calls Maine's Mahoosuc Notch, a canyon full of boulders, the trail's hardest mile, and says it is more scrambling than walking. Maine also has 21 unbridged stream crossings that can be dangerous
      after snowmelt or heavy rain; the widest, the Kennebec River, has a canoe ferry sponsored by the ATC in the hiking season. In New Hampshire the ATC advises very good fitness and strong knees, and
      notes that the Presidential Range has had snow in every month of the year.
    - Elevation changes everything. Kuwohi (formerly Clingmans Dome), at 6,643 feet (2,025 m), is the trail's highest point, and the Park Service says winters at the top can be quite severe. Hurricane Helene
      badly damaged the trail on the North Carolina and Tennessee border in autumn 2024, and some temporary detours were still in place when the 2026 mileage was published, so check the ATC's trail updates
      for your stretch.
    - Shelters bring their own small hazards. About half have bear boxes, cables or poles for food. Eat at least 200 feet (60 m) from the shelter, and do not sweep a shelter where there are rodents or droppings,
      because of the risk of Hantavirus.
  - h: When to go
    list:
    - 'Spring: true spring does not reach the high ridges until mid-April or May, later in New England. Avoid Vermont, New Hampshire and Maine in April and May, which the ATC calls mud season.'
    - 'Summer: can be hot and humid, so start early to avoid afternoon thunderstorms. The ATC suggests June at the earliest for Vermont and July for New Hampshire and Maine; August in the north has fewer
      bugs but more people.'
    - 'Autumn: leaves peak in October and September is quiet in many places, but snow can fall high in New Hampshire and Maine from September. Hunting season means bright orange clothing; on Pennsylvania
      State Game Lands it is required from 15 November to 15 December.'
    - 'Katahdin: Baxter State Park strongly recommends A.T. hikers summit before 15 October, and the trails close for part of the late autumn.'
  - h: Counting sections towards 2,000 miles
    p:
    - The ATC recognises everyone who reports walking the whole trail as a 2,000-miler, and section hikers count equally. Anyone who takes more than 12 months is a section hiker, and the order, direction
      and speed do not matter. It runs on an honour system, and ignoring Leave No Trace or the A.T. Hiker Pledge can get an application turned down. Approved hikers get a certificate, an A.T. patch and
      a 2,000-miler rocker patch.
    - In 2024 the ATC recognised 996 people as 2,000-milers, and 117 of them were section hikers. If you are aiming for the whole trail, keep a record of each stretch as you go, and note that miles walked
      between 31 March 2020 and 11 May 2021 do not count. Before an overnight trip anywhere on the trail, the ATC also encourages free, voluntary registration through its ATCamp system, which helps spread
      hikers out.
  faq:
  - q: How long is the Appalachian Trail?
    a: The ATC's official 2026 length is 2,197.9 miles (3,537 km). It changes slightly each year as the path is rerouted and remeasured.
  - q: Do you need a permit to hike the Appalachian Trail?
    a: Not for most of it. You need a backcountry permit to camp in Great Smoky Mountains and Shenandoah national parks, a free Baxter State Park permit to climb Katahdin, and you pay for some overnight
      sites in New Hampshire and southern Maine.
  - q: How much is a Smoky Mountains backcountry permit for the Appalachian Trail?
    a: As last listed, $8 per person per night plus a $6 fee per permit, booked on Recreation.gov. The A.T. thru-hiker pass is $44.50.
  - q: Can you section hike the Appalachian Trail and still be a 2,000-miler?
    a: Yes. The ATC recognises section hikers equally with thru-hikers, and anyone who takes more than 12 months counts as a section hiker. The order and direction do not matter.
  - q: When is the best time to hike the Appalachian Trail?
    a: It depends on the section. The ATC suggests waiting until July for good conditions in New Hampshire and Maine, avoiding mud season in northern New England in April and May, and notes September is
      quiet in many places.
  - q: Do I need a tent if the Appalachian Trail has shelters?
    a: Yes. The ATC tells hikers to carry their own tent or hammock because shelters fill quickly and most are first come, first served.
