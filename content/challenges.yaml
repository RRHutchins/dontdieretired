  seo_title: 'Life drawing classes for beginners: what to expect'
  description: What happens at a first life drawing class, how long the poses last, what to bring, what it costs, and where to find a class in the UK and the US.
  detail:
  - h: What it's really like
    p:
    - A class usually begins with very short poses, often called gesture poses, before the model holds longer ones. One studio's guide tells students to expect poses from several seconds up to 20 minutes,
      with a break of 10 to 15 minutes about halfway through. Most classes draw with pencil, chunky graphite or charcoal.
    - The honest hard part is the first evening. A London school's guide says that at first you may be drawing stick figures and struggling to see any likeness, and that drawing from life can feel daunting
      if you have never done it. It also says life models are professionals, and a Seattle studio's etiquette sheet says almost all studio etiquette rests on respect for the model.
