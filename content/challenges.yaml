  seo_title: Creative writing courses for beginners, free and paid
  description: 'Free and paid creative writing courses for beginners: the Open University''s free course, evening classes, Arvon retreats and Gotham, with costs and what to expect.'
  detail:
  - h: What it's really like
    p:
    - Most beginners' courses mix short exercises with reading like a writer and feedback on what you write. Gotham Writers Workshop's Creative Writing 101 is for beginners or anyone wanting a refresher,
      with no pressure to work on a particular project. An Arvon residential week has morning workshops, one-to-one tutorials in the afternoons and readings in the evenings, and ends with participants reading
      their own work.
    - 'The honest part comes from the Open University''s free course: writing usually cannot be done quickly, you need to live with it and return to it again and again, and even a short paragraph can take
      a while to get right. It advises sharing work with other writers.'
  - h: Ways in, from free to a week away
    table:
      head:
      - Course
      - Format
      - Cost (as last listed)
      rows:
      - - 'OpenLearn: Start writing fiction'
        - Online, 24 hours over 8 weeks; free statement of participation
        - Free
      - - City Lit, London and online
        - Short classes and longer courses, in person and online
        - £19 to £269 (concessions from £12)
      - - 'Arvon: Starting to Write'
        - Six days residential, with published writers as tutors; meals included
        - £995 single room; a limited number of concessions at £696.50, and a grant scheme
      - - Gotham Writers Workshop, New York
        - Creative Writing 101, six weeks, in person, on Zoom or online
        - $364 to $380 including registration
    after: In the US, the 124 Osher Lifelong Learning Institutes run classes for their members; the University of Utah's has included a six-session class on writing your own stories.
  faq:
  - q: Are there free creative writing courses?
    a: 'Yes. The Open University''s OpenLearn course Start writing fiction is free: about 24 hours over 8 weeks, with a free statement of participation.'
  - q: Do I need experience to take a creative writing course?
    a: No. Gotham's Creative Writing 101 is for beginners, and Arvon's Starting to Write is for people starting out.
  - q: How much does a writing retreat cost?
    a: Arvon's six-day Starting to Write course was £995 for a single room, with a limited number of concession places.
  - q: How long does a beginners' writing course take?
    a: OpenLearn's is 8 weeks at about three hours a week; Gotham's is six weeks; an Arvon residential is six days.
