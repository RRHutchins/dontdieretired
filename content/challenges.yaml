- id: walk-hadrians-wall-path
  title: Walk Hadrian's Wall Path
  category: move
  kind: project
  effort: demanding
  cost: high
  time: weeks
  setting: outdoors
  company: either
  season: May to October
  regions:
  - uk
  places: [north-east, north-west]
  why: This 84-mile National Trail follows a Roman frontier across England from Wallsend, near Newcastle, to the Solway coast beyond Carlisle. Most walkers take six or seven days, and the high central section along the wall itself is one of the best day walks in the country.
  start:
  - Read the National Trails page and choose between the whole path and a day on the central section.
  - Plan for May to October, when the ground is drier and buses and accommodation are running.
  - Allow extra time for the Roman forts and museums along the way.
