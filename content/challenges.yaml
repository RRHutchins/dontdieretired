  seo_title: 'Mount Whitney permit and hike: lottery, route, altitude'
  description: How the Mount Whitney permit lottery works, the 22-mile day hike or overnight trip, altitude and storms, the snow-free season and what to carry.
  detail:
  - h: What it's really like
    p:
    - The summit of Mount Whitney sits at 14,505 feet (4,421 metres). The trail starts at Whitney Portal, about 8,300 feet (2,530 metres) up and 13 miles (21 km) west of the town of Lone Pine, and it climbs
      more than 6,200 feet (1,890 metres) on the way to the top.
    - 'The round trip is 22 miles (35 km). The Inyo National Forest calls it a strenuous but non-technical route when it is free of snow: there is no climbing, but there is a very long day with more than
      12,000 feet (3,660 metres) of ascent and descent added together, most of it in thin air.'
    - Outpost Camp, 3.8 miles (6.1 km) in at 10,300 feet (3,140 metres), and Trail Camp, 6 miles (9.7 km) in at 12,000 feet (3,660 metres), are the two camps on the trail. Trail Camp is above the tree line
      and exposed to wind. Above it, the Forest Service warns that from the cables to Trail Crest there are places where a slip or fall can cause injury or death.
  - h: 'Day hike or overnight: the two permits'
    table:
      head:
      - ''
      - Day use
      - Overnight
      rows:
      - - People allowed each day (1 May to 1 November)
        - '100'
        - '60'
      - - How long it lasts
        - One day, midnight to midnight; no back-to-back day permits
        - Several nights, and you may leave by another trail
      - - Food storage
        - '-'
        - Bear-resistant containers required for food and rubbish
      - - Human waste
        - Pack it out in a kit
        - Pack it out in a kit
      - - Fees
        - $6 per reservation, then $15 a person
        - $6 per reservation, then $15 a person
    after: Everyone who enters the Mount Whitney Zone needs a permit, including day hikers, all year round. An overnight trip spreads the 22 miles over more than one day; a day hike means all of it in one
      go.
  - h: How the lottery works
    table:
      head:
      - Step
      - When
      - What happens
      rows:
      - - Apply
        - 1 February to 1 March
        - Enter the lottery on Recreation.gov for day use or overnight
      - - Results
        - 15 March
        - Look for your lottery application in your Recreation.gov account
      - - Claim
        - By 9pm Pacific time on 21 April
        - Pay the $15 a person and complete the details, or lose the date
      - - Leftover dates
        - From 7am Pacific time on 22 April
        - Unclaimed dates go on sale first come, first served for the rest of the season
      - - Outside the quota season
        - 2 November to 30 April
        - Permits are not limited; book online up to two weeks ahead
    after: The Forest Service gives these dates without a year, so check its Mount Whitney page in January before the 2027 window opens. There are no refunds. You can print the permit from a week before
      the trip, and it is cancelled as a no-show if it is not printed before the deadline. Only the group leader or the alternate named on the reservation can pick it up or use it.
  - h: Snow, storms and altitude
    list:
    - The Forest Service says the trail is usually free of snow from July to late September, and to expect ice and snow until the beginning of July. Its trail page gives a slightly wider window, late June
      to mid-October, and the National Park Service says ice axes and crampons are needed in spring and early summer.
    - High winds, freezing temperatures, rain or snow can come in any month, and winter storms can bring winds of more than 100 mph (160 km/h).
    - Thunderstorms and lightning are a serious hazard. If storms are forecast, plan to be off the summit by noon, and at the first sign of lightning leave the summit and any exposed ridge.
    - Altitude sickness shows as a headache that will not go, with poor sleep, dizziness, tiredness, loss of appetite, nausea or vomiting. Symptoms get worse if you keep climbing; if they are more than
      mild, go down at once, and always go down with a group member who is weak or ill.
  - h: Rules and what to carry
    list:
    - Pack out all solid human waste and paper, all year. Kits are available at the visitor centre and the trailhead, and there is a disposal box near the Whitney Portal toilets.
    - Bears are very active at the trailhead. Take all food and rubbish out of your car and put it in the bear-proof lockers and bins.
    - Overnight hikers must keep food and rubbish in a bear-resistant container.
    - Layers for freezing, windy weather, waterproofs, a head torch, and food and water for a very long day.
    - Build up first with long hill days that gain a lot of height, so the distance is not the thing that stops you.
  faq:
  - q: How hard is the Mount Whitney hike?
    a: The Forest Service calls it strenuous but non-technical when it is free of snow. It is 22 miles (35 km) there and back and climbs more than 6,200 feet (1,890 metres) to 14,505 feet.
  - q: When is the Mount Whitney lottery?
    a: Applications run from 1 February to 1 March on Recreation.gov, results come out on 15 March, and winners must claim their date by 9pm Pacific time on 21 April.
  - q: Do you need a permit to day hike Mount Whitney?
    a: Yes. Everyone entering the Mount Whitney Zone needs a permit, day hikers included, all year round.
  - q: How much does a Mount Whitney permit cost?
    a: A $6 reservation fee, which is not refunded, plus $15 for each person entering the Whitney Zone. There are no refunds on Whitney reservations.
  - q: What if I don't win the Mount Whitney lottery?
    a: Unclaimed dates go on sale first come, first served from 7am Pacific time on 22 April. From 2 November to 30 April permits are not limited, but the mountain is usually under snow and needs winter
      skills.
  - q: What is the best month to hike Mount Whitney?
    a: The trail is usually free of snow from July to late September. Expect ice and snow before July, and plan to be off the summit by noon if thunderstorms are forecast.
