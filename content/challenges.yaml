  collection: arts
  why: Folding, sewing and covering your own book shows you how every book on your shelf is put together, and the first projects use paper, cloth, board and a few hand tools. A short evening or weekly course
    takes you from a simple sewn booklet to hard covers.
  start:
  - Find a beginners' bookbinding course at an adult education college, a book arts centre, or through the Society of Bookbinders' course list (UK) or the Guild of Book Workers' study list (US).
  - Check whether materials are in the fee; at City Lit they are, at Morley College you buy them at the first class.
  - Take a pencil, metal ruler and craft knife if you have them, and a bone folder if you own one.
