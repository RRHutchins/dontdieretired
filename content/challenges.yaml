- id: carve-a-wooden-spoon
  title: Carve a wooden spoon
  category: think
  kind: skill
  effort: moderate
  cost: low
  time: afternoon
  setting: either
  company: others
  regions:
  - uk
  - us
  collection: arts
  why: Spoon carving turns a split log of fresh, unseasoned wood into something you can stir a pan with, using little more than an axe and two knives. A one-day course supplies the wood and the tools, so
    you can find out whether you like it before you buy anything.
  start:
  - Book a one-day beginners' spoon carving course where green wood and tools are provided, such as those at West Dean College or the Weald & Downland Living Museum.
  - If you are left-handed, ask for left-handed tools when you book; West Dean says you can request them.
  - Wear covered shoes and old clothes or an apron, and take a pencil for marking out.
  links:
  - label: 'West Dean College: Spoon Carving with Annie Slack (West Sussex)'
    url: https://www.westdean.ac.uk/short-courses/s1d41794-spoon-carving
    region: uk
    checked: '2026-11-07'
  - label: 'Weald & Downland Living Museum: Spoon Carving for Beginners (West Sussex)'
    url: https://www.wealddown.co.uk/events/spoon-carving-beginners-course/
    region: uk
    checked: '2026-11-07'
  - label: 'North House Folk School: Wooden Spoon Carving Traditions (Minnesota)'
    url: https://northhouse.org/course-session/wooden-spoon-carving-traditions-3-13-2027-0900
    region: us
    checked: '2026-11-07'
  - label: 'John C. Campbell Folk School: Traditional Hewing and Carving Spoons and Bowls (North Carolina)'
    url: https://folkschool.configio.com/pd/3974/traditional-hewing-and-carving-spoons-and-bow
    region: us
    checked: '2026-11-07'
  seo_title: 'Spoon carving courses for beginners: what to expect'
  description: What a beginners' spoon carving course covers, the tools you use, what to wear, and what green woodworking courses cost in the UK and US.
  detail:
  - h: What it's really like
    p:
    - You start with a billet of green wood and use an axe to rough out a spoon blank, then refine the shape with straight and curved knives. At West Dean the knife grips taught are based on the Swedish
      sloyd tradition, and the Weald & Downland course teaches safe knife grips and how to work with the grain.
    - It needs steady hands. West Dean asks that students have strength and stability in their hands and can take instruction, because the sharp tools are used close to the body. North House asks for basic
      hand strength, stamina and focus, and gives being able to open a sealed jar as an example.
    - This is carving by hand, not turning on a lathe. If you would rather work at a pole lathe or a powered lathe, a woodturning club is the other way in.
  - h: Ways in and what they cost
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - Weald & Downland Living Museum, West Sussex
        - 'One day: carve a version of a spoon found on the Mary Rose with an axe and knife; tools provided'
        - £90
      - - North House Folk School, Minnesota
        - 'Wooden Spoon Carving Traditions: three days, open to all levels; bring a fixed-blade carving knife'
        - $335, plus $10 materials
      - - John C. Campbell Folk School, North Carolina
        - 'Traditional Hewing and Carving Spoons and Bowls: one week, all skill levels; spoons and at least one bowl'
        - $730, plus a $25 Folk School fee and $90 materials
    after: West Dean College also runs a one-day spoon carving course and a two-hour taster with lime spoon blanks; the course pages did not show a price, so check with the college. The taster is listed
      as suitable for beginners.
  faq:
  - q: Do I need my own tools for a spoon carving course?
    a: Often not. West Dean lends carving knives and axes and supplies the timber, and the Weald & Downland course provides all tools. North House asks you to bring a fixed-blade carving knife.
  - q: What wood is used for carving spoons?
    a: Courses use green, unseasoned wood. West Dean's taster session uses lime spoon blanks, and John C. Campbell students work mainly with green wood from several species.
  - q: What should I wear to a spoon carving class?
    a: Covered, closed-toe shoes and clothes you do not mind marking. West Dean does not allow sandals or open-toed shoes, and John C. Campbell asks for leather gloves and a carving glove or thumb guard.
  - q: How long does it take to carve a wooden spoon?
    a: Beginners can carve a spoon in a day. Both the West Dean and Weald & Downland one-day courses aim for you to make a spoon.
  safety: Wear closed shoes and use a carving glove or thumb guard as courses ask, because the knives are used close to your body.
  sources:
