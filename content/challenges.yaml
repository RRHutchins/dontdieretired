  safety: 'Locks and deep water carry real risk: keep the boat well forward of the cill, keep fingers clear of ropes on bollards, consider a lifejacket (children, non-swimmers and lone boaters should wear
    one on deck), and never jump in after someone who has fallen in; throw them a line.'
