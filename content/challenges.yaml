  seo_title: 'South West Coast Path: sections, ferries and planning'
  description: 'Plan the South West Coast Path: its seven sections, how long it takes, the toughest day, every ferry and tidal crossing, Lulworth Ranges and where to start.'
  detail:
  - h: What it's really like
    p:
    - The South West Coast Path runs 630 miles (1,014 km) from Minehead in Somerset to South Haven Point on Poole Harbour in Dorset, and has been a National Trail since 1978. It is not flat. The South West
      Coast Path Association counts more than 115,000 feet (35,000 metres) of ascent and descent, which it says is like climbing Everest four times.
    - 'Walking the whole path typically takes seven to eight weeks at a leisurely pace; a very fit, fast walker might manage about 30 days. The Association''s itinerary splits it into 52 day-long sections,
      graded easy, moderate, strenuous or severe, and most walkers go anticlockwise, from Minehead to Poole. You do not have to walk it all at once: the Association also suggests day walks and short breaks.'
  - h: The seven sections
    table:
      head:
      - Section
      - Distance
      rows:
      - - Somerset and Exmoor
        - 35 miles (56 km)
      - - North Devon
        - 80 miles (129 km)
      - - North Cornwall
        - 76 miles (122 km)
      - - West Cornwall
        - 144 miles (232 km)
      - - South Cornwall
        - 76 miles (122 km)
      - - South Devon
        - 104 miles (167 km)
      - - Jurassic Coast
        - 115 miles (185 km)
    after: 'The Association''s short-break ideas start and finish where transport is easy: two to three days from Bude to Tintagel or Charmouth to Abbotsbury, five to seven from St Ives to Penzance, and
      seven to ten for the whole Jurassic Coast. For a first taste, its rail-to-trail walks include Penzance to Mousehole (3.6 miles) and a 3.4-mile circular from Minehead.'
  - h: The honest hard parts
    p:
    - The Association's walk page says Hartland Quay to Bude, 15.2 miles (24.5 km) graded challenging to severe, is said to be the toughest part of the entire path, with relentless climbs and descents.
      Its itinerary describes the week from Westward Ho! to Padstow as the one many consider the toughest, and one of the most spectacular.
    - 'Cliffs and the sea set the rules. Some cliffs overhang or are unstable without obvious signs, and short grass is slippery when wet. Cliff falls and landslips close sections and send walkers on temporary
      inland diversions: in early 2026 coastal instability, subsidence and landslips closed or diverted stretches at Tregonhawke, Under Hooken near Branscombe, The Ness at Shaldon and Newquay''s North Pier,
      and flooding washed the path away at Tintagel in December 2025. Check the Association''s route changes page before you go, and follow the signs on the ground.'
    list:
    - Keep to the path and away from cliff edges, especially in high wind.
    - Know the tide times so you are not cut off, and keep clear of the base of cliffs.
    - 'Check the forecast: mist, fog and high winds are more likely on the coast.'
    - Phone signal is patchy. Fingerposts carry location signs, and What3Words or OS Locate can give your position.
    - Walk around cattle, not between them. If cattle chase you and your dog, let go of the lead.
  - h: Ferries and tidal crossings
    table:
      head:
      - Crossing
      - When it runs
      rows:
      - - 'Torridge: Appledore to Instow'
        - 1 April to 31 October
      - - 'Camel: Padstow to Rock'
        - All year; the last ferry varies by season, with a water taxi in the evening
      - - 'Gannel: Newquay (Fern Pit) to Crantock'
        - End of May to mid-September, 9:30am to 6pm, weather permitting
      - - 'Fal: Falmouth to St Mawes'
        - All year, seven days a week
      - - St Mawes to Place
        - April to October, 9:15am to 4pm
      - - Helford
        - 1 April to 31 October, 9:30am to 5pm, on demand. Otherwise a 13-mile walk round the river, or a taxi
      - - Gillan Creek
        - Ferry 1 April to 31 October; the stepping stones are under water for about three hours either side of high tide
      - - Fowey to Polruan
        - All year, with shorter hours from October to April
      - - 'Tamar: Cremyll to Plymouth'
        - Check the operator's website
      - - 'Plym: Sutton Harbour to Mount Batten'
        - Summer hours 24 April to 27 September, then winter hours
      - - 'Yealm: Wembury to Noss Mayo'
        - 1 April to 30 September, 10am to 4pm
      - - 'Erme: Mothecombe to Wonwell'
        - No ferry. Wade across for about an hour either side of low tide
      - - 'Avon: Bigbury to Bantham'
        - April to September, 10am to noon and 2pm to 4pm
      - - Salcombe to East Portlemouth
        - All year, every half hour
      - - 'Dart: Dartmouth to Kingswear (Lower Ferry)'
        - All year, about 7am to 11pm
      - - 'Teign: Shaldon to Teignmouth'
        - All year, 10am to 4:30pm, later in warmer months; cash only
      - - 'Exe: Starcross to Exmouth'
        - Daily, 1 April to 31 October; cash only
      - - Sandbanks Ferry, South Haven Point
        - 7am to 11pm
    after: As listed by the South West Coast Path Association, checked on 7 November 2026. Ferries change with the weather, the tides and the time of day, so check each operator before you rely on one;
      in winter, plan around the seasonal ones.
  - h: Lulworth Ranges, seasons and getting there
    p:
    - In Dorset the path crosses the Lulworth army ranges, which are open to walkers every weekend apart from a few closures (the last of 2026 is 14 to 15 November) and every day over holidays, including
      19 December 2026 to 3 January 2027. After weekday firing the gates open as near as possible to 4:30pm on Friday and stay open until 8am on Monday. The Defence Infrastructure Organisation publishes
      the times on GOV.UK, and its general information line is 01929 404714.
    - The Association says spring and late summer are the best times to walk, autumn often stays warm enough to swim, and from mid-July to early September the coast is very busy and beds are harder to find.
      National Trails recommends booking accommodation in advance, as it is limited in some areas. Several companies will move your bag between overnight stops; one, Luggage Transfers, runs from March to
      October from £18 a day. National Express coaches serve the main towns, and National Trails lists airports at Exeter, Newquay, Bournemouth and Bristol.
  faq:
  - q: How long is the South West Coast Path?
    a: 630 miles (1,014 km), from Minehead in Somerset to South Haven Point on Poole Harbour.
  - q: How long does it take to walk the whole South West Coast Path?
    a: Typically seven to eight weeks at a leisurely pace, or about 30 days for a very fit, fast walker. The Association suggests a 52-day itinerary.
  - q: What is the hardest section of the South West Coast Path?
    a: Hartland Quay to Bude, 15.2 miles (24.5 km), which the Association says is said to be the toughest part of the entire path.
  - q: Do the South West Coast Path ferries run in winter?
    a: Some do, including Falmouth to St Mawes, Fowey to Polruan, Salcombe, the Dartmouth Lower Ferry, Shaldon and Padstow to Rock. Many others run only from about April to October, so check each one.
  - q: Is the coast path through the Lulworth Ranges open?
    a: Most weekends and every day over the main holidays, but not when the army is firing. Check the range walk times on GOV.UK before you go.
  - q: Can you walk the South West Coast Path with a dog?
    a: Yes. Keep your dog away from cliff edges, use a short lead near sheep, cows and horses, carry water for it, and if cattle threaten you, let go of the lead.
