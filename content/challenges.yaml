    url: https://continue.utah.edu/class/LLCFT/295
    region: us
    checked: '2026-11-07'
  - label: 'Craft Yarn Council: guilds and groups, including Crochet Guild of America chapters'
    url: https://craftyarncouncil.com/node/131
    region: us
    checked: '2026-11-07'
  seo_title: 'Learn to crochet: hooks, yarn and beginners'' classes'
  description: 'How to start crochet: which yarn and hook to pick, UK and US stitch names, what a beginners'' class covers and what it costs in the UK and US.'
  detail:
  - h: What it's really like
    p:
    - Everything starts with a chain. Beginners then learn a few basic stitches, how to turn at the end of a row, how to work in the round, and how to increase and decrease. Coleg Gwent's course also teaches
      reading and following a pattern, and the University of Utah's class adds changing colour, with a dishcloth and a scarf as suggested projects.
    - Yarn and hook go together. The Craft Yarn Council's standard system puts DK in category 3, with hooks of 4.5 to 5.5 mm, and chunky in category 5, with hooks of 6.5 to 9 mm. It calls these guidelines
      only. Coleg Gwent starts its students on chunky yarn and a 6 mm hook.
    - The confusing part is the names. Simply Crochet explains that UK terms sit one step above US ones, so a UK double crochet is a US single crochet and a UK treble is a US double. If a pattern mentions
      single crochet (sc), it is written in US terms. Coleg Gwent teaches in US terms.
  - h: Ways in and what they cost
    table:
      head:
      - Where
      - Course/format
      - Cost (as last listed)
      rows:
      - - Coleg Gwent, Blaenau Gwent Learning Zone
        - 'Crochet for Beginners: 29 weeks, Mondays 4pm to 6pm, from October 2026; yarn and a 6 mm hook provided in week one'
        - £50 (£30 tuition plus £20 other fees); half-price tuition on means-tested benefits
      - - University of Utah Continuing Education, Salt Lake City
        - 'Beginning Crochet: four Thursday evenings in March 2027, two hours each'
        - $170 ($125 tuition plus a $45 fee for shared supplies)
      - - Crochet Guild of America chapters
        - Local chapters; the Craft Yarn Council says many local crochet groups are CGOA chapters
        - See the guild's website
    after: Coleg Gwent says students will need more hooks, DK and chunky yarns and a tapestry needle for weaving in ends as the course goes on. Utah's class asks students to bring some of their own materials
      from a supply list.
  faq:
  - q: What size crochet hook should a beginner use?
    a: Match the hook to the yarn. The Craft Yarn Council suggests 4.5 to 5.5 mm for DK and 6.5 to 9 mm for chunky; Coleg Gwent starts beginners on chunky yarn with a 6 mm hook.
  - q: What is the difference between UK and US crochet terms?
    a: UK names are one step up from US ones, so a UK double crochet is a US single crochet. A pattern that uses single crochet (sc) is in US terms.
  - q: How long does it take to learn to crochet?
    a: A short course covers the basic stitches and a first project. The University of Utah's beginners' class runs for four evenings; Coleg Gwent's runs weekly through the year and goes on to garments
      and decorative pieces.
  - q: Do I need to bring my own yarn to a crochet class?
    a: It depends on the course, so ask. Coleg Gwent provides yarn and a hook in the first week and then asks students to buy their own.
