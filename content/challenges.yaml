  why: A bundle of soaked willow rods becomes a usable bread or fruit basket in two evenings, using techniques called upsett, wale and a trac border. Some beginners' classes provide the willow, and others
    teach you how to sort and soak it yourself.
  start:
  - Look for a beginners' willow basketry class at an adult education college, a craft school or through the Basketmakers' Association's listings.
  - Check whether the willow is included or whether you must buy and soak your own, and what tools the class asks for.
  - Expect some hand and arm work; City Lit advises contacting its Visual Arts department first if you have concerns about the strength needed.
