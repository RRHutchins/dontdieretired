- id: climb-ben-nevis
  title: Climb Ben Nevis
  category: move
  kind: experience
  effort: demanding
  cost: low
  time: weeks
  setting: outdoors
  company: either
  season: Summer for a first ascent
  regions:
  - uk
  why: It is the highest mountain in the UK, and the Mountain Track takes you from the glen floor to the summit plateau on foot. Standing on top means there is nowhere higher to go in these islands.
  start:
  - Read Mountaineering Scotland's Ben Nevis guide and note the six to nine hours it suggests.
  - Do two or three long hill days first, carrying the pack you plan to take.
  - Check the mountain weather forecast and start early from the Glen Nevis visitor centre.
  links:
  - label: 'Mountaineering Scotland: Ben Nevis guide'
    url: https://www.mountaineering.scot/activities/hillwalking/ben-nevis
    region: uk
    checked: '2026-10-06'
  safety: Carry a map and compass and know how to use them, as the summit can be cold, cloudy and snow-covered even in summer.
- id: climb-yr-wyddfa
  title: Climb Yr Wyddfa (Snowdon)
  category: move
  kind: experience
  effort: demanding
  cost: low
  time: weeks
  setting: outdoors
  company: either
  season: Late spring to early autumn
  regions:
  - uk
  why: The highest mountain in Eryri National Park has several distinct paths to the top, so you can choose a route that suits you. On a clear day the view runs from the mountains to the sea.
  start:
  - Read the Eryri National Park Authority page and choose a path that matches your experience.
  - Plan how you will reach the start, as car parks such as Pen y Pass fill early.
  - Check the forecast and the park's ground conditions report the day before you go.
  links:
  - label: 'Eryri National Park Authority: Yr Wyddfa'
    url: https://eryri.gov.wales/visit/yr-wyddfa/
    region: uk
    checked: '2026-10-06'
  safety: Read the park's safety advice and turn back if the weather closes in.
- id: climb-scafell-pike
  title: Climb Scafell Pike
  category: move
  kind: experience
  effort: demanding
  cost: low
  time: weeks
  setting: outdoors
  company: either
  season: Late spring to early autumn
  regions:
  - uk
  why: England's highest mountain rises straight out of Wasdale, one of the quietest and most dramatic valleys in the Lake District. The Hollow Stones route is the most direct way up, and it is rough and rocky enough to feel like a proper mountain day.
  start:
  - Read the National Trust's Hollow Stones route description from Wasdale.
  - Practise on a couple of smaller Lakeland fells with a map and compass.
  - Pick a settled day, start early from Wasdale and allow plenty of time for the descent.
  links:
  - label: 'National Trust: Scafell Pike via Hollow Stones route'
    url: https://www.nationaltrust.org.uk/wasdale/trails/scafell-pike-via-hollowstones-route
    region: uk
    checked: '2026-10-06'
  safety: The summit plateau is stony and confusing in cloud, so carry a map and compass and be ready to turn round.
- id: hike-half-dome
  title: Hike to the top of Half Dome
  category: move
  kind: experience
  effort: demanding
  cost: mid
  time: months
  setting: outdoors
  company: either
  season: Summer, when the cables are up
  regions:
  - us
  why: Yosemite's most recognisable summit is reached by a 14 to 16 mile round trip with 4,800 feet of climbing. The last 400 feet go up bare granite between two steel cables, which is unlike anything else on a walking route.
  start:
  - Read the National Park Service Half Dome page and its permit page in full.
  - Apply for a day-hike permit through the preseason lottery, or try the daily lottery.
  - Train with long hill days, as most hikers take ten to twelve hours.
  links:
  - label: 'National Park Service: Half Dome day hike'
    url: https://www.nps.gov/yose/planyourvisit/halfdome.htm
    region: us
    checked: '2026-10-06'
  - label: 'National Park Service: Half Dome permits'
    url: https://www.nps.gov/yose/planyourvisit/hdpermits.htm
    region: us
    checked: '2026-10-06'
  safety: Stay off the cables if the rock is wet or a storm is near.
- id: hike-mount-whitney
  title: Hike to the summit of Mount Whitney
  category: move
  kind: experience
  effort: demanding
  cost: mid
  time: year
  setting: outdoors
  company: either
  season: July to late September, when the trail is usually free of snow
  regions:
  - us
  why: The trail from Whitney Portal gains more than 6,200 feet to a summit that is also the southern end of the John Muir Trail. When it is free of snow the Forest Service describes it as non-technical but strenuous, so it is a walk rather than a climb.
  start:
  - Read the Inyo National Forest page for Mount Whitney and its permit rules.
  - Enter the permit lottery on Recreation.gov, choosing day use or an overnight trip.
  - Spend time walking at altitude beforehand and build up to very long days.
  links:
  - label: 'US Forest Service: Mount Whitney (Inyo National Forest)'
    url: https://www.fs.usda.gov/r05/inyo/wilderness/mount-whitney
    region: us
    checked: '2026-10-06'
  safety: Outside the snow-free season this becomes a mountaineering route that needs specialist skills and equipment.
- id: hike-mount-washington
  title: Hike up Mount Washington, New Hampshire
  category: move
  kind: experience
  effort: demanding
  cost: low
  time: weeks
  setting: outdoors
  company: either
  season: Summer and early autumn
  regions:
  - us
  why: The highest of New Hampshire's White Mountains has a staffed weather observatory on its summit and a reputation for some of the wildest weather in the country. Reaching the top on foot on a clear day is a real prize.
  start:
  - Choose a trail with a current guidebook or map and work out your turnaround time.
  - Read the Mount Washington Observatory's Higher Summits Forecast on the morning of your hike.
  - Pack warm layers, shelter, food and water, whatever the valley weather looks like.
  links:
  - label: 'Mount Washington Observatory: Higher Summits Forecast'
    url: https://mountwashington.org/weather/higher-summits-forecast/
    region: us
    checked: '2026-10-06'
  safety: Mountain weather here changes fast and can be extreme, so be willing to turn back.
- id: walk-coast-to-coast
  title: Walk the Coast to Coast Path
  category: move
  kind: project
  effort: demanding
  cost: high
  time: weeks
  setting: outdoors
  company: either
  season: Late spring to early autumn
  regions:
  - uk
  why: This 190-mile National Trail crosses England from St Bees on the Irish Sea to Robin Hood's Bay on the North Sea. It passes through three national parks, the Lake District, the Yorkshire Dales and the North York Moors, so the scenery changes every few days.
  start:
  - Read the National Trails page and decide between one continuous walk and several shorter trips.
  - Sketch daily stages you are comfortable with and book accommodation well ahead.
  - Walk two long days back to back with your full pack before you set off.
  links:
  - label: 'National Trails: Coast to Coast Path'
    url: https://www.nationaltrail.co.uk/en_GB/trails/coast-to-coast/
    region: uk
    checked: '2026-10-06'
  safety: The Lake District stages cross high fells, so carry a map and compass and check the forecast each morning.
  guide: walking-holidays-for-beginners-after-50
- id: walk-west-highland-way
  title: Walk the West Highland Way
  category: move
  kind: project
  effort: demanding
  cost: mid
  time: weeks
  setting: outdoors
  company: either
  season: Late spring to early autumn
  regions:
