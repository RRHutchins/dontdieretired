  why: Heating steel in a forge and hammering it into a twisted toasting fork teaches you how metal moves in a single day. The British Artist Blacksmiths Association suggests starting with a short taster
    course, and many of these suit people who just want to have a go.
  start:
  - Book a one-day taster or a short beginners' course at a forge, a craft college or a continuing education programme.
  - Read the kit list before you go; some forges will not let you work without steel-toe-capped boots.
  - Wear natural-fibre clothes that are not loose, and long trousers rather than shorts, and take a large bottle of water.
