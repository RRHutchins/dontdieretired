  collection: arts
  why: Screen printing uses a stencil on a screen to print your own design, one colour layer at a time, and to run off a numbered edition of the same image. A day workshop can take a drawing of yours to
    finished prints.
  start:
  - Book a beginners' day at a screen printing studio or a short course at an adult education college or art school.
  - Prepare a simple black-and-white design; Print Club London asks for one A4 copyright-free design on a USB stick, plus a backup.
  - Wear closed shoes and clothes you do not mind getting ink on.
  links:
  - label: 'Print Club London: Beginners Screen Print Workshop'
    url: https://printclublondon.com/shop/beginner-workshop
    region: uk
    checked: '2026-11-07'
