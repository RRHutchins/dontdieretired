  collection: arts
  why: Crochet needs one hook and a ball of yarn, and a handful of stitches built on a simple chain will make a dishcloth, a scarf or a blanket square. A beginners' class gets you past the awkward first
    rows and teaches you to read a pattern, which opens up everything else.
  start:
  - Book a beginners' crochet class at an adult education college, a community college or a library, and ask whether a hook and yarn are provided for the first session.
  - Start with smooth, light-coloured DK or chunky yarn and the hook size printed on the ball band, so you can see each stitch.
  - 'Before you buy a pattern, check whether it uses UK or US terms: the same stitch names mean different stitches.'
  links:
  - label: 'Coleg Gwent: Crochet for Beginners (Blaenau Gwent)'
    url: https://coleggwent.ac.uk/course/CE3195
    region: uk
    checked: '2026-11-07'
