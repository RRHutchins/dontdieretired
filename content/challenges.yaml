- id: climb-scafell-pike
  title: Climb Scafell Pike
  category: move
  kind: experience
  effort: demanding
  cost: low
  time: weeks
  setting: outdoors
  company: either
  season: Late spring to early autumn
  regions:
  - uk
  places: [north-west]
  why: England's highest mountain rises straight out of Wasdale, one of the quietest and most dramatic valleys in the Lake District. The Hollow Stones route is the most direct way up, and it is rough and rocky enough to feel like a proper mountain day.
  start:
  - Read the National Trust's Hollow Stones route description from Wasdale.
  - Practise on a couple of smaller Lakeland fells with a map and compass.
  - Pick a settled day, start early from Wasdale and allow plenty of time for the descent.
  links:
  - label: 'National Trust: Scafell Pike via Hollow Stones route'
    url: https://www.nationaltrust.org.uk/wasdale/trails/scafell-pike-via-hollowstones-route
    region: uk
    checked: '2026-10-06'
  safety: The summit plateau is stony and confusing in cloud, so carry a map and compass and be ready to turn round.
  seo_title: "How to climb Scafell Pike: routes, timings and safety"
  description: The shortest route up Scafell Pike from Wasdale, how long it takes, the longer routes, what to carry, and the descent mistakes that catch people out.
  detail:
  - h: What it's like
    p:
    - Scafell Pike is England's highest mountain, 978 metres (about 3,209 feet) high, and also a war memorial. Around 250,000 people climb it each year, and the National Trust says the numbers in recent years have put the local mountain rescue teams under extreme pressure.
    - The shortest way up is from Wasdale, starting at the National Trust's Lake Head car park beside the Wasdale campsite. The path follows Lingmell Gill upstream, crosses the beck at about 300 metres, climbs a stone-pitched path, then goes through the boulder field of Hollow Stones and zigzags up to the col below Lingmell. Above that the path is informal, over boulders, to the summit cairn. The Trust calls it a tough, steep hike with scrambling over hard terrain.
  - h: How long it takes, and the other routes
    table:
      head: [Start, Time to allow, What to expect]
      rows:
      - [Wasdale (Lake Head car park), At least 5 to 6 hours in good weather, The shortest route; steep and rough above Hollow Stones]
      - [Borrowdale (park at Seatoller), 7 hours or more, The Corridor Route via Styhead; not much longer but has rock steps and needs better route-finding]
      - [Langdale or Eskdale, 7 hours or more, Significantly longer approaches]
    after: These times come from Wasdale Mountain Rescue, which says to allow extra time in bad weather. The National Trust lists the Wasdale route as 3.5 miles (5.6 km) and about five hours.
  - h: The honest hard parts
    p:
    - The summit is likely to be 5 to 10 degrees colder than the valley, and strong winds, severe windchill and even snow are possible all year. Snow is common high up from October to May. A warm, sunny start in the valley tells you little about the top.
    - "Most trouble comes on the way down. From Wasdale, the junction at Lingmell Col (777 metres) is the key point: the National Trust suggests noting it or taking a photo on the way up. Miss it in cloud and you can end up on steep ground above Piers Gill, a canyon where there have been deaths. Wasdale Mountain Rescue also rescues several groups a year who come down into Eskdale by mistake, which leaves them hours from their car. Keep your group together: the team answers several 999 calls a year from groups that split up in mist."
  - h: What to wear and carry
    list:
    - Walking boots with ankle support. The National Trust adds insulating layers, waterproofs, hat and gloves, even in summer.
    - A map (OS Explorer OL6, Lake District South West) and a compass, and the skill to use them. You can borrow both at the Lake Head car park.
    - A torch, a whistle, and a survival bag or small shelter.
    - Food and plenty to drink.
    - "A charged phone, but do not rely on it: the signal is patchy and batteries fail in the cold."
  - h: Planning your day
    p:
    - "Park in the car park and, if it is full, come back another day: the valley roads are narrow and roadside parking can block tractors and emergency vehicles. Share lifts where you can. Summer gives the best chance of good weather, and having a few days to choose from lets you pick a good forecast. Walk at the pace of the slowest person, tell someone your route and when you expect back, and be ready to turn round."
  faq:
  - q: How long does it take to climb Scafell Pike?
    a: From Wasdale, Wasdale Mountain Rescue says to allow at least five to six hours even in very good weather. From Borrowdale, Langdale or Eskdale, allow most of a day, seven hours or more.
  - q: What is the easiest route up Scafell Pike?
    a: The route from the National Trust car park at Wasdale Head, via Lingmell Gill and Hollow Stones. It is the shortest, but still steep, rocky and rough near the top.
  - q: How high is Scafell Pike?
    a: 978 metres, or about 3,209 feet. It is the highest mountain in England.
  - q: Can I take my dog up Scafell Pike?
    a: Well-behaved dogs are welcome on a lead around livestock, but only dogs used to long fell walks should go. Wasdale Mountain Rescue says it is a poor choice for a dog's first fell walk, as the boulders can damage paws.
  - q: Is there phone signal on Scafell Pike?
    a: It is patchy. In an emergency call 999, ask for the police, then Mountain Rescue. If you cannot call, six long whistle blasts, a minute's pause, then repeat, is the signal for help.
