  seo_title: 'How to see the northern lights: alerts, places, timing'
  description: How to read aurora alerts and the Kp index, the best time of night and year, where to go in Scotland, Norway and Alaska, and how to photograph it.
  detail:
  - h: What it's really like
    p:
    - On most nights the northern lights are not the vivid curtains of the photographs. Fairbanks, Alaska, describes its displays as mostly green, teal and white, with a purple or magenta edge when they are intense, in curtains, bands, rays or a corona overhead.
    - A display can last a few minutes or several hours, and nobody can promise one. What you can control is being somewhere dark, facing north, under a clear sky, at the right time of night. Most of an evening out is waiting, often in the cold, so warm layers and a hot drink matter more than any gadget.
  - h: How to read the alerts
    table:
      head:
      - Alert or index
      - What it means
      - What to do
      rows:
      - - AuroraWatch UK green
        - Aurora unlikely to be visible by eye or camera anywhere in the UK
        - Stay in
      - - AuroraWatch UK yellow
        - May be visible by eye from Scotland, and by camera from Scotland, northern England and Northern Ireland
        - Worth a look from a dark spot in Scotland
      - - AuroraWatch UK amber
        - Likely visible by eye from Scotland, northern England and Northern Ireland, possibly elsewhere; photographs likely from anywhere in the UK
        - Go out if the sky is clear
      - - AuroraWatch UK red
        - Likely visible by eye and camera from anywhere in the UK
        - Go out wherever you are, away from lights
      - - NOAA Kp 3 to 5
        - The aurora moves further from the poles and grows brighter and more active
        - Good nights in the far north; from further south, find a hilltop
      - - NOAA Kp 6 to 7
        - Possibly visible from the northern edge of the United States
        - 'Northern states: find a dark view to the north'
      - - NOAA Kp 8 to 9
        - Very bright and active; may be overhead in the northern states
        - Worth trying across much of the northern US
    after: The UK alert levels are AuroraWatch UK's, run by Lancaster University; the Kp scale, from 0 to 9, is the one NOAA's Space Weather Prediction Center forecasts for North America. NOAA's rough rule is that the edge of the aurora sits near 66 degrees geomagnetic latitude at Kp 0 and moves about 2 degrees towards the equator for each step up the scale. A bright display can be seen hundreds of kilometres (miles) away, so a hill with a clear northern horizon helps.
  - h: When to go
    p:
    - Darkness comes first. NOAA notes that the aurora may still be there in summer but can only be seen when the sky is dark, which is why summer trips to the far north usually disappoint. NOAA says displays are usually strongest within an hour or two of midnight, between 10pm and 2am local time, and that the weeks around the spring and autumn equinoxes tend to bring larger geomagnetic storms. A full moon makes the aurora look fainter.
    - Visit Norway says aurora activity began peaking in 2024 and expects the highest levels in 11 years through 2026, so this winter and next spring are a good time to try.
  - h: Where to travel for them
    table:
      head:
      - Where
      - Season the tourist board gives
      - Worth knowing
      rows:
      - - 'Scotland: Shetland, Orkney, Lewis and Harris, Caithness, Galloway Forest Park'
        - October to March
        - Shetland calls the lights the Mirrie Dancers. Caithness and the North Coast 500 need no ferry. Galloway Forest Park was the UK's first Dark Sky Park.
      - - 'Northern Norway: Tromsø, Alta, Lyngen, Senja, Lofoten, Bodø'
        - Late September to late March
        - Direct international flights to Tromsø; Bodø also has an international airport. Tromsø is busy in winter, so Visit Norway suggests autumn or the quieter places nearby. Coastal ships sail between Tromsø and Kirkenes.
      - - Fairbanks, Alaska
        - 21 August to 21 April
        - Under the auroral oval, with low rainfall and often clear skies. Explore Fairbanks says the aurora shows on about four clear, dark nights in five.
    after: 'Explore Fairbanks puts the chance at more than 90 per cent for visitors who stay at least three nights and are out late, but no tourist board can guarantee a sighting: you need a clear, dark sky as well as activity. Plan spare nights rather than pinning everything on one.'
  - h: Taking a photograph
    list:
    - A phone's night mode can work. For a camera, VisitScotland suggests a sturdy tripod and a wide-angle lens.
    - Explore Fairbanks suggests manual mode, the highest ISO and the widest aperture, with exposures of about 5 to 10 seconds; longer exposures are brighter but blur the aurora and streak the stars. A remote shutter helps.
    - Bring extra batteries and a head torch, and find somewhere with as little light pollution as you can.
  faq:
  - q: Can you see the northern lights from England?
    a: Yes, on strong nights. At an AuroraWatch UK amber alert the aurora is likely to be visible by eye from northern England and photographs are likely from anywhere in the UK; at red it is likely to be visible by eye from anywhere in the UK.
  - q: What time of night is best for the northern lights?
    a: NOAA says usually within an hour or two of midnight, between 10pm and 2am local time. VisitScotland gives 9pm to 2am, and says activity can come earlier or later.
  - q: What Kp do you need to see the aurora?
    a: NOAA says that at Kp 6 to 7 it may be visible from the northern edge of the United States, and at Kp 8 to 9 it may be overhead in the northern states. In the far north, Kp 3 to 5 brings brighter, more active displays.
  - q: What is the best month to see the northern lights?
    a: NOAA says the weeks around the spring and autumn equinoxes tend to bring bigger storms. Visit Norway gives late September to late March, with most activity in September and October and in March and April; VisitScotland says October to March.
  - q: Do I need to book a tour?
    a: No. Explore Fairbanks lists driving to a vantage point and waiting as one option, alongside guided tours and heated cabins. At home, watching the alerts and going to a dark spot with a view north is enough.
  - q: How many nights should I allow?
    a: Explore Fairbanks puts the chance above 90 per cent for visitors who stay at least three nights and are out late. Nowhere can promise it, so allow spare nights for cloud.
