    why: grip matters on the rock sections
    url: https://www.amazon.co.uk/s?k=hiking+shoes+grip
  inspire:
  - kind: read
    person: Debbie Caban, Bedford
    line: Climbed the chains to the summit of Angels Landing with four friends, a group whose average age was about 70, after one of them won a 9am permit in the lottery, on a guided tour of Utah's parks.
    title: Conquering Angels Landing in Zion National Park
    outlet: The Bedford Citizen
    url: https://thebedfordcitizen.org/2025/10/conquering-angels-landing-in-zion-national-park/
    checked: '2026-11-04'
  seo_title: 'Angels Landing permit: the lottery and the hike explained'
  description: How the Angels Landing permit lotteries work, the fees and rules, the 5.4-mile hike and its chains, heat and storms, and what to do if you miss out.
  detail:
  - h: What it's really like
    p:
    - Angels Landing is a 5.4-mile (8.7 km) round trip from the Grotto, shuttle stop 6 in Zion Canyon, with 1,488 feet (454 metres) of climbing; the park says most hikers take about four hours. The first 2.25 miles (3.6 km) climb about 1,000 feet (305 metres) up the West Rim Trail to Scout Lookout, and anyone may walk that far without a permit.
    - The last half-mile is why people come and why there is a permit. Beyond Scout Lookout the route follows a narrow fin of rock, in places less than three feet (about a metre) wide, with steep drop-offs and chains fixed to hold. Zion issues more than 200,000 permits a year for it, and the park credits the system with less crowding and safer conditions on the chains.
    - The park is plain that falls from cliffs on its trails have killed people and that your safety is your responsibility. If the exposure is not for you, Scout Lookout is a real destination in its own right.
  - h: The two lotteries
    table:
      head:
      - Lottery
      - When you apply
      - Results
      - Changes and refunds
      rows:
      - - Seasonal
        - In a window before each season (dates below); list up to seven dates, times or ranges
        - A few days after the window closes
        - Cancel up to two days before for a refund of the per-person fee
      - - Day-before
        - 12:01am to 3pm Mountain Time on the day before you hike
        - 4pm Mountain Time that day
        - No changes; all fees non-refundable
    after: Both run on Recreation.gov. Everyone on the chains section needs a permit, whatever the season.
  - h: How the 2026 seasonal lotteries ran
    table:
      head:
      - Hike dates
      - Lottery open
      - Permits issued
      rows:
      - - 1 March to 31 May 2026
        - 13 to 25 February
        - 26 February
      - - 1 June to 31 August 2026
        - 1 to 20 April
        - 25 April
      - - 1 September to 30 November 2026
        - 1 to 20 July
        - 25 July
      - - 1 December 2026 to 28 February 2027
        - 1 to 20 October
        - 25 October
    after: The park announces each year's dates in advance, so check the 2027 windows on its permit page. For hikes before the end of February 2027, the seasonal lottery has closed and the day-before lottery is the way in.
  - h: Fees and rules
    list:
    - A $6 application fee, which is not refunded, then $3 a person if you win, plus the park entrance fee unless you hold a federal recreation pass.
    - 'Up to six people, including you, on one application. Apply only once: if you submit more than one application, all of them are cancelled and nothing is refunded.'
    - The permit holder or the named alternate must be on the hike, carrying photo ID that matches the application. Permits cannot be transferred and you cannot add people later.
    - Save the confirmation before you set out. Most phones get no signal in Zion Canyon, and rangers may ask to see permits anywhere on the trail at any time.
    - The time on your permit is when you must be at the Grotto, so allow for the shuttle. The shuttle and park entry need no reservation, but check the time of the last shuttle back.
  - h: Heat, storms and what to carry
    list:
    - Zion's summers bring extreme heat, thunderstorms and rain, and the monsoon season runs from July to September. Flash floods can happen at any time.
    - 'Carry and drink plenty of water: the park advises at least a gallon (about 4 litres) per person per day.'
    - Take a torch or head torch with new batteries, food, layers and proper footwear, in case you are out later than planned.
    - In an emergency, try 911 first. If there is no signal, find a ranger or park volunteer.
  faq:
  - q: Do you need a permit for Angels Landing?
    a: Yes, for the chains section from Scout Lookout to the summit, in every season. You can hike the West Rim Trail to Scout Lookout without one.
  - q: How much is the Angels Landing permit?
    a: A $6 application fee, which is not refunded, then $3 a person if you win, plus the park entrance fee unless you have a federal recreation pass.
  - q: How long does it take to hike Angels Landing?
    a: The park says most hikers take about four hours for the 5.4-mile (8.7 km) round trip, and some take longer.
  - q: What if I don't win the Angels Landing lottery?
    a: Enter the day-before lottery between 12:01am and 3pm Mountain Time the day before you want to hike; results come at 4pm. Or hike to Scout Lookout, which needs no permit.
  - q: How many people can go on one Angels Landing permit?
    a: Up to six, including the person who applies.
  - q: Is Angels Landing dangerous?
    a: Parts of the route are less than three feet wide with steep drop-offs, and the park says falls from cliffs on its trails have caused deaths. Use the chains, stay back from edges, and check the weather before you go.
  sources:
