  inspire:
  - kind: read
    person: Steve Tonkin, Dark Sky Advisor at Cranborne Chase National Landscape
    line: Volunteered on Cranborne Chase's bid to become an International Dark Sky Reserve, taking sky quality readings and helping at stargazing evenings, after 35 years teaching physics, maths and astronomy.
    title: Steve Tonkin - Cranborne Chase National Landscape
    outlet: Cranborne Chase National Landscape
    url: https://cranbornechase.org.uk/team/steve-tonkin/
    checked: '2026-11-07'
  seo_title: 'Dark Sky Parks: where and when to see the Milky Way'
  description: 'How to see the Milky Way at a Dark Sky Park or Reserve: the five kinds of Dark Sky Place, the best UK and US parks, new moon dates and what to take.'
  detail:
  - h: What it's really like
    p:
    - 'On a clear night in Galloway Forest Park, Forestry and Land Scotland says more than 7,000 stars and planets can be seen with the naked eye, and the Milky Way is usually easy to pick out. The Royal
      Observatory Greenwich puts the difference plainly: in a city you see stars down to about magnitude 3, while at a dark site you can see them as faint as magnitude 6.'
    - The view does not arrive at once. The US National Park Service says your eyes take 20 to 30 minutes to adjust to low light, and Forestry and Land Scotland says to give them 30. One glance at a white
      phone screen undoes it, which is why parks ask for red torches and phones kept away. The honest hard parts are cloud, which no park can control, the Moon, whose light washes out faint stars, and the
      cold of standing still for an hour.
  - h: The five kinds of Dark Sky Place
    table:
      head:
      - Type
      - What DarkSky International means by it
      rows:
      - - Dark Sky Park
        - Land with an exceptional quality of starry nights, protected for its science, nature, heritage or public enjoyment
      - - Dark Sky Reserve
        - A core area that meets minimum standards for sky quality and natural darkness, with a surrounding peripheral area
      - - Dark Sky Sanctuary
        - Like a park, but usually in a very remote place
      - - Dark Sky Community
        - A town or city that has adopted and enforces a good outdoor lighting ordinance and teaches about dark skies
      - - Urban Night Sky Place
        - A park or open space in or near a city, designed to give an authentic night-time experience despite the lights around it
    after: For a first night under a truly dark sky, a park or reserve is the place to aim for. Many of those below have marked viewing spots, and several run guided evenings.
  - h: Where to go in the UK and US
    table:
      head:
      - Place
      - Status
      - What's there
      rows:
      - - Galloway Forest Park, south-west Scotland
        - Dark Sky Park, 2009, Gold Tier
        - Viewing at Clatteringshaws Loch, Stroan Loch and Glentrool; star-spotting information at the Kirroughtree visitor hub
      - - Northumberland National Park and Kielder Water and Forest Park
        - Dark Sky Park, December 2013, Gold Tier
        - Kielder Observatory runs ticketed evenings; the North East Dark Skies Festival is on 12 to 20 February 2027
      - - Exmoor National Park
        - Europe's first Dark Sky Reserve, 2011
        - A 3.2 km (2 mile) Dark Sky Discovery Trail out to Larkbarrow Farm and back, about 1½ hours; the 2026 Dark Skies Festival ran from 16 October to 1 November
      - - South Downs National Park
        - Dark Sky Reserve, 2016
        - Ten Dark Sky Discovery Sites, including Butser Hill, Harting Down, Devil's Dyke, Ditchling Beacon and Birling Gap
      - - Bannau Brycheiniog (Brecon Beacons)
        - Dark Sky Reserve, 2013, the world's fifth
        - Wales's first Dark Sky Reserve
      - - Cherry Springs State Park, Pennsylvania
        - Dark Sky Park, 2008
        - A public viewing area for a few hours, and an overnight astronomy field where white light is banned
      - - Big Bend National Park, Texas
        - Dark Sky Park, 2012
        - The least light pollution of any national park unit in the lower 48 states; free ranger night-sky programmes
      - - Great Basin National Park, Nevada
        - Dark Sky Park, 2016, Gold Tier
        - Ranger astronomy programmes Thursday to Sunday, roughly Memorial Day to Labor Day, and an astronomy festival each September
      - - Natural Bridges National Monument, Utah
        - The first International Dark Sky Park, 2007
        - Ranger stargazing programmes in spring and summer
    after: Eryri National Park says it is one of 18 International Dark Sky Reserves in the world. Use DarkSky International's place finder for the full list, and each park's own page for this season's events.
  - h: 'When to go: the new moon'
    p:
    - Plan around the Moon. The National Park Service says the best nights are at new moon, or before moonrise or after moonset. NASA says the brightest part of the Milky Way is a summer sight in the northern
      hemisphere, rising in the south-east near Scorpius and Sagittarius, and is best seen when the Moon is new or a crescent.
    table:
      head:
      - New moon
      - Time (UT)
      rows:
      - - 9 November 2026
        - 07:02
      - - 9 December 2026
        - 00:52
      - - 7 January 2027
        - '20:24'
      - - 6 February 2027
        - '15:56'
      - - 8 March 2027
        - 09:29
      - - 6 April 2027
        - '23:51'
      - - 6 May 2027
        - '10:58'
      - - 4 June 2027
        - '19:40'
      - - 4 July 2027
        - 03:02
    after: 'Dates from the US Naval Observatory. UT is the same as GMT: add an hour for British Summer Time, and take off five hours for US Eastern time (four in summer).'
  - h: What to take, and how to behave
    list:
    - A red torch, or a red filter on your torch and phone screen. Great Basin bans white lights at its talks to protect everyone's night vision.
    - 'Warm layers, a hat and a chair: you will be standing or sitting still for a long time.'
    - Binoculars if you have them. Big Bend suggests them; nothing more is needed to start.
    - A cloud forecast, checked before you leave.
    - Park only in designated car parks, never on verges, and expect few facilities at night viewing spots.
    - 'Follow local signs: Galloway is checking how recent storms have affected its forests, and Exmoor asks walkers on its dark sky trail to keep away from cattle from May to September.'
  faq:
  - q: What is a Dark Sky Park?
    a: An area that DarkSky International has certified for an exceptional quality of starry nights, protected for its science, nature, heritage or public enjoyment.
  - q: What is the difference between a Dark Sky Park and a Dark Sky Reserve?
    a: A reserve has a dark core area that meets minimum standards for sky quality, with a surrounding peripheral area; a park is protected land with an exceptional quality of starry nights.
  - q: When is the best time to see the Milky Way?
    a: In the northern hemisphere its brightest part is a summer sight, rising in the south-east. Go near a new moon on a clear night, well away from lights.
  - q: How long does it take your eyes to adjust to the dark?
    a: The US National Park Service says 20 to 30 minutes; Forestry and Land Scotland says to allow 30. Use a red light and keep your phone away so you do not have to start again.
  - q: Do I need a telescope to stargaze at a Dark Sky Park?
    a: No. In Galloway more than 7,000 stars and planets can be seen with the naked eye, and binoculars are a good next step.
  - q: Where is the first International Dark Sky Park?
    a: Natural Bridges National Monument in Utah, named in 2007. In the UK, Galloway Forest Park was one of the first in the world, in 2009.
