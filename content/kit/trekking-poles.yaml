agree:
- text: Carbon poles are lighter but cost more and can snap; aluminium is heavier, cheaper and tougher, and tends to bend rather than break.
  reviews:
  - outdoorgearlab
  - gearjunkie
  - treeline
  - switchback
  - cleverhiker
  - outdoorlife
  - outdoorsmagic
  - lfto
  - countryfile
  - womanandhome
- text: Lever (flick) locks are more secure and easier to adjust than twist locks.
  reviews:
  - treeline
  - switchback
  - cleverhiker
  - outdoorsmagic
  - lfto
- text: Cork grips handle sweat and mould to the hand; foam is lighter but gets sweaty or slippery.
  reviews:
  - treeline
  - switchback
  - gearjunkie
  - womanandhome
- text: Folding (Z-style) poles pack smallest; telescopic poles adjust more and are usually tougher.
  reviews:
  - countryfile
  - switchback
  - cleverhiker
  - outdoorgearlab
- text: Set the length so your elbow is at about a right angle, shorter for climbs and longer for descents.
  reviews:
  - outdoorsmagic
  - lfto
  - womanandhome
  - switchback
- text: Budget poles are fine for occasional walks, but give up quality in the locks, grips and durability.
  reviews:
  - gearjunkie
  - treeline
  - outdoorlife
  - cleverhiker
  - outdoorgearlab
caution: Check whether poles are sold singly or in pairs, as several cheap ones are single poles and the reviews recommend using two. If you lean hard on your poles, the reviews favour aluminium because carbon can snap without warning.
