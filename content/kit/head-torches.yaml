id: head-torches
name: Head torches
title: 'Best head torches: what 10 independent reviews recommend'
description: Which head torches 10 independent UK and US reviews recommend for walking, camping and running, from cheap backups to bright rechargeables.
kit_names: [head torch, headtorch, headlamp]
intro: A head torch keeps your hands free on dark winter walks, around camp and on early or late runs. The reviews say 200 to 300 lumens is enough for walking, more for running, and that a red light mode, a comfortable stable strap, a lock and a sensible battery choice (rechargeable, or hybrid with AAA backup) matter as much as raw brightness.
