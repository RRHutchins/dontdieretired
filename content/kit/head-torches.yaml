- text: 'A red light mode is worth having: it keeps your night vision and avoids disturbing others around camp or in a bothy.'
  reviews: [tgo, advnture, outdoorsmagic, switchback]
- text: Around 200 to 300 lumens is plenty for walking and camp; night running, technical trails and climbing call for more, roughly 300 to 600 lumens or above.
  reviews: [tgo, outdoorsmagic, switchback, outdoorlife, t3, advnture, gearjunkie, trailrunning]
- text: Full brightness drains batteries fast, so use the lowest setting that works and check burn times on low and high.
  reviews: [tgo, switchback, cleverhiker, gearjunkie]
- text: Hybrid lamps that also take AAA or AA batteries, or carrying spares or a power bank, guard against running out on long outings.
  reviews: [advnture, tgo, trailrunning]
- text: 'Check the IP (water resistance) rating: many lamps are only splash- or weather-resistant and may not suit prolonged heavy rain.'
  reviews: [advnture, outdoorsmagic, trailrunning]
- text: Buttons you can work with gloves on, and a lock so the lamp does not switch itself on in your pack, matter as much as brightness.
  reviews: [gearjunkie, outdoorsmagic, treeline, tgo]
caution: 'Carry spare batteries, a power bank or a second light on longer winter walks, and charge before you go: some rechargeable packs need topping up every few months even when unused.'
