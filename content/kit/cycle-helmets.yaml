agree:
- text: 'Fit is crucial: measure your head, check the brand''s size chart and try helmets on where you can, because shapes differ between brands.'
  reviews:
  - bikeradar-road
  - cyclingweekly
  - roadcc
  - bikeradar-commuter
  - cyclingnews
  - bikerumor
  - tomsguide
- text: Rotational protection such as MIPS, or a rival system like KinetiCore or WG11, is worth looking for, and many cheap helmets now have it.
  reviews:
  - bikeradar-road
  - cyclingweekly
  - roadcc
  - bikeradar-commuter
  - bikerumor
  - tomsguide
  - velo
  - nbcselect
- text: Every helmet on sale has to meet a basic safety standard (EN 1078 in the UK and Europe, CPSC in the US); Virginia Tech's independent star ratings are a useful way to compare protection.
  reviews:
  - bikeradar-road
  - cyclingweekly
  - roadcc
  - velo
  - bikerumor
  - cyclingnews
  - ogl-road
- text: Paying more mostly buys lower weight, more vents, aero speed or features, not more protection.
  reviews:
  - bikerumor
  - cyclingnews
  - ogl-road
  - nbcselect
  - bikeradar-road
- text: Vents keep you cool on long or hot rides; aero and enclosed commuter helmets ventilate less but suit cold, wet and stop-start riding.
  reviews:
  - bikeradar-road
  - cyclingweekly
  - roadcc
  - ogl-road
  - cyclingnews
  - bikeradar-commuter
- text: Replace a helmet after any crash or hard knock, even if it looks fine, and after a few years of use.
  reviews:
  - cyclingweekly
  - bikerumor
  - tomsguide
