  - countryfile
  - t3
  - switchback
  - treeline
- text: 'Match the boot to the ground and the load: stiffer, more supportive boots for rough ground and heavy packs, lighter flexible ones for easier paths and day walks.'
  reviews:
  - lfto
  - advnture
  - gearjunkie
  - switchback
  - treeline
- text: Waterproof linings such as Gore-Tex keep feet dry in wet conditions but run warmer and dry more slowly; non-waterproof boots suit hot, dry weather.
  reviews:
  - advnture
  - switchback
  - treeline
- text: Leather boots last longer but are heavier and need breaking in; synthetic boots are lighter and comfortable sooner but usually wear out faster.
  reviews:
  - outdoorsmagic
  - lfto
  - countryfile
  - gearjunkie
- text: Widths and sizing differ a lot between brands and models (Keen tends to be roomy, Salomon narrower), so check width and whether a model runs small or large.
  reviews:
  - lfto
  - gearjunkie
  - switchback
  - tomsguide
- text: Some boots can be resoled, so a well-made pair can be repaired rather than replaced and last for years.
  reviews:
  - lfto
  - treeline
caution: Support for your ankle comes mainly from a stiff sole and a snug heel rather than a high collar, and a new pair should be worn on short walks before a long day out to avoid blisters.
