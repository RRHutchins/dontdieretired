id: waterproof-jackets
name: Waterproof jackets
title: 'Best waterproof jackets for walking: what 11 reviews recommend'
description: We read 11 independent UK and US reviews of waterproof walking jackets and rain jackets and pulled together what they recommend and why.
kit_names:
- waterproof walking jacket
- waterproof jacket
- packable waterproof jacket
- rain jacket
intro: 'A waterproof jacket keeps rain and wind off on walks and hikes. The reviews agree the choice is a balance: heavier three-layer shells keep you dry in long, heavy rain and last longer, while lighter ones pack small but give up some protection and durability. Vents, a hood that stays put and pockets you can reach with a rucksack on matter as much as the fabric.'
