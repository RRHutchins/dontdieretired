agree:
- text: '8x, usually 8x42 or 8x32, is the sweet spot for birds and nature watching: steadier than 10x, which suits longer distances.'
  reviews: [livescience, advnture, expertreviews, gearjunkie]
- text: Bigger objective lenses gather more light for dawn, dusk and stars but add weight and bulk; smaller 25mm to 32mm pairs are lighter and pocketable but dimmer.
  reviews: [livescience, digitalcameraworld, outdoorgearlab, expertreviews, advnture, t3, gearjunkie]
- text: 'If you wear glasses, check the eye relief: look for roughly 14mm to 16mm or more.'
  reviews: [livescience, advnture, expertreviews, space]
- text: ED (extra-low dispersion) glass cuts colour fringing, and is mostly found in pairs above about £200.
  reviews: [expertreviews]
- text: For stargazing, choose bigger lenses (at least 10x50 or 50mm); at higher magnifications you need a tripod or image stabilisation.
  reviews: [space, livescience, digitalcameraworld, t3]
- text: Porro-prism binoculars give brighter views for the money; roof-prism designs are more compact and lighter.
  reviews: [advnture, t3, space, expertreviews]
caution: Advnture says there is no substitute for getting your hands on a pair before you buy; if you wear glasses, check the eye relief first.
