# The words the generator (static/planner.js) puts around an activity's own steps (RUNBOOK §6s, day 2).
# What to DO always comes from the activity itself (start, links, book, kit, safety) or from dates.yaml and the engine;
# these lines only say WHEN and WHY. `text` is a short step title, `why` the reason for its timing. Placeholders:
# {title} activity title, {weeks} weeks, {event} engine event name, {months} best months, {date} the reader's date.
# Each `at` is days relative to the reader's date (negative = before), or a fraction of the lead time ("lead*0.5"),
# or "start" (the first day of the plan). The generator never puts a step before today: a short run-up squeezes the
# flexible steps closer together and says so.
steps:
  first:
    at: start
    why: "First, because everything after it depends on what you find out here."
  second:
    at: "start+7"
    why: "Once you have read up, so you know what you are committing to."
  ongoing:
    at: "lead*0.5"
    why: "From the middle of the run-up, so there is time to get used to it before the day."
  after_start:
    at: 14
    why: "Once you have made a start: this is the next stretch, and what turns a first go into something you can do."
  dates:
    at: start
    text: "Check this year's dates"
    why: "It happens at the same time every year, but dates move: check this year's on the organiser's own website before you plan round it. The link here is where we read when it usually happens."
  book:
    at: "start+7"
    text: "Compare and book"
    why: "Places on courses, trips and events can fill up, so booking early keeps your date."
  travel:
    at: "lead*0.6"
    text: "Sort out getting there, and somewhere to stay if you need it"
    why: "It is tied to one place, and travel and rooms are easier to get, and often cheaper, well ahead."
  kit_before:
    at: -14
    text: "Get your kit"
    why: "Two weeks before, so anything new has time to arrive and you can try it out first."
  kit_after:
    at: 7
    text: "Get your kit"
    why: "After your first session, once you know what you need and what you can borrow or hire."
  safety:
    at: -1
    text: "Before you go: stay safe"
    why: "The day before, while there is still time to change plans."
  safety_month:
    at: -1
    text: "Before you start: stay safe"
    why: "Just before your month begins, while there is still time to change plans."
  day:
    at: 0
    text: "{title}"
    why: "Your date."
  day_span:
    text: "{title}"
    why: "Your dates, {date}. Everything above is ready by the first day."
  day_month:
    text: "{title}"
    why: "You chose {date} rather than a day, so the plan has everything ready by the start of the month."
  train_start:
    text: "Start the {weeks}-week training plan for {event}"
    why: "The training comes from our guidance engine, built from the sources it lists, and its plan for your date runs {weeks} weeks. It starts here so that it ends on the day."
  later:
    at: 28
    why: "Once you have begun: this is the longer stretch that runs on from here, so it sits a month in as a reminder rather than a deadline."
  look_back:
    at: 28
    text: "Four weeks in: look back"
    why: "A month is long enough to know whether the time slot works. Keep it, move it or try something else."
  take_stock:
    at: 28
    text: "A month in: take stock"
    why: "Projects stall without a rhythm, so a look a month in shows whether it is moving and what the next stretch is."

# My year: a day with more than this many steps from two or more of the reader's plans is busy, and flexible steps move off it.
busy_day: 3

# Notes the generator adds to a plan when they apply.
notes:
  squeezed: "Your date is closer than our usual {weeks}-week run-up, so the steps are closer together."
  outside: "{date} is outside the best months for this ({months}), by our reading of its season: \"{season}\"."
  too_soon: "{event} needs at least {weeks} weeks of training, and your date is sooner than that. The earliest date that leaves enough time is {earliest}."
  train_short: "{event} usually takes {usual} weeks of training. Your date leaves {weeks}, which is not below the engine's minimum of {min}, so the plan runs {weeks} weeks."
  past: "That date has already gone. Pick a date from today on."
  # Under the date picker on an activity page (RUNBOOK §6s, day 3): why the date we fill in was chosen.
  suggest_fixed: "We have filled in the next date we found published. Check it on the organiser's own website before you book anything."
  suggest_season: "We have filled in the first of its best months ({months}) that leaves our usual {weeks}-week run-up. Change it to suit you."
  suggest_any: "Any time of year suits this, so we have filled in a date that leaves our usual {weeks}-week run-up. Change it to suit you."
  # Shown with a saved plan.
  saved: "Saved on this device only, with your list. Clearing this browser's data clears it too, so save a backup from your list now and then."
  saved_past: "Your date, {date}, has passed. Mark it done on your list, or pick a new date."
  # The My year page (RUNBOOK §6s, day 4): all of a reader's plans together. The planner flags clashes and leaves the
  # choice to the reader; it only moves flexible steps (never training, safety, a booking date or the day itself).
  moved_you: "You moved this from {from}."
  moved_day: "Moved from {from}, the day of {other}, so that day is kept clear for it."
  moved_busy: "Moved from {from} to spread out a busy day: your plans had more than {n} steps on it."
  clash_day: "{titles} are on the same day, {date}. If that is not what you meant, change the date of one of them."
  clash_span: "{a} ({adates}) and {b} ({bdates}) overlap. If that is not what you meant, change the dates of one of them."
  # Planner Plus day 10: a trip away that falls on, or ends the day before, training sessions of another plan (a fact, not advice)
  trip_train: "{a} ({dates}) falls on {n} of the training sessions in your plan for {b}{key}. Each plan was built on its own, so check how you will fit them around your trip."
  trip_train_key: ", including the {key} on {day}"
  trip_train_eve: "{a} ({dates}) ends the day before the {key} in your plan for {b}, on {day}. Each plan was built on its own, so check how the travel home fits with it."
  # Something added with "Add to my year" from a trip's "While you're there": not flagged as a clash with that trip
  with_trip: "Part of your trip for {title}."
  clash_train: "The training plans for {a} and {b} overlap from {from} to {to}. Each plan was built on its own, so check you can fit both into your week, or set the dates further apart."
  affiliate: "Some of the links in this plan are affiliate links: if you book or buy through them we may earn a commission at no extra cost to you."
  # Add to my calendar (RUNBOOK §6s, day 5): the words around each step in the .ics file, and the line under the button.
  cal_step: "{title}: {text}"
  cal_day_month: "{title} (some time in {month})"
  cal_why: "Why then: {why}"
  cal_plan: "Your plan on Don't Die Retired (it opens on the device where you saved it): {url}"
  cal_help: "This saves a calendar file (.ics) with one all-day entry for each step still to do. Open it with your calendar app, or use the app's import option, to add them. Nothing is sent anywhere. The calendar does not change when your plan does: if you change the plan, save the file again, and check for steps you no longer need, as some calendar apps keep both."
  cal_why_train: "Why: {why}"
  # More than one day (Robin, 7 Nov 2026): a plan on a day may have a last day too, up to 30 days on.
  span_q: "I'm going for more than one day"
  span_last: "Last day"
  span_help: "Everything is made ready by the first day, and the whole stay shows as one block in My year and your calendar."
  span_err: "Choose a last day after the first day, and no more than 30 days later."
  # Dated training (RUNBOOK §6s, day 6). The sessions themselves, their order and every reason for them come from the
  # guidance engine (tools/engine.py export); these are only the words around them.
  level_q: "Where are you starting from?"
  level_opt: "{label} (the plan's first {key}: {start})"
  level_starter: "Starting out"
  level_active: "Already active"
  level_advanced: "Very active"
  level_help: "Pick the one whose first {key} you could do comfortably now. You can change it later: the sessions are then worked out again from the day you change it."
  train_month: "The training sessions are dated once you choose the day itself, because the plan's last weeks ease off to end on that day. Until then the plan shows when to start."
  train_offline: "The day-by-day training sessions could not be loaded just now. Reload the page to see them."
  train_week: "Week {w} of {weeks}: {head}"
  train_about: "Your {weeks}-week training plan, {level}, from our guidance engine"
  train_level_long: "From your starting point ({level}) the engine builds up over {full} weeks rather than its usual {usual}, so the long session never grows too fast from one week to the next."
  train_level_short: "From your starting point ({level}) the engine's plan builds up over {full} weeks, and your date leaves fewer, so the plan below cannot build up to the full length safely. A date on or after {earliest} gives the whole plan."

# Where it is and getting there (RUNBOOK §6t, Planner Plus day 8). static/planner.js trip() builds these links from the
# place: an activity's sourced `where:` (content/challenges.yaml), or the town, venue or postcode the member types.
# The same links serve the free "plan it yourself" box and the paid plan. Each link is a search the reader runs
# themselves: no recommendation, no price. `url` placeholders: {q} the place (URL-encoded). `countries`: GB, US, or
# any. Affiliate travel links go here only once Robin has an id in site.yaml → affiliates (none yet, 8 Nov 2026).
# Day 9 (8 Nov 2026): `section: stay` (where to stay) shows for a trip away: a plan over more than one day, or an
# activity tied to a place (not a weekly habit). `url_dated` is the same search with the nights filled in ({in} and
# {out}, YYYY-MM-DD: the first and last days of a stay, or the night of a single day); a month plan uses `url`.
# `section: eat` is a map search near the place. Never name or recommend a place to stay or eat that we have not checked.
# The Google Maps forms are Google's documented Maps URLs (api=1); with no origin, Google asks for one or uses the
# device's own location, so the member's home is never in our links.
trip:
  head: "Where it is and getting there"
  head_away: "Your trip"
  where_label: "Where"
  where_q: "Where will you do it?"
  where_help: "Type a town, venue or postcode. It is kept with your plan on this device, and goes to the map or journey planner only if you open one of the links."
  where_hint: "Our page for this lists {area}."
  where_save: "Show the links"
  where_change: "Change the place"
  where_source: "From {label}, checked {checked}. Check the organiser's own page before you travel: venues and start points can change."
  when_none: "the day you go"
  getting_help_span: "Each link opens a search for you to run: put in {from} to travel there and {to} to come back, and where you are setting off from."
  getting: "Getting there"
  getting_help: "Each link opens a search for you to run: put in {when}, and where you are setting off from."
  my_needs: "Add where it is on its plan page to see the map, journey planners, places to stay and places to eat."
  step_detail: "The links are with the day itself, under \"Your trip\": getting there, where to stay and where to eat."
  stay: "Where to stay"
  stay_fold: "Staying the night?"
  stay_help_span: "The hotel search is set for {from} to {to}. Change the dates in the search if you arrive the night before or leave the day after."
  stay_help_day: "The hotel search is set for the night of {day}. If it starts early, you could choose the night before instead."
  stay_help_month: "Choose your nights in the search once you have picked your day."
  stay_more: "Hostels and campsites"
  eat: "Where to eat"
  # Planner Plus day 10: other things to do on the same trip, and things that go well with this one
  near: "While you're there"
  near_help: "Other things on our list in the same area. Add to my year puts one on a free day of this trip; its own plan then shows how to get ready."
  near_area: "Also in {area}"
  near_tours: "Tours and things to do near {place}"
  near_tours_help: "Searches for you to run. We have not checked or chosen any of these tours."
  goes: "Goes well with"
  goes_help: "Activities that go with this one. Add to my year gives one its own plan, on the date shown; change it on its page."
  add: "Add to my year"
  add_on: "for {when}"
  added: "In your year: {when}"
  see_plan: "See its plan"
  pick_date: "Choose a date on its page"
  pick_why_event: "It has a training plan, so choose its date and starting point on its page."
  pick_why_fixed: "It happens on set dates, so check them on its page."
  pick_why_long: "It takes more than an afternoon, so give it its own dates on its page."
  # the words put in front of the place for the map searches above ({q_hotels} and so on)
  near_q: {hotels: "hotels near", campsites: "campsites near", eat: "restaurants near", cafes: "cafes near"}
  eat_help: "Map searches near {place}. We have not checked or chosen any of these places: see what is open on your day."
  # added to a typed place when the activity is in one country only, so "Bath" finds Bath in Somerset, not Maine
  country_q: {GB: "UK", US: "USA"}
  links:
    - id: map
      label: "See it on a map"
      url: "https://www.google.com/maps/search/?api=1&query={q}"
      why: "Google Maps, to see where it is and what is around it."
      countries: any
      section: where
    - id: transit
      label: "Directions by public transport"
      url: "https://www.google.com/maps/dir/?api=1&destination={q}&travelmode=transit"
      why: "Google Maps directions from where you are, by train, bus or coach."
      countries: any
      section: getting
    - id: drive
      label: "Directions by car"
      url: "https://www.google.com/maps/dir/?api=1&destination={q}&travelmode=driving"
      why: "Google Maps driving directions from where you are."
      countries: any
      section: getting
    - id: national-rail
      label: "National Rail Enquiries"
      url: "https://www.nationalrail.co.uk/"
      why: "Train times and tickets in England, Scotland and Wales."
      countries: [GB]
      section: getting
    - id: traveline
      label: "Traveline"
      url: "https://www.traveline.info/"
      why: "Bus, coach and local journeys across Great Britain."
      countries: [GB]
      section: getting
    - id: amtrak
      label: "Amtrak"
      url: "https://www.amtrak.com/"
      why: "Train times and tickets between US cities."
      countries: [US]
      section: getting
    - id: hotels
      label: "Search hotels on Booking.com"
      url: "https://www.booking.com/searchresults.en-gb.html?ss={q}"
      url_dated: "https://www.booking.com/searchresults.en-gb.html?ss={q}&checkin={in}&checkout={out}"
      why: "Hotels, guest houses and flats near there, with prices for your nights. Check the address against the venue before you book."
      countries: any
      section: stay
    - id: hotels-map
      label: "Places to stay on a map"
      url: "https://www.google.com/maps/search/?api=1&query={q_hotels}"
      why: "Google Maps, to see how far each one is from where you are going."
      countries: any
      section: stay
    - id: yha
      label: "YHA hostels (England and Wales)"
      url: "https://www.yha.org.uk/"
      why: "Hostels in England and Wales. Check the hostel's own page for rooms and ages."
      countries: [GB]
      section: stay
      more: true
    - id: hostelling-scotland
      label: "Hostelling Scotland"
      url: "https://www.hostellingscotland.org.uk/"
      why: "Hostels across Scotland."
      countries: [GB]
      section: stay
      more: true
    - id: hi-usa
      label: "HI USA hostels"
      url: "https://www.hiusa.org/"
      why: "Hostelling International hostels in the US."
      countries: [US]
      section: stay
      more: true
    - id: campsites-map
      label: "Campsites on a map"
      url: "https://www.google.com/maps/search/?api=1&query={q_campsites}"
      why: "Google Maps, for campsites and caravan sites near there."
      countries: any
      section: stay
      more: true
    # Planner Plus day 10: "While you're there". Tour and activity searches for the place (affiliate: viator and
    # getyourguide are the only ids Robin has sent, site.yaml → affiliates; the disclosure shows beside them, and they
    # are written plain in calendar files). Same search forms as the "Book it" boxes on activity pages.
    - id: viator
      label: "Tours and activities on Viator"
      url: "https://www.viator.com/searchResults/all?text={q}"
      why: "Guided tours, tastings and day trips that run near there. Read what is included and the meeting point before you book."
      countries: any
      section: near
      aff: viator
    - id: getyourguide
      label: "Tours and activities on GetYourGuide"
      url: "https://www.getyourguide.com/s/?q={q}"
      why: "Another search of tours, tickets and day trips near there, to compare."
      countries: any
      section: near
      aff: getyourguide
    - id: eat-map
      label: "Places to eat nearby"
      url: "https://www.google.com/maps/search/?api=1&query={q_eat}"
      why: "Google Maps: restaurants near there."
      countries: any
      section: eat
    - id: cafes-map
      label: "Cafés nearby"
      url: "https://www.google.com/maps/search/?api=1&query={q_cafes}"
      why: "Google Maps: cafés near there, for something lighter."
      countries: any
      section: eat

