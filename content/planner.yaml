# My year: the planner (RUNBOOK §6s). Settings the planner uses to turn an activity and a date into a get-ready plan.
# Checked by tools/planner.py at every build. Nothing here is shown to readers as a fact about the world: lead times are
# our planning defaults, and `seasons` is our reading of each activity's own `season` line (which came from its sources).
#
# Per-activity overrides in content/challenges.yaml (all optional):
#   when: [5, 6, 7]        best months to do it (1 = January). Overrides the season reading. Use [] for "any time".
#   lead_weeks: 8          how many weeks before the date the plan starts. Overrides the kind's default.
#   start_at: [first, second, day]   where each of the activity's `start` steps goes in a plan: first, second, ongoing,
#                          after_start (the rules under `steps` below) or day (shown with the day itself). Only where the
#                          default placement reads wrongly (see static/planner.js).
#   plan_event: marathon   an engine event (engine/events/<id>.yaml) that supplies the training. Needed only when the
#                          event's own `activity:` does not already point at this activity.

# One plan shape per kind of activity. `lead_weeks_local` is the shorter run-up for a one-off afternoon that is not tied to
# a far-off place (a taster session, a local open day): six weeks' notice for a climbing wall would just be noise. Strands, in the order the plan introduces them:
#   book   find it, check dates, book a place or tickets (booking deadlines, entry, courses)
#   learn  read, visit, try a taster, practise between sessions
#   train  physical preparation, only from the guidance engine (never written freehand)
#   travel getting there and somewhere to stay
#   kit    what to take or buy, at three levels, with the reason for each
kinds:
  skill:
    label: Skill or course
    lead_weeks: 10
    lead_weeks_local: 3
    strands: [book, learn, kit]
    why: "Courses and classes have start dates and can fill up, so the plan begins with finding and booking one. Kit comes after the first session, once you know what you need."
  experience:
    label: Experience or day out
    lead_weeks: 6
    lead_weeks_local: 2
    strands: [book, travel, kit]
    why: "The hard part of a day out is the timing: the right season, tickets and getting there. The plan watches the calendar for you."
  event:
    label: Event
    lead_weeks: 12
    lead_weeks_local: 4
    strands: [book, learn, travel, kit]
    why: "Events have fixed dates and entry or ticket deadlines."
    why_train: "Physical events add a training plan from our guidance engine, and its length is set by the engine, not by the date you would like."
  project:
    label: Project
    lead_weeks: 4
    lead_weeks_local: 1
    strands: [learn, book, travel, kit]
    why: "Projects run over months and stall without a rhythm, so the plan sets milestones you can see."
  habit:
    label: Habit
    lead_weeks: 1
    strands: [book, learn]
    why: "A habit needs a fixed slot in the week more than a plan, so the planner gives it one and checks in gently."

# Lead weeks for an activity tied to an engine event come from the event's `weeks.default` (never fewer than `weeks.min`).

# Our reading of each `season` phrase used in content/challenges.yaml, as best months (1 = January).
