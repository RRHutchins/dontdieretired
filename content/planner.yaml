# The words the generator (static/planner.js) puts around an activity's own steps (RUNBOOK §6s, day 2).
# What to DO always comes from the activity itself (start, links, book, kit, safety) or from dates.yaml and the engine;
# these lines only say WHEN and WHY. `text` is a short step title, `why` the reason for its timing. Placeholders:
# {title} activity title, {weeks} weeks, {event} engine event name, {months} best months, {date} the reader's date.
# Each `at` is days relative to the reader's date (negative = before), or a fraction of the lead time ("lead*0.5"),
# or "start" (the first day of the plan). The generator never puts a step before today: a short run-up squeezes the
# flexible steps closer together and says so.
steps:
  first:
    at: start
    why: "First, because everything after it depends on what you find out here."
  second:
    at: "start+7"
    why: "Once you have read up, so you know what you are committing to."
  ongoing:
    at: "lead*0.5"
    why: "From the middle of the run-up, so there is time to get used to it before the day."
  after_start:
    at: 14
    why: "Once you have made a start: this is the next stretch, and what turns a first go into something you can do."
  dates:
    at: start
    text: "Check this year's dates"
    why: "It happens at the same time every year, but dates move: check this year's on the organiser's own website before you plan round it. The link here is where we read when it usually happens."
  book:
    at: "start+7"
    text: "Compare and book"
    why: "Places on courses, trips and events can fill up, so booking early keeps your date."
  travel:
    at: "lead*0.6"
    text: "Sort out getting there, and somewhere to stay if you need it"
    why: "It is tied to one place, and travel and rooms are easier to get, and often cheaper, well ahead."
  kit_before:
    at: -14
    text: "Get your kit"
    why: "Two weeks before, so anything new has time to arrive and you can try it out first."
  kit_after:
    at: 7
    text: "Get your kit"
    why: "After your first session, once you know what you need and what you can borrow or hire."
  safety:
    at: -1
    text: "Before you go: stay safe"
    why: "The day before, while there is still time to change plans."
  day:
    at: 0
    text: "{title}"
    why: "Your date."
  day_month:
    text: "{title}"
    why: "You chose {date} rather than a day, so the plan has everything ready by the start of the month."
  train_start:
    text: "Start the {weeks}-week training plan for {event}"
    why: "The training comes from our guidance engine, built from the sources it lists, and its plan for your date runs {weeks} weeks. It starts here so that it ends on the day."
  look_back:
    at: 28
    text: "Four weeks in: look back"
    why: "A month is long enough to know whether the time slot works. Keep it, move it or try something else."
  take_stock:
    at: 28
    text: "A month in: take stock"
    why: "Projects stall without a rhythm, so a look a month in shows whether it is moving and what the next stretch is."

# Notes the generator adds to a plan when they apply.
notes:
  squeezed: "Your date is closer than our usual {weeks}-week run-up, so the steps are closer together."
  outside: "{date} is outside the best months for this ({months}), by our reading of its season: \"{season}\"."
  too_soon: "{event} needs at least {weeks} weeks of training, and your date is sooner than that. The earliest date that leaves enough time is {earliest}."
  train_short: "{event} usually takes {usual} weeks of training. Your date leaves {weeks}, which is not below the engine's minimum of {min}, so the plan runs {weeks} weeks."
  past: "That date has already gone. Pick a date from today on."
  # Under the date picker on an activity page (RUNBOOK §6s, day 3): why the date we fill in was chosen.
  suggest_fixed: "We have filled in the next date we found published. Check it on the organiser's own website before you book anything."
  suggest_season: "We have filled in the first of its best months ({months}) that leaves our usual {weeks}-week run-up. Change it to suit you."
  suggest_any: "Any time of year suits this, so we have filled in a date that leaves our usual {weeks}-week run-up. Change it to suit you."
  # Shown with a saved plan.
  saved: "Saved on this device only, with your list. Clearing this browser's data clears it too, so save a backup from your list now and then."
  saved_past: "Your date, {date}, has passed. Mark it done on your list, or pick a new date."
  affiliate: "Some of the links in this plan are affiliate links: if you book or buy through them we may earn a commission at no extra cost to you."
