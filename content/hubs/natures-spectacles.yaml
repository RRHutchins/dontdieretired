- id: bioluminescent-bays-puerto-rico
  name: Bioluminescent bays of Puerto Rico
  type: living
  place: Mosquito Bay on Vieques, Laguna Grande in Fajardo and La Parguera in Lajas
  country: Puerto Rico (US)
  continent: north-america
  see: [guided, boat]
