  see_note: Entry to the park requires a permit from the park office in Labuan Bajo, and a local guide is mandatory on dragon treks. The ministry says Rinca, about two hours by ferry from Labuan Bajo, has the largest population of dragons, while on Komodo itself they can be hard to spot. Go in the early morning, when it is cooler and wildlife is most active; afternoon seas can be rough.
  note: Indonesia's tourism ministry says most of the remaining 3,000 endangered Komodo dragons live in the park area. They can reach 3 meters and 150 kilograms, and can be dangerous if provoked, so keep a safe distance. The park is a UNESCO World Heritage Site.
