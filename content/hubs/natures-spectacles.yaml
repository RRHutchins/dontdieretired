# ---------- In the sky ----------
- id: total-solar-eclipse-2027-spain
  name: Total solar eclipse in Spain and Gibraltar
  type: sky
  place: Most of Cádiz province, part of Málaga province, the far south of Granada and Almería provinces, Ceuta and Melilla; and Gibraltar
  country: Spain and Gibraltar
  continent: europe
  month: [8]
  when: Monday 2 August 2027, around 10:50am local time
  see: [own]
  see_note: Be inside the path of totality on the morning. Spain's National Geographic Institute (IGN) gives local times and lengths for each place; wear eclipse glasses for every phase except totality itself.
  note: The IGN says Ceuta will have Spain's longest totality, 4 minutes 48 seconds, between 10:45 and 10:50. Cádiz has 2 minutes 54 seconds from 10:45, Málaga 1 minute 48 seconds from 10:48 and Melilla 4 minutes 34 seconds from 10:48. The Government of Gibraltar expects the eclipse to bring many visitors, "possibly in the thousands".
  link: {label: 'IGN Astronomy: total solar eclipse of 2 August 2027', url: 'https://astronomia.ign.es/en/eclipses-de-sol-y-luna/eclipse-total-sol-de-2-de-agosto-2027', checked: '2026-11-19'}
  more:
  - {label: 'HM Government of Gibraltar: planning begins for solar eclipses', url: 'https://www.gibraltar.gov.gi/press-releases/planning-begins-for-solar-eclipses-212026-11608', checked: '2026-11-19'}
- id: total-solar-eclipse-2027-north-africa
  name: Total solar eclipse across North Africa and Egypt
  type: sky
  place: A track across Morocco, Algeria, Tunisia, Libya and Egypt, then on to Saudi Arabia and Yemen
  country: Morocco, Algeria, Tunisia, Libya, Egypt
  continent: africa
  month: [8]
  when: Monday 2 August 2027 (greatest eclipse at 10:07 UT)
  see: [own]
  see_note: Be inside the path of totality, which NASA puts at 258 km wide at the point of greatest eclipse. Wear eclipse glasses for every phase except totality itself.
  note: NASA puts the point of greatest eclipse at 25.5°N, 33.2°E, with 6 minutes 23 seconds of totality and the Sun 82° above the horizon. A partial eclipse will be visible across most of Europe and much of Africa.
  link: {label: 'NASA: eclipses during 2027', url: 'https://eclipse.gsfc.nasa.gov/OH/OH2027.html', checked: '2026-11-19'}
  more:
  - {label: 'NASA Science: future eclipses', url: 'https://science.nasa.gov/eclipses/future-eclipses/', checked: '2026-11-19'}
- id: northern-lights-uk
  name: Northern lights in the UK
  type: sky
  place: Most often Scotland, northern England and Northern Ireland; anywhere in the UK at the highest alert
  country: UK
  continent: europe
  see: [own]
  see_note: Follow AuroraWatch UK, hosted by Lancaster University, through social media, its Telegram channel or third-party apps. Even at a high alert, local conditions such as cloud still need to be right.
  note: "AuroraWatch UK's alerts run from green to red. At amber the aurora is likely to be visible by eye from Scotland, northern England and Northern Ireland; at red it is likely to be visible by eye and camera from anywhere in the UK."
  link: {label: 'AuroraWatch UK: alerts', url: 'https://aurorawatch.lancs.ac.uk/alerts/', checked: '2026-11-19'}
- id: northern-lights-norway
  name: Northern lights in Northern Norway
  type: sky
  place: Northern Norway, including Tromsø, Lofoten, Alta, Kirkenes, North Cape, the Lyngen Alps and Svalbard
  country: Norway
  continent: europe
  month: [9, 10, 11, 12, 1, 2, 3, 4]
  see: [own, guided, boat]
  see_note: Go between September and April and look on a clear, dark night away from lights. Visit Norway lists guided aurora chases by minibus and evening aurora cruises, for example from Tromsø.
  note: Visit Norway says activity is highest around March and April and September and October.
  link: {label: 'Visit Norway: the best time to see the northern lights', url: 'https://www.visitnorway.com/things-to-do/nature-attractions/northern-lights/best-time-to-see/', checked: '2026-11-19'}
- id: northern-lights-iceland
  name: Northern lights in Iceland
  type: sky
  place: Anywhere dark in Iceland, away from artificial light
  country: Iceland
  continent: europe
  month: [9, 10, 11, 12, 1, 2, 3, 4]
  see: [own]
  see_note: Check cloud cover and aurora activity on the Icelandic Met Office website, then head somewhere dark. Visit Iceland says you do not necessarily need a tour.
  note: Visit Iceland gives the main season as September through April, and reminds drivers that road safety matters on winter roads.
  link: {label: 'Visit Iceland: the northern lights in Iceland', url: 'https://www.visiticeland.com/article/northern-lights-in-iceland/', checked: '2026-11-19'}
- id: northern-lights-finnish-lapland
  name: Northern lights in Finnish Lapland
  type: sky
  place: Finnish Lapland
  country: Finland
  continent: europe
  month: [8, 9, 10, 11, 12, 1, 2, 3, 4]
  when: Usually late August to early April
  see: [own, guided]
  see_note: Look up between 9pm and 2am on clear nights; the Finnish Meteorological Institute publishes an aurora probability map. Tours range from snowshoeing and snowmobiling to reindeer safaris and sauna evenings.
  note: Visit Finland says the aurora shows in Lapland on roughly every other clear night between August and April, and that some places have glass cabins where you can watch from bed.
  link: {label: 'Visit Finland: how to see the northern lights', url: 'https://www.visitfinland.com/en/articles/how-to-see-the-northern-lights/', checked: '2026-11-19'}
- id: perseid-meteor-shower
  name: Perseid meteor shower
  type: sky
  place: Anywhere away from street lights (the Royal Observatory's guide is written for the UK)
  country: UK
  continent: europe
  month: [7, 8]
  when: Active 17 July to 24 August; peak overnight 12 to 13 August 2027
  see: [own]
  see_note: Watch between midnight and 5.30am from somewhere away from street lights, and give your eyes at least 15 minutes to adjust. Binoculars and telescopes are not needed; they narrow the patch of sky you see.
  note: The meteors are debris from comet 109P/Swift-Tuttle. The Royal Observatory notes a bright waxing gibbous Moon at the 2027 peak.
  link: {label: 'Royal Observatory Greenwich: Perseid meteor shower guide', url: 'https://www.rmg.co.uk/stories/space-astronomy/perseid-meteor-shower-guide-uk-when-where-to-see', checked: '2026-11-19'}
  more:
  - {label: 'Royal Observatory Greenwich: meteor shower calendar 2026 and 2027', url: 'https://www.rmg.co.uk/stories/space-astronomy/meteor-shower-guide-2026', checked: '2026-11-19'}
- id: geminid-meteor-shower
  name: Geminid meteor shower
  type: sky
  place: Anywhere away from street lights (the Royal Observatory's guide is written for the UK)
  country: UK
  continent: europe
  month: [12]
  when: Active 4 to 20 December; peak on 14 December 2026
  see: [own]
  see_note: Find a safe spot away from street lights and look a little away from the radiant, the point the meteors seem to come from, rather than straight at it.
  note: The Royal Observatory gives a peak rate of up to 120 meteors an hour, though far fewer are seen under light-polluted skies. The Geminids come from the asteroid 3200 Phaethon.
  link: {label: 'Royal Observatory Greenwich: Geminid meteor shower 2026', url: 'https://www.rmg.co.uk/stories/space-astronomy/geminid-meteor-shower-uk-dates-how-to-see', checked: '2026-11-19'}
# ---------- Wildlife and living light ----------
- id: starling-murmurations
  name: Starling murmurations
  type: living
  place: Large roosts in reedbeds, on piers and on coastal marshes, such as RSPB Ham Wall
  country: UK
  continent: europe
  month: [11, 12, 1, 2]
  see: [own]
  see_note: Go to a roost at dusk, when the flocks gather. At RSPB Ham Wall the reserve asks you to arrive by 3.30pm at the latest, ring its Starling hotline to find where the birds roosted the night before, and bring a torch for the walk back.
  note: The RSPB calls the starlings' winter display "one of nature's most spectacular shows". Hundreds, and sometimes thousands, of birds gather as the sun goes down.
  link: {label: 'RSPB: starling', url: 'https://www.rspb.org.uk/birds-and-wildlife/starling', checked: '2026-11-19'}
  more:
  - {label: 'RSPB Ham Wall: the starling roost', url: 'https://www.rspb.org.uk/days-out/reserves/ham-wall/the-starling-roost', checked: '2026-11-19'}
- id: bioluminescent-bays-puerto-rico
  name: Bioluminescent bays of Puerto Rico
  type: living
  place: Mosquito Bay on Vieques, Laguna Grande in Fajardo and La Parguera in Lajas
  country: Puerto Rico (US)
  continent: north-america
  see: [guided, boat]
  see_note: Book with a certified eco-tour operator for a dark night, near the new moon and away from the full moon. Mosquito Bay is reached by kayak only; La Parguera is the one bay where motorboats are allowed.
  note: Discover Puerto Rico says swimming is not allowed in the bio bays, asks visitors not to use bug spray or sunscreen, and asks them not to touch or take anything from the water. Discover Puerto Rico says Guinness World Records recognised Mosquito Bay in 2006 as the brightest bioluminescent bay in the world.
  link: {label: "Discover Puerto Rico: the three bioluminescent bays", url: 'https://www.discoverpuertorico.com/article/guide-to-exploring-puerto-ricos-bioluminescent-bays', checked: '2026-11-19'}
  more:
  - {label: "Discover Puerto Rico: protecting the bioluminescent bays", url: 'https://www.discoverpuertorico.com/protecting-puerto-ricos-bioluminescent-bays', checked: '2026-11-19'}
- id: synchronous-fireflies-smokies
  name: Synchronous fireflies in the Great Smoky Mountains
  type: living
  place: Elkmont, Great Smoky Mountains National Park, Tennessee
  country: USA
  continent: north-america
  month: [5, 6]
  when: Usually eight nights between late May and early June
  see: [booked]
  see_note: Enter the park's lottery for vehicle reservations in late April; each reservation is for one night. Cover your torch with red cellophane and stay on the designated trails.
  note: The species is Photinus carolinus. In 2026 the viewing ran from 20 to 27 May, with 120 reservations a night, and only vehicles with a reservation could enter after noon.
  link: {label: 'National Park Service: synchronous fireflies', url: 'https://www.nps.gov/grsm/learn/nature/fireflies.htm', checked: '2026-11-19'}
  more:
  - {label: 'National Park Service: 2026 firefly viewing dates', url: 'https://www.nps.gov/grsm/learn/news/great-smoky-mountains-national-park-announces-dates-for-2026-annual-firefly-viewing-event.htm', checked: '2026-11-19'}
- id: salmon-run-brooks-falls
  name: Bears and the salmon run at Brooks Falls
  type: living
  place: Brooks Camp, Katmai National Park and Preserve, Alaska
  country: USA
  continent: north-america
  month: [7]
  see: [own]
  see_note: Everyone must check in at the Brooks Camp Visitor Center first. Bears fishing for salmon can be watched from three viewing platforms along the river.
  note: The park says bears fish at Brooks Falls and in the lower Brooks River throughout July, and in some years a few still fish at the falls in September and October. Weather and bears can delay floatplane arrivals and departures.
  link: {label: 'National Park Service: bear viewing at Brooks Camp (PDF)', url: 'https://www.nps.gov/katm/planyourvisit/upload/bear-viewing-at-brooks-camp.pdf', checked: '2026-11-19'}
- id: great-migration-serengeti-mara
  name: The great wildebeest migration
  type: living
  place: Serengeti National Park, Tanzania, and the Maasai Mara, Kenya
  country: Tanzania and Kenya
  continent: africa
  month: [7, 8, 9, 10]
  when: Crossings into the Maasai Mara usually July to October
  see: [vehicle]
  see_note: At the Mara River crossings in the Serengeti, vehicles must stay in the signed viewing areas, leave the animals room to pass and keep everyone inside.
  note: Tanzania National Parks puts the migration at more than 1.5 million wildebeest, with hundreds of thousands of zebras and half a million gazelles. Magical Kenya says the herds cross the Mara River into the Maasai Mara from July to October.
  link: {label: 'Magical Kenya: the Great Migration', url: 'https://magicalkenya.com/experience/the-great-migration/', checked: '2026-11-19'}
  more:
  - {label: 'Tanzania National Parks: Serengeti brochure (PDF)', url: 'https://www.tanzaniaparks.go.tz/uploads/publications/en-1634493627-SE-ENG.pdf', checked: '2026-11-19'}
  - {label: 'Tanzania National Parks: Mara River crossing guideline (PDF)', url: 'https://www.tanzaniaparks.go.tz/uploads/publications/en-1682869509-MARARIVERCROSSINGGUIDELINE.pdf', checked: '2026-11-19'}
- id: sardine-run
  name: The sardine run
  type: living
  place: The KwaZulu-Natal coast
  country: South Africa
  continent: africa
  month: [5, 6, 7]
  when: Usually May to the end of July
  see: [own, boat]
  see_note: The run can be watched from land, from a boat or underwater as the shoals move up the coast.
  note: The sardines swim from their spawning ground in the Cape up South Africa's east coast, followed by sharks, dolphins, humpback and minke whales, Cape fur seals and Cape gannets.
  link: {label: 'South African Tourism: experience the sardine run', url: 'https://www.southafrica.net/gl/en/travel/article/experience-the-sardine-run-the-greatest-shoal-on-earth', checked: '2026-11-19'}
- id: waitomo-glowworm-caves
  name: Waitomo glowworm caves
  type: living
  place: Waitomo Caves, Waikato, North Island
  country: New Zealand
  continent: oceania
  see: [guided, boat]
  see_note: Guides lead you through the caves, and the visit includes a boat ride through the glowworm grotto. The operator recommends booking in advance.
  note: The boat passes under thousands of glowworms. The limestone of the caves began forming on the ocean floor more than 30 million years ago, says Tourism New Zealand's listing.
  link: {label: 'Tourism New Zealand: Waitomo Glowworm Caves', url: 'https://www.newzealand.com/us/plan/business/waitomo-glowworm-caves/', checked: '2026-11-19'}
  more:
  - {label: 'Waitomo Glowworm Caves (operator)', url: 'https://www.waitomo.com/', checked: '2026-11-19'}
# ---------- Water and rock ----------
- id: severn-bore
  name: The Severn bore
  type: earth
  place: River Severn estuary, Gloucestershire, for example from the riverbank at Newnham-on-Severn or the footpath at Minsterworth
  country: UK
  continent: europe
  see: [own]
  see_note: Check a bore timetable and arrive early; predicted times are only an estimate and the bore can be 10 minutes early or late. Stand well back, because the wave can swamp the bank, and the water is icy cold with a fierce current.
  note: The bore is a surge wave that travels more than 25 miles up the estuary from Awre to Gloucester. Bores are graded from 1* to 5*, and the strongest come with the spring and autumn tides.
  link: {label: 'Visit the Forest of Dean and Wye Valley: the Severn Bore', url: 'https://www.visitdeanwye.co.uk/business-directory/the-severn-bore', checked: '2026-11-19'}
- id: strokkur-geyser
  name: Strokkur geyser
  type: earth
  place: Geysir geothermal area, Haukadalur valley, on the Golden Circle
  country: Iceland
  continent: europe
  see: [own]
  see_note: Stop at the Geysir geothermal area on the Golden Circle and wait; Strokkur erupts every 10 minutes or so.
  note: Its column of boiling water can reach as high as 30 metres. The Great Geysir next to it has been dormant since 1916, says Visit South Iceland.
  link: {label: 'Visit South Iceland: Geysir geothermal area', url: 'https://www.south.is/en/place/geysir-geothermal-area', checked: '2026-11-19'}
- id: old-faithful
  name: Old Faithful
  type: earth
  place: Upper Geyser Basin, Yellowstone National Park, Wyoming
  country: USA
  continent: north-america
  see: [own]
  see_note: Check the next predicted eruption at the Old Faithful Visitor Education Center, then watch from the viewing area or the boardwalks.
  note: The National Park Service gives the median interval, as of January 2025, as 102 minutes, plus or minus 10. Eruptions last 1½ to 5 minutes and average 130 feet (40 m) high.
  link: {label: 'National Park Service: Old Faithful', url: 'https://home.nps.gov/yell/planyourvisit/exploreoldfaithful.htm', checked: '2026-11-19'}
# ---------- Seasons and flowers ----------
- id: bluebell-woods
  name: Bluebell woods
  type: season
  place: Bluebell woods across the UK, such as Glen Finglas in the Trossachs and Hackfall in the Yorkshire Dales
  country: UK
  continent: europe
  month: [3, 4, 5]
  when: Usually late March to early May
  see: [own]
  see_note: Visit a bluebell wood in flower and keep to the paths so you do not tread on the plants.
  note: The Woodland Trust says bluebells are not endangered but are threatened by local extinction.
  link: {label: 'Woodland Trust: best UK bluebell woods', url: 'https://www.woodlandtrust.org.uk/visiting-woods/things-to-do/woods-through-the-seasons/spring/best-bluebell-woods/', checked: '2026-11-19'}
- id: cherry-blossom-japan
  name: Cherry blossom in Japan
  type: season
  place: Across Japan, from Kyushu in the south-west to Hokkaido in the north
  country: Japan
  continent: asia
  month: [3, 4, 5]
  when: Usually late March to early May, depending on the place
  see: [own]
  see_note: Check the Japan National Tourism Organization's forecast, based on Japan Weather Association data, for first-bloom dates in the city you plan to visit.
  note: The season starts on Kyushu in March and moves north. For 2026 the forecast first bloom was 19 March in Tokyo and 19 April in Sapporo; dates change with the weather.
  link: {label: 'Japan National Tourism Organization: cherry blossom forecast', url: 'https://www.japan.travel/en/see-and-do/cherry-blossom-forecast/', checked: '2026-11-19'}
- id: autumn-leaves-japan
  name: Autumn leaves (koyo) in Japan
  type: season
  place: Across Japan, from northern Hokkaido south to central and southern Japan
  country: Japan
  continent: asia
  month: [9, 10, 11, 12]
  when: Usually late September to early December, depending on the place and height
  see: [own]
  see_note: Check the Japan National Tourism Organization's autumn leaves forecast for the city you plan to visit.
  note: The colour starts in the colder areas of northern Hokkaido and moves south; the mountains turn first, then city gardens, parks and temples.
  link: {label: 'Japan National Tourism Organization: autumn leaves forecast', url: 'https://www.japan.travel/en/see-and-do/autumn-leaves-forecast/', checked: '2026-11-19'}
# ---------- Added 20 Nov 2026 (build-out run 1) ----------
- id: quadrantid-meteor-shower
  name: Quadrantid meteor shower
  type: sky
  place: Anywhere away from street lights (the Royal Observatory's guide is written for the UK); the meteors seem to come from Boötes, near the Plough (Big Dipper)
  country: UK
  continent: europe
  month: [1]
  when: Active 28 December 2026 to 12 January 2027; peak 3 to 4 January 2027
  see: [own]
  see_note: In 2027 the peak is best seen just after midnight, while the Moon is far below the horizon. No binoculars or telescope are needed, but give your eyes at least 15 minutes to adjust to the dark.
  note: The Royal Observatory gives a maximum rate of 120 meteors an hour on a clear night at the peak. Meteors can appear anywhere in the sky.
  link: {label: 'Royal Museums Greenwich: Quadrantid meteor shower, when and where to see it in the UK', url: 'https://www.rmg.co.uk/stories/space-astronomy/quadrantid-meteor-shower-when-where-see-it-uk', checked: '2026-11-20'}
- id: farne-islands-puffins
  name: Puffins on the Farne Islands
  type: living
  place: Farne Islands, off the Northumberland coast; boats leave from Seahouses harbour
  country: UK
  continent: europe
  month: [5, 6, 7]
  when: Breeding season, May to July; the islands reopen to visitors on 1 April 2027
  see: [boat]
  see_note: Take a boat from Seahouses to sail round the islands or land on Inner Farne; the National Trust recommends booking the boat in advance. Bird numbers drop sharply from late July. No dogs on the islands, including assistance dogs.
  note: The National Trust says the islands host up to 23 bird species in the breeding season, including around 40,000 pairs of puffins. The Trust adds that the islands have England's largest breeding population of Atlantic grey seals, with pups from October to December.
  link: {label: 'National Trust: things to see on the Farne Islands', url: 'https://www.nationaltrust.org.uk/visit/north-east/farne-islands/things-to-do-on-the-farne-islands', checked: '2026-11-20'}
  more:
  - {label: 'National Trust: Farne Islands', url: 'https://www.nationaltrust.org.uk/visit/north-east/farne-islands', checked: '2026-11-20'}
- id: donna-nook-grey-seals
  name: Grey seal pups at Donna Nook
  type: living
  place: Donna Nook National Nature Reserve, near North Somercotes, Lincolnshire (access from Marsh Lane)
  country: UK
  continent: europe
  month: [11, 12]
  when: The viewing area is usually open from late October to December, depending on seal numbers
  see: [own]
  see_note: No booking needed. Stay in the viewing area behind the fence at the foot of the dunes. No dogs on the viewing area. The Lincolnshire Wildlife Trust names the six weekends from 7 November to 13 December 2026 as the busy ones.
  note: Grey seals come ashore here every November and December to give birth. The Trust counted 1,924 pups in the 2025 season, and posts a weekly count during the season.
  link: {label: 'Lincolnshire Wildlife Trust: Donna Nook', url: 'https://www.lincstrust.org.uk/get-involved/top-reserves/donna-nook', checked: '2026-11-20'}
  more:
  - {label: 'Lincolnshire Wildlife Trust: weekly seal update from Donna Nook', url: 'https://www.lincstrust.org.uk/get-involved/top-reserves/donna-nook/weekly-update', checked: '2026-11-20'}
- id: deer-rut-richmond-bushy-park
  name: The deer rut in Richmond Park and Bushy Park
  type: living
  place: Richmond Park and Bushy Park, south-west London
  country: UK
  continent: europe
  month: [9, 10, 11]
  when: From the end of September to early November
  see: [own]
  see_note: Keep at least 50 metres from the deer and never wave food or a phone at them. Keep dogs on a lead and under close control during the rut.
  note: The Royal Parks say the two parks have more than 1,000 free-roaming red and fallow deer between them. Stags roar to warn off rivals; if neither backs down, they lock antlers.
  link: {label: 'The Royal Parks: 12 things you should know about the deer rutting season', url: 'https://www.royalparks.org.uk/read-watch-listen/12-things-you-should-know-about-deer-rutting-season', checked: '2026-11-20'}
- id: shenandoah-fall-colour
  name: Autumn colour in Shenandoah National Park
  type: season
