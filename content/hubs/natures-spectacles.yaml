- id: synchronous-fireflies-smokies
  name: Synchronous fireflies in the Great Smoky Mountains
  type: living
  place: Elkmont, Great Smoky Mountains National Park, Tennessee
  country: USA
  continent: north-america
  month: [5, 6]
  when: Usually eight nights between late May and early June
