- slug: seeing-wildlife-responsibly
  title: How to watch wildlife spectacles without disturbing them
  short: Watching wildlife well
  seo_title: 'Watching wildlife responsibly: distances, seasons and the codes'
  description: How close to get to seals, puffins, elk, whales and other wildlife spectacles, when animals are most vulnerable, and what the official UK and US codes ask of visitors.
  standfirst: The best wildlife spectacles are the ones the animals barely notice you watching. Here is what the official codes on both sides of the Atlantic ask, and why.
  detail:
  - h: The one rule every code agrees on
    p:
    - "If an animal changes what it is doing because of you, you are too close. The US National Park Service puts it plainly: \"In general, if animals react to your presence you are too close\", and it adds that if you are close enough for a selfie, you are definitely too close."
    - "The UK's Marine and coastal wildlife code asks you to move further away if you think an animal is showing signs of disturbance, and not to approach animals head-on or from directly behind. Binoculars, a spotting scope or a camera zoom give you the close view without the closeness."
  - h: How far away to stay
    table:
      head: [Where, Distance, Who says so]
      rows:
      - ['Most wildlife in many US national parks', '25 yards (about 23 m)', 'National Park Service (check each park: Olympic asks for 50 yards)']
      - ['Bears, wolves and other predators in US parks', '100 yards (about 91 m)', 'National Park Service']
      - ['Elk in Rocky Mountain National Park', '75 feet (23 m), about two bus lengths', 'National Park Service, Rocky Mountain']
      - ['Seals, seabirds, dolphins and whales on UK coasts', 'At least 100 m (330 ft) if you can', 'Marine and coastal wildlife code (GOV.UK)']
      - ['Boats near UK marine wildlife', '100 m (330 ft), under 6 knots', 'Marine and coastal wildlife code (GOV.UK)']
    after: The National Park Service suggests a quick check, holding your arm straight out with your thumb up. If your thumb does not cover the animal, you are too close.
  - h: When animals are most easily upset
    p:
    - "The Marine and coastal wildlife code says animals are especially vulnerable when breeding, in winter, and when resting or moulting, and that disturbed animals may abandon their nests, mates or young. Its breeding seasons: June to January for seals, February to September for birds, and the summer months for dolphins, whales and porpoises. Seals also moult between November and April, and in August."
    - Several spectacles in our finder fall in these seasons, such as seal pupping and seabird colonies. Some places close or restrict access in these seasons, so follow the signs and the wardens.
    - "If you find a seal pup on a beach, the code says not to move it or chase it into the sea, and not to touch or try to refloat any injured or stranded animal."
  - h: Feeding, noise and calls
    list:
    - "Never feed wild animals. The Countryside Code says it can cause them harm, and the National Park Service says it is illegal in US parks to feed, touch, tease, frighten or intentionally disturb wildlife."
    - Keep quiet, and do not use bird calls, wildlife calls or attractants (National Park Service).
    - Avoid flash photography, and do not get too close for a picture (Marine and coastal wildlife code).
    - Do not fly a drone where it will disturb or endanger wildlife (Marine and coastal wildlife code).
    - "Follow each site's own rules. At Jigokudani, Japan's tourism body asks visitors not to feed, touch or threaten the snow monkeys or stare into their eyes; at Volcanoes National Park in Rwanda, time with each gorilla family is limited to one hour a day."
  - h: Dogs, cars and boats
    p:
    - "The Countryside Code asks you to keep your dog under effective control, away from wildlife, and says that between 1 March and 31 July you must keep it on a lead on open access land, even with no livestock about. Many US parks require a leash, most often 6 feet long, where dogs are allowed at all; Skomer allows no dogs."
    - "In a car, pull fully off the road into a marked pull-out to watch (National Park Service). In Rocky Mountain National Park, stay by the roadside and turn off lights and engines when watching elk."
    - On a boat, the UK code asks skippers to slow down when they see an animal, stay under 6 knots, keep their distance if more than two boats are already there, and hold a steady speed and course if dolphins or whales come close, letting them leave when they choose. Look for operators in the WiSe (Wildlife Safe) scheme.
  faq:
  - q: How close can I get to a seal?
    a: The UK's Marine and coastal wildlife code asks you to try to stay at least 100 metres (330 feet) away, or as far as you can, and to move further away if the seal wakes to look straight at you or heads for the water.
  - q: How far should I stay from elk or bears in a US national park?
    a: The National Park Service says many parks require 25 yards from most wildlife and 100 yards from predators like bears and wolves. Rocky Mountain National Park asks for at least 75 feet from elk. Each park sets its own rules, so check before you go.
  - q: Is it ever all right to feed wild animals?
    a: No. The Countryside Code says feeding can harm them, and in US national parks it is illegal.
