  name: Bears and the salmon run at Brooks Falls
  type: living
  place: Brooks Camp, Katmai National Park and Preserve, Alaska
  country: USA
  continent: north-america
  month: [7]
  see: [own]
  see_note: Everyone must check in at the Brooks Camp Visitor Center first. Bears fishing for salmon can be watched from three viewing platforms along the river.
  note: The park says bears fish at Brooks Falls and in the lower Brooks River throughout July, and in some years a few still fish at the falls in September and October. Weather and bears can delay floatplane arrivals and departures.
