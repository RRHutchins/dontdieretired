  - {label: 'NASA: NASA, NOAA say the Sun reaches maximum phase in 11-year solar cycle (15 October 2024)', url: 'https://science.nasa.gov/science-research/heliophysics/nasa-noaa-sun-reaches-maximum-phase-in-11-year-solar-cycle/', checked: '2026-11-20'}
