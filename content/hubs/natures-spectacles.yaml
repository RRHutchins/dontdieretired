- slug: northern-lights-when-and-where
  title: 'The northern lights: when and where to see them'
  short: Northern lights
  seo_title: 'Northern lights: when and where to see them, from the UK and Alaska to Lapland'
  description: When and where to see the northern lights, from Scotland and northern England to Norway, Iceland, Lapland, Alaska and Canada, how the UK alerts work, and what helps your chances.
  standfirst: "The aurora needs three things to line up: activity on the Sun, a clear sky and real darkness. Here is when and where your odds are best, from the UK to the Arctic, taken from the official forecasters and tourism bodies."
  detail:
  - h: What you need on the night
    p:
    - "The official forecasters and tourism bodies agree on the basics. You need a clear sky, or at least gaps in the cloud. You need darkness, away from street lights and towns. And you need to look north: AuroraWatch UK, run by Lancaster University, asks for \"a good, unobstructed view of the northern horizon, preferably from a height (e.g. a hill)\"."
    - The Met Office says green is the most common colour. The Royal Observatory Greenwich explains that green comes from oxygen, while hints of purple, blue or pink come from nitrogen.
    - The US Space Weather Prediction Center (NOAA) says a full moon dims how bright the aurora looks, though not how bright it really is.
  - h: The best time of night and of year
    p:
    - AuroraWatch UK says that, statistically, the best time to see an aurora is between 10pm and midnight. NOAA's Space Weather Prediction Center gives a wider window, usually within an hour or two of midnight, between 10pm and 2am local time.
    - NOAA says the best seasons are around the spring and autumn equinoxes. Visit Norway says that, statistically, activity is highest in March and April and in September and October.
    table:
      head: [Where, Season]
      rows:
      - [Norway, 'September to April in northern Norway, and sometimes across the whole country (Visit Norway)']
      - [Iceland, 'September to April, during the winter (Visit Iceland)']
      - [Finland, 'End of August to April in Lapland and northern Lakeland (Visit Finland)']
      - [UK, 'Any time it is dark enough; follow the AuroraWatch UK and Met Office alerts (below)']
      - [Sweden, 'September to late March in Arctic Sweden, sometimes into early April (Visit Sweden)']
      - [Alaska, 'Late August to late April (Travel Alaska); 21 August to 21 April in Fairbanks (Explore Fairbanks)']
      - [Canada's Northwest Territories, 'Mid August to the end of September, and mid November to early April (Spectacular NWT)']
  - h: Seeing it from the UK
    p:
    - The Met Office says the aurora is sometimes seen as far south as "Scotland and Northern England/Ireland" when skies are clear. The Royal Observatory Greenwich says it has very occasionally been seen as far south as Cornwall and Brighton, and AuroraWatch UK says that generally, the further north you are in the UK, the better your chances.
    - "AuroraWatch UK measures the Earth's magnetic field with magnetometers and sends alerts in four colours. Its alerts are real-time, not predictions:"
    table:
      head: [Alert, What AuroraWatch UK says it means]
      rows:
      - [Green, Aurora is unlikely to be visible by eye or camera from anywhere in the UK]
      - [Yellow, Aurora may be visible by eye from Scotland]
      - [Amber, 'Aurora is likely to be visible by eye from Scotland, northern England and Northern Ireland']
      - [Red, It is likely that aurora will be visible by eye and camera from anywhere in the UK]
    list:
    - AuroraWatch UK sends alerts on X (Twitter, @aurorawatchuk), on Facebook and through a Telegram channel; third-party phone apps also carry them.
    - The Met Office publishes a space weather forecast that says where and when you are likely to see an aurora.
    - The Met Office says almost anyone with a smartphone or digital camera can photograph an aurora.
  - h: Norway, Iceland, and Finnish and Swedish Lapland
    p:
    - NOAA puts the best viewing under an oval-shaped region between about 60 and 75 degrees north, which moves south when activity rises.
    - "Norway: Visit Norway advises finding a dark place preferably at least 150 metres from buildings and looking north."
    - "Iceland: Visit Iceland says there is no exact best time, that your chances are much better outside towns, especially away from the light of Reykjavík, and that you do not necessarily need a tour. The Icelandic Met Office (Veðurstofa Íslands) publishes an aurora forecast with a cloud-cover map and an activity scale from 0 to 9, and notes that even a low level can be beautiful."
    - "Finland: Visit Finland says that in autumn and spring the lights are, statistically, visible on every second clear night, and advises checking the weather forecast alongside the aurora forecast, because cloud blocks the view entirely. In late summer, a calm lake can reflect the display."
    - "Sweden: Visit Sweden says the lights show over Arctic Sweden from September to March, sometimes into early April, best between 6pm and 2am and usually most intense around 10 to 11pm. It calls Abisko National Park one of Sweden's most reliable spots, because the surrounding mountains often keep its skies clear when nearby areas are cloudy, and says the aurora is occasionally seen as far south as Skåne."
  - h: Seeing it from Alaska, Canada and the rest of the US
    p:
    - Travel Alaska, the state's official tourism site, gives the season as late August to late April, and says the Interior, Arctic and Southcentral regions are best for viewing, with Fairbanks in the Interior and bases such as Anchorage in Southcentral. It puts the prime viewing hours at 10pm to 2am and points to a statewide aurora forecast that looks 27 days ahead.
    - Explore Fairbanks says the city sits under the auroral oval, and that the aurora is visible there on average four nights out of five when the sky is clear and dark enough. It suggests staying at least three nights.
    - In Canada, Spectacular NWT, the Northwest Territories' tourism body, says the territory lies under the auroral oval, that its low humidity keeps the skies clear, and that the aurora shows on up to 240 nights a year, in two seasons, mid August to the end of September and mid November to early April.
    - For the rest of North America, NOAA's Space Weather Prediction Center publishes an experimental map of where the aurora is likely tonight and tomorrow night, and a 30-minute forecast that looks 30 to 90 minutes ahead; its experimental aurora dashboard puts the forecasts on one page. NOAA notes that a bright aurora can be seen from as much as 1,000 km (about 620 miles) away, so it does not need to be overhead. NOAA removed the "view line" from the tonight-and-tomorrow map in May 2026, so older advice to check the view line is out of date.
  - h: Is now a good time?
    p:
    - The Sun's activity rises and falls over a cycle of about 11 years. The Royal Observatory Greenwich says the Sun entered the peak of that cycle in late 2024, and that a peak usually lasts one to two years. NASA added that fairly significant storms are often still seen as the cycle declines, though less often.
    - The Royal Observatory also says aurorae can happen at any time, whatever the Sun is doing, so a clear dark night and an alert matter more than the year.
  faq:
  - q: Can you see the northern lights in England?
    a: Sometimes. The Met Office says they are sometimes seen from northern England when skies are clear, and the Royal Observatory says they have very occasionally been seen as far south as Cornwall and Brighton. An amber or red AuroraWatch UK alert is the sign to look.
  - q: What time of night is best?
    a: AuroraWatch UK says the best time is statistically between 10pm and midnight. NOAA gives 10pm to 2am local time.
  - q: Which months are best for a trip to Norway, Iceland or Lapland?
    a: Visit Norway and Visit Iceland give September to April, and Visit Finland the end of August to April. NOAA says activity tends to be highest around the spring and autumn equinoxes, and Visit Norway gives March and April and September and October.
  - q: Can you see the northern lights from the US or Canada?
    a: Yes. Travel Alaska gives late August to late April, with Fairbanks among the best places, and Spectacular NWT gives mid August to the end of September and mid November to early April in Canada's Northwest Territories. Farther south, NOAA's Space Weather Prediction Center publishes a forecast map for tonight and tomorrow night over North America.
  - q: Do I need a tour?
    a: Not necessarily. Visit Iceland says you do not need one; what matters is getting away from town lights on a clear night.
