  month: [11]
  when: Mid-November (in 2026, active 6 to 30 November and peaking overnight on 17 to 18 November)
  see: [own]
  see_note: No binoculars or telescope are needed. Find a safe spot away from street lights and other light pollution.
  note: The Leonids come from debris left by Comet 55P/Tempel-Tuttle, which hits the atmosphere at up to 70 km a second. Royal Museums Greenwich describes fast, bright meteors with fine trains and gives a peak rate of about 10 to 15 an hour.
