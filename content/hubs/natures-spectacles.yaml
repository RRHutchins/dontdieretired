- slug: what-to-see-when
  title: "What to see when: nature's spectacles month by month"
  short: Month by month
  seo_title: "Nature's spectacles by month: what to see and when"
  description: Northern lights, meteor showers, migrations, whale seasons, blossom and fall color, listed under the months the official pages give, with the link to each page.
  standfirst: Pick a month and see which spectacles the official pages say are usually on then, from the aurora season to puffins, whales, blossom and meteor showers.
  by_month: true
  detail:
  - h: How to use this list
    p:
    - Each spectacle appears under every month that its official page gives as its usual season, so a long season, such as the northern lights in Svalbard (late September to mid March), shows up in many months. The months come from those pages, and nature does not keep to a timetable, so they are a guide to when to plan, not a promise.
    - Tap a name to see its full entry in our finder, with how you see it, what stands out and the official page. Check that page before you book, because seasons, opening times and booking rules change.
    - "Some pages give a season in words rather than months, such as \"winter\" or \"the rainy season\": those are listed at the end."
  faq:
  - q: Why is something listed in a month when I have heard it peaks later?
    a: We list the months the official page gives, and many give the whole season, not only the peak. The entry in the finder says more where the page does.
  - q: Are one-off events such as eclipses on this list?
    a: Yes, under their month, with the date in words. The total solar eclipse of 2 August 2027 is under August; our eclipse guide says how to watch it safely.
