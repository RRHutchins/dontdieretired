guides:
- slug: 2027-total-solar-eclipse
  title: How to see the 2027 total solar eclipse safely, and where
  short: The 2027 eclipse
  seo_title: 'Total solar eclipse 2 August 2027: where to see it and how to stay safe'
  description: Where the 2 August 2027 total solar eclipse can be seen in Spain, Gibraltar and North Africa, how long totality lasts, and how to watch it without harming your eyes.
  standfirst: On 2 August 2027 the Moon covers the Sun across southern Spain, Gibraltar and North Africa. Here is where to stand, how long it lasts, and how to protect your eyes.
  detail:
  - h: What happens on 2 August 2027
    p:
    - NASA says the total eclipse will be visible in southern Spain, North Africa (including Morocco, Algeria, Tunisia, Libya and Egypt), Saudi Arabia and Yemen. A partial eclipse will be seen across most of Europe and much of Africa and the Middle East.
    - At the point of greatest eclipse, 25.5°N 33.2°E at 10:07 UT, NASA gives 6 minutes 23 seconds of totality, with the Sun 82° above the horizon and the path of totality 258 km wide.
  - h: Where to see totality in Spain and Gibraltar
    p:
    - "Spain's National Geographic Institute (IGN) says the band of totality crosses the Strait of Gibraltar from west to east, covering Ceuta and Melilla, almost all of Cádiz province, part of Málaga province and the far south of Granada and Almería provinces. It happens in the morning, at around 10:50."
    - The Government of Gibraltar says Gibraltar will see a total eclipse that morning and expects it to bring many visitors, "possibly in the thousands".
    table:
      head: [Place, Totality begins (local time), How long it lasts]
      rows:
      - [Ceuta, '10:45', 4 minutes 48 seconds (the longest in Spain)]
      - [Melilla, '10:48', 4 minutes 34 seconds]
      - [Cádiz, '10:45', 2 minutes 54 seconds]
      - [Málaga, '10:48', 1 minute 48 seconds]
  - h: Totality times in Cádiz, Málaga and Granada
    p:
    - "The IGN's eclipse site lists times for each town in the path. Here are some of them, in local time on 2 August 2027. The last column is our own count from the IGN's start and end times; the IGN does not print a length. The partial phases begin at about 9.40am and end at about noon."
    table:
      head: [Town, Totality begins, Totality ends, How long (our count)]
      rows:
      - ['Tarifa (Cádiz)', '10:45:00', '10:49:38', 4 min 38 s]
      - ['Algeciras (Cádiz)', '10:45:19', '10:49:45', 4 min 26 s]
      - ['La Línea de la Concepción (Cádiz)', '10:45:28', '10:49:51', 4 min 23 s]
      - ['Barbate (Cádiz)', '10:44:53', '10:49:08', 4 min 15 s]
      - ['Vejer de la Frontera (Cádiz)', '10:44:56', '10:49:01', 4 min 5 s]
      - ['Conil de la Frontera (Cádiz)', '10:44:51', '10:48:51', 4 min]
      - ['Jerez de la Frontera (Cádiz)', '10:46:17', '10:47:38', 1 min 21 s]
      - ['Estepona (Málaga)', '10:46:11', '10:49:47', 3 min 36 s]
      - ['Marbella (Málaga)', '10:46:41', '10:49:57', 3 min 16 s]
      - ['Fuengirola (Málaga)', '10:47:03', '10:50:13', 3 min 10 s]
      - ['Torremolinos (Málaga)', '10:47:29', '10:50:09', 2 min 40 s]
      - ['Ronda (Málaga)', '10:47:24', '10:48:42', 1 min 18 s]
      - ['Nerja (Málaga)', '10:48:46', '10:50:25', 1 min 39 s]
      - ['Motril (Granada)', '10:49:11', '10:50:52', 1 min 41 s]
    after: "Granada city, Huelva and Madrid are outside the path: the IGN gives them only a partial eclipse (in Madrid the Sun is 85% covered, at 10:51)."
  - h: Weather, heat and getting there
    p:
    - The IGN's weather page says the path of totality in Spain has a low chance of cloud in August, slightly higher in western Cádiz. Its map is an average for August from 2001 to 2017, not a forecast; it suggests checking the forecasts from AEMET, Spain's state weather agency, in the days before.
    - "Spain's Ministry of Health has assessed the risks of the eclipses of 2026 to 2028. It notes that two of the three fall in August, when high temperatures matter, and that time in the sun can bring heatstroke, dehydration and sunburn. It also warns of traffic accidents and congestion."
    - "The IGN's practical advice: do not travel on the day of the eclipse, especially afterwards; set off in good time to avoid jams; avoid improvised trips, especially in busy tourist areas; and choose a viewing spot near a main road. Andalusia's official tourism body advises booking accommodation and transport early."
    - "The NHS says to stay in the shade between 11am and 3pm in hot weather and to drink plenty of cold drinks; the eclipse's partial phase runs to about noon, so bring shade and water for the whole morning. The CDC says heatstroke is a medical emergency: get medical help immediately."
  - h: What you will see in totality
    p:
    - "NASA describes the sequence. Just before totality, Baily's beads appear: sunlight streaming through valleys on the Moon's edge. Then the diamond ring, a last bright point of Sun. In totality the sky darkens as if at dawn or dusk, the Sun's outer atmosphere, the corona, shows as streams of white light, and you may see bright planets or stars. NASA says the air temperature drops, by about 5°C (10°F) depending on humidity and cloud, and you may see a sunset glow all round the horizon."
    - NASA's reminder at the end of totality is to put your eclipse glasses back on before the bright Sun returns.
  - h: Seeing it from the US
    p:
    - NASA says the 2027 eclipse is partial in the United States, and only in northern Maine (it is also partial in eastern Canada). NASA lists totality in southern Spain, North Africa, Saudi Arabia and Yemen, and the Government of Gibraltar says Gibraltar is in the path too. NASA's eclipse FAQ says the next total solar eclipse in the contiguous US will be in 2044.
  - h: Seeing it from the UK
    p:
    - The UK sees only a partial eclipse. The Royal Observatory Greenwich says it will begin at 9.03am BST in London. The same eye rules apply all the way through, because no part of the UK sees totality.
  - h: Protecting your eyes
    list:
    - Never look at the Sun directly without proper protection. NASA says safe solar viewers are thousands of times darker than sunglasses and should meet the ISO 12312-2 international standard. Ordinary sunglasses, however dark, are not safe.
    - "The only time it is safe to look with the naked eye is totality, when the Moon completely covers the Sun's bright face. NASA's rule: as soon as you see even a little of the bright Sun again, put your eclipse glasses back on."
    - Never look through binoculars, a camera or a telescope while wearing eclipse glasses. A solar filter must be fitted to the front of the optics.
    - The Royal Observatory says eclipse glasses must be "the real deal, not 3D glasses or anything similar". The Royal Astronomical Society says old CE-marked eclipse glasses may be safe only if they were stored safely and are undamaged; check for tiny holes or wrinkles in the coating.
    - Pinhole projection lets you watch the partial phases without looking at the Sun at all. NASA's warning: do not look at the Sun through the pinhole.
  faq:
  - q: Can I look at the eclipse without glasses?
    a: Only during totality, when the Moon completely covers the Sun's bright face, and only if you are inside the path of totality. Put your eclipse glasses back on as soon as any bright Sun reappears. Outside the path, you need protection the whole time.
  - q: How long does totality last?
    a: It depends on where you stand. The IGN gives 4 minutes 48 seconds in Ceuta and 2 minutes 54 seconds in Cádiz; NASA gives 6 minutes 23 seconds at the point of greatest eclipse.
  - q: Which of the towns listed here gets the longest totality?
    a: Of the towns in the IGN's tables that we list, Tarifa has the longest, about 4 minutes 38 seconds by our count from the IGN's times (10:45:00 to 10:49:38 local time). Ceuta, across the strait, has 4 minutes 48 seconds.
  - q: Will the US see the 2027 eclipse?
    a: Only as a partial eclipse, and only in northern Maine, according to NASA. The next total solar eclipse in the contiguous US is in 2044.
  - q: Will the UK see a total eclipse?
    a: No. The UK sees a partial eclipse, starting at 9.03am BST in London according to the Royal Observatory Greenwich, so eclipse glasses are needed throughout.
  kit:
  - name: Eclipse glasses
    why: check the packaging says ISO 12312-2, and that the film has no holes, scratches or wrinkles
    url: https://www.amazon.co.uk/s?k=eclipse+glasses+iso+12312-2
  - name: Solar filter for a camera or binoculars
    why: it must fit securely over the front of the lens, never the eyepiece
    url: https://www.amazon.co.uk/s?k=solar+filter+camera+lens
