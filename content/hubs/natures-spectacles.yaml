- id: svalbard-polar-night-aurora
  name: Northern lights in the Svalbard polar night
  type: sky
  place: Longyearbyen, Svalbard
  country: Norway
  continent: europe
  month: [9, 10, 11, 12, 1, 2, 3]
  when: Late September to mid March, as Visit Svalbard gives it. The polar night runs from November 14 to January 29.
