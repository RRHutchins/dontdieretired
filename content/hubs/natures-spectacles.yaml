- slug: photographing-the-night-sky
  title: How to photograph the night sky
  short: Night sky photography
  seo_title: 'How to photograph the night sky: stars, star trails, the Moon and the aurora'
  description: Simple camera and phone settings for stars, star trails and the Moon, how to focus in the dark, where to go and how to keep your eyes and kit safe, from NASA, the National Park Service and Royal Museums Greenwich.
  standfirst: "You do not need an expensive camera to start. A tripod, a dark place and a few settings you can learn in daylight will get you your first starry sky. Here is how, taken from NASA, the US National Park Service and the astronomers at Royal Museums Greenwich."
  detail:
  - h: What you need
    p:
    - "Royal Museums Greenwich (RMG) advises starting simple with a camera on a tripod and not spending heavily on equipment at first. As one photographer told it: \"You don't need professional cameras and equipment to do astrophotography, just start with what you have.\""
    - "The National Park Service's guide for Acadia National Park lists a digital camera with manual settings, a wide-angle lens and a sturdy tripod. RMG's star trails guide adds a remote or cable release, and suggests a lens of 28 mm or wider to take in as much sky and foreground as possible."
    - "Phones work too. NASA's Guide to Smartphone Astrophotography suggests putting the phone on a tripod, setting a 5-second delay so you do not shake it, and starting with a 10-second exposure at ISO 400."
  - h: Settings to start with
    p:
    - These are starting points from the official pages, not fixed rules. Take a test shot, zoom in on the screen to check the stars are sharp, then adjust.
    table:
      head: [Setting, Stars and the Milky Way (NPS), Star trails (RMG)]
      rows:
      - [Mode, Manual, Manual]
      - [Aperture, 'The widest your lens allows; f/1.4 to f/3.5 works well', f/2 to f/9]
      - [ISO, 'Start at 400 and go higher if needed', 200 to 600]
      - [Shutter, '10 to 20 seconds; leave it open too long and the stars start to trail', '30 seconds a frame, many frames in a row']
      - [Focus, 'Manual, on a distant bright light such as a star or a streetlight', 'Manual, set to infinity']
      - [Trigger, 'A 2 to 5 second self-timer or a remote', A remote or cable release]
    after: The NPS guide also suggests leaving white balance on auto. RMG notes that a lower ISO gives less noise but shows fewer faint stars.
  - h: Focusing in the dark
    p:
    - The NPS says to focus manually on a distant bright light, such as a star, a streetlight or a house. RMG's photographers suggest learning to focus by hand in daylight first, and getting to know which button does what before you go out, because you will be doing it in the dark.
  - h: Star trails
    p:
    - "RMG's guide to star trails points the camera at the celestial pole, north in the northern hemisphere, for circles, or east or west for straight lines. Rather than one exposure of half an hour or more, which adds noise, it recommends taking many short ones, \"100 or more shots at 30 seconds each\", and combining them afterward with free stacking software."
    - "It suggests starting a good two hours after sunset, checking the moonrise time and the forecast, and putting trees, rocks or buildings in the foreground. If you want to light the foreground with a flashlight (torch), do it at the very start or end of the sequence, so there is no gap in the trails."
  - h: The Moon
    p:
    - "The Moon is bright, so it needs the opposite of star settings. RMG's guide suggests a telephoto lens of about 250 mm to start, a low ISO, and slightly underexposing \"to prevent bright details burning out\"; with an SLR on a long telescope and a tripod, a shutter speed of 1/30 of a second is fine. NASA's smartphone guide notes that a phone held behind the eyepiece of a modest telescope, or even binoculars, can do very well."
  - h: Where and when to go
    p:
    - "Darkness matters most. NASA's smartphone guide calls location \"a huge factor\", though it also says not to be discouraged if you cannot travel to a dark site. The NPS suggests looking up a dark sky map, and RMG's photographers advise scouting a dark site ahead of time and choosing clear, still nights."
    - "Give your eyes time. Forestry and Land Scotland, which runs Galloway International Dark Sky Park, advises giving your eyes 30 minutes to adjust, using a red light or a red filter on your flashlight, and checking the Moon's phase: nights around the new moon show the most stars."
    - For the northern lights, our northern lights guide covers the alerts and the best places.
  - h: Staying safe
    list:
    - "Never point a camera, phone, binoculars or telescope at the Sun without a proper solar filter. NASA says viewing any part of the bright Sun through a camera lens, binoculars or a telescope without a special-purpose solar filter secured over the front of the optics \"will instantly cause severe eye injury\", and that eclipse glasses must not be used with them: those need different filters. Ask an astronomer before using a solar filter on any optics."
    - "For your eyes, NASA's one exception is totality in a total solar eclipse, when the Moon completely hides the Sun's bright face; put your eclipse glasses back on as soon as any bright Sun reappears. That exception is about your eyes: NASA does not say cameras or other optics are safe unfiltered then. See our guide to the 2027 eclipse."
    - NASA's smartphone guide also warns that pointing a phone at the Sun unfiltered can damage its sensitive light meters.
    - Night shoots are often remote. RMG's photographers advise staying aware of your surroundings, carrying a head torch with a red light and wearing warm clothes,.
  - h: Keep it honest
    p:
    - "One of RMG's photographers advises against pasting the Milky Way or a giant Moon into a landscape."
  faq:
  - q: What settings should I use to photograph stars?
    a: "The NPS suggests manual mode, the widest aperture your lens allows (f/1.4 to f/3.5 works well), ISO 400 to start and a shutter of 10 to 20 seconds, on a tripod with a self-timer. Focus by hand on a distant bright light."
  - q: Can I photograph the stars with my phone?
    a: Yes. NASA's smartphone guide suggests a tripod, a 5-second delay, a 10-second exposure and ISO 400 as a first try, as dark a site as you can reach, and a red flashlight to see what you are doing.
  - q: How long should a star trail exposure be?
    a: Royal Museums Greenwich recommends many 30-second shots, 100 or more, combined afterward, instead of one very long exposure, which adds noise.
  - q: Can I photograph the Sun or a solar eclipse?
    a: Only with a proper solar filter fitted over the front of the lens. NASA says eclipse glasses must not be used with cameras, binoculars or telescopes. NASA says the one time you can look at the Sun with your own eyes is during totality.
