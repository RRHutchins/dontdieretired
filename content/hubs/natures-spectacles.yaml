- id: perseid-meteor-shower
  name: Perseid meteor shower
  type: sky
  place: Anywhere away from street lights (the Royal Observatory's guide is written for the UK)
  country: UK
  continent: europe
  month: [7, 8]
  when: Active 17 July to 24 August; peak overnight 12 to 13 August 2027
  see: [own]
  see_note: Watch between midnight and 5.30am from somewhere away from street lights, and give your eyes at least 15 minutes to adjust. Binoculars and telescopes are not needed; they narrow the patch of sky you see.
  note: The meteors are debris from comet 109P/Swift-Tuttle. The Royal Observatory notes a bright waxing gibbous Moon at the 2027 peak.
  link: {label: 'Royal Observatory Greenwich: Perseid meteor shower guide', url: 'https://www.rmg.co.uk/stories/space-astronomy/perseid-meteor-shower-guide-uk-when-where-to-see', checked: '2026-11-19'}
  more:
  - {label: 'Royal Observatory Greenwich: meteor shower calendar 2026 and 2027', url: 'https://www.rmg.co.uk/stories/space-astronomy/meteor-shower-guide-2026', checked: '2026-11-19'}
- id: geminid-meteor-shower
  name: Geminid meteor shower
  type: sky
  place: Anywhere away from street lights (the Royal Observatory's guide is written for the UK)
  country: UK
  continent: europe
  month: [12]
  when: Active 4 to 20 December; peak on 14 December 2026
  see: [own]
  see_note: Find a safe spot away from street lights and look a little away from the radiant, the point the meteors seem to come from, rather than straight at it.
  note: The Royal Observatory gives a peak rate of up to 120 meteors an hour, though far fewer are seen under light-polluted skies. The Geminids come from the asteroid 3200 Phaethon.
  link: {label: 'Royal Observatory Greenwich: Geminid meteor shower 2026', url: 'https://www.rmg.co.uk/stories/space-astronomy/geminid-meteor-shower-uk-dates-how-to-see', checked: '2026-11-19'}
# ---------- Wildlife and living light ----------
- id: starling-murmurations
  name: Starling murmurations
  type: living
  place: Large roosts in reedbeds, on piers and on coastal marshes, such as RSPB Ham Wall
  country: UK
  continent: europe
  month: [11, 12, 1, 2]
  see: [own]
  see_note: Go to a roost at dusk, when the flocks gather. At RSPB Ham Wall the reserve asks you to arrive by 3.30pm at the latest, ring its Starling hotline to find where the birds roosted the night before, and bring a torch for the walk back.
  note: The RSPB calls the starlings' winter display "one of nature's most spectacular shows". Hundreds, and sometimes thousands, of birds gather as the sun goes down.
  link: {label: 'RSPB: starling', url: 'https://www.rspb.org.uk/birds-and-wildlife/starling', checked: '2026-11-19'}
  more:
