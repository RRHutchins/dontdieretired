  see: [own]
  see_note: NASA says you need no special equipment to watch a lunar eclipse, just a line of sight to the Moon. Binoculars or a telescope enhance the view, and a dark spot away from bright lights makes it more dramatic.
  note: NASA's catalog gives greatest eclipse at 16:52 UT and 1 hour 11 minutes of totality, with the Moon overhead at 23°N, 108°E. The Moon looks red because Earth blocks most of the Sun's light, and the light that still reaches it has passed through Earth's atmosphere. NASA's catalog lists no total lunar eclipse in 2027; the next after this one are on 26 June 2029 (the Americas, Europe, Africa and the Middle East) and 20 December 2029.
  link: {label: 'NASA: lunar eclipses 2021 to 2030', url: 'https://eclipse.gsfc.nasa.gov/LEdecade/LEdecade2021.html', checked: '2026-11-24'}
  more:
