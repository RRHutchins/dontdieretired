  note: Discover Puerto Rico says swimming is not allowed in the bio bays, asks visitors not to use bug spray or sunscreen, and asks them not to touch or take anything from the water. Discover Puerto Rico says Guinness World Records recognised Mosquito Bay in 2006 as the brightest bioluminescent bay in the world.
