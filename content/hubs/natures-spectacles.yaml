- id: wadden-sea-harbor-seals
  name: Harbor seals of the Wadden Sea
  type: living
  place: Sandbanks of the German Wadden Sea national parks, for example by boat from Wilhelmshaven to the seal banks of the Jadebusen
  country: Germany
  continent: europe
  month: [5, 6, 7, 8, 9]
  when: Seals gather on the sandbanks May to September; pups are born early June to early July
  see: [boat]
  see_note: Watch from a boat trip to the seal banks, such as the national park trips run with the Wilhelmshaven World Heritage visitor center. If you find a lone pup on the beach, do not touch it and keep at least 300 meters away so its mother can find it.
  note: The national parks say the pups are born at low tide on sandbanks that dry out, and are suckled only at low water, in several small feeds. The harbor seal population has shown a steady upward trend for more than 40 years.
  link: {label: 'Nationalpark Wattenmeer: harbor seal (German)', url: 'https://www.nationalpark-wattenmeer.de/wissensbeitrag/seehund/', checked: '2026-11-24'}
