description: Where and when to see the 2027 total solar eclipse, the northern lights, meteor showers, starling murmurations, the Severn bore, fireflies, geysers and more, from official sources.
lead: Many of nature's great shows happen on a timetable. Here is when and where to see them, and how, checked against the official page for each one.
intro:
- On Monday 2 August 2027 the Moon will cover the Sun completely along a track across southern Spain, Gibraltar and North Africa. Other spectacles come round every year, if you know the month and the place, from the northern lights to starlings over a reedbed at dusk.
- Filter the list below by region, kind, month or how you see it. Every entry links to an official page (a national park, an observatory, a government or an official tourism body), opened on the date shown. Seasons shift with the weather, so check the official page before you travel.
