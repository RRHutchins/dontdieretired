  type: living
  place: Westman Islands, Látrabjarg, Borgarfjörður Eystri and other coasts
  country: Iceland
  continent: europe
  month: [5, 6, 7, 8]
  when: May to mid August, as Visit Iceland gives it. The birds usually arrive in late April or early May and most leave by mid to late August.
  see: [own, boat]
  see_note: Visit Iceland says Dyrhólaey and Hafnarhólmi in Borgarfjörður Eystri can be reached without a boat, and Hafnarhólmi has boardwalks and viewing platforms. Boat tours run from Reykjavík harbor, Stykkishólmur and Djúpivogur. Stay at least 3.3 feet (1 meter) from cliff edges near a colony, move slowly and quietly, and never touch or feed the birds. Burrows are protected by law in the breeding season.
