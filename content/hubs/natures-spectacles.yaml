- id: galloway-dark-sky-park
  name: Stargazing in Galloway International Dark Sky Park
  type: sky
  place: Galloway Forest Park, Dumfries and Galloway, Scotland, such as Kirroughtree visitor hub, Clatteringshaws Loch, Stroan Loch and Glentrool
  country: UK
  continent: europe
  when: Any clear night; nights around the new moon show the most stars
  see: [own]
  see_note: You do not need a tour. The visitor hub at Kirroughtree has information points to help you pick out constellations and planets. Give your eyes 30 minutes to adjust, use a red light or a red filter on your flashlight (torch), check the moon's phase and the cloud forecast before you go, and take a chair.
  note: In 2009 Galloway became one of the first places in the world named an International Dark Sky Park, and it holds Gold Tier status. On a clear night more than 7,000 stars and planets can be seen with the naked eye, the Milky Way is usually easy to see, and you can pick out the Andromeda galaxy, which Forestry and Land Scotland calls the most distant thing you can see with your naked eye.
  activity: dark-sky-place
  link: {label: 'Forestry and Land Scotland: Galloway International Dark Sky Park', url: 'https://forestryandland.gov.scot/visit/forest-parks/galloway-forest-park/galloway-international-dark-sky-park', checked: '2026-11-22'}
