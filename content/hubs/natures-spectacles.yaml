about: We list a spectacle only after opening an official page about it (a national park, government body, observatory or official tourism body), and every fact here comes from that page or another official page linked beside it. Seasons, dates and access rules change, so the official page is the one to trust. Being listed does not mean any of these bodies endorses this site.
safety: "Eclipses: never look at the Sun without proper eclipse glasses (NASA says they should meet the ISO 12312-2 standard) or through binoculars, a camera or a telescope without a solar filter on the front. The only safe time to look with the naked eye is totality, when the Moon completely covers the Sun's bright face; put the glasses back on as soon as any bright Sun reappears. Sunglasses, however dark, are not safe. Rivers, coasts and wild animals: follow the site's own safety advice and keep well back."
