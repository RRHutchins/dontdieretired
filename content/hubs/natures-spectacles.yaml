  - name: Binoculars
    why: check the magnification and the weight in the listing; you may hold them up for a long time
    url: https://www.amazon.co.uk/s?k=binoculars+wildlife
  - name: Camera with a zoom lens or a phone telephoto adaptor
    why: check the zoom range in the listing, so you can stay back and still get the picture
    url: https://www.amazon.co.uk/s?k=camera+zoom+lens+wildlife
  - name: Short dog lead
    why: for places where a lead is required; check the length if a park sets one
