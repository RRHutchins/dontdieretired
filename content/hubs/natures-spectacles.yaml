# ---------- Water and rock ----------
- id: severn-bore
  name: The Severn bore
  type: earth
  place: River Severn estuary, Gloucestershire, for example from the riverbank at Newnham-on-Severn or the footpath at Minsterworth
  country: UK
  continent: europe
  see: [own]
  see_note: Check a bore timetable and arrive early; predicted times are only an estimate and the bore can be 10 minutes early or late. Stand well back, because the wave can swamp the bank, and the water is icy cold with a fierce current.
  note: The bore is a surge wave that travels more than 25 miles up the estuary from Awre to Gloucester. Bores are graded from 1* to 5*, and the strongest come with the spring and autumn tides.
  link: {label: 'Visit the Forest of Dean and Wye Valley: the Severn Bore', url: 'https://www.visitdeanwye.co.uk/business-directory/the-severn-bore', checked: '2026-11-19'}
- id: strokkur-geyser
  name: Strokkur geyser
  type: earth
  place: Geysir geothermal area, Haukadalur valley, on the Golden Circle
  country: Iceland
  continent: europe
  see: [own]
  see_note: Stop at the Geysir geothermal area on the Golden Circle and wait; Strokkur erupts every 10 minutes or so.
  note: Its column of boiling water can reach as high as 30 metres. The Great Geysir next to it has been dormant since 1916, says Visit South Iceland.
  link: {label: 'Visit South Iceland: Geysir geothermal area', url: 'https://www.south.is/en/place/geysir-geothermal-area', checked: '2026-11-19'}
- id: old-faithful
  name: Old Faithful
  type: earth
  place: Upper Geyser Basin, Yellowstone National Park, Wyoming
  country: USA
  continent: north-america
  see: [own]
  see_note: Check the next predicted eruption at the Old Faithful Visitor Education Center, then watch from the viewing area or the boardwalks.
  note: The National Park Service gives the median interval, as of January 2025, as 102 minutes, plus or minus 10. Eruptions last 1½ to 5 minutes and average 130 feet (40 m) high.
  link: {label: 'National Park Service: Old Faithful', url: 'https://home.nps.gov/yell/planyourvisit/exploreoldfaithful.htm', checked: '2026-11-19'}
