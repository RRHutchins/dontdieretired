  link: {label: 'Visit Norway: the best time to see the northern lights', url: 'https://www.visitnorway.com/things-to-do/nature-attractions/northern-lights/best-time-to-see/', checked: '2026-11-19'}
- id: northern-lights-iceland
  name: Northern lights in Iceland
  type: sky
  place: Anywhere dark in Iceland, away from artificial light
  country: Iceland
  continent: europe
  month: [9, 10, 11, 12, 1, 2, 3, 4]
