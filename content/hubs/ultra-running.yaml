  - {label: 'HOKA UTMB Mont-Blanc, Responsible mobility and the lottery boost', url: 'https://montblanc.utmb.world/get-involved/take-action/reduction-des-emissions-carbone-et-mobilite', checked: '2026-11-17'}
  - {label: 'UTMB World Series, The 2026 season', url: 'https://utmb.world/news/new-season-2026', checked: '2026-11-17'}
  - {label: 'Hardrock 100', url: 'https://hardrock100.com/', checked: '2026-11-17'}
