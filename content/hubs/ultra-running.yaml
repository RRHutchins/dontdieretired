- slug: under-100km
  title: Ultras under 100 km
  short: Under 100 km
  group: Distance
  filter: {band: u100}
  intro: [A race is listed here if one of its main distances is longer than a marathon and under 100 km. Many festivals also have longer races, so the distance line shows them all.]
- {slug: 100km-ultras, title: 'Ultras of 100 to 149 km', short: 100 to 149 km, group: Distance, filter: {band: 100k}}
- {slug: 100-mile-ultras, title: 100-mile ultras, short: About 100 miles, group: Distance, filter: {band: 100m}, intro: ['A race is listed here if one of its main distances is between 150 and 180 km, which takes in the classic 100 miles (161 km) and mountain courses a little shorter or longer.']}
- {slug: over-180km, title: Ultras over 180 km, short: Over 180 km, group: Distance, filter: {band: long}}
- slug: stage-races
  title: Multi-day stage ultras
  short: Stage races
  group: Distance
  filter: {format: stage}
  intro: ['In a stage race the distance is split into daily stages, with a camp or a bed between them. What you must carry, and what the organisers carry for you, differs a lot from race to race, so read each kit list.']
- slug: open-entry
  title: Ultras with open entry
  short: Open entry
  group: How you get a place
  filter: {entry: open}
  intro: ['These races give places to whoever enters first, on the day entries open, until they are full. Some still ask for a qualifying race, so check the "Getting in" line.']
- slug: no-qualifier-needed
  title: Ultras with no qualifying race needed
  short: No qualifier needed
  group: How you get a place
  filter: {not_entry: qualifier}
  intro: ['Our notes from each organiser''s page do not show a qualifying race for these. Some still ask for a medical certificate, an age limit or an online account, so read the entry rules on each race page.']
- slug: ballot-ultras
  title: Ultras with a ballot or lottery
  short: Ballot or lottery
  group: How you get a place
  filter: {entry: ballot}
  intro: ['These races draw places by ballot or lottery, usually months ahead. The race page says when the draw happens and what you need before you apply.']
- slug: generous-time-limits
  title: Ultras with generous time limits
  short: Generous time limits
  group: Pace
  filter: {pace: slow}
  intro: ['A race is listed here if a time limit on its organizer''s page allows at least 12 minutes per km (about 19 minutes per mile) for one of its distances. We work that out from the stated limit and distance only: climb, heat, altitude and checkpoint cut-offs along the way can make the same limit much harder, so read each race page.']
