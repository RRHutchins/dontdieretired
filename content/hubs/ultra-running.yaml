- slug: crewing-and-pacing
  title: Crews and pacers in an ultra, and the rules that come with them
  short: Who may help you, where, and how
  seo_title: 'Ultra crew and pacer rules: what races allow'
  description: Where crews may meet you, when a pacer may join and what they must not carry, from the rules of Western States, Centurion, Lakeland and UTMB.
  standfirst: Some ultras let friends meet you at checkpoints and run the last miles beside you. Others ban outside help altogether. The rules differ a lot from race to race, and breaking them can cost you the finish.
  detail:
  - h: Crew, pacer, supporter
    p:
    - A crew is the people who meet you at agreed points with food, clothes and encouragement. A pacer is someone who runs with you for part of the course. Many races also have supporters who simply come to watch. Each race decides which of these it allows, and the runner answers for all of them. Western States puts it in capitals on its crew advice page - runners are held responsible for the actions of their crews and pacers.
    - So before you invite anyone, read three things on your race's own site - the rules, the crew or supporter instructions and the pacer rules. They are usually separate pages, and they change from year to year.
  - h: Four races, four sets of rules
    table:
      head: [Race, Crews, Pacers, What it says happens if you break the rules]
      rows:
      - [Western States 100 (California), Only at aid stations named as crew points in that year's participant guide, 'One at a time (with a few short stretches where friends may also run alongside), from Foresthill (mile 62) to the finish, or from Michigan Bluff (mile 56) if you leave after 8pm; pacers must be 18 or over', 'Parking against the instructions can get the car towed and the runner disqualified']
      - [Centurion South Downs Way 100 (England), 'Only at the points listed on the crew page, with one crew vehicle that shows a crew pass; no motorhomes', 'Not set out on the crew page; only one person, crew or pacer, may go inside the Washington hall', Help outside the permitted points means disqualification]
      - [Centurion Autumn 100 (England), 'Not allowed anywhere, and supporters may not visit the checkpoints', 'One pacer, on foot, from mile 75 to the finish', 'Being crewed means disqualification or a lifetime ban; pacing outside the last leg brings a one-hour penalty, disqualification or a ban']
      - [Lakeland 100 and 50 (England), 'Supporters may watch only at set points, must not enter checkpoint buildings, and some checkpoints are marked no spectating', 'Not allowed; the one exception is that 50 runners'' friends and family may join the first loop round the Dalemain estate', Entering restricted areas means disqualification with no appeal]
    after: Taken from each race's pages opened on 20 November 2026. Check your own year's version before race day.
  - h: What a pacer may not do
    p:
    - At Western States a pacer mostly keeps you company. Pacers may help fill bottles and restock at aid stations, but the pacer rules say they may not carry water, food, torches, shoes, clothing or other supplies for their runner, or give any other physical help. Carrying for your runner, known as muling, is "expressly forbidden". Pacers may carry their own food and supplies.
    - Pacers there must enter and leave each aid station with their runner, and may not run ahead into an aid station to speed up refuelling. If the runner drops out, the pacer may not carry on along the trail alone. Each runner is issued three pacer numbers, used one at a time at set change points.
    - Centurion's Autumn 100 is just as strict about the company. Its supporter page says that if your runner has a pacer, only that pacer may run with them, and that running with them even "just for a few minutes" counts as pacing.
  - h: What a crew should know
    p:
    - Parking and access are where crews most often get their runner into trouble. Western States allows one crew vehicle per runner at most aid stations, does not allow motorhomes into any aid station except Foresthill, and lists aid stations that crews cannot reach by car at all. Centurion's South Downs Way 100 allows one crew vehicle no bigger than a long-wheelbase van and tells crews never to park illegally or block the road.
    - At Western States, crews must stay within 200 yards of the aid station while they help their runner, and in Foresthill they may give help at one place only. The crew advice page warns that stopping or parking at the Highway 49 crossing risks the runner's disqualification.
    - UTMB Mont-Blanc's 2027 regulations say a runner can be penalised or disqualified when their supporters break the rules. Their penalty table for the OCC, MCC and ETC races gives 30 minutes for help or crewing outside the authorised zones and 10 minutes for each time a runner is accompanied outside the tolerance zones, and says a failure by supporters to follow the organisers' instructions on parking, access or restricted areas is a breach of the rules.
  - h: If your race allows neither
    p:
    - Plenty of good races are run with no crew and no pacer, and some runners prefer them. The aid stations do the crew's job, so read your race's aid station list and drop bag rules early. The Autumn 100 rules also forbid storing your own supplies along the trail, with a two-hour penalty, so everything you need comes from the aid stations, a drop bag the race allows, or your pack.
    - Your friends can still come. Ask the race where supporters are welcome, and point them at the finish.
  faq:
  - q: Can my pacer carry my water or food?
    a: Not at Western States, where muling is expressly forbidden and pacers may carry only their own supplies. Other races set their own rules, so read your race's pacer page.
  - q: Can a friend run with me for a few minutes?
    a: Only where your race allows pacers, and only on the stretch it allows. Centurion's Autumn 100 counts even a few minutes beside you as pacing, and Lakeland does not allow pacers at all, apart from friends and family joining 50 runners on the first loop round Dalemain.
  - q: How old must a pacer be?
    a: At Western States, 18 or over, with exceptions asked for in advance from the race director. Check your own race's rules.
