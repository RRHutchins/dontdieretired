guides:
- slug: kit-by-environment
  title: Ultra running kit for mountains, desert, winter and lowland trails
  short: What to carry, by environment
  seo_title: 'Ultramarathon kit list: mountain, desert, winter, trail'
  description: What race organisers make ultra runners carry in the Alps, the Sahara, a British winter and on lowland trails, and why each item is on the list.
  standfirst: The fastest way to learn what an ultra needs is to read the organisers' mandatory kit lists. They are written by the people who send out the rescue teams.
  detail:
  - h: Start with the race's own kit list
    p:
    - Almost every ultra publishes a list of what you must carry, and many check it. Centurion Running, which organises four 100-mile races in England, makes checks before, during and after its races and adds a one-hour penalty for each missing item. At UTMB Mont-Blanc you must carry the full list from start to finish, and race stewards can check it at any point.
    - The lists change from year to year (the Spine Race updated its summer gloves and insulated jacket rules in March 2026), so read the current version for your race and treat the guidance below as background.
  - h: The environments compared
    table:
      head: [Environment, What the organisers plan for, What the list adds, Races to look at]
      rows:
      - [Lowland trail and riverside, 'Rain, a night out on the path, getting cold when you slow down', 'Water for at least 1 litre, a waterproof jacket with sealed seams, a survival blanket, a whistle, a headtorch of at least 100 lumens, a charged phone', 'Thames Path 100, Autumn 100']
      - [Alpine mountain, 'Heat above 30°C (86°F), cold down to about -10°C (14°F) above 2,000 m, rain, hail or snow, one or two nights outside', 'Enough to wait safely for a rescue team in bad weather, carried for the whole race', 'UTMB, Lavaredo, Eiger Ultra Trail']
      - [High altitude, 'Several climate zones in one race, ice-cold streams, snowfields', Layers for the cold at height as well as the heat lower down, 'Hardrock 100, Leadville Trail 100']
      - [British winter, 'Long nights, wind and wet on open moorland, days without a bed', 'A sleeping bag, an insulated jacket, gloves to a set standard, navigation by GPS set to the British National Grid', Montane Winter Spine]
      - [Desert stage race, 'Carrying a week of food in the heat', 'Every meal for the stages (MDS suggests 10 to 12 meals, at least 2,000 kcal a day), with water handed out only at checkpoints and camp', 'Marathon des Sables, MDS 120']
  - h: Lowland trails and riverside 100s
    p:
    - Centurion's Thames Path 100 list is a good model for a first long ultra in Britain. Its compulsory items include bottles or a bladder holding at least 1 litre, a survival blanket of at least 1.4 by 2 metres, a waterproof jacket rated to at least 10,000 mm with sealed seams and a hood, a whistle, and a headtorch or main light of at least 100 lumens. For the Autumn 100, Centurion strongly recommends a paper map and a separate compass, not a phone.
    - The point of the list is what happens when you stop. A runner who sits down at 3am on a wet towpath cools quickly, and the jacket and blanket are what keep a slow night from becoming a medical one.
  - h: Mountains and the Alps
    p:
    - UTMB Mont-Blanc explains its rules plainly. At the end of August above 2,000 m, the temperature can fall to -10°C (14°F) and it can snow or hail, so your equipment must let you spend one or two nights on the route and wait for rescue in safe conditions. The organisers also publish extra items that are switched on when the forecast demands them, and each runner must bring those to the race too.
    - Two of UTMB's own tips are worth keeping for any mountain race. If you use your survival blanket, put it under your clothes rather than over them, and wrap your dry clothes in plastic inside your pack.
    - At altitude, Hardrock's organisers warn that the course passes through several climate zones and that runners will wade knee-deep, ice-cold streams and cross snowfields. Plan for winter at the top and summer at the bottom of the same day.
  - h: Winter ultras
    p:
    - The Montane Winter Spine runs 268 miles (431 km) up the Pennine Way in January, with a 156-hour limit. Its kit list is a separate document, which includes a sleeping bag, an insulated jacket and gloves that meet set standards. The organisers ask runners to set their GPS to the British National Grid so positions match British maps and mountain rescue.
    - The shorter Sprint North (43 miles, 18-hour limit) has only about four hours of daylight, which is a good way to find out how your kit copes in the dark before you try a longer race.
  - h: Desert stage races
    p:
    - In a Marathon des Sables race you carry all your food from the start. For the three-stage MDS 120 races, the organisers suggest planning for 10 to 12 meals with at least 2,000 kcal a day. Water is the one thing handed out, at checkpoints every 8 to 12 km and 5 litres at camp after each stage, for drinking, cooking and washing.
    - Every gram is carried for the whole week, so it is worth weighing your food and kit before you pack.
  - h: What we have not done
    p:
    - We have not tested any of this kit, and nothing on this page is a recommendation of a brand. The kit links below are searches on Amazon so you can compare items against your race's list. Check every item against the official list, which is the only one a kit check will accept.
  faq:
  - q: Do I need mandatory kit for a 50K?
    a: It depends on the race. Many shorter road and trail ultras have little or no compulsory kit, while mountain races such as those at UTMB Mont-Blanc set a basic list for every race. Read the rules for your race.
  - q: What waterproof jacket passes a kit check?
    a: Centurion asks for a jacket rated to at least 10,000 mm with sealed seams (and a hood for the Thames Path 100). Other races set their own standard, so check the wording for yours.
  - q: How much water do I need to carry?
    a: Centurion's lowland 100s ask for at least 1 litre. Mountain, hot and desert races may ask for more, or space the water stations further apart, so check your race.
  kit:
  - {name: Running vest or race pack, why: 'big enough for your race''s full list with water; try it packed, not empty', url: 'https://www.amazon.co.uk/s?k=trail+running+vest+12l'}
  - {name: Waterproof running jacket with taped seams, why: 'check the hydrostatic head (10,000 mm or more) and that the seams are sealed, as kit checks ask for both', url: 'https://www.amazon.co.uk/s?k=waterproof+running+jacket+taped+seams'}
  - {name: Headtorch, why: 'at least 100 lumens for many UK races; carry spare batteries or a power bank', url: 'https://www.amazon.co.uk/s?k=running+head+torch+rechargeable'}
  - {name: Survival blanket or bag, why: 'check the minimum size your race asks for (Centurion: 1.4 by 2 metres)', url: 'https://www.amazon.co.uk/s?k=emergency+survival+blanket'}
  - {name: Soft flasks, why: 'carry at least the volume your race asks for; soft flasks pack down as you drink', url: 'https://www.amazon.co.uk/s?k=soft+flask+500ml+running'}
  - {name: Trekking poles, why: 'useful on long mountain climbs; check your race allows them and practise with them first', url: 'https://www.amazon.co.uk/s?k=folding+trail+running+poles'}
  - {name: Desert gaiters, why: keep sand out of your shoes on desert stage races, url: 'https://www.amazon.co.uk/s?k=desert+running+gaiters+sand'}
