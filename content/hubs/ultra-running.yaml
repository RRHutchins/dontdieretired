  - {label: 'Ryan, Daly and Ryan, Exploring the nutrition strategies employed by ultra-endurance athletes to alleviate exercise-induced gastrointestinal symptoms: a systematic review, Nutrients, 2023', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC10610183/', checked: '2026-11-19'}
