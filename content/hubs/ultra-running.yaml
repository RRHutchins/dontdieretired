  - {label: 'Roberts and others, ACSM Expert Consensus Statement on Exertional Heat Illness (Current Sports Medicine Reports, 2023; copy hosted by KHSAA)', url: 'https://khsaa.org/common_documents/Sports%20Medicine/EHIPositionStatement//B-ACSM%20EHI%20Consensus%20Statement%202023.pdf', checked: '2026-11-22'}
