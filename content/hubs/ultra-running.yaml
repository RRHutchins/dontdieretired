- slug: running-vests
  title: Choosing a running vest for an ultra
  short: What your race's kit list asks you to carry, how to check a vest against it, and the vests one independent reviewer picks
  seo_title: 'Running vests for ultras: kit lists, fit and reviewers'' picks'
  description: How to choose a running vest for an ultra from your race's kit list (Lakeland, UTMB Mont-Blanc), what to check on fit and flasks, and the vests iRunFar's testers name in their November 2026 guide.
  standfirst: In most mountain and trail ultras the vest is what carries the kit list, and the kit is checked. Start from your race's list, then choose the vest that carries all of it comfortably; here is what two organizers ask for and what one independent review recommends.
  detail:
  - h: Start from your race's kit list
    p:
    - 'Your vest has to carry everything your race says you must have, from the start to the finish. The Montane Lakeland 50 and 100 kit page lists compulsory items including a fully waterproof jacket with a hood and taped seams, spare base layers sealed in a bag, a hat and gloves, a first aid kit, emergency food sealed in a bag, a head torch with spare batteries or a spare torch, a whistle, a fully charged phone, a survival blanket or bag, a solid plastic cup and a bottle or soft flask. Item 10 is simply "a back pack or similar to carry all the above."'
    - 'There is a kit check at Lakeland registration, and without the required kit you are not allowed to start. HOKA UTMB Mont-Blanc says you must carry its mandatory equipment for the whole race, start to finish, or be penalized, and that race stewards may check it at any time during the race.'
    - So write out your own race's list first, gather the actual items, and only then look at vests. The volume a maker quotes in liters is a guide; the test is whether your own kit fits with room for food and drink.
  - h: Two kit lists side by side
    table:
      head: [Race, What its page says about the kit, Checks]
      rows:
      - ['Montane Lakeland 50 and 100', 'Compulsory items including waterproofs with taped seams and a hood, spare base layers, emergency food, head torch and spares, phone, survival blanket or bag, a solid cup and a bottle or soft flask; a back pack or similar to carry it all', 'Kit check at registration; without the kit you may not start']
      - ['HOKA UTMB Mont-Blanc', 'A basic list each runner must adapt to their own abilities, suitable for all conditions and for spending one or two nights outdoors on the route, depending on your speed', 'Carry it from start to finish or be penalized; stewards may check at any time']
    after: 'From the Lakeland kit requirements and UTMB Mont-Blanc mandatory equipment pages, opened on 24 November 2026. Check your own race''s current list: they change.'
  - h: What to check on the vest itself
    p:
    - 'Space for the bulky items. The waterproof jacket, spare layers and survival bag take the most room, and Lakeland wants spare layers and emergency food sealed in bags that stay packed unless there is an emergency. Pack them first and see what is left.'
    - 'Drinks. Lakeland asks for a bottle or soft flask for cold drinks and a solid plastic cup for hot drinks or soup; its page says a cup that collapses is not solid, and that no plastic cups are provided. Check where the flasks sit and that you can get them out and back in while moving: iRunFar''s testers noted of their top vest that "flasks can be difficult to get back into their sleeves when removed."'
    - 'Fit and sizing. iRunFar says makers have a size chart and instructions for taking proper measurements, and recommends using these guides and trying on packs in a specialty running store if possible. Try the vest fully loaded, with full flasks, and run in it.'
    - 'Training. UTMB Mont-Blanc recommends testing your equipment in training sessions under different conditions. Long training runs with the full race load show up rubbing and bounce before race day.'
  - h: How the picks below were chosen
    p:
    - 'The picks come from one independent review, iRunFar''s "Best Running Vests of 2026" by Carly Eisley and Eszter Horanyi, dated 22 November 2026. iRunFar says its team of trail runners takes the most promising packs out on all sorts of terrain to test their comfort, functionality and durability. The labels and quotes are the reviewers'' own words; we have not tested any vest ourselves.'
    - 'iRunFar also names budget picks, including one for ultramarathons. We could not read that part of the page word for word this time, so it is not shown here. Open the review for the full list, and check any vest against your own race''s kit list.'
  picks:
  - item: Running vest
    why: 'From iRunFar''s November 2026 guide: its overall pick and its pick for ultramarathons. Whether either suits you depends on your race''s kit list and your fit.'
    options:
    - tier: top
      name: Salomon Adv Skin 12
      label: Best Overall Running Vest
      quote: It can fit a massive amount of cargo and wears just as comfortably when empty.
      reviewer: iRunFar
      review: {title: 'Best Running Vests of 2026', url: 'https://www.irunfar.com/best-running-vests', checked: '2026-11-24'}
      buy: 'https://www.amazon.co.uk/s?k=Salomon+Adv+Skin+12'
    - tier: good
      name: UltrAspire Alpha 6.0 Race Vest
      label: Best Trail Running Vest for Ultramarathons
      quote: The 6-liter capacity makes it an excellent option for ultras without an extensive gear list.
      reviewer: iRunFar
      review: {title: 'Best Running Vests of 2026', url: 'https://www.irunfar.com/best-running-vests', checked: '2026-11-24'}
      buy: 'https://www.amazon.co.uk/s?k=UltrAspire+Alpha+6.0+vest'
  faq:
  - q: What size of running vest do I need for an ultra?
    a: It depends on your race's kit list rather than the distance. Gather the compulsory items your race names (Lakeland's include waterproofs, spare layers, a survival bag and a cup), pack them, and choose a vest that carries all of them with room for food and drink.
  - q: Will my vest be checked?
    a: Often, yes. The Lakeland 50 and 100 check kit at registration and will not let you start without it; UTMB Mont-Blanc says stewards may check your equipment at any time and that missing kit is penalized.
  - q: Can I use a collapsible cup?
    a: Not at Lakeland, whose kit page asks for a solid plastic cup for hot drinks or soup and says a collapsible cup is not solid. Other races set their own rules, so check yours.
  - q: Is a vest with a 6-liter capacity enough?
    a: iRunFar says the 6-liter UltrAspire Alpha 6.0 suits ultras without an extensive gear list. For races with a long list, such as Lakeland or UTMB Mont-Blanc, pack your own kit and see what fits.
