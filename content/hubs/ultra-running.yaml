  faq:
  - q: How many lumens do I need for an ultra?
    a: iRunFar recommends 200 to 300 lumens for trail running; Advnture says 200 lumens is fine for easier, slower trail running and 400-plus for technical trails and night navigation. Your race may set its own minimum, so check its kit list, and check the burn time at the setting you will use.
  - q: Do I need two headtorches?
    a: Some races say so. Western States says each runner should carry two LED flashlights, and UTMB Mont-Blanc's penalty table for its OCC, MCC and ETC races penalizes carrying only one headlamp. Check your own race's rules.
  - q: Is a higher lumen figure always better?
    a: No. The lumen figure under the ANSI/PLATO FL1 standard is the output in the first minutes with new batteries, and burn time is measured until the light falls to 10% of that. iRunFar warns that the lightest lamps compromise on brightness and battery life, and Advnture says to look at a lamp's other modes, not only its maximum.
