# Deep hub (RUNBOOK §6u): one subject covered in depth: an event finder, guides and the activities that lead into it.
# The pattern is generic: copy this file to start another hub (hiking, open water, cycling...). build.py renders
# /<slug>/ (hub page with the finder), /<slug>/<guide-slug>/ (each guide). RULES: every event link was opened on its
# `checked` date and supports what the row says; no prices; months are "usually" and the official page is the one to
# trust; an event id is permanent (pages and readers' lists may point at it).
id: ultra-running
slug: ultra-running
category: move
label: Ultra running
h1: Ultramarathons around the world
seo_title: 'Ultramarathons worldwide: race finder, entry and kit'
description: Find an ultramarathon by region, distance, terrain and month, from UTMB and Western States to the Spine and Comrades, with how entry works and what kit to carry.
lead: Any race longer than a marathon is an ultra. Here are the big ones, checked against each organiser's own page, with how you actually get a place and what the organisers make you carry.
intro:
- Ultramarathons range from a 56 km road race around Cape Town to six days along the mountains of Wales. Some you can enter on the day entries open; some need a qualifying race, a lottery ticket or years of patience. Filter the list below by region, distance, terrain, month and how entry works.
- Every race here links to its organiser's own page, opened on the date shown. Dates, fees and rules change every year, so treat the month as a guide and the official page as the last word.
activities: [run-an-ultramarathon]
tags: [ultra, ultras, ultramarathon, ultramarathons, race, races, trail, mile, miler, '100']
# what the finder shows (labels only; the values live on each event)
