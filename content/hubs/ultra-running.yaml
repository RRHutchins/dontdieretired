- slug: poles
  title: Poles in an ultra
  short: Whether poles help, which races allow them and how to carry them
  seo_title: 'Trekking poles in ultramarathons: research and race rules'
  description: What studies found about poles on steep climbs, which race rules cover them (Western States, UTMB), and how to use and carry them without hurting anyone.
  standfirst: On a long, steep climb many ultra runners reach for poles. The research says the energy saving is small but the effort feels easier and the legs take a little less load, and race rules decide where you can use them.
  detail:
  - h: Do poles help?
    p:
    - 'A 2019 study in the European Journal of Applied Physiology had 14 mountain runners walk uphill on a treadmill at seven slopes, with and without poles. Poles cut the energy cost of climbing only on three of the steeper slopes (25.4, 29.8 and 35.5 degrees, but not the steepest), and only by about 2 to 3 percent, which the authors called small. But the runners rated the effort lower with poles on five of the seven slopes, and the authors suggest that this may delay fatigue in long efforts.'
    - 'A 2023 study by the same group, with 15 male trail runners walking uphill on a treadmill and outdoors, found poles reduced the force through the feet by a few percent and made no difference to heart and breathing measures. In the hardest outdoor trial the runners climbed about 2.5 percent faster with poles.'
    - 'A 2011 study in Medicine and Science in Sports and Exercise split 37 walkers into a pole group and a no-pole group for a walk up and down Snowdon with a day pack. The pole group lost less leg strength straight after and over the next two days, had less muscle soreness at 24 and 48 hours, and rated the climb as easier.'
    - None of these studies was a race. They suggest poles make long climbs feel easier and spare the legs a little; they do not show that poles make you faster over a whole ultra.
  - h: What the studies found
    table:
      head: [Study, Who and what, What poles changed]
      rows:
      - ['Giovanelli and others, European Journal of Applied Physiology, 2019', '14 mountain runners walking uphill on a treadmill at seven slopes', 'Energy cost down about 2 to 3 percent on three slopes only; effort felt easier on five slopes; longer, less frequent strides']
      - ['Giovanelli and others, European Journal of Applied Physiology, 2023', '15 male trail runners walking uphill, treadmill and outdoors', 'A few percent less force through the feet; no change in heart and breathing measures; about 2.5 percent faster in the hardest outdoor trial']
      - ['Howatson and others, Medicine and Science in Sports and Exercise, 2011', '37 walkers up and down Snowdon with a day pack', 'Less loss of leg strength and less soreness over the next two days; the climb felt easier']
    after: 'From the papers'' abstracts and publisher or university pages, opened on 23 November 2026.'
  - h: What the race rules say
    p:
    - 'Western States says poles may be used anywhere on its course, and you can drop them or pick them up at aid stations where crews or drop bags are allowed. Its pacers must not carry anything for their runner ("muling" is forbidden), so plan to carry your own.'
    - 'The UTMB Mont-Blanc 2027 regulations list penalties for the OCC, MCC and ETC races: 30 minutes for using poles you did not carry from the start or for leaving poles behind during the race, and 10 minutes for carrying poles with uncovered tips pointing at runners or spectators. Ultra-Trail Australia by UTMB lists the 30-minute penalty for using poles not carried from the start, and the 10-minute penalty for tips, for its 20K and 50K. The pages we opened do not say how these rules apply to UTMB''s longer races, so read your own race''s regulations.'
    - 'The Everest Trail Race does not make poles compulsory but says they are advisable.'
    - Rules change from race to race and year to year, so check your race's current regulations before you train with poles.
  - h: Using them well
    p:
    - 'The British Mountaineering Council''s guide to trekking poles says that on the way down you can put your hands on top of the handles, and that each step down then puts some of your body weight through your arms rather than your knees.'
    - 'On boulder fields and river crossings it suggests taking your hands out of the straps, so that you can let go of the poles if you slip. It warns that poles do not grip rock well and can become a hazard, suggests storing them inside your pack on the approach to a climb, and in winter says to get the ice axe out early.'
    - 'The Medical Commission of the UIAA, the international mountaineering and climbing federation, says two poles balance a loaded walker better than one, but that tripping or stumbling can become a greater risk with poles and that they should not be used everywhere. It names narrow ridges and climbing terrain as places they cannot be used.'
    - 'Both warn that relying on poles all the time can leave you out of practice at balancing on your own. If your race allows them, try them on long climbs and descents in training first: the 2019 study found they change your stride.'
  - h: Carrying them without hurting anyone
    p:
    - 'The UIAA says to carry poles on your pack with the tips pointing down, so they do not injure the person behind you.'
    - 'UTMB Mont-Blanc''s rules for the OCC, MCC and ETC penalize uncovered tips pointed at runners or spectators, so fit rubber tip covers or keep the points down when you carry them in a crowd, at aid stations and in town.'
    - At Western States you can leave them with your crew or in a drop bag at the aid stations that allow it. In the UTMB races with the penalty above, once you start with poles you carry them to the finish.
  faq:
  - q: Do poles make you faster in an ultra?
    a: The studies we opened did not test whole races. On steep treadmill climbs poles saved only about 2 to 3 percent of energy on some slopes, but the effort felt easier, and in one outdoor trial runners climbed about 2.5 percent faster.
  - q: Are poles allowed at Western States?
    a: Yes. Its performance rules say poles may be used anywhere on the course, and dropped or collected at aid stations with crew access or drop bags. Pacers may not carry them for you.
  - q: Can I pick up poles partway through a UTMB race?
    a: For the OCC, MCC and ETC, the 2027 regulations give a 30-minute penalty for using poles you did not carry from the start, and the same for abandoning them during the race. Check your own race's regulations.
  - q: Do poles help my knees on the way down?
    a: The British Mountaineering Council says resting your hands on top of the handles when descending takes some of your body weight on your arms at each step. A 2011 study on Snowdon found walkers with poles had less muscle soreness over the next two days.
