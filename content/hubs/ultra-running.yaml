- slug: running-through-the-night
  title: Running through the night in an ultra
  short: Lights, cold, sleepiness and roads after dark
  seo_title: 'Night running in an ultra: lights, cold and sleep'
  description: What races make you carry after dark, why a spare light beats spare batteries, staying warm, sleepiness and hallucinations, and being seen on roads, from race rules, the Highway Code and research on ultra runners.
  standfirst: Any ultra that runs past sunset becomes a different race in the dark. The trail is harder to read, the temperature drops and tiredness gets to work on your judgement. Races write rules for this, and they are worth reading closely.
  detail:
  - h: Why the night matters
    p:
    - Western States warns that almost half of its 100-mile trail may be covered at night. At UTMB Mont-Blanc, finishers take anything from under 20 hours to more than 46, and UTMB says your kit must let you spend one or two nights out on the course, depending on your speed.
    - Centurion Running's mandatory kit page says that if any runner in the field will be out after sunset, a headtorch or other main light goes on the mandatory list. It explains why plainly - light is needed to move safely over the ground and to find your way.
  - h: What races make you carry
    table:
      head: [Race, Lights, Other night rules]
      rows:
      - ['Centurion Running (all races that go past sunset)', 'A headtorch or main light; a phone does not count as a main or spare light', 'Spare batteries are "extremely worthwhile"; a light can also act as a beacon for race staff or rescuers']
      - ['Centurion Winter Downs 100 (December 2026)', 'Two lights of at least 200 lumens each, spare batteries for both, and a red flashing rear light', 'A mid-layer, two pairs of warm gloves, a warm hat (a Buff does not count), an emergency long-sleeved top and a survival or bivi bag (not a blanket)']
      - ['Lakeland 100 and 50 (England)', 'Headtorch with spare batteries or a spare headtorch', 'Spare base layers top and bottoms, sealed in a bag for emergencies; a survival blanket, bag or duvet; without the kit you may not start']
      - ['Western States 100 (California)', 'Each runner should carry two LED torches; pick one up at Foresthill (or Michigan Bluff for slower runners) whatever the time', 'Reflectors mark the last 38 miles in the dark; warm clothing and a spare torch in drop bags are strongly recommended']
      - ['OCC, MCC and ETC (UTMB Mont-Blanc week, 2027 penalty table)', 'No headlamp means immediate disqualification; only one headlamp brings a 30-minute penalty', 'UTMB''s kit must let you spend one or two nights out on the course and wait safely for rescue']
    after: Taken from each race's pages opened on 21 November 2026. Kit lists change every year, so check your own race's version.
  - h: A spare light, not just spare batteries
    p:
    - Centurion's reasoning is worth borrowing for any race. If the bulb or the lamp itself fails, no amount of batteries will fix it, and the spare lamp is there so you are not left in total darkness. It also recommends spare batteries.
    - Western States' own advice if your lights fail is to wait for another runner with a light. Mountain Rescue England and Wales puts it more bluntly - without a torch, a map and compass are useless after dark - and reminds walkers to take spare batteries.
    - AdventureSmart UK advises checking the batteries in your headtorch before you set out. In an emergency a torch can call for help - its page gives six short flashes, repeated at one-minute intervals, as the international distress signal.
  - h: The cold after dark
    p:
    - Night brings the temperature down even in summer races. Western States says night temperatures on its course drop into the 40 to 50°F range (about 4 to 10°C) and calls hypothermia a potentially serious risk, especially at night. UTMB's kit page mentions temperatures as low as -10°C above 2,000 m, with rain, hail or snow.
    - Mountain Rescue England and Wales lists the signs of hypothermia to watch for - disorientation, confusion, shivering, tiredness, a pale complexion and loss of circulation in the hands or toes - and says children and older people are especially susceptible. It advises warm, windproof and waterproof layers, and a spare hat and gloves even in summer.
    - In the UK hills, Mountain Rescue says to dial 999 and ask for the police, then mountain rescue (AdventureSmart adds that 112 works too); in the US, call 911. Once you have called, Mountain Rescue says, stay safe and stay put. If you are deaf or have speech difficulties, register with emergencySMS in advance by texting "register" to 999.
  - h: Sleepiness and the tricks it plays
    p:
    - Western States lists sleep deprivation among the conditions that, with fatigue, can bring disorientation and irrational thinking.
    - A 2022 survey of 119 runners of races over 100 miles, published in the European Journal of Investigation in Health, Psychology and Education, found that in 74% of the 100 to 149-mile races they reported, they did not sleep at all, while in races of 200 miles or more they slept more. Signs of sleep loss reported for their races included visual hallucinations (26%), difficulty staying awake (20%) and trips and falls through inattention (12%). The authors suggest learning about sleep management, or talking to a sleep scientist, before a race.
    - A 2018 survey of 636 ultra runners in PLoS ONE found that 73.9% had a plan for sleep before a race, mostly sleeping longer at night and napping, but only 21% had a plan for sleep during one. In a very small 2021 study of eight runners in a 246 km mountain race in Taiwan, three saw visual hallucinations in the last 60 km; all eight slept less than 30 minutes during the race.
    - None of this tells you how long to sleep, and the research is mostly surveys. It does suggest deciding before the race whether and where you will rest, rather than in the small hours.
  - h: Roads after dark
    p:
    - Many ultras cross or follow roads, often at night. The Highway Code (rule 2) says that where there is no pavement you should keep to the right-hand side of the road so you can see oncoming traffic, and be ready to go in single file, especially in poor light. Rule 3 says to use reflective materials when it is dark, which drivers can see by headlights up to three times as far away as non-reflective ones.
    - In the US, NHTSA's advice is to use sidewalks where they exist and, where there is none, to walk facing traffic as far from it as possible. Western States singles out its Highway 49 crossing, which runners reach at night and tired.
  faq:
  - q: How bright should my headtorch be?
    a: Most kit lists we opened do not give a figure. Centurion's Winter Downs 100 asks for at least 200 lumens for each of its two lights. Check your own race's list, and check the burn time at the setting you will use.
  - q: Can I use my phone as a torch?
    a: Not at Centurion races, whose page says a phone is not acceptable as a main or spare light. A phone is also your way to call for help, so keep its battery for that.
  - q: Will I need to sleep in a 100-mile race?
    a: In most of the 100 to 149-mile races reported in a 2022 survey, runners did not sleep at all, while in races of 200 miles or more they slept more. Plan your own approach before the race, and stop at an aid station if you cannot stay awake or think clearly.
  kit:
  - {name: Rechargeable headtorch, why: 'check the stated output against your race''s minimum, the burn time at that setting, and whether the battery can be swapped', url: 'https://www.amazon.co.uk/s?k=running+head+torch+rechargeable'}
  - {name: 'Second, lighter headtorch', why: 'Centurion counts a spare lamp, not only spare batteries; check it meets your race''s minimum too', url: 'https://www.amazon.co.uk/s?k=lightweight+head+torch+running'}
  - {name: Spare batteries, why: 'check they fit both lamps, as some races ask for spares for each', url: 'https://www.amazon.co.uk/s?k=head+torch+spare+battery'}
  - {name: Red flashing rear light, why: 'check that it flashes and how it fixes to your vest or belt; some races list one', url: 'https://www.amazon.co.uk/s?k=red+rear+light+running+clip'}
  - {name: Reflective armbands or vest, why: 'the Highway Code asks for reflective materials on roads after dark; check they fit over your pack', url: 'https://www.amazon.co.uk/s?k=reflective+running+armbands'}
