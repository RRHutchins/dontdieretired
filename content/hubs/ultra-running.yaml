- slug: eating-and-drinking
  title: Eating and drinking in an ultra, from aid stations to your own pockets
  short: Food, fluid and salt on the move
  seo_title: 'Ultramarathon nutrition: food, fluid and salt on the move'
  description: How much ultra runners are advised to eat and drink an hour, what aid stations usually offer, why overdrinking can be dangerous, and how to train your stomach.
  standfirst: In a long ultra, eating is part of the race. The research gives some useful ranges per hour, race medical teams warn about drinking too much, and the rest you find out in training.
  detail:
  - h: How much, per hour
    p:
    - The International Society of Sports Nutrition (ISSN) published a position stand on nutrition for single-stage ultramarathons in 2019. It suggests aiming for 150 to 400 kcal an hour during a race, made up of 30 to 50 g of carbohydrate and 5 to 10 g of protein, from a variety of calorie-dense foods.
    - For fluid, the same paper suggests 450 to 750 ml an hour, which works out at about 150 to 250 ml every 20 minutes. It adds that you need more fluid and electrolytes when it is hot or humid.
    - These are starting points, not targets to force down. The ISSN authors say palatability and your own tolerance matter, and that runners tend to prefer savoury food as races get longer.
    table:
      head: [What, The ISSN 2019 range, What that looks like]
      rows:
      - [Energy, 150 to 400 kcal an hour, From a variety of calorie-dense foods]
      - [Carbohydrate, 30 to 50 g an hour, 'Part of the energy above, not on top of it']
      - [Protein, 5 to 10 g an hour, 'Part of the energy above, not on top of it']
      - [Fluid, 450 to 750 ml an hour, About 150 to 250 ml every 20 minutes]
  - h: What aid stations usually offer
    p:
    - Look up your race's aid station list before you plan your own food. Centurion Running's Autumn 100 in England lists 16 fully stocked aid stations with gels, chews, electrolyte drink, water, cola, chocolate, sweets and biscuits, nuts, fruit, sandwiches and wraps, and savoury snacks such as mini sausage rolls. Hot drinks are served on the later legs and hot food at the race base.
    - Check whether you need your own cup. Centurion puts a cup or mug on its mandatory kit list, alongside bottles or a bladder that hold at least 1 litre of water, because you carry what you need between aid stations.
  - h: Drinking too much can be dangerous
    p:
    - Western States, the 100-mile race in California, tells its runners that those who develop symptoms of low blood sodium (hyponatraemia) have generally been overhydrating, and that the best way to avoid it is not to overhydrate. Its medical page says there is no evidence that extra sodium or electrolyte drinks instead of water prevent it.
    - The race also warns that weight change is not a reliable guide, because hyponatraemia can happen with weight gain or loss, and it does not weigh runners at aid stations. Its medical team watches how runners look, feel and think instead.
    - The symptoms Western States lists are bloating, nausea, vomiting, headache, confusion, poor coordination, dizziness and fatigue; untreated, it can lead to seizures, coma and death. It may get worse after you stop, as fluid still in the stomach is absorbed.
    - The ISSN paper says electrolytes, mainly sodium, may be needed in drinks at higher concentrations than most commercial products provide. Western States' point is a different one: extra sodium does not protect you from drinking too much.
  - h: Training your stomach
    p:
    - Stomach trouble is common: a 2023 systematic review in Nutrients, by Tansy Ryan and colleagues, cites estimates that gut symptoms during exercise affect between 30% and 90% of distance athletes. The review found seven studies of nutrition strategies for ultra-endurance athletes' gut symptoms. It concluded that avoiding high-FODMAP foods (certain fermentable carbohydrates) and practising eating carbohydrate repeatedly during training are promising, but that the studies were small.
    - The ISSN position stand makes the same point: progressive gut training and, for some runners, a low-FODMAP diet can reduce stomach problems during racing.
    - In practice, that means eating on every long training run, with the foods and drinks you will use on the day (including what the aid stations serve), and slowly building up the amount.
  - h: Caffeine, keto and painkillers
    p:
    - The ISSN authors say caffeine can help sustain performance late in a race, especially when lack of sleep could make a runner unsafe. If you use it, try it in training first.
    - They found the evidence that ketogenic diets or ketone drinks improve ultra performance is lacking.
    - Western States warns that anti-inflammatory painkillers such as ibuprofen can worsen acute kidney injury and could land a runner in hospital with kidney failure, and tells runners not to mask pain with a pill.
  - h: When to stop and get help
    p:
    - Confusion, poor coordination, vomiting or a bad headache during or after an ultra need urgent medical help. Go to the race medics at once, or call 999 (911 in the US) if you are off the course.
  - h: What we have not done
    p:
    - This guide is written with AI from the pages listed below, opened on the date shown. It has not been reviewed by a coach, a doctor or a dietitian. If you have a health condition, especially one affecting your heart, kidneys or blood sugar, or take regular medicines, check with your GP (family doctor) before racing.
  faq:
  - q: How many calories should I eat in an ultra?
    a: The ISSN 2019 position stand suggests 150 to 400 kcal an hour, from a variety of foods, and practising it in training.
  - q: Should I drink to a schedule?
    a: The ISSN suggests 450 to 750 ml an hour as a range, more in the heat. Western States warns that overhydrating is what generally causes symptomatic hyponatraemia, so do not drink more than you need.
  - q: Do salt tablets stop hyponatraemia?
    a: Western States says there is no evidence that extra sodium or electrolyte drinks prevent it. Not overdrinking is what it advises.
  kit:
  - {name: Soft flasks, why: 'check the total volume against your race''s minimum water rule (Centurion asks for at least 1 litre)', url: 'https://www.amazon.co.uk/s?k=soft+flask+500ml+running'}
  - {name: Collapsible running cup, why: 'check your race''s kit list says a cup is needed and how much it should hold', url: 'https://www.amazon.co.uk/s?k=collapsible+running+cup'}
  - {name: Electrolyte drink tablets, why: 'check the sodium per tablet, and practise with them in training', url: 'https://www.amazon.co.uk/s?k=electrolyte+tablets+running'}
