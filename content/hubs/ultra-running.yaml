- slug: first-ultra
  title: Your first ultramarathon, from choosing a race to the finish
  short: Choosing a race, building up and race day
  seo_title: 'First ultramarathon: choosing a race, training and race day'
  description: How to pick a first ultra, what entry rules to expect, how organisers suggest you build up, and what the evidence says about eating, drinking and stopping safely.
  standfirst: A first ultra is mostly a long day of walking, eating and looking after yourself, with some running in between. Here is what race organisers and the research say about getting to the finish.
  detail:
  - h: What counts as an ultra
    p:
    - A marathon is 42.2 km (26.2 miles); an ultra is anything beyond it. The International Trail Running Association (ITRA), which rates trail races, sorts them into bands of 50K (45 to 64 km), 50 miles (65 to 89 km), 100K (90 to 129 km), 100 miles (130 to 189 km) and longer, and describes ultra-trail races as 80 km and beyond.
    - Climb matters too. ITRA counts every 100 metres of ascent as one extra kilometre of effort, so a hilly 50K can be as hard as a flat race much longer.
  - h: Choosing a first race
    p:
    - Look for a race the organisers describe as suitable for a first ultra, with aid stations, a marked course and a generous time limit. Centurion Running, for example, describes its Hundred Hills 50km in March as ideal for a first ultra, with five aid stations, medics on the course, a fully marked route and a 9-hour limit.
    - Read the entry rules before you set your heart on a race. Centurion's 50-mile races ask for a finished marathon or longer race within its time limits, and its 100-mile races ask for a 50-mile finish within 15 hours. The organisers say these are the absolute minimum, and advise much more experience than a single qualifier, especially for the 100.
    - Some famous races say plainly they are not for beginners. The Lakeland 100 organisers say it should not be approached as a first ultra and point first-timers to the Lakeland 50, where they advise having run at least a marathon distance on mountain terrain first. The route is not waymarked, so you must be able to navigate it.
    table:
      head: [First step, What it looks like, An example]
      rows:
      - [A 50K on marked trails, 'About 31 miles, several aid stations, a time limit of around 9 hours', Centurion Hundred Hills 50km]
      - [A 50-mile race, 'A marathon finish needed first, a 13-hour limit', Centurion South Downs Way 50]
      - [A mountain 50, 'A full day on the fells, navigation needed, marathon on mountain terrain advised', Lakeland 50]
      - [A road ultra, 'A marathon qualifying time and a 12-hour limit', Comrades Marathon (about 90 km)]
  - h: Building up
    p:
    - 'The NHS advice for runners applies at any distance: do not increase how far or how hard you run too quickly, and do not run through pain.'
    - The Lakeland organisers point out that most people find a long run of 18 to 20 miles hard enough, and that a weekend of very long runs is not the answer. Instead they suggest long walking days of 8 to 10 hours, doing your longer sessions with your pack fully loaded, getting used to descents so your legs can take them on race day, and being ready to be on your feet for 10 to 20 hours.
    - Injuries in ultra runners are common, mostly in the lower leg, ankle, knee and foot, and mostly from overuse, according to a 2021 scoping review in Frontiers in Physiology. A 2025 study of 106 runners from the 2018 Comrades Marathon found that lower training loads were linked with a higher risk of injury, with the risk highest below two runs a week. That study looked back at runners' GPS training records and the injuries they reported, and its authors say the finding needs confirming.
  - h: Eating and drinking
    p:
    - The International Society of Sports Nutrition's position stand on single-stage ultramarathons (2019) suggests aiming for 150 to 400 kcal an hour during a race, including 30 to 50 g of carbohydrate, from a variety of foods. For fluid it suggests 450 to 750 ml an hour, about 150 to 250 ml every 20 minutes, with sodium in the drink.
    - Practise all of it in training, well before the race. The same paper says the gut can be trained to cope with eating on the move and so reduce stomach problems.
    - Too much water is a danger too. Drinking well beyond thirst can dilute the salt in your blood (exercise-associated hyponatraemia), which can be fatal. A 2017 review in Frontiers in Medicine names overdrinking as the main cause and advises drinking according to thirst; gaining weight during a race is a sign you have drunk more than you have lost.
  - h: Race day
    p:
    - Expect to walk. The Lakeland organisers estimate that the average runner in the Lakeland 50 walks 60% of the course or more.
    - Carry the mandatory kit all the time. Centurion may check kit at the start, on the course or at the finish, with a penalty of at least one hour for each missing item. Cut-offs at aid stations are strictly enforced.
    - If you stop, tell the race. Centurion's rules say a runner who drops out must tell the nearest aid station captain in person and hand in their race number, or they will be treated as lost. At Comrades, runners must retire if the medical staff tell them to.
  - h: When to stop and get help
    p:
    - On a hot day, watch for the signs of heat exhaustion the NHS lists, such as dizziness, nausea, cramps, heavy sweating and pale, clammy skin. Move somewhere cool, drink and cool the skin; if you are no better after 30 minutes, or there is confusion, a fit, hot skin that has stopped sweating or loss of consciousness, call 999 (911 in the US) or get the race medics at once.
    - Confusion or any change in mental state during an ultra needs urgent medical help whatever the weather, as it can also be a sign of severe hyponatraemia.
  - h: What we have not done
    p:
    - This guide is written with AI from the pages listed below, opened on the date shown. It has not been reviewed by a coach, a doctor or a dietitian. If you have a health condition or have not exercised for a while, check with your GP (family doctor) before you start training.
  faq:
  - q: How long should I train for a first ultra?
    a: The pages we used do not give a set number of weeks. Centurion asks for a finished marathon before its 50-mile races, and organisers advise more experience than the minimum. Build up gradually, as the NHS advises.
  - q: Do I have to run the whole way?
    a: No. The Lakeland organisers estimate that the average Lakeland 50 runner walks 60% of the course or more.
  - q: How much should I drink in an ultra?
    a: The ISSN position stand suggests 450 to 750 ml an hour with sodium, and a 2017 review advises drinking to thirst, because overdrinking can cause dangerous hyponatraemia. Practise in training.
  kit:
  - {name: Running vest or race pack, why: 'train with it fully loaded, as the Lakeland organisers suggest; check it holds your race''s kit list', url: 'https://www.amazon.co.uk/s?k=trail+running+vest+12l'}
  - {name: Soft flasks, why: 'check the volume your race asks you to carry', url: 'https://www.amazon.co.uk/s?k=soft+flask+500ml+running'}
  - {name: Electrolyte drink tablets, why: 'check the sodium per tablet against what you practise with in training', url: 'https://www.amazon.co.uk/s?k=electrolyte+tablets+running'}
  sources:
