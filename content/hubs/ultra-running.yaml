# Deep hub (RUNBOOK §6u): one subject covered in depth: an event finder, guides and the activities that lead into it.
# The pattern is generic: copy this file to start another hub (hiking, open water, cycling...). build.py renders
# /<slug>/ (hub page with the finder), /<slug>/<guide-slug>/ (each guide). RULES: every event link was opened on its
# `checked` date and supports what the row says; no prices; months are "usually" and the official page is the one to
# trust; an event id is permanent (pages and readers' lists may point at it).
id: ultra-running
slug: ultra-running
category: move
label: Ultra running
h1: Ultramarathons around the world
seo_title: 'Ultramarathons worldwide: race finder, entry and kit'
description: Find an ultramarathon by region, distance, terrain and month, from UTMB and Western States to the Spine and Comrades, with how entry works and what kit to carry.
lead: Any race longer than a marathon is an ultra. Here are the big ones, checked against each organizer's own page, with how you actually get a place and what the organizers make you carry.
intro:
- Ultramarathons range from a 56 km road race around Cape Town to six days along the mountains of Wales. Some you can enter on the day entries open; some need a qualifying race, a lottery ticket or years of patience. Filter the list below by region, distance, terrain, month and how entry works.
- Every race here links to its organiser's own page, opened on the date shown. Dates, fees and rules change every year, so treat the month as a guide and the official page as the last word.
activities: [run-an-ultramarathon]
event_pages: true   # a page per race at /ultra-running/<id>/ (RUNBOOK §6u step 1)
safety: Ultras in the mountains, the desert or winter can leave you far from help. Read each race's kit list and medical guidance before you enter.
tags: [ultra, ultras, ultramarathon, ultramarathons, race, races, trail, mile, miler, '100']
# what the finder shows (labels only; the values live on each event)
facets:
  continent: {europe: Europe, north-america: North America, africa: Africa, asia: Asia, oceania: Oceania, south-america: South America}
  terrain: {mountain: Mountain, trail: Trail and path, road: Road, desert: Desert, winter: Winter, island: Island}
  entry: {open: Open entry, register: Register with the organiser (see its rules), ballot: Ballot or lottery, qualifier: Qualifying race needed, application: Application or invitation}
  series: {utmb: UTMB World Series, centurion: Centurion Running, mds: Marathon des Sables, spine: Spine Races, aravaipa: Aravaipa Running, destination-trail: Destination Trail, racingtheplanet: RacingThePlanet 4 Deserts, threshold: Threshold Trail Series, wtm: World Trail Majors, independent: Independent}
# Landing pages for common filters (RUNBOOK §6u step 2): /ultra-running/<slug>/. Facts on each page are computed by the build;
# `intro` is our own short explanation of the filter only (no race facts). A page needs at least 4 races.
landing_months: true
# Entry calendar (RUNBOOK §6u step 4): races may carry `entry_dates`; the hub shows those in the next 120 days and this page shows all to come
entry_calendar:
  slug: entry-dates
  title: Ultramarathon ballots and entry dates
  seo_title: 'Ultramarathon ballot and entry dates: the calendar'
  description: When ultramarathon lotteries, ballots and registrations open and close, month by month, each date copied from the organizer's own page with the day we checked it.
  lead: When lotteries open and close, when draws happen and when registration starts, for the races in our finder that have posted their next dates.
signup_tag: int-ultra
landing_noun: Ultras
