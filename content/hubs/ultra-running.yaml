- slug: running-in-the-heat
  title: Running an ultra in the heat
  short: Heat illness, getting used to heat, drinking and cooling
  seo_title: 'Ultramarathon in the heat: acclimatizing, drinking, cooling'
  description: How to spot heat exhaustion and heatstroke, how long it takes to get used to heat, why drinking too much is a risk too, and what desert races make you carry.
  standfirst: Heat turns an ultra you could finish into one that can hurt you. The good news is that the body adapts within days to weeks, and the rules races write for the desert show what matters most.
  detail:
  - h: Why heat matters
    p:
    - Western States says temperatures during its 100 miles can range from 20°F to above 110°F (about -7°C to above 43°C), and that heat stroke can cause death, kidney failure and brain damage. Its medical page notes that in 1989 the heat radiating off the rocks was measured at 114°F (about 46°C).
    - Desert stage races plan around heat. The Marathon des Sables regulations let the organizers change the race for "extreme heat", among other reasons, and the 2015 expert consensus on training and competing in the heat, published in the British Journal of Sports Medicine, asks organizers to plan for large shaded areas with cooling and drinks.
    - The NHS lists people at higher risk in hot weather, including people aged 65 and over, people with serious long-term conditions such as heart or breathing problems, and people taking medicines that may make them more likely to be badly affected by heat. If any of those apply to you, talk to your GP (family doctor) or primary care doctor before a hot race.
  - h: Know the signs, and when to call for help
    table:
      head: [What you notice, What it may be, What to do]
      rows:
      - ['Tiredness, dizziness, headache, heavy sweating with pale and clammy skin, cramps, being very thirsty', 'Heat exhaustion (NHS and CDC)', 'Get to a cool place, loosen or remove extra clothing, sip water, cool the skin with cool water and fanning. The NHS says people should feel better within 30 minutes']
      - ['Still unwell after 30 minutes of rest and cooling; hot skin that is not sweating; a fast heartbeat or fast breathing; confusion or poor coordination; a seizure; passing out', 'Heatstroke, a medical emergency', 'Call 999 in the UK or 911 in the US, or alert the nearest race medic. Keep cooling while you wait. The CDC says not to give someone with heat stroke anything to drink']
      - ['Muscle pain or spasms during hard exercise with heavy sweating', 'Heat cramps (CDC)', 'Stop the activity and move to a cool place']
    after: Taken from the NHS heat exhaustion and heatstroke page (reviewed 28 May 2026) and the CDC's heat-related illnesses sheet, opened on 22 November 2026. For heat exhaustion, the CDC says to get medical help right away if you are throwing up, symptoms get worse or they last longer than an hour.
  - h: Getting used to the heat
    p:
    - The 2015 consensus, written after an expert conference in Doha, says heat acclimatization should be repeated exercise in the heat over one to two weeks, in sessions of at least 60 minutes a day. Early changes come within the first few days, and most of the benefit (on heart rate and core temperature, for example) lasts for two to four weeks.
    - A 2023 American College of Sports Medicine consensus on exertional heat illness agrees that one to two weeks of heat acclimatization brings most of the body's adaptations.
    - Western States says acclimatizing takes about two weeks, and recommends training for 90 minutes in heat of 90°F (about 32°C) or more for at least two weeks before its race if you can.
    - If you live somewhere cool, the practical question is when you can get that heat, so plan it against your race date. Build up gradually, and stop if you notice any of the signs above.
  - h: Drinking and salt
    p:
    - Not drinking enough is one risk; drinking too much is the other. The 2015 heat consensus says to start well hydrated and keep dehydration down during exercise, but warns that recreational athletes in prolonged exercise should be careful not to overhydrate.
    - The 2015 international consensus statement on exercise-associated hyponatremia (low blood sodium), published in the British Journal of Sports Medicine, says the main cause is drinking more fluid than the body loses, and that using thirst to guide drinking should limit drinking too much. It reports rates in 161 km (100-mile) ultramarathons, mostly without symptoms, ranging from 5% to 51%, says sodium-containing sports drinks will not prevent it in people who overdrink, and says gaining weight during exercise is a sign you have drunk more than you lost.
    - Western States puts it simply - the best way to avoid symptomatic hyponatremia is not to overhydrate - and says untreated it can lead to seizures, coma and death. It also warns that ibuprofen or naproxen can lead to kidney problems, and the hyponatremia consensus names these anti-inflammatory painkillers (NSAIDs) as a risk factor.
    - A 2021 study of 266 runners enrolled (174 with blood tests) in an 80 km stage of a six-stage RacingThePlanet desert race, in the Clinical Journal of Sport Medicine, found that 6.3% developed low blood sodium and 17.2% high blood sodium. Hot race climates were linked to both, though only the link with high sodium was statistically clear. Taking sodium supplements neither prevented low sodium nor caused high sodium.
    - Our guide to eating and drinking on the move covers fuel. We give no figures for how much salt to take; desert races that list electrolytes tell you to test your plan in training.
  - h: Staying cool on the move
    p:
    - Western States says a light-colored shirt and cap, especially if kept wet, can help, and if signs of heat exhaustion appear it recommends rapid cooling with ice on the groin, neck and armpits.
    - Badwater 135, which runs from below sea level in Death Valley in July, allows ice, wet towels, hand-held water sprayers or misters and modern fabrics. Its rules ban cooling vests, cooling hats and umbrellas or shade while moving forward, require every runner to have their own support crew, and disqualify anyone who receives an intravenous drip during the race.
    - For heatstroke itself, the 2023 American College of Sports Medicine consensus says cold water immersion cools effectively and that aggressive cooling should start within minutes of collapse, on site, so it is not delayed by transport. That is a job for race medics; your part is to stop early and get help.
  - h: What desert races make you carry
    table:
      head: [Race, Water rules, Sun and other heat items]
      rows:
      - ['Marathon des Sables Legendary 2027 (Morocco)', 'Carry at least 1.5 liters. You get 5 liters at the end of each stage, then water again at the next day''s first checkpoint. Water from anywhere outside the organizers'' supply is banned (at least a 3-hour penalty)', 'A survival blanket (2-hour penalty if missing), stock cubes to help rehydration (two per race day) and a pack of 6.5 to 15 kg (14 to 33 pounds) without water']
      - ['Gobi March 2027 (Mongolia)', 'Containers that hold 2.5 liters at all times', 'Electrolytes ("critical to a safe race"), at least 60 ml of sunscreen (high-SPF and waterproof recommended) and UV-protection sunglasses']
      - ['RacingThePlanet UltraLite Namibia', 'Leave every checkpoint with 1.5 liters', 'A cap with a neck cover, at least 60 ml (2 fl oz) of sunscreen, and electrolytes you have tested in training. A missing item can mean a time penalty or not starting']
      - ['Badwater 135 (California)', 'Your own crew in one vehicle carries your water and ice', 'Ice, wet towels and sprayers allowed; no cooling vests or umbrellas while moving; an intravenous drip means disqualification']
    after: From each race's regulations or equipment list, opened on 22 November 2026. Lists change each year, so check your own race's current version.
  - h: The sun
    p:
    - The NHS advises sunscreen of at least SPF 30 with at least 4-star UVA protection, reapplied every two hours and after sweating or toweling, a wide-brimmed hat that shades the face, neck and ears, and shade between 11am and 3pm. It says covering the whole body takes around 6 to 8 teaspoons of sunscreen.
    - In a race you cannot always choose the hours, which is why desert races write a neck-cover cap and sunscreen into their kit lists.
  faq:
  - q: How long does it take to get used to running in the heat?
    a: The 2015 heat consensus and a 2023 American College of Sports Medicine consensus both say one to two weeks of repeated exercise in the heat brings most of the adaptations, with some changes in the first few days. Most of the benefit lasts two to four weeks, so time it against your race.
  - q: Do salt tablets stop hyponatremia?
    a: No source we opened says so. The 2015 hyponatremia consensus says sodium drinks will not prevent it in people who overdrink, and a 2021 desert race study found sodium supplements did not prevent it. Drinking to thirst is the consensus advice.
  - q: Should I drink as much as I can in a hot race?
    a: No. Both the heat consensus and Western States warn against overhydrating, because drinking more than you lose can cause dangerously low blood sodium. Use thirst as your guide and follow your race's water rules.
  - q: When is it an emergency?
    a: Confusion, hot skin that has stopped sweating, a fast heartbeat or breathing, a seizure, passing out, or still feeling unwell after 30 minutes of rest and cooling. Call 999 in the UK or 911 in the US, or get the nearest race medic.
  kit:
  - {name: Cap with a neck cover, why: 'some desert races require one; check it shades the back of the neck and can be soaked', url: 'https://www.amazon.co.uk/s?k=running+cap+neck+flap'}
  - {name: Sunscreen SPF 30 or more, why: 'the NHS asks for SPF 30 or more and 4-star UVA; check the label for both and for sweat resistance', url: 'https://www.amazon.co.uk/s?k=sunscreen+spf50+4+star+uva+sport'}
  - {name: UV-protection sunglasses, why: 'Gobi March asks for UV protection; check the label says UV400 or 100% UV', url: 'https://www.amazon.co.uk/s?k=uv400+running+sunglasses'}
  - {name: Soft flasks or a bladder, why: 'check the total holds what your race asks for (1.5 to 2.5 liters on the lists above)', url: 'https://www.amazon.co.uk/s?k=running+soft+flask+500ml'}
  - {name: Hand-held water sprayer, why: 'Badwater allows sprayers for cooling; check what your race allows and how much it holds', url: 'https://www.amazon.co.uk/s?k=handheld+water+mister+spray+bottle'}
