- slug: headtorches
  title: Choosing a headtorch for an ultra
  short: What races ask you to carry after dark, what the numbers on the box mean, and the headtorches two independent reviewers pick
  seo_title: 'Headtorches for ultras: race rules, lumens and reviewers'' picks'
  description: How to choose a headtorch (headlamp) for an ultramarathon, from what Western States and UTMB Mont-Blanc ask for, what lumens and burn time measure, and the lights iRunFar and Advnture pick for running.
  standfirst: Many ultras run on into the dark, and some races want two lights. Start from your race's rules, learn what the numbers on the box mean, then choose; here is what two races ask for and what two independent reviews recommend.
  detail:
  - h: Start from what your race asks for
    p:
    - 'Western States tells its runners that almost half of the trail may be covered at night, and that each runner should carry two LED flashlights. It says to plan to pick up a flashlight in Foresthill whatever time you get there (Michigan Bluff if you are a 28 to 30-hour runner), and strongly recommends an extra flashlight in your drop bags. Its advice if your lights fail is to wait for another runner with a light, and not to try to find your way in the dark.'
    - 'HOKA UTMB Mont-Blanc''s 2027 regulations, in the penalty table for its OCC, MCC and ETC races, list "no headlamp" among the gaps in mandatory safety equipment that bring immediate disqualification, and "only one headlamp" among the other missing items that bring a 30-minute penalty. So read your own race''s list for how many lights it wants, and whether it sets a minimum brightness or asks for spare batteries.'
    - Our guide to running through the night in an ultra, linked at the foot of this page, compares more races' light rules and covers the cold, sleepiness and roads after dark.
  - h: What the numbers on the box mean
    p:
    - 'Petzl measures its lamps to a standard called ANSI/PLATO FL1, and its explainer says the lumen figure is taken between 30 and 120 seconds after the lamp is turned on, with new batteries, and indicates the maximum light output when the lamp is first switched on.'
    - 'The burn time, Petzl says, is measured from 30 seconds after switch-on for as long as the lamp takes to drop to 10% of its maximum output. The beam distance is how far away the light still gives 0.25 lux, and depends on brightness but mainly on the shape of the beam.'
    - So a high lumen figure tells you about the first minutes, not the whole night. Check the burn time at the setting you will actually run on, and how long your night will be at your pace.
  - h: How bright, and what else to check
    table:
      head: [What to check, iRunFar, Advnture]
      rows:
      - [Brightness, '"we recommend having 200 to 300 lumens for trail running"', '"For technical trails and night navigation, 400-plus lumens fits the bill"; for easier, slower trail running "200 lumens is fine"']
      - [Battery, '"Battery life is one of the most important considerations when choosing a headlamp"', '"Battery weight is the limiting factor in beam life"']
      - [Beam, 'Long-throw light, or a spotlight, is "the most common type of lighting used on the trail"', 'It is "handy to have more control over whether the headlamp emits a flood or spotlight beam"']
      - [Fit, '"A tight headlamp can cause headaches and divots in your forehead"', 'Make sure the headband is easy to adjust, even when you are running']
    after: 'From iRunFar''s "Best Running Headlamps of 2026" and Advnture''s "The best running headlamps", opened on 25 November 2026. iRunFar warns that with the lightest headlamp "you''ll compromise on brightness and battery life," and that too much and too little light can both cause eye strain; Advnture says to look at a lamp''s other lighting modes, not only its maximum.'
  - h: How the picks on this page were chosen
    p:
    - 'The picks come from two independent reviews. iRunFar''s "Best Running Headlamps of 2026" (Alli Miles, Meghan Hicks and Eszter Horanyi) says its testers took the lights out for sunrise runs, 100-mile races and multi-day fastpacking outings. Advnture''s "The best running headlamps: tested on roads and trails" (Claire Maxted, with Cat Ellis) says she tested them on dark trails, unlit roads and country lanes during winter training, and timed how long each ran on a full charge at each brightness setting.'
    - The labels and quotes are the reviewers' own words; we have not tested any headtorch ourselves. Open each review for its full list, and check any light against your own race's rules.
