  faq:
  - q: Can I wear new shoes for my marathon?
    a: Best not. London Marathon Events' advice for first-timers is that you should not try anything new on event day, and to build up kit testing slowly in training. Get fitted at a running shop and do your long runs in the pair you will race in.
  - q: Do I need to carry water in a marathon?
    a: It depends on the race. London's 2026 course had water, Lucozade Sport and refill stations, and the organizers recommended a bottle belt or hydration pack to cut bottle waste and stops. Boston allows a fuel belt with bottles of 1 liter or smaller but bans bags over one gallon, including personal hydration systems. Check your race's rules.
  - q: Can I run a marathon with headphones?
    a: Often, with limits. London's 2026 guide allowed non-noise-cancelling or bone conduction headphones, or one earpiece, so you can hear safety instructions. Boston says headphones are discouraged, but permitted.
  - q: Do I need expensive running shoes?
    a: No. The NHS says you do not have to spend a lot of money and that all running shoe brands make cheaper versions suitable for beginners; more expensive shoes may just be more durable and lightweight.
