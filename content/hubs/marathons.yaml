- slug: generous-time-limits
  title: Marathons you can take your time over
  short: Generous time limits
  seo_title: 'Marathons with no time limit or a generous cut-off'
  description: Big marathons where walkers and slower runners have time, from Honolulu, which has no time limit, to Loch Ness, Philadelphia, Austin, Melbourne and London.
  standfirst: You do not have to run all 26.2 miles. Here are big marathons whose own rules give you time to walk part of the way.
  detail:
  - h: What a cut-off means
    p:
    - Most marathons close the course after a set time, and some also set checkpoint times along the route. What happens to anyone behind it varies from race to race, so read the race's FAQ or race-day page before you enter.
    - A six-hour cut-off means averaging about 13 minutes 45 seconds a mile (about 8 minutes 32 seconds a kilometre), the whole way. If you plan to walk much of it, pick a race with a longer limit or none.
  - h: Cut-offs from the organisers' own pages
    table:
      head: [Race, Time limit, What the organisers say]
      rows:
      - ['Honolulu Marathon', 'None', 'The finish stays open until the last person is in. Many walk part or all of the course.']
      - ['Loch Ness Marathon', 'Seven hours', 'The cut-off is 5pm for a 10am start.']
      - ['Manchester Marathon', 'Six hours', 'All finishers should cross the line by 5pm.']
      - ['Big Sur International Marathon', 'Six hours', 'The race ends at 1pm, a pace of 13:45 a mile, with checkpoints at miles 15.2 and 21.2.']
      - ['Marine Corps Marathon', 'A pace of 14 minutes a mile', 'Runners must also pass checkpoints ("gauntlets") in time.']
      - ['London Marathon', 'Eight hours (2026 guide)', 'Counted from when the last participant starts; tailwalkers keep an eight-hour pace.']
      - ['Melbourne Marathon', '7 hours 45 minutes', 'Gun time, with earlier cut-offs on the course.']
      - ['Philadelphia Marathon', 'Seven hours', 'A 16-minute-mile pace; the FAQ calls the race walker-friendly.']
      - ['Grandma''s Marathon', 'Seven hours', 'About 16 minutes a mile; after that, runners move onto the sidewalk.']
      - ['Indianapolis Monumental Marathon', 'Seven hours', 'A minimum pace of 16 minutes a mile.']
      - ['Austin Marathon', 'Seven hours', 'A 16-minute-mile pace; the course closes at 2:18pm.']
      - ['Perth Running Festival Marathon', 'Seven hours', 'The cut-off is 7 hours.']
  - h: Training to walk a marathon
    p:
    - Walking 26.2 miles is still a long day on your feet; at 15 minutes a mile, that is six and a half hours. Build up your longest walk gradually over months, as runners do, and practise eating and drinking on the move.
    - Try your shoes, socks and anti-chafe balm on long training walks, never for the first time on race day.
  faq:
  - q: Is there a marathon with no time limit?
    a: Yes. The Honolulu Marathon has no time limit; the finish stays open until the last person crosses, and the organisers say many people walk part or all of it.
  - q: What pace is a six-hour marathon?
    a: About 13 minutes 45 seconds a mile, or about 8 minutes 32 seconds a kilometre.
