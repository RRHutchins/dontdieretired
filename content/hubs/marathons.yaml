# Deep hub (RUNBOOK §6u): marathons (Robin, 19 Nov 2026: second hub after ultra running, chosen for search demand,
# spend on travel and kit, and fit with the planner). Same rules as ultra-running.yaml: every event link was opened on
# its `checked` date and supports what the row says; no prices; months are "usually"; event ids are permanent.
# Every event is the full 42.195 km, so this hub sets `bands_def: []` (no distance filter).
