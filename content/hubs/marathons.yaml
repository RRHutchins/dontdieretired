slug: marathons
category: move
label: Marathons
h1: Big marathons around the world
seo_title: 'Marathons worldwide: finder, ballots and how to get a place'
description: Find a marathon by region, month and how you get in, from London, New York and the eight World Marathon Majors to Loch Ness, the Médoc and the Great Wall, with every way to a start line.
lead: Every big marathon has its own way in. Some sell out on the day entries open, some draw places by ballot, and some fill through charities and travel packages. Here is how each one works, checked against the organiser's own page.
intro:
- More than 1.3 million people applied in the ballot for the 2027 London Marathon, and most missed out. But a ballot is only one way in. Charities buy places, some races take whoever enters first, some want a qualifying time, and some can only be entered as part of a travel package.
- Filter the list below by region, month, the way you want to get in, or the World Marathon Majors. Every race links to its organiser's own page, opened on the date shown. Dates and rules change each year, so the official page is the last word.
activities: [run-a-marathon, marine-corps-marathon]
tags: [marathon, marathons, '26.2', ballot, majors, abbott, city, race, races, running]
finder_title: Marathon finder
noun_one: a marathon
noun_many: marathons
series_label: Series
series_any: Any
none_text: No marathons match those choices yet. Try any month or any way in.
safety: A marathon is a long, hard day on the heart, muscles and feet. Build up over months, follow your race's medical advice, and check with your GP (family doctor) before you start training if you have a heart condition or another health worry.
