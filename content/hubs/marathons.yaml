# ---------- Abbott World Marathon Majors ----------
- id: tokyo-marathon
  name: Tokyo Marathon
  series: wmm
  place: Tokyo
  country: Japan
  continent: asia
  km: [42.2]
  distances: Marathon
  terrain: [road]
  format: single
  month: [3]
  entry: [ballot, charity]
  entry_note: General entry is a drawing, held in August for the following March; overseas runners can also apply through the ONE TOKYO GLOBAL membership window just before it. Charity runners, chosen by each charity programme, enter earlier, from late June, and must make a large minimum donation. Applicants who expect to finish in under three hours must send a result certificate.
  note: The 2027 race is on Sunday 7 March 2027, with a field of 40,000.
  link: {label: 'Tokyo Marathon 2027: entry information', url: 'https://www.marathon.tokyo/en/participants/guideline/', checked: '2026-11-19'}
- id: boston-marathon
  name: Boston Marathon
  series: wmm
  place: Hopkinton to Boston, Massachusetts
  country: USA
  continent: north-america
  km: [42.2]
  distances: Marathon
  terrain: [road]
  format: single
  month: [4]
  entry: [qualifier]
  entry_note: You need a qualifying time for your age and sex, run on a certified course in the qualifying window. Qualifiers apply in one registration week in September, and it is not first come, first served; for 2027 a runner needed to be 5 minutes 17 seconds under their standard to be accepted. From 2027 the organisers added a random selection opportunity for qualifiers.
  note: The 131st Boston Marathon is on Monday 19 April 2027. The organisers adjust qualifying times run on courses that drop more than 1,500 ft (457 m).
  link: {label: 'B.A.A.: qualify for the Boston Marathon', url: 'https://www.baa.org/races/boston-marathon/qualify/', checked: '2026-11-19'}
