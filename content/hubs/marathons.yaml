- slug: marathon-kit
  title: 'Marathon kit: shoes, watch and belt'
  short: What race organizers say about kit on the day, how to choose shoes, and the shoes, watches and belts independent reviewers pick
  seo_title: 'Marathon kit: running shoes, GPS watches and running belts'
  description: What to wear and carry in a marathon, from London Marathon Events, the B.A.A. and the NHS, plus the running shoes, GPS watches and running belts that RTINGS, Tom's Guide and iRunFar pick in their 2026 reviews.
  standfirst: A marathon needs less kit than you might think, but what you have must be tried and tested. Here is what the organizers of the London and Boston marathons say about race day, and what three independent reviewers pick.
  detail:
  - h: Nothing new on race day
    p:
    - 'London Marathon Events, which runs the London Marathon, puts it plainly in its advice for first-timers: "You shouldn’t try anything new on Event Day". It suggests approaching kit testing the same way you do training, building it slowly and intentionally, and says the two things you want to avoid are blisters and chafing.'
    - The same goes for food. London's advice is to test energy gels in training, taking only a little at a time to begin with, and to follow the guidance on the packet.
    - 'It is cold waiting at the start. London says many participants wear old clothes to keep warm before their wave starts; its 2026 event guide says collection points near every start line take any extra layers you do not want to run in, as long as they are clean and in good condition.'
  - h: Shoes
    p:
    - 'The NHS says it is important to buy the correct running shoes, and that it is best to go to a running shop to get fitted. London Marathon Events says you can get your gait analyzed for free in most running shops.'
    - 'You do not have to spend a lot. The NHS says all running shoe brands make cheaper versions that are suitable for beginners, and that expensive shoes may just be more durable and lightweight, so more suitable for people running long distances. Worn-out shoes are one of the causes of heel pain it lists.'
    - Run your long training runs in the pair you will race in, so that any rubbing shows up in training rather than at mile 20.
  - h: Water, belts and what the race provides
    p:
    - 'Big city marathons provide drinks on the course, but the rules on what you may carry differ. London''s 2026 event guide said there was water every three miles from mile 3 to 12, then every two miles to mile 24, with Lucozade Sport at miles 7, 15, 21 and 23, gels at miles 13 and 19 and refill stations at miles 5, 10, 14, 17 and 20. It recommended a bottle belt or hydration pack to reduce bottle waste and stops.'
    - 'Boston is stricter. The B.A.A.''s list of prohibited items for participants bans bags larger than one gallon, including personal hydration systems, but allows one fanny pack (bum bag) no larger than 5 x 15 x 5 inches and a fuel belt with bottles of 1 liter or smaller.'
    - So read your own race's participant guide before you buy a belt or pack.
  - h: Bag drop and headphones
    p:
    - 'London accepts only its official event kitbag at bag drop, with nothing attached to it, and asks runners not to put expensive items such as a phone in it. It suggests packing something to eat after you finish.'
    - 'Headphone rules vary too. London''s 2026 guide allowed non-noise-cancelling or bone conduction headphones, or a single earpiece, because you must be able to hear safety instructions. Boston''s list says headphones are "Discouraged, but permitted".'
  - h: How the picks below were chosen
    p:
    - 'The picks come from three independent reviews, each opened on 24 November 2026: RTINGS''s "The 5 Best Marathon Running Shoes of 2026" (updated 16 October 2026), Tom''s Guide''s "Best running watches 2026: tested and ranked by experts" (updated 28 September 2026) and iRunFar''s "Best Running Belts of 2026" (26 October 2026). The labels and quotes are the reviewers'' own words; we have not tested any of these products ourselves.'
    - RTINGS's overall pick is a racing shoe it rates highest for raw performance efficiency; its cheaper pick is the one it suggests if you simply want to finish. Try any shoe on in a running shop before you buy.
