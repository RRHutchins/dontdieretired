- slug: world-marathon-majors
  title: The Abbott World Marathon Majors
  short: World Marathon Majors
  group: Series
  filter: {series: wmm}
  intro: ['The Abbott World Marathon Majors is a series of big city marathons. Each race runs its own entry, so the way in differs from one to the next: read the "Getting in" line for each.']
- slug: open-entry
  title: Marathons with open entry
  short: Open entry
  group: How you get a place
  filter: {entry: open}
  intro: ['These races give places to whoever enters first, until they are full. The popular ones can sell out within days of opening, so note when entries open.']
- {slug: ballot-marathons, title: Marathons with a ballot or lottery, short: Ballot or lottery, group: How you get a place, filter: {entry: ballot}}
- {slug: charity-places, title: Marathons with charity places, short: Charity places, group: How you get a place, filter: {entry: charity}, intro: ['A charity place means promising to raise a set sum for the charity. Each charity sets its own target and terms, so read them before you apply.']}
- {slug: qualifying-time, title: Marathons with qualifying-time entry, short: Qualifying time, group: How you get a place, filter: {entry: qualifier}, intro: ['These races offer places, sometimes only some places, to runners with a fast enough recent time. Most have other routes in as well.']}
- {slug: travel-packages, title: Marathons with travel packages, short: Travel packages, group: How you get a place, filter: {entry: tour}}
- slug: seven-hours-or-more
  title: Marathons with seven hours or more to finish
  short: Seven hours or more
  group: Pace
  filter: {pace: slow}
  intro: ['A race is listed here if its organizer''s page gives a time limit of at least seven hours for the marathon, or says there is no limit. Some count the time from the gun and some from when the last runner starts, and many also close checkpoints along the way, so read each race page before you plan to walk.']
- slug: walkers-welcome
  title: Marathons that welcome walkers
  short: Walkers welcome
  group: Pace
  filter: {pace: walkers}
  intro: ['A race is listed here only where the organizer''s own page says walkers are welcome or allowed, or runs a walking division. The time limit still applies, so check it against your walking pace.']
