guides:
- slug: how-to-get-a-place
  title: How to get a place in a big marathon
  short: Getting a place
  seo_title: 'How to get into a big marathon: ballots, charity places and more'
  description: The six ways into London, New York, Berlin and the other big marathons, from the ballot to charity places, qualifying times, tour operators and races you can simply enter.
  standfirst: Missing out in the ballot is normal. Here are the other ways to a start line, with what each costs you in time, money and effort.
  detail:
  - h: The ballot is a long shot
    p:
    - For the 2027 London Marathon, 1,338,544 people applied in the public ballot, up 18% on the year before. London says applications from the UK passed a million for the first time. We could not find the number of ballot places on London's own pages, so the exact odds are unknown, but with about 100,000 runners across both days, most applicants miss out.
    - Ballots elsewhere work the same way. Tokyo, Berlin, Chicago, New York, Sydney, Cape Town and, from 2027, Paris all draw places at random. Entering on the first day makes no difference; Paris and Sydney both say so.
  - h: The six ways in
    table:
      head: [Way in, How it works, Examples]
      rows:
      - ['Ballot or lottery', 'Apply in the window and wait for the draw. Many are free to enter, and you pay only if picked.', 'London, Berlin, Tokyo, Paris, Sydney, Big Sur']
      - ['Charity place', 'Charities buy guaranteed places and give them to runners who promise to raise a set sum.', 'London, Chicago, New York, Tokyo, Manchester, Cape Town']
      - ['Qualifying time', 'Run fast enough for your age on a certified course in the qualifying window.', 'Boston (the only way in for most), London Good For Age, Chicago, New York']
      - ['Travel package or tour operator', 'Official tour operators and organisers sell places bundled with a hotel or a whole trip.', 'London, Chicago, Amsterdam, Big Sur, Médoc; the Great Wall only this way']
      - ['Open entry', 'Places go on sale and the fastest buyers get them. Popular races sell out within days.', 'Manchester, Edinburgh, Loch Ness, Amsterdam, Jungfrau, Honolulu']
      - [Earn it, 'Run a set of the organiser''s other races, or one qualifying race, for a guaranteed place the next year.', 'New York (9+1), Marine Corps (the 17.75K), Chicago (Distance Series)']
  - h: Charity places
    p:
    - A charity place is the surest way into a sold-out race if you are willing to fundraise. Each charity sets its own target and rules. Chicago says its charity runners must raise at least $2,500, and Tokyo's charity runners donate at least ¥100,000 or more if their charity asks.
    - Apply early and to more than one charity. London still had a limited number of charity places after its ballot closed, and Manchester's charity places were the only way in once public entries sold out.
  - h: Qualifying times
    p:
    - Boston is the race built on qualifying times. You need a standard for your age group and sex, and even then a place is not certain; for 2027, applicants had to be 5 minutes 17 seconds faster than their standard. Boston adjusts times run on courses with a net drop of more than 1,500 ft (457 m).
    - London's Good For Age places are only for UK residents, with 6,000 a year (3,000 men and 3,000 women); if more apply, London reviews the times. Chicago and New York also offer guaranteed places for fast marathon times; New York does not accept half marathon times run outside its own races.
  - h: Races you can simply enter
    p:
    - Some excellent marathons have no ballot at all. You need to be ready when entries open, because the popular ones go quickly. Manchester sold over 40,000 public places in ten days for 2027; Amsterdam's 32,000 marathon places for 2026 went in a week.
    - Honolulu is the easiest big marathon to get into. Anyone can enter, there is no qualifying time and no time limit. The Athens Marathon, from the town of Marathon to the Panathenaic Stadium, opens about six months ahead and closes when full.
  - h: Plan backwards from the date
    list:
    - Ballots close months ahead. London's closes in early May, a year before the race; Berlin's runs October to November; Chicago's runs in October; Tokyo's general entry is in August.
    - Training for a first marathon takes months, so a spring race means training through the winter.
    - Book flights and a hotel only after your place is confirmed, unless you choose a travel package that includes a place.
  faq:
  - q: What are my chances in the London Marathon ballot?
    a: London's pages we checked do not give the number of ballot places. For 2027, 1,338,544 people applied, so most applicants miss out. Charity places, Good For Age (UK residents) and international tour operators are the other ways in.
  - q: Which big marathons can I enter without a ballot?
    a: Of the races in our finder, Manchester, Edinburgh, Loch Ness, Amsterdam, the Jungfrau-Marathon, Athens and Honolulu sell places direct, but the popular ones sell out quickly.
  - q: How do I get into the Boston Marathon?
    a: Most runners need a qualifying time for their age and sex, run on a certified course in the qualifying window, and then must be fast enough on the cut-off. For 2027 it was 5 minutes 17 seconds.
  - q: Is a charity place worth it?
    a: It is the surest way into a sold-out race, but you commit to raising a set sum, which can run to thousands (Chicago's minimum is $2,500). Read the charity's terms on what happens if you cannot run.
  kit:
  - name: Running shoes
    why: the one thing worth spending on; a running shop can watch you run and suggest a fit
    url: https://www.amazon.co.uk/s?k=running+shoes
  - name: Running belt
    why: holds a phone, gels and a card without bouncing; try it on long runs
    url: https://www.amazon.co.uk/s?k=running+belt+phone
  - name: Anti-chafe balm
    why: for long runs; try it in training, not on the day
    url: https://www.amazon.co.uk/s?k=anti+chafe+balm
  sources:
