about: We list a ride only after opening its organiser's own page, and every fact here comes from that page or another official page linked beside it. Dates, routes, fees and entry rules change every year, so the organiser's page is the one to trust. Being listed does not mean any ride or organiser endorses this site.
safety: A long ride on open or closed roads is hard on the heart and legs. Build up your distance over weeks, follow the event's rules (most require a helmet), and check with your GP (family doctor) before you start training if you have a heart condition or another health worry. In an emergency call 999 or 112 in the UK and Europe (911 in the US).
