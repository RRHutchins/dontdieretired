# Deep hub (RUNBOOK §6u): big bike rides (built 20 Nov 2026; Robin asked for more deep hubs that are popular, bring
# traffic, involve spending and fit the planner). Race-style schema with riding words: `series` is the kind of ride
# (sportive, gran fondo, charity, multi-day, audax). Every fact comes from the organiser's page linked on the row (or a
# `more` link), opened on its `checked` date; no prices; months only where the page says; ids are permanent; the site
# never states a total. Sportives are not races: never call them races in our own words.
id: big-bike-rides
slug: big-bike-rides
category: move
label: Big bike rides
h1: "Big bike rides: sportives, gran fondos and bucket-list rides"
seo_title: 'Cycling sportives and big rides: finder and how to enter'
description: Find a sportive, gran fondo or multi-day ride by region, distance, terrain and how you get a place, from L'Étape du Tour and the Maratona dles Dolomites to the Fred Whitton, RAGBRAI and the Cape Town Cycle Tour.
lead: A big organised ride gives you a signposted route, food stops and other riders around you for a day you will talk about for years. Here is how each one works and how to get a place, checked against the organiser's own page.
intro:
- British Cycling calls sportives personal challenge rides: a signposted route, staffed feed stations and your own pace. Many set cut-off times, a few rank every rider by time, and some multi-day rides cross a whole country or run day and night, like the 1,200 km Paris-Brest-Paris.
- Filter the list below by region, distance, terrain, kind of ride or how you get a place. Every ride links to its organiser's own page, opened on the date shown. Dates, routes and entry rules change every year, so the organiser's page is the last word.
