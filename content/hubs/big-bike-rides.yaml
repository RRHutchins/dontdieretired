guides:
- slug: your-first-sportive
  title: 'Your first sportive: how big organised bike rides work'
  short: Your first sportive
  seo_title: 'Your first sportive: a plain guide for new riders'
  description: What happens on a sportive or challenge ride, how to choose a distance, how ballots, open entry and charity places work, and how to prepare and stay safe.
  standfirst: A sportive is a signposted, supported ride over a set route, which British Cycling calls a personal challenge ride. Here is how they work and how to get ready for your first.
  detail:
  - h: What a sportive is
    p: ['British Cycling calls sportives personal challenge rides: the route is fully signposted for you, there are staffed feed stations to rest and refuel, and the majority offer chip timing so you can see how long you took.', 'Events differ on whether they rank riders. Vätternrundan in Sweden says it is not a race but a challenge, and the Paris-Brest-Paris rules say it has no classification. Others do: the Maratona dles Dolomites places riders by finishing time, and GFNY calls itself a timed race. Read each event''s rules.', 'Many big rides set cut-off times. At the Cape Town Cycle Tour, riders who miss a cut-off must take the sweep bus to the finish; at the Maratona dles Dolomites, riders past certain cut-offs are sent onto a shorter course.']
  - h: Choosing a distance
    p: ['British Cycling says routes usually range from 20 to 100+ miles, often with several distances to choose from. Pick a distance you are confident you can finish.', 'Look at the climbing as well as the length. The Fred Whitton organisers, for example, strongly advise first-timers to get experience on a 100-mile sportive with more than 2,800 m of climbing before taking on theirs.']
  - h: Short and long options on some hub rides
    table:
      head: [Event (from our hub), Short option, Long option]
      rows:
      - [BHF London to Brighton, 20.5 miles (about 33 km), 54 miles (86.9 km)]
      - [Etape Caledonia, 40 miles (64.4 km), 85 miles (136.8 km)]
      - [Cape Town Cycle Tour, 42 km (about 26 miles), 109 km (about 68 miles)]
      - [We Ride Flanders, 80 km (about 50 miles), 240 km (about 149 miles)]
  - h: How places work
    list: ['Open entry: first come, first served until places run out (the Dragon Ride works this way).', 'Ballot or draw: you apply in a set window and places are drawn (Fred Whitton, Maratona dles Dolomites, UNBOUND Gravel).', 'Charity place: a place linked to raising money or donating to a charity (BHF London to Brighton, L''Étape du Tour via Prostate Cancer UK, the Fred Whitton''s guaranteed Special Charity entry).', 'Travel package: some events sell places through official travel agencies or tour operators.', 'Qualifying rides: long audax events such as Paris-Brest-Paris need qualifying brevets first.']
  - h: Getting ready
    p: ['British Cycling suggests planning your training so that a taper week comes before event week, sticking to the fuelling you have already tested in training, and not changing your diet in the final week.', 'Check the course and conditions beforehand so you can pace yourself and plan food stops. British Cycling''s riding tips: don''t start too hard, save your energy for when you really need it, and eat and drink little and often whether or not you feel hungry, choosing food you can eat on the move.', 'British Cycling suggests booking a bike service with about two weeks to spare so any new parts can be ordered, and giving any new kit a test run rather than saving it for the day.']
  - h: Staying safe
    p: ['Many events make helmets compulsory: the BHF London to Brighton will not let you cross the start line without one, and the Maratona dles Dolomites and Mallorca 312 rules require one. The Highway Code advises wearing a helmet that meets current regulations, fits and is securely fastened.', 'Check whether an event''s roads are closed; if they are not, expect traffic. On UK roads the Highway Code says you can ride two abreast, which can be safer in larger groups, but should let drivers behind overtake when it is safe, for example by moving into single file.']
  faq:
  - {q: 'Is a sportive a race?', a: 'British Cycling describes sportives as personal challenge rides on a signposted route, most with chip timing so you know your own time. Some events, such as the Maratona dles Dolomites, do place riders by finishing time, so check each event''s rules.'}
  - {q: 'Do I need to wear a helmet?', a: 'Check the event rules. Many make it compulsory, including the BHF London to Brighton, the Maratona dles Dolomites and the Mallorca 312, and the Highway Code advises wearing one that fits and is securely fastened.'}
  - {q: 'What happens if I am too slow?', a: 'Many big rides have cut-off times. Depending on the event, riders who miss one may be sent onto a shorter course (Maratona dles Dolomites) or taken to the finish by sweep bus (Cape Town Cycle Tour).'}
  - {q: 'How do I get a place on a popular ride?', a: 'It depends on the event: some are open entry until full, some use a ballot, and many offer charity places or travel packages. Each entry in our hub explains how its next edition works.'}
  kit:
  - {name: Cycling helmet, why: 'Check it meets current safety standards, fits snugly and the straps adjust; some events, such as the BHF London to Brighton, will not let you start without one.', url: 'https://www.amazon.co.uk/s?k=road+cycling+helmet'}
  - {name: Saddle bag puncture kit, why: 'Check it holds a spare inner tube that matches your tyre size and valve type, plus tyre levers.', url: 'https://www.amazon.co.uk/s?k=cycling+saddle+bag+puncture+repair+kit'}
  - {name: Mini pump, why: Check it fits your valve type (Presta or Schrader) and can be mounted on your frame., url: 'https://www.amazon.co.uk/s?k=bike+mini+pump+presta'}
  - {name: Cycling water bottles, why: Check the size fits your bottle cages and that the valve is easy to open while riding., url: 'https://www.amazon.co.uk/s?k=cycling+water+bottle+750ml'}
