- slug: treks-you-must-book
  title: 'Permits, quotas and huts: the great walks you have to book'
  short: Treks you must book
  seo_title: 'Trek permits and hut bookings: what to book and when'
  description: 'Milford Track, West Coast Trail, John Muir Trail, Everest Base Camp and more: what you must book before you walk, and how, from the official pages.'
  standfirst: Some of the world's great walks you can simply turn up for. Others sell out quickly, cap walkers each day, or need a licensed guide. Here is what the official pages say, checked on 20 November 2026.
  detail:
  - h: Three kinds of booking
    p: ['Hut and campsite bookings: on New Zealand''s Great Walks, Laugavegur, the Tour du Mont Blanc and the Larapinta Trail you book a bed or pitch before you set off. On the Milford and Routeburn tracks, DOC says that without a valid booking you may be charged a penalty or turned away if the hut is full.', 'Permits and quotas: some trails cap the number of people starting or passing a point each day. The John Muir Trail allows 45 people a day over Donohue Pass from Yosemite; the Overland Track has 34 places a day in its peak period.', 'Guides: in Nepal, listed trekking routes in specific protected areas need a licensed guide and a TIMS card, arranged through a government-registered trekking agency.']
  - h: 'When to book: route by route'
    table:
      head: [Route, What you must book, When booking opens / how]
      rows:
      - [Milford Track (NZ), 'Huts for all 3 nights in the Great Walks season, 1 Nov to 30 Apr; no camping', 'DOC online. 2026/27 opened 9.30am Wed 13 May 2026, with a virtual queue']
      - [Routeburn Track (NZ), Huts and campsites in season, DOC online. 2026/27 opened 9.30am Fri 15 May 2026]
      - [Kepler Track (NZ), Huts and campsites in season (27 Oct to 30 Apr), DOC online. 2026/27 opened 9.30am Tue 19 May 2026]
      - [Abel Tasman Coast Track (NZ), 'Huts and campsites, all year', DOC online. 2026/27 opened 9.30am Thu 14 May 2026]
      - [Heaphy Track (NZ), 'Huts and campsites, all year', DOC online. 2026/27 opened 9.30am Wed 20 May 2026]
      - [Overland Track (Tasmania), 'A booking in the peak period, 1 Oct to 31 May; 34 places a day', Parks and Wildlife Service online. 2026/27 opened Tue 7 July 2026]
      - [Laugavegur (Iceland), Confirmed hut or campsite bookings before you start, Ferðafélag Íslands; huts often sell out in peak season]
      - [Tour du Mont Blanc, Each refuge, Can open as early as April or May; La Chamoniarde points to montourdumontblanc.com]
      - [GR20 (Corsica), 'Every night at the park''s refuges, including bivouac pitches and bunks, must be booked', Online at pnr-resa.corsica; refuges guarded 16 May to 4 Oct in 2026]
      - [Larapinta Trail (Australia), A campsite for each night, 'NT parks online booking system, before you go']
      - [West Coast Trail (Canada), Backcountry Use Permit; no standby spaces, '2026 season opened 8am PT, 5 Feb 2026']
      - [John Muir Trail from Yosemite, Wilderness permit; 45 a day over Donohue Pass, Lottery 24 weeks ahead on Recreation.gov; 40 per cent released 7 days ahead]
      - [Kalalau Trail (Hawai'i), Camping permit beyond Hanakāpī'ai; up to 5 nights, Available 90 days in advance]
      - [Appalachian Trail (USA), 'Permits in the Smokies, Shenandoah and Baxter State Park (Katahdin)', Smokies and Shenandoah via Recreation.gov; Baxter in person at Katahdin Stream ranger station]
      - [Everest Base Camp and Annapurna Circuit (Nepal), Licensed guide and TIMS card, Through a government-registered trekking agency (rule effective from 31 March 2023)]
  - h: Tips for booking day
    list: ['DOC New Zealand advises making a booking account well before opening day, testing your login beforehand, and getting online at around 9.15am on the day.', 'Have a back-up plan: DOC suggests looking at other options if your first choice books out, and Tasmania''s parks service advises planning alternative dates for the Overland Track.', 'Check each route''s own page close to the time: in November 2026 the Tongariro Northern Circuit page said it was not currently operating as a Great Walk while Oturere Hut is replaced, and that part of the track is closed after the 2025 fire.']
  - h: 'Nepal: guide rules'
    p: ['The Nepal Tourism Board says that, from 31 March 2023, trekkers in specific protected areas must be accompanied by a licensed trekking guide and carry a TIMS card (its page heading says ''most trekking routes in the Himalaya''). Its list includes Everest Base Camp, Gokyo, the Three Passes, the Annapurna Circuit, Poon Hill-ABC, Langtang and the Manaslu Circuit.', Registered trekking agencies buy the TIMS card online for you; it comes as an eCard with a QR code.]
  - h: 'Going high: altitude safety'
    p: ['The NHS says altitude sickness usually happens above 2,500 metres, with symptoms such as headache, nausea, tiredness, dizziness and poor sleep, usually 6 to 10 hours after arriving at height.', 'Its advice: go up slowly, spend a few days below 2,500 metres first, and at 3,000 metres or above take a rest day at the same height every 3 to 4 days. Avoid flying straight to high altitude, drink enough water and avoid alcohol.', 'If you feel unwell, stop climbing and rest. If it gets worse or doesn''t improve after a day, go down. Confusion, balance problems or breathlessness at rest need medical help at once. Speak to a GP or travel clinic before going high quickly, or if you have had altitude sickness before.']
  faq:
  - {q: 'Can I book Camino Francés pilgrim hostels ahead?', a: 'Spain''s official tourism site says public pilgrim hostels cannot be booked and are allocated first come, first served. It also lists private hostels, rural houses, hotels and campsites.'}
  - {q: 'Do I need a guide to trek to Everest Base Camp?', a: 'Yes. The Nepal Tourism Board lists the Everest Base Camp trek among routes where a licensed guide and TIMS card are mandatory, arranged through a government-registered trekking agency.'}
  - {q: 'When do New Zealand Great Walk bookings open?', a: 'For 2026/27 they opened in May 2026, staggered by track at 9.30am each day: Milford on 13 May, Abel Tasman on 14 May, Routeburn on 15 May, Kepler on 19 May and Heaphy on 20 May. DOC uses a virtual queue.'}
  - {q: 'Is there one permit for the whole Appalachian or Continental Divide Trail?', a: 'No. The Appalachian Trail Conservancy says there is no single trail-wide permit for the A.T., and the CDT Coalition says no long-distance permit covers the CDT. You get permits area by area.'}
  kit:
  - {name: Bear-resistant food canister, why: Required throughout Yosemite and in Rocky Mountain National Park on the CDT. Check it is a model the park allows before you buy., url: 'https://www.amazon.co.uk/s?k=bear+resistant+food+canister'}
  - {name: Personal locator beacon, why: DOC lists one in the winter kit for the Routeburn and Tongariro Northern Circuit. Check it is registered for the country you will use it in., url: 'https://www.amazon.co.uk/s?k=personal+locator+beacon'}
  - {name: Trekking poles, why: 'Laugavegur has at least three rivers to wade, and poles can help on steep descents. Check the packed length fits your rucksack and the locks are easy to work with cold hands.', url: 'https://www.amazon.co.uk/s?k=trekking+poles'}
  - {name: Waterproof dry bags, why: For wet crossings and rain-heavy routes like the Kumano Kodo. Check the size and roll-top seal., url: 'https://www.amazon.co.uk/s?k=waterproof+dry+bag'}
  sources:
