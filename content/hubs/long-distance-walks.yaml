- id: offas-dyke-path
  name: Offa's Dyke Path
  series: national-trail
  place: Sedbury Cliffs near Chepstow to Prestatyn
  country: Wales and England
  continent: europe
  km: [285]
  distances: 285 km (177 miles); the whole walk takes a couple of weeks or more
  terrain: [hills]
  format: single
  entry: [any]
  entry_note: The route is very well waymarked, but carry a guidebook or map. You can walk it all or in short stretches. Most people walk between April and October, though it can be walked right through the year.
  note: Often follows Offa's Dyke, an 8th-century earthwork, and passes Chepstow, Monmouth, Hay-on-Wye and Llangollen. The Hatterrall Ridge in the Brecon Beacons and the Clwydian Range can be hard going in bad weather; the flattest part follows the River Severn and the Montgomeryshire Canal.
  activity: walk-offas-dyke-path
  link: {label: 'National Trails: Offa''s Dyke Path', url: 'https://www.nationaltrail.co.uk/en_GB/trails/offas-dyke-path/', checked: '2026-11-20'}
- id: hadrians-wall-path
  name: Hadrian's Wall Path
  series: national-trail
  place: Wallsend, Tyne and Wear to Bowness-on-Solway, Cumbria
  country: England
  continent: europe
  km: [135]
  distances: 135 km (84 miles); around 6 to 7 days for experienced walkers
  terrain: [hills, lowland]
  format: single
  entry: [any]
  entry_note: Open all year, but GOV.UK recommends visiting between Easter and October for conservation reasons; it is very popular, particularly in July and August. Waymarked with the acorn, with signposts showing both directions. GOV.UK gives an example split into six sections. Between Easter and October you can buy a trail passport and collect seven stamps along the way.
  note: Passes the Roman forts at Segedunum, Chesters, Housesteads and Birdoswald. Chollerford to Birdoswald (23 miles, 37 km) is a switchback of short climbs and descents. Parts of the Solway coast are at sea level and can be affected by tidal flooding, so check tide times.
  activity: walk-hadrians-wall-path
  link: {label: 'GOV.UK: Hadrian''s Wall Path National Trail', url: 'https://www.gov.uk/government/publications/visit-a-national-trail-in-england/hadrians-wall-path-national-trail', checked: '2026-11-20'}
