- id: peddars-way-norfolk-coast-path
  name: Peddars Way and Norfolk Coast Path
  series: national-trail
  place: Knettishall Heath to Holme-next-the-Sea, then the Norfolk coast from Sutton Bridge to Hopton-on-Sea
  country: England
  continent: europe
  km: [254]
  distances: '254 km (158 miles) in all: Peddars Way 74 km (46 miles), about 4 days; Norfolk Coast Path 180 km (112 miles), about 10 days; about 14 days for both'
  terrain: [lowland, coast]
  format: single
  entry: [any]
  entry_note: Open all year. Waymarked with the acorn or trail name; there are steps but no stiles. Walk it all, one or two sections, or local circular walks. Check tide times around Cromer and Mundesley, where you can be cut off by rising tides. Peddars Way near Thorpe Woodlands, Shadwell, can flood in winter; an alternative route is available.
  note: 'Gentle gradients: often sandy tracks through the Brecks, then sandy beaches, dunes, shingle, saltmarsh and mudflats. Birds at The Wash and Cley next the Sea, Castle Acre castle and priory ruins, and reserves at Holkham, Blakeney and Titchwell Marsh. The Norfolk Coast Path is part of the King Charles III England Coast Path.'
  activity: walk-the-norfolk-coast-path
  link: {label: 'GOV.UK: Peddars Way and Norfolk Coast Path National Trail', url: 'https://www.gov.uk/government/publications/visit-a-national-trail-in-england/peddars-way-and-norfolk-coast-path-national-trail', checked: '2026-11-20'}
- id: yorkshire-wolds-way
  name: Yorkshire Wolds Way
  series: national-trail
  place: Hessle, East Riding of Yorkshire to Filey Brigg, North Yorkshire
  country: England
  continent: europe
  km: [127]
  distances: 127 km (79 miles); about 6 days
  terrain: [lowland]
  format: single
  entry: [any]
  entry_note: Open all year. Very well waymarked with the acorn or trail name; no stiles. GOV.UK gives an example split into six sections; there are beds in South Cave, Fridaythorpe and Thixendale, but Wintringham has no facilities. The National Trails site says May and September are the most popular months, and suggests June to early July for poppies.
  note: Gentle chalk country with dry valleys and, with a few short exceptions, no serious hills. Passes the deserted medieval village of Wharram Percy and artworks from the WANDER project, with red kites near Londesborough. It ends at Filey Brigg, where a sculpture marks the end of both this trail and the Cleveland Way.
  link: {label: 'National Trails: Yorkshire Wolds Way', url: 'https://www.nationaltrail.co.uk/en_GB/trails/yorkshire-wolds-way/', checked: '2026-11-20'}
  more:
  - {label: 'GOV.UK: Yorkshire Wolds Way National Trail', url: 'https://www.gov.uk/government/publications/visit-a-national-trail-in-england/yorkshire-wolds-way-national-trail', checked: '2026-11-20'}
- id: glyndwrs-way
  name: Glyndŵr's Way
  series: national-trail
  place: Knighton, Powys to Welshpool, Powys
  country: Wales
  continent: europe
  km: [217]
  distances: 217 km (135 miles)
  terrain: [hills]
  format: single
  entry: [any]
  entry_note: Walk it in one go or as a series of day walks, at any time of year. Some accommodation closes in winter, and being able to navigate by compass is very welcome in mist. The interactive map on the National Trails site shows places to stay.
  note: Very hilly, over open moorland, farmland, woodland and forest, sometimes rough and remote; the highest point is Foel Fadian (510 m, 1,530 ft). Passes the Clywedog Reservoir and crosses heather-clad Plynlimon, with views including Lake Vyrnwy, Cadair Idris and the Dulas valley to Machynlleth.
  link: {label: 'National Trails: Glyndŵr''s Way', url: 'https://www.nationaltrail.co.uk/en_GB/trails/glyndwrs-way/', checked: '2026-11-20'}
- id: coast-to-coast
  name: Coast to Coast Path
  series: national-trail
  place: St Bees, Cumbria to Robin Hood's Bay, North Yorkshire
  country: England
  continent: europe
  km: [306]
  distances: 306 km (190 miles); around 13 days with a rest day
  terrain: [hills]
  format: single
  entry: [any]
  entry_note: Open all year, though some high-level sections may be difficult in winter or bad weather; low-level options avoid some of them. Waymarked with the acorn or trail name (some signs show 'AW'), but in the Lake District National Park waymarking usually stops above the fell wall. Most people walk west to east.
  note: Officially launched as England's newest National Trail on 26 March 2026; the route was first imagined by Alfred Wainwright in 1973. It goes through the Lake District, Yorkshire Dales and North York Moors national parks. Patterdale to Shap is one of the most challenging sections. In March 2026 GOV.UK said a stone marker would be installed permanently at Keld to mark halfway.
  activity: walk-coast-to-coast
  link: {label: 'GOV.UK: Coast to Coast Path National Trail', url: 'https://www.gov.uk/government/publications/visit-a-national-trail-in-england/coast-to-coast-path-national-trail', checked: '2026-11-20'}
