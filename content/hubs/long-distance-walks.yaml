h1: "Long-distance walks and treks: from the Pennine Way to the Pacific Crest Trail"
seo_title: 'Long-distance walks and treks: route finder'
description: Find a long-distance walk by region, length, terrain and what you must book, from the Pennine Way and West Highland Way to the Camino, the Tour du Mont Blanc, the Milford Track and the Appalachian Trail, from official pages.
lead: Some of the world's great walks need nothing but boots and a bed for the night. Others need a permit, a hut booked months ahead or a licensed guide. Here is how each one works, checked against the official page.
intro:
- A long-distance walk can be done end to end in one go, in a string of long weekends, or one favourite day at a time. Britain's National Trails are waymarked with an acorn from end to end, and the Wales Coast Path says you need no permit or pass. A few of the world's best-known treks are rationed by permits, quotas or hut bookings that open months ahead.
- Filter the list below by region, length, terrain, network or what you have to book. Every route links to its official page (a trail authority, national park or government body), opened on the date shown. Conditions, closures and booking rules change, so check the official page before you go.
