# Deep hub (RUNBOOK §6u): long-distance walks and treks (built 20 Nov 2026; Robin asked for more deep hubs that are
# popular, bring traffic, involve spending and fit the planner). Race-style schema with walking words: `series` is the
# trail network, `entry` is what you must book, `format` is single for every route. Every fact comes from the official
# page linked on the row (or a `more` link), opened on its `checked` date; no prices; months only where an official page
# gives a season; ids are permanent; the site never states a total.
