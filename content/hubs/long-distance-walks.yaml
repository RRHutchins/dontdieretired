  entry: [any]
  entry_note: Advance booking of beds is essential; some B&Bs close out of season. Ballindalloch is a former station, not a village, so beds there are hard to find. Many companies offer accommodation booking and baggage transfer. Waymarking is good. Wild camping is legal if done responsibly under the Scottish Outdoor Access Code.
  note: Follows the Spey from the coast through pine forest and moorland, past distilleries (the page names Aberlour and Glenlivet) and the Scottish Dolphin Centre at Spey Bay. Parts between Ballindalloch and Grantown can be slow going, and some sections between Ballindalloch and Cromdale are challenging when wet. The Tomintoul spur crosses exposed moorland where you need map and compass in poor visibility.
