- id: pennine-way
  name: Pennine Way
  series: national-trail
  place: Edale, Derbyshire to Kirk Yetholm, Scottish Borders
  country: England
  continent: europe
  km: [431]
  distances: 431 km (268 miles); around 16 to 19 days for the whole trail
  terrain: [hills]
  format: single
  month: [5, 6, 7, 8, 9]
  entry: [any]
  entry_note: 'The trail is open all year and waymarked with the acorn symbol or the trail name on gates and signposts, which point both ways. You don''t have to walk it all at once: it splits into day-sized sections such as Edale to Crowden (16 miles, 26 km). Some sections have no amenities at all, so plan beds and food carefully. The National Trails site suggests mid-May to September as the best months.'
  note: Paths range from firm and smooth to narrow, wet and boggy, and the route is hilly and remote in places; expect snow on the northern sections in winter. Named highlights include Kinder Scout (scene of the 1932 Mass Trespass), Malham Cove, Pen-y-ghent, High Cup Nick, Cross Fell, Hadrian's Wall and The Cheviot.
  activity: walk-the-pennine-way
  link: {label: 'National Trails: Pennine Way', url: 'https://www.nationaltrail.co.uk/en_GB/trails/pennine-way/', checked: '2026-11-20'}
