  entry_note: Very well waymarked, but carry a guidebook or map. Beds can be hard to find, especially for single nights, so book well ahead. On the Dale to Neyland section, check tide tables for the two tidal crossings; check current opening times for the military range (Range East).
  note: Clifftops, coves, beaches and estuaries, with large castles at Pembroke, Tenby and Manorbier, occasional grey seals and gannets out to sea. No services between Poppit and Newport Sands. The Wales Coast Path site says it forms part of the Wales Coast Path.
