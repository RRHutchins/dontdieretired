- id: south-west-coast-path
  name: South West Coast Path
  series: national-trail
  place: Minehead, Somerset to Poole Harbour, Dorset (end marker at South Haven Point)
  country: England
  continent: europe
  km: [1014]
  distances: 1,014 km (630 miles); about 30 to 56 days, and the path's own site says 7 to 8 weeks on average
  climb: over 115,000 ft (35,000 m) of ascent and descent
  terrain: [coast]
  format: single
  entry: [any]
  entry_note: Open all year. Most people walk it over several visits; GOV.UK gives an example split into eight sections of 6 to 7 days each. Signposted all the way with the acorn, with distance markers and big markers at Minehead, Porthallow (the mid-point) and South Haven Point. You have to take a number of ferries to cross estuaries. The path's official site has pages on places to stay and baggage transfer.
  note: Steep hills and rugged clifftop paths, with exposed walking between Westward Ho! and Padstow. Passes two World Heritage Sites, the Cornwall and West Devon Mining Landscape and the Jurassic Coast.
  activity: walk-south-west-coast-path
  link: {label: 'GOV.UK: South West Coast Path National Trail', url: 'https://www.gov.uk/government/publications/visit-a-national-trail-in-england/south-west-coast-path-national-trail', checked: '2026-11-20'}
  more:
