- id: cotswold-way
  name: Cotswold Way
  series: national-trail
  place: Chipping Campden to Bath
  country: England
  continent: europe
  km: [164]
  distances: 164 km (102 miles); around 7 to 10 days
  terrain: [hills, lowland]
  format: single
  entry: [any]
  entry_note: Open all year. Very well waymarked, but carry a guidebook or map. The National Trails site breaks it into 15 sections; GOV.UK says most people walk north to south. There are a good number of B&Bs, hotels, self-catering places, campsites and glamping sites. The National Trails site says it is not legal to wild camp on the Cotswold Way.
  note: Follows the Cotswold Edge escarpment, with many steep climbs. Historic sites on the way include Broadway Tower, the Neolithic burial chamber at Belas Knap, Sudeley Castle and Hailes Abbey, and finishes in the World Heritage city of Bath.
  activity: walk-the-cotswold-way
