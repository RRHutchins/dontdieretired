  format: single
  entry: [any]
  entry_note: 'Open all year; the National Trails site says ''The best months to visit are spring through to the end of autumn''. Very well waymarked. Sections between Thames Head and Oxford can flood in winter: check flood warnings and river levels, and do not walk through flood water.'
  note: Mostly flat, with a few natural slopes, through Oxford, Reading and London to the Thames Barrier, passing Windsor Castle and Hampton Court Palace. You can collect stamps at over 30 stamping stations along the route. The National Trails site gives the length as about 184 miles (294 km).
  activity: walk-the-thames-path
