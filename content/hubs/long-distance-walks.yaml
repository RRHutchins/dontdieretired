  entry_note: The Pacific Crest Trail Association says permits are required in some but not all areas. It issues the PCT Long-distance Permit one year at a time, with a separate registration each year; permits are limited and the most popular trips fill quickly. On the shared John Muir Trail section, camping between Crabtree Meadows and the Mount Whitney summit needs an extra permit from Sequoia-Kings Canyon National Park.
  note: The US Forest Service page says the Pacific Crest National Scenic Trail crosses many jurisdictions, including 25 national forest units, 6 national park units and 51 wilderness areas. It gives 500 miles for Washington and 430 for Oregon.
  activity: hike-pacific-crest-trail-section
  link: {label: 'US Forest Service: Pacific Crest National Scenic Trail, geographic areas', url: 'https://www.fs.usda.gov/trails/pacific-crest-nst/geographic-areas', checked: '2026-11-20'}
  more:
  - {label: 'PCTA: Permits', url: 'https://www.pcta.org/discover-the-trail/permits/', checked: '2026-11-20'}
  - {label: 'PCTA permit site: Frequently Asked Questions', url: 'https://permit.pcta.org/docs/frequently-asked-questions/', checked: '2026-11-20'}
- id: john-muir-trail
  name: John Muir Trail
  series: independent
  place: Yosemite Valley to Mount Whitney, Sierra Nevada, California
  country: USA
  continent: north-america
  km: [339.5]
  distances: 211 miles (about 339.5 km)
  terrain: [mountain]
  format: single
  entry: [permit]
  entry_note: For a continuous hike starting in Yosemite you need only one Yosemite wilderness permit for the whole trip. Only 45 hikers a day may exit over Donohue Pass (15 from Happy Isles, 30 from Lyell Canyon). Sixty per cent of reservations go by lottery 24 weeks ahead on Recreation.gov; the other 40 per cent are released seven days ahead. Reservations are only for trips from May to October. Bear canisters are required throughout Yosemite.
  note: It ends on Mount Whitney, which the NPS calls the highest point in the contiguous United States. There is no public transport between Whitney Portal and Yosemite.
  link: {label: 'NPS Yosemite: John Muir and Pacific Crest Trails', url: 'https://www.nps.gov/yose/planyourvisit/jmt.htm', checked: '2026-11-20'}
  more:
  - {label: 'NPS Yosemite: Wilderness Permit Reservations', url: 'https://www.nps.gov/yose/planyourvisit/wpres.htm', checked: '2026-11-20'}
- id: continental-divide-trail
  name: Continental Divide Trail
  series: us-nst
  place: Mexican border in New Mexico's bootheel to Waterton Lake on the Canadian border, through New Mexico, Colorado, Wyoming, Idaho and Montana
  country: USA
  continent: north-america
  km: [4988]
  distances: 3,100 miles (about 4,988 km); the Continental Divide Trail Coalition says a thru-hike can take 5 to 7 months
  terrain: [mountain]
  format: single
  entry: [permit]
  entry_note: 'The Coalition says no long-distance permit covers the CDT, so you need permits area by area. Examples it gives: a Blackfeet Nation Fish & Wildlife Recreation Permit; wilderness camping permits in Glacier National Park; Yellowstone backcountry permits obtained in person no more than 48 hours before your trip through the park; paid backcountry camping in Rocky Mountain National Park, where hard-sided bear canisters are required; and a permit to camp in the Indian Peaks Wilderness.'
  note: State lengths on the Forest Service page are 820 miles in New Mexico, 750 in Colorado, 510 in Wyoming and 1,020 in Montana and Idaho.
  link: {label: 'US Forest Service: Continental Divide National Scenic Trail, geographic areas', url: 'https://www.fs.usda.gov/trails/continental-divide-nst/geographic-areas', checked: '2026-11-20'}
  more:
  - {label: 'Continental Divide Trail Coalition: Thru-hiking the CDT', url: 'https://cdtcoalition.org/explore-the-trail/thruhiking/', checked: '2026-11-20'}
- id: west-coast-trail
  name: West Coast Trail
  series: independent
  place: Pachena Bay (north) to Gordon River (south), Pacific Rim National Park Reserve, Vancouver Island
  country: Canada
  continent: north-america
  km: [75]
  distances: 75 km (about 47 miles); most people spend 6 to 8 days
  terrain: [coast]
  format: single
  month: [5, 6, 7, 8, 9]
  entry: [permit]
  entry_note: A West Coast Trail Backcountry Use Permit is required for all users. There are no standby spaces; all spaces are reservable. Reservations for the 2026 season opened at 8am PT on 5 February 2026. Everyone must view the Hiker Safety Primer and attend a briefing at a trailhead before starting.
  note: Open and reservable from 1 May to 30 September. Parks Canada mentions more than 100 ladder systems and says the trail should only be attempted by seasoned backcountry hikers with multi-day trek experience; it is not recommended for children under 12.
  link: {label: 'Parks Canada: West Coast Trail, hike of a lifetime', url: 'https://parks.canada.ca/pn-np/bc/pacificrim/activ/sco-wct', checked: '2026-11-20'}
- id: kalalau-trail
  name: Kalalau Trail (Nāpali Coast)
  series: independent
  place: Ke'e Beach (Hā'ena State Park) to Kalalau Beach, Kaua'i, Hawai'i
  country: USA
  continent: oceania
  km: [17.7]
  distances: 11 miles (about 17.7 km) one way, 22 miles return
  terrain: [coast]
  format: single
  entry: [permit]
  entry_note: Anyone going beyond Hanakāpī'ai must have a valid camping permit, currently available 90 days in advance; the maximum stay in Nāpali Coast State Park is 5 nights. Hā'ena State Park needs an advance entry reservation (gohaena.com); Kalalau camping permit holders don't need the entry reservation, but overnight parking for them is reserved through the same site.
  note: Hawai'i State Parks says the trail crosses five valleys and is almost never level, and warns of flash floods and falling rocks.
  link: {label: 'Hawai''i DLNR State Parks: Kalalau Trail', url: 'https://dlnr.hawaii.gov/dsp/hiking/kauai/kalalau-trail/', checked: '2026-11-20'}
guides:
- slug: planning-a-long-distance-walk
  title: Planning a long-distance walk
  short: Planning a long walk
  seo_title: 'Planning a long-distance walk: a practical guide'
  description: 'How to plan a multi-day trail walk in the UK: choosing a route, sections or end to end, waymarks, beds and baggage, feet, weather, access codes and emergencies.'
  standfirst: A long-distance trail is a run of ordinary walking days strung together. Get the planning right and the walking takes care of itself.
  detail:
  - h: Choose your trail
    p: ['England and Wales have National Trails. A GOV.UK announcement says England has 17, including the Coast to Coast Path, officially launched as a National Trail on 26 March 2026. Scotland has its Great Trails, and Wales also has the 870-mile Wales Coast Path.', 'Start with the official trail page. It tells you the length, the usual number of days, the terrain and where it is remote. The National Trails site suggests the Thames Path for people new to long-distance walking.']
  - h: Typical lengths and days (from the official pages)
    table:
      head: [Trail, Length, Usual time]
      rows:
      - [Yorkshire Wolds Way, 127 km (79 miles), about 6 days]
      - [Hadrian's Wall Path, 135 km (84 miles), 6 to 7 days for experienced walkers]
      - [South Downs Way, 160 km (100 miles), 8 or 9 days]
      - [West Highland Way, 154 km, 5 to 8 days]
      - [Coast to Coast Path, 306 km (190 miles), around 13 days with a rest day]
      - [Pennine Way, 431 km (268 miles), 16 to 19 days]
  - h: Sections or end to end
    p: ['You don''t have to walk a trail in one go. The GOV.UK trail pages suggest ways to split each route into sections, and most people walk the South West Coast Path over several visits.', 'Walking in sections lets you choose your weather, go home between stretches and build up fitness. End to end needs more planning but gives you the full journey.']
  - h: Follow the waymarks, but carry a map
    p: ['National Trails are waymarked with an acorn symbol or the trail name, for example on gates and signposts, and GOV.UK says signposts show the route in both directions. Diversions and closures are signposted, so follow them.', 'Waymarks are not a substitute for a map. On the Coast to Coast, waymarking usually stops above the fell wall in the Lake District National Park, and on the Southern Upland Way map and compass are essential in poor visibility.']
  - h: Book beds and baggage transfer
    p: ['On popular trails, book early. The West Highland Way and Speyside Way pages say advance booking is essential, and the Pembrokeshire Coast Path page warns that beds can be hard to find, especially for single nights.', 'On several trails, such as the West Highland Way and Speyside Way, companies offer accommodation booking and baggage transfer. On some routes, such as the South Downs Way, many beds are in villages off the trail, so allow time to get there.', 'Wild camping rules differ. The National Trails site says it is not legal on the Cotswold Way, while in Scotland the Great Trails pages say it is legal if done responsibly under the Scottish Outdoor Access Code. From 1 March to 30 September, Loch Lomond & The Trossachs National Park byelaws allow wild camping only in designated zones booked in advance.']
  - h: Train up
    p: ['Build up to back-to-back days at the distance you plan to walk, wearing the boots and pack you will use. The National Trails site says reasonably fit people who can comfortably walk about 12 miles (20 km) a day should manage the South Downs Way.', AdventureSmartUK advises planning around the skills and knowledge of the least experienced person in your group.]
  - h: Look after your feet
    list: ['Wear comfortable, well-fitting shoes and break new ones in with short walks first.', 'Wear thick, moisture-wicking socks and change them often if your feet sweat.', 'If you get a blister, keep it clean and cover it with a soft plaster or padded dressing. Don''t burst it or peel off the skin.', 'A pharmacist can suggest a dressing; the NHS says a hydrocolloid dressing can protect the blister, ease pain and help it heal. Use NHS 111 if a blister is very painful or keeps coming back, and do not ignore signs of infection such as heat or yellow or green pus.']
  - h: Weather and mountain safety
    p: ['AdventureSmartUK suggests three questions before you set off: do I have the right gear, do I know what the weather will be like, and do I have the skills and knowledge for the day?', 'It also suggests checking the forecast for the highest point on your route, setting out in good time, carrying a torch even if you plan to be back long before dark, and being flexible about changing your plans.', 'On coast paths, check tide times. Parts of the Solway coast on Hadrian''s Wall Path can be affected by tidal flooding, you can be cut off by rising tides around Cromer, and White Park Bay on the Causeway Coast Way should be avoided at high tide.']
  - h: Follow the access code
    p: ['In England, follow the Countryside Code: leave gates as you found them, keep dogs on a lead around livestock, take your litter home, and check your route, weather and tide times before you go.', 'In Scotland, the Scottish Outdoor Access Code has three principles: take responsibility for your own actions, respect the interests of others and care for the environment.']
  - h: Tell someone and know who to call
    p: ['The Countryside Code says to tell someone where you are going and when you expect to be back, and notes that phone signals are unreliable in many places.', 'In an emergency in the UK, call 999 or 112. In the hills or mountains ask for Police, then Mountain Rescue; on the coast ask for the Coastguard.', 'Have ready your location (a grid reference if possible), the casualty''s name, sex, age and injuries, how many are in your group and your mobile number. Then stay where you are until the team contacts you.', 'If you have hearing or speech difficulties, register with emergencySMS before you go by texting ''register'' to 999.']
  faq:
  - {q: 'How many days does a National Trail take?', a: 'It depends on the trail. GOV.UK gives about 6 days for the Yorkshire Wolds Way, 8 or 9 for the South Downs Way, around 13 for the Coast to Coast and 16 to 19 for the Pennine Way.'}
  - {q: 'Do I need a permit for a UK long-distance trail?', a: 'None of the official UK trail pages we checked mentions a walking permit, and the Wales Coast Path site says you don''t need a permit or a pass. You may need to book beds well ahead, and from 1 March to 30 September wild camping on part of the West Highland Way is allowed only in designated zones booked in advance.'}
  - {q: 'Can I wild camp on a long-distance trail?', a: 'In Scotland, the Great Trails pages say wild camping is legal if done responsibly under the Scottish Outdoor Access Code, but Loch Lomond & The Trossachs National Park byelaws limit it to booked zones from 1 March to 30 September. In England, the Countryside Code says camping may need the landowner''s permission, and the National Trails site says it is not legal to wild camp on the Cotswold Way.'}
  - {q: 'Who do I call if something goes wrong in the hills?', a: 'Call 999 or 112 and ask for Police, then Mountain Rescue. On the coast, ask for the Coastguard.'}
  kit:
  - {name: Walking socks, why: 'Check they are thick, such as moisture-wicking sports socks, as the NHS suggests, and that they fit your boots without bunching.', url: 'https://www.amazon.co.uk/s?k=moisture+wicking+walking+socks'}
  - {name: Hydrocolloid blister plasters, why: 'Check the size suits heels and toes and that they are hydrocolloid, the type the NHS mentions.', url: 'https://www.amazon.co.uk/s?k=hydrocolloid+blister+plasters'}
  - {name: Head torch, why: 'Check the battery type and burn time, and pack spare batteries.', url: 'https://www.amazon.co.uk/s?k=head+torch+walking'}
  - {name: Baseplate compass, why: 'Check it has a clear baseplate with scales that match your map, and learn to use it before you rely on it.', url: 'https://www.amazon.co.uk/s?k=baseplate+compass+walking'}
