  format: single
  entry: [any]
  entry_note: Open all year. Waymarked with the acorn, with signposts showing both directions, and there are no stiles. GOV.UK gives an example split into nine sections. Staithes, Sandsend, Whitby, Robin Hood's Bay and Ravenscar have food and beds; there are hourly buses between Robin Hood's Bay and Scarborough and trains or buses between Scarborough and Filey.
  note: Moorland first, then coast; GOV.UK says it can be challenging in places, especially the coastal sections. Passes Rievaulx Abbey, the White Horse of Kilburn, Whitby Abbey and Boulby Cliff (203 m), the highest cliff on England's east coast, with Roseberry Topping in view.
