  - {label: 'GOV.UK: ''Wainwright way'' becomes England''s newest National Trail', url: 'https://www.gov.uk/government/news/wainwright-way-becomes-englands-newest-national-trail', checked: '2026-11-20'}
- id: west-highland-way
  name: West Highland Way
  series: great-trail
  place: Milngavie (Glasgow) to Fort William
  country: Scotland
  continent: europe
  km: [154]
  distances: 154 km (about 96 miles); 5 to 8 days, and first-timers should allow at least 7 or 8
  climb: 3,155 m of ascent
  terrain: [hills]
  format: single
  entry: [any]
  entry_note: Advance booking of beds is essential. Many companies offer accommodation booking and baggage transfer. Well waymarked; map-and-compass skills are useful but not essential. From 1 March to 30 September, National Park byelaws allow wild camping only in designated zones, booked in advance (this affects Drymen to north of Rowardennan).
  note: Runs through Loch Lomond & The Trossachs National Park, with views from Conic Hill, and across very exposed Rannoch Moor, then up the Devil's Staircase with views over Glen Coe. Ben Lomond and Ben Nevis are optional extra climbs.
  activity: walk-west-highland-way
  link: {label: 'Scotland''s Great Trails: West Highland Way', url: 'https://www.scotlandsgreattrails.com/trail/west-highland-way/', checked: '2026-11-20'}
- id: great-glen-way
  name: Great Glen Way
  series: great-trail
  place: Fort William to Inverness
  country: Scotland
  continent: europe
  km: [125]
  distances: 125 km (about 78 miles); 5 to 7 days
  climb: 1,230 m on the original route, 1,835 m on the High Route
  terrain: [lowland, hills]
  format: single
  entry: [any]
  entry_note: Beds along the way, but limited in Gairlochy and South Laggan, so Spean Bridge or Invergarry are suggested. A number of companies offer support services, including baggage transfer. Wild camping is legal in Scotland if done responsibly under the Scottish Outdoor Access Code. South-west to north-east is the recommended direction.
  note: Canal towpath, forest tracks and old drove and military roads, past Neptune's Staircase on the Caledonian Canal. The optional High Route has steep sections, reaches 422 m between Invermoriston and Drumnadrochit and gives views over Loch Ness.
