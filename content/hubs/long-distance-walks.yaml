- id: south-downs-way
  name: South Downs Way
  series: national-trail
  place: Winchester, Hampshire to Eastbourne, East Sussex
  country: England
  continent: europe
  km: [160]
  distances: 160 km (100 miles); around 8 or 9 days
  terrain: [hills]
  format: single
  entry: [any]
  entry_note: Open all year; the chalk drains and dries quickly. Very well waymarked; National Trails carry the acorn symbol or the trail name. Many places to stay are in villages off the trail, so allow time to get to and from it. Busiest at weekends and in school holidays between May and September. The National Trails site says reasonably fit people who can comfortably walk about 12 miles (20 km) a day should manage it.
  note: Shared with cyclists and horse riders. Highlights include the Seven Sisters, the Devil's Dyke valley, the Iron Age hill fort of Chanctonbury Ring and the Long Man of Wilmington; Butser Hill (270 m) is the highest point.
  activity: walk-the-south-downs-way
  link: {label: 'GOV.UK: South Downs Way National Trail', url: 'https://www.gov.uk/government/publications/visit-a-national-trail-in-england/south-downs-way-national-trail', checked: '2026-11-20'}
