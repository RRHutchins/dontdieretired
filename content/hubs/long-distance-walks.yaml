- id: north-downs-way
  name: North Downs Way
  series: national-trail
  place: Farnham, Surrey to Dover, Kent
  country: England
  continent: europe
  km: [246]
  distances: 246 km (153 miles); around 12 days
  terrain: [lowland, hills]
  format: single
  entry: [any]
  entry_note: Open all year; some sections get muddy in wet weather. Signposts show the route in both directions. GOV.UK gives example sections, such as Farnham to Guildford (11 miles, 17.7 km). From Wye you can go to Dover either via Chilham and Canterbury (the Canterbury Loop) or along the Heritage Coast via Folkestone.
  note: Much of it is on fairly level ground, with steep climbs and descents in places; Guildford to Reigate has a number of hills and may be harder. Passes Box Hill, Kit's Coty, Leeds Castle and Canterbury Cathedral and ends over the White Cliffs of Dover. The National Trails route page gives the same 153 miles as 245 km.
  link: {label: 'GOV.UK: North Downs Way National Trail', url: 'https://www.gov.uk/government/publications/visit-a-national-trail-in-england/north-downs-way-national-trail', checked: '2026-11-20'}
