about: We list a route only after opening its official page (a trail authority, national park, government or official tourism body), and every fact here comes from that page or another official page linked beside it. Diversions, permits and booking rules change, so the official page is the one to trust. Being listed does not mean any of these bodies endorses this site.
safety: Walk within your fitness and experience, carry a map and know your route, check the forecast, and tell someone where you are going. In an emergency call 999 or 112 in the UK (911 in the US); in the UK mountains ask for the police, then mountain rescue. High-altitude treks carry a risk of altitude sickness; see your GP (family doctor) before you book if you have a heart or lung condition.
