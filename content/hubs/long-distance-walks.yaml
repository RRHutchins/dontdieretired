- id: the-ridgeway
  name: The Ridgeway
  series: national-trail
  place: Overton Hill near Avebury, Wiltshire to Ivinghoe Beacon, Buckinghamshire
  country: England
  continent: europe
  km: [139]
  distances: 139 km (87 miles); about 6 days at roughly 15 miles (24 km) a day
  terrain: [hills]
  format: single
  entry: [any]
  entry_note: Open all year. Waymarked with the acorn or trail name; no stiles. GOV.UK gives an example split into six sections. West of the Thames the route is often far from villages; Ogbourne St George to Sparsholt Firs is considered the most remote section. East of the Thames it passes villages and small towns with facilities.
  note: Mostly off-road, on rolling chalk downland in the west and through Chiltern beech woods in the east, and muddy when wet. Starts in the Avebury World Heritage Site and passes Barbury Castle Iron Age fort and white horses cut into the chalk. Horse riders and mountain bikers can use Overton Hill to Streatley-on-Thames.
  activity: walk-the-ridgeway
  link: {label: 'GOV.UK: The Ridgeway National Trail', url: 'https://www.gov.uk/government/publications/visit-a-national-trail-in-england/the-ridgeway-national-trail', checked: '2026-11-20'}
