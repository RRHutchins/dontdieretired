description: Find an open-water swim by region, distance, water and how you get a place, from the Great North Swim and Swim Serpentine to the Dart 10k, Lake Zurich, Rottnest and the English Channel.
lead: Open-water events range from a mile in a lake with a kayak never far away to a channel crossing behind a pilot boat. Here is how each one works and how to get a place, checked against the organiser's own page.
intro:
- A first open-water event is usually a mile or so in a lake, with waves of swimmers, wetsuits allowed and safety kayaks on the water. From there the distances grow to 10 km river swims, crossings between continents and the channel swims that need a pilot boat booked years ahead.
- Filter the list below by region, distance, water, kind of swim or how you get a place. Every swim links to its organiser's or governing association's own page, opened on the date shown. Dates, distances and rules change every year, so the official page is the last word.
