about: We list a swim only after opening its organiser's or governing association's own page, and every fact here comes from that page or another official page linked beside it. Dates, distances and safety rules change every year, so the official page is the one to trust. Being listed does not mean any swim or organiser endorses this site.
safety: Cold water can cause cold water shock even on a warm day. Never swim alone, build up gradually, and follow the event's safety briefing. If you get into trouble, the RNLI's advice is to float on your back until you can control your breathing. In an emergency call 999 or 112 and ask for the coastguard at the coast (911 in the US). Check with your GP (family doctor) first if you have a heart condition.
