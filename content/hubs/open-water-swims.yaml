guides:
- slug: open-water-safety-and-first-event
  title: 'Open water swimming: staying safe and your first event'
  short: Safety and your first event
  seo_title: Open water swimming safety and your first event
  description: 'How to stay safe outdoors: cold water shock and Float to Live, acclimatising, swimming with others, checking water quality, choosing a distance and what to expect at your first mass-participation swim.'
  standfirst: 'Swimming outdoors is very different from the pool: there are no walls to hold on to, and the water is often colder. Here is what the RNLI, Swim England, the Outdoor Swimming Society, the Environment Agency and event organisers say about getting started safely, checked on 20 November 2026.'
  detail:
  - h: Cold water shock and Float to Live
    p: ['The RNLI warns that cold water shock is a real danger whenever the water is 15C or below. Never jump straight in: walk in slowly and wait until your breathing is under control before you start swimming. A wetsuit reduces the chance of cold water shock and helps you float.', 'If you get into trouble, the RNLI''s Float to Live advice is: tilt your head back with your ears under water, relax and breathe normally, move your hands and feet to help you stay afloat, and accept that your legs may sink. Fight the urge to thrash about. You can practise floating in a pool first.']
  - h: Getting used to colder water
    p: ['The Outdoor Swimming Society says it is easier to start when the water is 16C or above, and to keep going as it cools. Swim at least once a week, ideally two or three times.', 'Build up your time in the water slowly rather than setting a time target, and get out if you are not comfortable. Change into warm clothes quickly afterwards: Swim England notes you can chill very quickly even on a warm day.']
  - h: Swim with others and be seen
    list: ['Never swim alone: go with a buddy, if possible to a spot you know, and tell someone when you plan to be back (RNLI).', 'Wear a brightly coloured swim cap and consider a tow float, so others can see you (RNLI).', 'In the USA, the National Weather Service advises swimming only at beaches with lifeguards if possible, and looking for designated swimming areas.']
  - h: Check the water quality
    p: ['In England the Environment Agency''s free Swimfo service covers all 464 designated bathing waters. It shows each site''s rating (Excellent, Good, Sufficient or Poor) and flags days when rain, wind or high tides may lower water quality. Testing runs from mid-May to the end of September.', 'The Environment Agency advises against swimming after recent rain, when more pollution can wash into rivers and water can flow higher and faster. Swim England suggests packing water and hand sanitiser so you can clean your hands before eating.', 'Some events point you to the data too: Level Water links Dart10k entrants to Environment Agency monitoring for the start and finish.']
  - h: What happens at a first mass event
    p: ['Big swims start in waves, with groups setting off at intervals. The Great North Swim and Swim Serpentine both run waves through the day, and the Great North Swim includes a women-only wave. Henley Swim places you in a wave by your expected time.', 'Safety crews watch the course from kayaks, paddleboards and boats. At the Great North Swim, if you are struggling you lie on your back or tread water and raise a hand, and a member of the safety team comes to check on you. At Swim Serpentine the water safety team can take out any swimmer who appears to be struggling. Some longer swims have time limits.', 'Arrive early for the safety briefing and course explanation (Swim England). If you want to wear a neoprene hat, socks or gloves, check first that the event allows them.']
  - h: 'Wetsuit rules differ: check yours'
    table:
      head: [Event (from our hub), What the rules say]
      rows:
      - [Great North Swim, 'Optional at 15C or above; without one, over-16s need an approved tow float; under-16s must wear one']
      - [Swim Serpentine, Optional 16C to 24.5C; compulsory below 14.9C; banned at 24.6C or above]
      - [Bantham Swoosh, '2026 rules: adults need a full-length wetsuit unless approved to swim without one']
      - [Henley Classic, Optional for all swimmers]
      - [English Channel (CSA rules), Costume and cap must give no thermal protection or buoyancy]
  - h: Choosing a distance
    p: [Swim England advises training until you can swim further than your event distance without putting your feet down. Many of the events in our finder also have a shorter option.]
    table:
      head: [Event, Shorter options, Longer options]
      rows:
      - [Great North Swim, '250 m (age 8+), half mile (12+)', '1 mile to 5 km (16+), 10 km (18+)']
      - [Swim Serpentine, Half mile (12+), '1 and 2 miles (16+), six miles (18+)']
      - [Dock2Dock, '1.5 km, 3 km', 5 km to 15 km]
      - [Thames Marathon, About 5.5 km (18+), About 9 km and 13 km]
  - h: Get ready in the pool, then outdoors
    list: ['Make your front crawl solid, and learn a second stroke such as breaststroke to rest on (Swim England).', 'Practise sighting: lift your head every 6 to 8 strokes to spot a fixed point at the far end.', 'Practise treading water in the deep end and turning round a partner without touching the wall or floor, since there are no walls outdoors.', 'Breathe to both sides to balance your stroke, and swim in a busy lane with four or five friends to get used to company.', Try a wetsuit before you buy it if you can; many events offer wetsuit hire (Swim England).]
  - h: In an emergency
    p: ['In the UK, call 999 or 112 and ask for the Coastguard (RNLI). If someone else is in trouble, tell them to relax and float on their back, and throw them something that floats.', 'In the USA, the National Weather Service says that if someone is in trouble and no lifeguard is present, call 911.']
  faq:
  - {q: 'How cold is too cold to start?', a: The RNLI says cold water shock is a risk at 15C or below. The Outdoor Swimming Society suggests beginning when the water is 16C or above and keeping going as it cools.}
  - {q: 'Do I need a wetsuit for an event?', a: 'It depends on the event and the water temperature on the day. Some make them compulsory in colder water, some leave it to you, and some ban them in warm water or for official channel swims. Read the rules for your swim.'}
  - {q: 'What if I panic or get tired in the middle of a mass swim?', a: 'Roll on to your back and float until your breathing is under control, then raise a hand. At the Great North Swim, for example, a member of the safety team then comes to check on you.'}
  - {q: 'Is the water clean enough to swim in?', a: 'In England, check the site on the Environment Agency''s Swimfo service before you go and avoid swimming after heavy rain.'}
  kit:
  - {name: Tow float, why: 'Check it is bright and high-visibility, and if it is for an event, that it meets the event''s rules (the Great North Swim asks for an approved one).', url: 'https://www.amazon.co.uk/s?k=swim+tow+float'}
  - {name: Bright silicone swim cap, why: 'Check the colour is bright and easy to spot, and check whether your event provides a cap you must wear.', url: 'https://www.amazon.co.uk/s?k=bright+silicone+swim+cap'}
  - {name: Open water goggles, why: 'Check the field of view, and choose clear or light lenses for dull days and tinted or mirrored ones for sun.', url: 'https://www.amazon.co.uk/s?k=open+water+swimming+goggles'}
  - {name: Changing robe, why: 'Check it is roomy enough to change under and warm when you are wet, so you can warm up quickly after swimming.', url: 'https://www.amazon.co.uk/s?k=swimming+changing+robe'}
