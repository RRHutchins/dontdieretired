# Deep hub (RUNBOOK §6u): open-water swims (built 20 Nov 2026; Robin asked for more deep hubs that are popular, bring
# traffic, involve spending and fit the planner). Race-style schema with swimming words: `series` is the kind of swim
# (mass event, crossing, solo channel swim), `terrain` is the water (lake, river, sea). Every fact comes from the
# organiser's or association's page linked on the row (or a `more` link), opened on its `checked` date; no prices;
# months only where the page says; water temperatures only where the page states them; ids are permanent.
