- id: english-channel
  name: English Channel solo or relay
  series: solo
  place: Usually from at or near Shakespeare's Cliff or Samphire Hoe (between Folkestone and Dover) towards Cap Gris Nez, France
  country: England
  continent: europe
  km: [32]
  distances: About 21 miles (32 km); the shortest route is 18.25 nautical miles
  terrain: [sea]
  format: single
  month: [4, 5, 6, 7, 8, 9, 10]
  entry: [application, qualifier]
  entry_note: 'You book an independent pilot boat for a tide window, then register with one of two ratifying bodies. CS&PF: your contract is with the pilot; register by 30 April; solos need a 6-hour qualifying swim in water at or below 16C (61F) within 18 months before, and at least 14 days before your tide; relay swimmers do 1.5 hours, a break, then 1 hour. CSA: book a pilot as early as possible (its pilots are taking bookings three years ahead), join as an associate member, pay solo fees before 30 April, and complete a verified 8-hour solo qualifying swim in water of 60F (about 15.5C) or colder; each relay swimmer needs a verified 2-hour cold-water swim. Both bodies need a medical.'
  note: The CSA says its swim season is 1 April to 31 October, and that you may expect water of 14 to 18C, with August having 'the best of it'. Under CSA rules the costume and cap must give no thermal protection or buoyancy.
  activity: swim-the-channel-in-a-relay
  link: {label: 'Channel Swimming & Piloting Federation: Booking a Swim', url: 'https://cspf.co.uk/booking-a-swim', checked: '2026-11-20'}
  more:
  - {label: 'Channel Swimming Association: A Step by Step Guide', url: 'https://www.channelswimmingassociation.com/swim-advice/a-step-by-step-guide', checked: '2026-11-20'}
  - {label: 'Channel Swimming Association: FAQ', url: 'https://www.channelswimmingassociation.com/faq', checked: '2026-11-20'}
- id: catalina-channel
  name: Catalina Channel
  series: solo
  place: Catalina Island to the California mainland
  country: USA
  continent: north-america
  km: [32]
  distances: A little more than 20 miles (about 32 km) at the shortest; currents can add a few more
  terrain: [sea]
  format: single
  entry: [application]
  entry_note: Book an independent boat pilot and secure your date, then send the Catalina Channel Swimming Federation's swim application (with medical form and waivers) at least 45 days before your attempt. The federation assigns two official observers; arranging kayak support is up to you.
  note: The federation describes a midnight start, to avoid blustery afternoon winds, which means several hours of swimming in the dark. The federation gives water temperatures of 58 to 72F (14 to 22C), dropping by as much as 10F (about 5.6C) in the last 3 miles near the mainland. It suggests a non-stop training swim of more than 15 miles.
  link: {label: 'Catalina Channel Swimming Federation: Basic Swim Information', url: 'https://swimcatalina.org/basic-swim-information/', checked: '2026-11-20'}
