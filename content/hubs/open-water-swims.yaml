- id: strait-of-gibraltar
  name: Strait of Gibraltar
  series: solo
  place: Usually from the Island of Tarifa (Spain) to the area of Punta Cires (Morocco)
  country: Spain / Morocco
  continent: europe
  km: [15, 22]
  distances: Usually 15 to 22 km (8 to 12 nautical miles) because of currents; the shortest line, from Punta de Oliveros, is 14.4 km but is not the usual route
  terrain: [sea]
  format: single
  month: [4, 5, 6, 7, 8, 9, 10, 11]
  entry: [application]
  entry_note: Apply through ACNEG's registration form; the date you send it decides your assigned date. You request a one-week window (April to November) and swim on any suitable day in it. Send ID, a swimming CV, a signed form and a doctor's medical certificate. ACNEG says the strait is not suitable for swimmers with little open water experience, and its advice (an article from February 2019) gives a minimum of 3 km an hour. Waiting lists can exceed two years.
  note: Crossings go with or without neoprene, one way, two ways or as relays. Surface currents generally run east and can exceed 3 knots; a Zodiac-type boat sits 2 to 3 m from the swimmer for safety and feeding. Crossing reports on ACNEG's site give average water temperatures of 19.7 to 21.1C.
  link: {label: 'ACNEG: The Crossing', url: 'https://www.acneg.com/en/?p=209423', checked: '2026-11-20'}
