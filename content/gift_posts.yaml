# Social posts for the gift ideas hub (RUNBOOK §6v). `python tools/gift_posts.py` writes social/<date>-<slug>/meta.json;
# build.py draws the cards. One a day at 10:30 UK (Facebook picture post with the link in the text, Instagram, X).
# page: a gift page id from content/gifts.yaml ("" = the hub). ideas: optional lines for the card (default: the page's
# first four gift names). Text at most 254 characters (X). Facts only from gifts.yaml and the activities it names:
# no prices, no delivery promises, no "best", no reviews of our own. Never edit a post once its date has passed.
until: "2026-12-24"
