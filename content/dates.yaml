    note: "English Heritage gives free access to Stonehenge for the Winter Solstice, in 2026 on Tuesday 22 December: the car park opens at 5.15am, sunrise is about 8.09am, and anyone coming by car must pre-book parking or be turned away (or travel via Salisbury on the Salisbury Reds solstice buses)."
