# My year: when things happen every year (RUNBOOK §6s). The planner's year view uses this to suggest what is coming up
# and to put a fixed-date activity in the right place. Checked by tools/planner.py at every build.
#
# RULES
# - `activity` is an id in content/challenges.yaml. Every entry is written from a page opened on its `checked` date, and
#   `source` is that page. Copy only what the page says.
# - `months` are the months it usually falls in (1 = January). If the page gives this year's date, put it in `next`
#   (YYYY-MM-DD) with `next_source`; the build ignores a `next` date once it has passed. Never guess a date.
# - Re-check every entry once a year: dates move.
dates:
  - activity: go-to-edinburgh-fringe
    months: [8]
    note: Runs for three weeks each August.
    source: {label: "Britannica: the Fringe", url: "https://www.britannica.com/art/the-Fringe", checked: "2026-11-01"}
  - activity: go-to-national-book-festival
    months: [8, 9]
    note: A single Saturday. The 2026 festival was on 22 August; the 2025 festival was on 6 September.
    source: {label: "Library of Congress Bookmarked blog: 2026 National Book Festival date announced", url: "https://blogs.loc.gov/bookmarked/2026/02/18/2026-national-book-festival-date-announced-plus-learn-about-exhibiting-at-the-festival-this-year/", checked: "2026-11-01"}
  - activity: paddle-devizes-to-westminster
    months: [3, 4]
    note: Over the Easter weekend each year, with a few exceptions. The 2027 race is 26 to 29 March.
    next: "2027-03-26"
    next_source: {label: "Devizes to Westminster International Canoe Race", url: "https://dwrace.co.uk/", checked: "2026-11-11"}
    source: {label: "DW race: information", url: "https://www.dwrace.co.uk/info", checked: "2026-11-11"}
  - activity: row-across-the-atlantic
    months: [12]
    note: The annual race begins in early December; crews take from about a month to more than three months to cross.
    next: "2026-12-12"
    next_source: {label: "World's Toughest Row", url: "https://worldstoughestrow.com/", checked: "2026-11-11"}
    source: {label: "World's Toughest Row: the Atlantic", url: "https://www.worldstoughestrow.com/the-atlantic/", checked: "2026-11-11"}
