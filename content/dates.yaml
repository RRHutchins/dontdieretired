      note: "The DW Training Day page lists courses on 24 October and 12 December 2026 at Newbury Canoe Club, 10am to 4pm, capped at 16; you pay Newbury Canoe Club in advance and tell the organiser."
      source: {label: "DW Race: DW Training Day", url: "https://www.dwrace.co.uk/dw-training-day", checked: "2026-11-17"}
  - activity: row-across-the-atlantic
