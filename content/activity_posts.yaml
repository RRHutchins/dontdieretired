# Evening social posts: one thing to do a day, posted at 18:00 UK (RUNBOOK §6d, 18 Nov 2026).
# `python tools/daily_posts.py` (also run by every full build) writes social/<date>-do-<id>/meta.json; build.py draws the
# cards. Facts only from the activity's own entry in challenges.yaml (or a sourced line in dates.yaml), which the
# activity page links to. `card` is the hook on the image and the X post: natural English read aloud, under 20 words,
# no age words. `photo: true` only after looking at the downloaded photo for social use (§6l: no identifiable person,
# no logo or someone else's artwork filling the frame, licence PD / CC0 / CC BY / CC BY-SA). Never edit a post once its
# date has passed. Keep this list at least seven days ahead; pick what suits the season.
# From 23 Nov 2026 (Robin, 22 Nov 2026, after reader complaints) every post follows RUNBOOK §6d1: written to be read
# aloud, any place, body or term a UK or US reader may not know explained on first mention, opening with the moment or
# the surprise, ending with one easy question. Every post carries `reviewed:` naming the second Claude model that checked
# it (a different model from the writer) and the date; build.py refuses posts from 23 Nov without it. Use a photo
# (`photo: true`) whenever a checked one exists; the plain card is the last resort.
posts:
  - date: "2026-11-19"
    id: see-the-northern-lights
    photo: true
    card: "The northern lights can reach much further south than you might think"
    text: "The aurora is charged particles from the Sun lighting up the upper atmosphere. When activity is strong it can be seen from as much as 1,000 kilometres away, from a hilltop with a clear view north. The skill is watching the alerts and being ready to go: our page has the alert services for the UK and the US, and how to pick your spot."
  - date: "2026-11-20"
    id: jurassic-coast-fossil-hunt
    photo: true
    card: "Winter is the best time to find a fossil on the Jurassic Coast"
    text: "After rough weather, ammonites and belemnites wash out of the cliffs and lie among the pebbles. Book a guided fossil walk for your first visit, go out around low tide and search the loose shingle well away from the cliffs. Holding something that last saw daylight in the time of the dinosaurs is hard to forget."
  - date: "2026-11-21"
    id: ride-the-settle-carlisle
    photo: true
    card: "This railway was built almost entirely by hand, and you can still ride it"
    text: "Work on the 72-mile Settle to Carlisle line began in 1869. It came close to closure in the 1980s, and ordinary passenger trains still cross the 24 arches of the Ribblehead Viaduct. Leeds to Carlisle takes about 2 hours 40 minutes, and stations such as Dent and Ribblehead are starting points for walks."
  - date: "2026-11-22"
    id: learn-to-ring-church-bells
    photo: true
    card: "Each bell ringer controls one bell with one rope, in time with the others"
    text: "Tower bell ringing is a team activity. The Association of Ringing Teachers says it takes on average 10 to 15 hours of intensive instruction to ring a bell safely and well. Find a tower near you, in the UK or North America, and ask for a first handling lesson."
  - date: "2026-11-23"
    id: learn-kintsugi
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "Mend a broken bowl with gold, so the crack becomes the decoration"
    text: |-
      Got a favorite bowl or mug with a crack in it? Don't throw it away.

      Kintsugi is the Japanese art of mending broken pottery with lacquer and gold. The crack isn't hidden. It becomes the decoration.

      The traditional method uses a natural lacquer called urushi and takes weeks, layer by layer. Modern beginners' classes use glue and gold leaf, and you finish in a day.

      What would you mend first?
  - date: "2026-11-24"
    id: try-curling
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "Curling is about touch and tactics, not strength, and you can slide your first stone within the hour"
    text: |-
      You may have seen it at the Winter Olympics: players sliding heavy granite stones down the ice while teammates sweep hard in front of them.

      It's a game of touch and tactics more than strength. Two teams of four aim at a target on the ice called the house. Sweeping changes how far each stone travels and how much it curls.

      At a beginners' taster session you'll be sliding your first stone within the hour, with brushes, sliders and stones supplied. Rinks have ice from fall to spring.

      Would you have a go?
  - date: "2026-11-25"
    id: learn-astrophotography
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "You don't need a telescope to photograph the Milky Way"
    text: |-
      Here's a surprise: you don't need a telescope to photograph the Milky Way.

      Put a camera on a tripod and leave the shutter open long enough, and it records stars your eyes can barely make out.

      A beginners' course, or an evening at a dark-sky site, will teach you the settings. Bring the camera you already have, a tripod and a red head torch (a headlamp, in the US). A local astronomy society can point you to dark sites.

      Have you ever seen the Milky Way with your own eyes?
  - date: "2026-11-26"
    id: learn-origami
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "Turn a square of paper into a swan, with folds alone"
    text: |-
      All you need is a square of paper.

      With folds alone, origami turns it into a swan, a penguin or a cat's head.

      The British Origami Society and OrigamiUSA both share free diagrams, so you could fold your first model tonight. If you'd like company, libraries run beginners' classes and local folding groups meet in the UK and the US.

      What would you fold first?
  - date: "2026-11-27"
    id: learn-to-ice-skate
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "Ice skating is learned in small, clear steps, one level at a time"
    text: |-
      Fancy gliding around the ice rink this winter?

      Skating is learned in small, clear steps, which is why lessons are set out in levels. In Britain, Skate UK, the national learn-to-skate program, is taught at more than 40 rinks. In the US, Learn to Skate USA has a six-level course for adults.

      Many adult beginners' courses include skate rental. Just bring gloves, thin socks and warm layers.

      Who would you take to the rink with you?
  - date: "2026-11-28"
    id: take-up-beekeeping
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "Try beekeeping before you buy a single thing: start with a taster day"
    text: |-
      Ever wondered what goes on inside a beehive?

      A honey bee colony changes through the year, from spring swarming, when part of the colony leaves to find a new home, to living on its food stores through winter. Learning to read those signs is a big part of the craft.

      Your local beekeeping association runs taster days and beginners' courses, and can often pair you with a mentor. That way you handle bees before you buy a single thing.

      Would you like to see inside a hive?
  - date: "2026-11-29"
    id: learn-cross-country-skiing
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "You can learn cross-country skiing without waiting for snow"
    text: |-
      Cross-country skiing isn't about racing down a mountain. You glide along quiet forest trails under your own power.

      And you don't have to wait for snow. In Scotland, the Huntly Nordic and Outdoor Centre, in Aberdeenshire in the north-east, teaches on an all-weather track. In the US, many Nordic (cross-country) ski centers sell a beginner package with ski rental and a trail pass.

      According to the US Cross Country Ski Areas Association, a couple of hours with an instructor builds the basic skills.

      Forest trails or mountain slopes: which would you choose?
  - date: "2026-11-30"
    id: learn-to-play-bridge
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "In club bridge, you're scored against players who held exactly the same cards"
    text: |-
      Think card games are all about luck? Club bridge is built to even the luck out.

      In a club, several tables play the same hands in turn. Your score is compared with everyone else who held exactly the same cards, so it comes down to how well you played them.

      To begin, try MiniBridge, a free practice game. Then the English Bridge Union or the American Contract Bridge League can help you find lessons and a club with games for newcomers.

      What's your favorite card game?
  - date: "2026-12-01"
    id: visit-a-stone-circle-at-solstice
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "Stand inside the Stonehenge stone circle, free, for the winter solstice"
    x: "Stonehenge opens its stone circle to everyone, free, for the winter solstice on Tuesday 22 December."
    text: |-
      Picture yourself among the stones at Stonehenge, the ancient stone circle in the south of England, at the winter solstice.

      That day, English Heritage, the charity that looks after Stonehenge, opens the stone circle to everyone, free. This year it's on Tuesday 22 December.

      Travel by public transport through the nearby city of Salisbury if you can: anyone coming by car must pre-book parking or be turned away. Dress for a cold night outdoors, and check English Heritage's list of items that aren't allowed.

      Would you go?
  - date: "2026-12-02"
    id: give-blood
    photo: true
    reviewed: "2026-11-22, Claude Sonnet (writer: Claude Opus)"
    card: "Every unit of blood a hospital uses began with someone in a donor chair"
    text: |-
      Every unit of blood a hospital uses began with someone sitting in a donor chair. Curious what it takes?

      First, check whether you can give. NHS Blood and Transplant in England and the American Red Cross publish their rules online. Then book an appointment at a donor center, or at a blood drive (a pop-up collection session) near you.

      On the day, you'll answer a health and lifestyle check, so the team can decide whether donating is right for you. Just answer honestly.

      Have you given blood before?
  - date: "2026-12-03"
    id: try-snowshoeing
    photo: true
    reviewed: "2026-11-25, Claude Sonnet (writer: Claude Opus)"
    card: "With snowshoes on, you can walk across deep snow that would swallow your boots"
    text: |-
      Picture walking on top of deep snow, not sinking into it. Snowshoes spread your weight, so you stay on the surface. That opens up winter landscapes you could not walk through in boots.

      In several US national parks, including Crater Lake in Oregon and Bryce Canyon in Utah, a park ranger (one of the park's own guides) will lend you snowshoes and lead the walk for free. Crater Lake charges a winter entrance fee of $20 per vehicle. No experience is needed. In Scotland, you can book a guided snowshoe day in the Cairngorms, a range of mountains there.

      It's hard work. Bryce Canyon calls snowshoeing highly strenuous, which means very tiring. Wear warm layers and waterproof boots, and bring water. Walks can be cancelled if there is too little snow or the weather is severe.

      Would you give it a try?
  - date: "2026-12-04"
    id: learn-hedge-laying
    photo: true
    reviewed: "2026-11-26, Claude Sonnet (writer: Claude Opus)"
    card: "Cut each stem part-way, bend it over, and a hedge grows back thicker"
    text: |-
      Cut a stem part-way, bend it over, and it keeps growing. That is how a laid hedge is made.

      Done along a whole hedge, it thickens into a barrier that holds in cattle and sheep. The National Hedgelaying Society describes 11 regional styles.

      It's a winter job. Beginners' courses run between November and April at agricultural colleges, wildlife trusts (local conservation charities) and rural skills centers. Some conservation volunteer groups lend tools to newcomers. The courses we found are in the UK.

      Bring thick trousers (pants, in the US), work gloves, sturdy boots, a hat and a packed lunch.

      Would you give it a try?
  - date: "2026-12-05"
    id: try-glassblowing
    photo: true
    reviewed: "2026-11-26, Claude Sonnet (writer: Claude Opus)"
    card: "Gather molten glass from a furnace and shape your own cup or vase in one session"
    text: |-
      Picture a glowing bubble of molten glass on the end of a long pipe, and you're the one shaping it.

      At a glassblowing taster (a short beginner session), a glassmaker stays beside you. You gather glass from the furnace, add color and shape it into a paperweight, a cup or a small vase. The piece is cooled slowly first, so you collect it the next day or later.

      Sessions run from under an hour to a full day, at studios in the UK and the US, and some take only two people at a time. Wear natural-fiber clothes and shoes that fully cover your feet, take off jewelry and tie back long hair.

      What would you make first?
  - date: "2026-12-06"
    id: make-a-terrarium
    photo: true
    reviewed: "2026-11-26, Claude Sonnet (writer: Claude Opus)"
    card: "A closed terrarium recycles its own moisture and may need water only a few times a year"
    text: |-
      Picture a small garden under glass that needs watering only a few times a year.

      A closed terrarium is a sealed glass jar of plants. It recycles its own moisture, so the RHS (the Royal Horticultural Society, the UK's gardening charity) says it usually needs only a few small waterings a year. Ferns, mosses and small tropical plants suit a closed jar. Succulents and cacti suit an open bowl.

      Workshops at botanic gardens and garden centers show you how to layer the gravel, compost and moss, and you take your terrarium home. At RHS Garden Bridgewater in Salford, England, you bring your own clear glass container.

      Closed jar or open bowl: which would you make?
  - date: "2026-12-07"
    id: try-gouache-painting
    photo: true
    reviewed: "2026-11-26, Claude Sonnet (writer: Claude Opus)"
    card: "Gouache mixes with water like watercolor, but covers the paper in flat, solid color"
    text: |-
      Imagine watercolor that hides the paper instead of letting it show through. That's gouache.

      Like watercolor, gouache paint mixes with water. Unlike watercolor, it's opaque, so it covers the paper in flat, matte color. Tate, the UK's national art museums, notes that it's often used to add highlights to watercolors.

      To start, you need only a small set of tubes in the primary colors plus white, two or three round brushes, a palette and some paper. Beginners' courses run at adult education centers and art schools in the UK and the US.

      Have you ever painted with gouache?
  - date: "2026-12-08"
    id: learn-beaded-jewellery
    photo: true
    reviewed: "2026-11-26, Claude Sonnet (writer: Claude Opus)"
    card: "A few beading techniques, and you can make earrings, necklaces and bracelets you'll actually wear"
    text: |-
      A few simple techniques are enough to make jewelry you'll actually wear.

      Beginners' classes teach stringing, crimping (squeezing a tiny metal bead flat to secure the end of the string), knotting between beads and simple wire wrapping. The first pieces are usually earrings, necklaces and bracelets.

      In London, City Lit, an adult education college, runs a four-Saturday introduction and supplies most of the materials and tools. In the US, community colleges and craft centers run beginners' classes too.

      Who would you make your first piece for?
  - date: "2026-12-09"
    id: join-a-brass-band
    photo: true
    reviewed: "2026-11-26, Claude Sonnet (writer: Claude Opus)"
    card: "In a brass band every player has a part that matters, and some bands teach complete beginners"
    text: |-
      Some brass bands will teach you from scratch.

      A British-style brass band has around 28 to 30 players: cornets, tenor horns, baritones, euphoniums, trombones, basses and percussion. Every player has a part that matters.

      In Belfast, Northern Ireland, a band called Downshire Brass runs Couch to Concert: 12 weeks for adults with no brass experience, with an instrument to use and a concert at the end. In the US, New Horizons bands at local colleges take adults who have never played an instrument.

      Which instrument would you pick?
  - date: "2026-12-10"
    id: learn-the-concertina
    photo: true
    reviewed: "2026-11-26, Claude Sonnet (writer: Claude Opus)"
    card: "On some concertinas, each button plays one note when you push and another when you pull"
    text: |-
      Here's a surprise for a new player. On an Anglo concertina, each button plays one note when you push the bellows and a different note when you pull.

      The concertina is a small bellows instrument you hold between your hands. On the English kind, a button gives the same note either way. The International Concertina Association, a society for players, says the right one for you depends on the music you want to play.

      A good concertina costs several hundred pounds or more, so look for a beginners' workshop that lends instruments first, or a players' group near you. The association lists groups in the UK and the US.

      Same note both ways, or two notes per button?
  - date: "2026-12-11"
    id: learn-bonsai
    photo: true
    reviewed: "2026-11-26, Claude Sonnet (writer: Claude Opus)"
    card: "Bonsai means shaping a small tree for years, and a first class sends you home with one"
    text: |-
      Imagine taking home a small tree you shaped yourself.

      A bonsai is kept small and shaped by pruning, wiring and repotting, and the work carries on for years. Most people start with a beginners' workshop at a college or a botanic garden, where you style a tree and take it home. As last listed, a two-hour class at a US botanic garden was $44, and a one-day workshop at a UK college was £100.

      After that, many people join a local bonsai society. Many societies welcome visitors and hold demonstrations for beginners.

      What kind of tree would you like to grow?
  - date: "2026-12-12"
    id: try-green-woodworking
    photo: true
    reviewed: "2026-11-26, Claude Sonnet (writer: Claude Opus)"
    card: "A pole lathe runs on leg power, and a one-day class can send you home with a rolling pin"
    text: |-
      No electricity needed: a pole lathe is powered by your own leg.

      You press a pedal, and the spring of a thin pole turns the wood while you shape it with chisels. Green woodworking uses freshly felled wood, worked with axes, drawknives (two-handled blades) and a shaving horse, a bench that grips the wood while you shape it.

      A one-day taster can send you home with a rolling pin, a honey drizzler or a small mallet. In the UK, the Association of Pole-lathe Turners and Green Woodworkers, known as the Bodgers, maps local groups near you.

      What would you make first?
