  url: https://stopthinkfraud.campaign.gov.uk/how-to-spot-fraud/how-to-spot-phone-fraud/
- label: 'Stop! Think Fraud (UK Government): how to spot doorstep fraud'
  url: https://stopthinkfraud.campaign.gov.uk/how-to-spot-fraud/how-to-spot-doorstep-fraud/
- label: 'Federal Trade Commission: how to avoid a scam'
  url: https://consumer.ftc.gov/articles/how-avoid-scam
reviews:
- label: 'Which?: scam-busting tools to know about (May 2026)'
  url: https://www.which.co.uk/news/article/scam-busting-tools-to-know-about-aRrTa7a2zeiF
- label: 'KSL: we tested four scam-detection apps (January 2026)'
  url: https://www.ksl.com/article/51440941/we-tested-4-popular-scam-detection-apps-heres-what-actually-worked
rejected:
- name: McAfee Scam Detector
  why: 'Not free on its own: McAfee says it is included in paid McAfee plans and needs the McAfee app, despite being the best performer in the KSL test.'
- name: Bitdefender Scamio
  why: Needs a Bitdefender account, and the KSL test (Jan 2026) found it least effective, often calling scams safe.
- name: Trend Micro ScamCheck
  why: KSL test (Jan 2026) found it failed to flag phishing and wrongly flagged a genuine message; official page not fetched.
- name: Image Whisperer
  why: Its page says free checks come with a free account; we only list tools that need no sign-up.
- name: Who Called Me
  why: Recommended by Which?, but we could not open its site to confirm the details on the day we checked, so it is not listed yet.
