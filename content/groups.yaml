# Groups for Things to do (Robin, 20 Nov 2026: "make it easy and obvious there are groups to navigate").
# build.py puts every activity into one or more groups by these rules, so new activities file themselves:
#   collection: an entry's `collection`   categories / kinds: lists   match: regex on "<id> <title>" (lower case)
#   not: regex that keeps an activity out   regions: any of these regions
# An activity matches a group if it meets ALL the keys the group gives (match is OR-ed with `also`, if given).
# An entry can also name groups itself with `groups: [key]` (added to whatever the rules give).
# Order here is the order of the tiles. `slug` is permanent once live (page /list/<slug>/) and must not clash with an id.
# `page: collection` means the group IS an existing collection and its tile opens that page.
# Every activity should land in at least one group: the build prints LIST WARNING with any that don't.
groups:
  walks:
    slug: walks-hikes-and-trails
    label: Walks, hikes and trails
    short: "Mountains, National Trails, coast paths and the great hikes of the world"
    title: "Walks and hikes: famous trails and mountains, how to start"
    meta: "Famous walks, hikes, long-distance trails and mountains in the UK, the US and abroad, each with how hard it is, when to go and the official route pages."
    match: "\\b(walk|walking|hike|hiking|trail|trek|climb|scramble|munro|fourteener|three peaks|camino|pilgrim|path|way|ramble|summit|nordic|high point|bothy)\\b"
    also: "geocach|map and compass|with your dog|dog to walk"
    not: "\\b(walk(ing)? (football|netball|rugby|cricket|basketball)|bat walk|bird walk|beaver walk|glow-worm|dawn chorus|blue plaques|indoor|rock climbing|ice climbing|climb outdoors|climbing wall|trail race|freedom trail|parkway|highway|the way of|half marathon)\\b"
    categories: [move, travel, explore, connect]
  wildlife:
    slug: wildlife-and-nature
    label: Wildlife and nature
    short: "Puffins, whales, bears, birds, bluebells and the nights out to see them"
    title: "Wildlife watching: where and when to see it"
    meta: "Where and when to see puffins, whales, dolphins, seals, deer, eagles, bears and more, plus nature walks, citizen science and wildlife volunteering."
    match: "wildlife|nature|bird|dawn chorus|puffin|seal|whale|dolphin|otter|badger|\\bbats?\\b|moth|butterfl|deer|eagle|osprey|kites?\\b|beaver|bears?\\b|wol(f|ves)|manatee|crane|hawk|gorilla|galapagos|safari|migration|rockpool|fung|mushroom|bluebell|\\btrees?\\b|wildflower|pond|nest box|naturalist|glow-worm|shark|gannet|murmuration|refuge|forag|ebird|species|bee|hens?\\b|garden|orchard|rewild|reef|snorkel|polar bear|seabird"
  sky:
