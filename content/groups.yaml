    kinds: [event]
    not: "marathon|\\brun\\b|triathlon|race|sportive|march|walk|swim|ride|ultra|goruck|murph|mudder|hyrox|relay|etape|whitton|swimathon|10k|trailwalker|yomp|challenge"
