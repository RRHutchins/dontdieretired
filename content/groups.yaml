    label: Night sky and science
    short: "Stars, eclipses, the northern lights, observatories, fossils and real research"
    title: "Stargazing and science days out: how to start"
    meta: "Stargazing, meteor showers, eclipses, the northern lights, observatories, planetariums, fossil hunting and citizen science you can join."
    match: "star|astronom|meteor|telescope|eclipse|northern lights|aurora|dark sky|planetarium|observatory|space|saturn|constellation|cern|jodrell|asteroid|zooniverse|geolog|fossil|science|weather|meridian|milky way|solar"
