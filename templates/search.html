{% extends "base.html" %}
{% block title %}Search — {{ cfg.site.name }}{% endblock %}
{% block description %}Search every story, guide and plan on Don't Die Retired.{% endblock %}
{% block content %}
<header class="page-head"><p class="kicker">Search</p><h1>Find a story</h1>
<input type="search" id="q" placeholder="e.g. swimming, powerlifting, business…" aria-label="Search" autofocus></header>
<div class="grid grid-3" id="results"></div>
{% endblock %}
{% block scripts %}<script>
(async () => {
  const idx = await (await fetch('/index.json')).json();
  let pages = []; try { pages = await (await fetch('/pages.json')).json(); } catch (e) {}
  const q = document.getElementById('q'), out = document.getElementById('results');
  const p = new URLSearchParams(location.search).get('q'); if (p) q.value = p;
  const render = () => { const s = q.value.toLowerCase().trim();
    const hits = (s ? pages.concat(idx) : idx).filter(a => !s || (a.title+' '+a.excerpt+' '+a.tags.join(' ')).toLowerCase().includes(s));
    const H = 'href', S = 'src'; /* spelled this way so crawlers do not read the template as a real link */ out.innerHTML = hits.map(a => `<article class="card${a.photo ? ' has-photo' : ''}" data-cat="${a.category}"><a class="card-img" ${H}="${a.url}" aria-hidden="true" tabindex="-1"><img ${S}="${a.art || a.image}" alt="" loading="lazy"></a><div class="card-body"><p class="kicker">${a.category}</p><h2 class="h3"><a ${H}="${a.url}">${a.title}</a></h2><p>${a.excerpt}</p></div></article>`).join('') || '<p>Nothing yet — try another word.</p>'; };
  q.addEventListener('input', render); render();
})();
</script>{% endblock %}
