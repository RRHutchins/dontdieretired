name: Weekly visitor numbers
# Fetches last week's numbers from Plausible and commits them to reports/data/ so the Sunday
# report and the improvement loop (RUNBOOK §3a, §5) can read them. Needs the repository secret
# PLAUSIBLE_API_KEY (a Plausible "Stats API" key). Without it the job passes and says so.
on:
  schedule:
    - cron: "17 3 * * 0"   # Sunday 03:17 UTC, before the daily job
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_stats.py
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
      - name: Commit the numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/data || true
          git diff --cached --quiet || (git commit -m "Stats: weekly visitor numbers" && git pull --rebase -q && git push)
