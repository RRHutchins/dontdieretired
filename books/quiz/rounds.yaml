        level: 1
        source: {title: "Percy Spencer", publisher: "Lemelson-MIT Program, Massachusetts Institute of Technology", url: "https://lemelson.mit.edu/resources/percy-spencer"}
        checked: 2026-10-27
      - q: "At just 15, a French boy who had lost his sight invented a way of reading by touching raised dots. What is it called?"
