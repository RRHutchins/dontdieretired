  - id: snow-ice-and-weather
    title: Snow, ice and weather
    editions: [uk, us]
    intro: "Whatever it is doing outside the window, here is a round about it."
    questions:
      - q: "Look closely at a snow crystal. How many sides or arms does it have: four, six or eight?"
        a: "Six"
        level: 1
        source: {title: "Wilson A. Bentley: Pioneering photographer of snowflakes", publisher: "Smithsonian Institution Archives", url: "https://torch.si.edu/2015/02/wilson-a-bentley-pioneering-photographer-of-snowflakes"}
        checked: 2026-10-27
      - q: "Which is colder, the North Pole or the South Pole?"
        a: "The South Pole"
        note: "It sits on an ice sheet more than 9,000 feet (2,700 metres) high, on top of a continent. The North Pole is floating sea ice, and the ocean beneath keeps it warmer."
        level: 1
        source: {title: "Why is the South Pole colder than the North Pole?", publisher: "Scientific American", url: "https://www.scientificamerican.com/article/why-is-the-south-pole-col/"}
        checked: 2026-10-27
      - q: "What do we call the balls of ice that fall from thunderstorms: hail, sleet or frost?"
        a: "Hail"
        note: "The largest found in the United States, at Vivian, South Dakota, in 2010, was 8 inches (20 cm) across."
        level: 1
        source: {title: "Severe Weather 101: Hail Basics", publisher: "NOAA National Severe Storms Laboratory", url: "https://www.nssl.noaa.gov/education/svrwx101/hail/"}
        checked: 2026-10-27
      - q: "For the Met Office to declare a white Christmas in the UK, how much snow has to be seen falling on Christmas Day?"
        a: "A single snowflake"
        accept: "One snowflake"
        note: "It must be seen by an official observer or a Met Office weather station."
        level: 2
        source: {title: "White Christmas and UK Christmas weather records", publisher: "Met Office", url: "https://weather.metoffice.gov.uk/learn-about/weather/types-of-weather/snow/white-christmas"}
        checked: 2026-10-27
      - q: "The Beaufort scale, devised by a Royal Navy officer in 1805, measures what?"
        a: "Wind speed"
        accept: "The wind; wind force"
        note: "It runs from 0, calm, to 12, hurricane."
        level: 2
        source: {title: "The Beaufort Wind Scale", publisher: "Royal Meteorological Society", url: "https://www.rmets.org/metmatters/beaufort-scale"}
        checked: 2026-10-27
      - q: "Roughly how much of an iceberg is hidden below the water: a tenth, half, or nine-tenths?"
        a: "Nine-tenths"
        accept: "90 per cent"
        level: 2
        source: {title: "Ninety percent of an iceberg is below the waterline", publisher: "US Geological Survey", url: "https://usgs.gov/media/images/ninety-percent-iceberg-below-waterline"}
        checked: 2026-10-27
      - q: "Lightning can heat the air around it to about five times hotter than the surface of what?"
        a: "The Sun"
        note: "The air expands so fast that it makes the sound we hear as thunder."
        level: 2
        source: {title: "Understanding Lightning: Thunder", publisher: "US National Weather Service", url: "https://www.weather.gov/safety/lightning-science-thunder"}
        checked: 2026-10-27
      - q: "Black ice on the roads is not really black. Why is it called that?"
        a: "It is clear, so you see the dark road through it"
        accept: "It is see-through; it looks like the road"
        note: "That is why drivers find it so hard to spot."
        level: 2
        source: {title: "What is frost and ice?", publisher: "Met Office", url: "https://weather.metoffice.gov.uk/learn-about/weather/types-of-weather/frost-and-ice"}
        checked: 2026-10-27
      - q: "Which Vermont farmer, nicknamed 'Snowflake', photographed more than 5,000 snow crystals from 1885 onwards?"
        a: "Wilson Bentley"
        accept: "Bentley"
        note: "He believed no two snowflakes were alike."
        level: 3
        source: {title: "Wilson A. Bentley: Pioneering photographer of snowflakes", publisher: "Smithsonian Institution Archives", url: "https://torch.si.edu/2015/02/wilson-a-bentley-pioneering-photographer-of-snowflakes"}
        checked: 2026-10-27
      - q: "The lowest air temperature ever recorded at the Earth's surface, minus 89.2°C in 1983, was measured on which continent?"
        q_us: "The lowest air temperature ever recorded at the Earth's surface, about minus 128.6°F in 1983, was measured on which continent?"
        a: "Antarctica"
        note: "At Vostok Station, on 21 July 1983."
        level: 3
        source: {title: "Record low surface air temperature at Vostok Station, Antarctica", publisher: "British Antarctic Survey", url: "https://www.bas.ac.uk/data/our-data/publication/record-low-surface-air-temperature-at-vostok-station-antarctica/"}
        checked: 2026-10-27

  - id: inventions
    title: Inventions
    editions: [uk, us]
    intro: "Happy accidents, bright ideas and the people who had them."
    questions:
      - q: "In 1903 the first powered aeroplane flight lasted just 12 seconds. Which brothers built the plane?"
        q_us: "In 1903 the first powered airplane flight lasted just 12 seconds. Which brothers built the plane?"
        a: "The Wright brothers"
        accept: "Orville and Wilbur Wright"
        note: "Orville flew 120 feet (about 37 metres) at Kitty Hawk, North Carolina. Wilbur's best flight that day lasted 59 seconds."
        level: 1
        source: {title: "How high did the Wright Brothers fly?", publisher: "Smithsonian Institution Archives", url: "https://torch.si.edu/2018/09/how-high-did-the-wright-brothers-fly"}
