# Questions for the Don't Die Retired Christmas Quiz Book (UK and US editions). See books/README.md, "Quiz books".
# Each round: id, title, editions ([uk], [us] or [uk, us]), intro (one line for the quizmaster to read out),
# questions: q (question), a (answer), level (1 anyone: a child of 8-12 could answer; 2 grown-ups; 3 hard), note (optional, printed with the answer),
# accept (optional: other answers to allow), source {title, publisher, url}, checked (date the source was opened
# and confirmed the answer). A question with no `checked` date is not printed.
# Spelling is British in both editions; a question can carry `q_us` / `a_us` where the US edition needs other words.
# kind (optional): junior (pitched for children) or swap (grown-ups answer about the children's world and children about the
# grown-ups'); in a swap round each question carries `for: grown-ups` or `for: children`, printed in place of the level word.

rounds:
  - id: christmas-around-the-world
    title: Christmas around the world
    editions: [uk, us]
    intro: "How other countries keep Christmas, from Reykjavik to Tokyo."
    questions:
      - q: "Every year since 1947, which country has given London the Christmas tree that stands in Trafalgar Square?"
        a: "Norway"
        note: "A thank-you for Britain's support during the Second World War. The tree is shipped from Oslo."
        level: 2
        source: {title: "London's Christmas tree: Norway's gift", publisher: "OnLondon", url: "https://www.onlondon.co.uk/londons-christmas-tree-norways-gift"}
        checked: 2026-10-24
      - q: "In Japan, a 1974 advertising campaign made a meal from which fast-food chain a Christmas tradition?"
        a: "KFC (Kentucky Fried Chicken)"
        note: "The campaign was called Kentucky for Christmas."
        level: 1
        source: {title: "How Kentucky for Christmas began in Japan", publisher: "KFC Global", url: "https://global.kfc.com/stories/how-kentucky-for-christmas-began-in-japan/"}
        checked: 2026-10-24
      - q: "In Iceland, how many Yule Lads come down from the mountains, one each night, in the run-up to Christmas?"
        a: "Thirteen"
        note: "The first arrives on 12 December. Their mother is the troll Grýla."
        level: 2
        source: {title: "The 13 Yule Lads and Christmas in Iceland", publisher: "Icelandic Tourist Board", url: "https://www.ferdamalastofa.is/en/news/the-13-yule-lads-and-christmas-in-iceland-1"}
        checked: 2026-11-06
      - q: "La Befana, a kindly old woman on a broomstick, brings sweets or coal to children at Epiphany in which country?"
        a: "Italy"
        note: "Her name comes from Epifania, the Italian word for Epiphany, 6 January."
        level: 2
        source: {title: "The legend of La Befana", publisher: "The Florentine", url: "https://www.theflorentine.net/2006/12/14/the-legend-of-la-befana/"}
        checked: 2026-10-24
      - q: "The Striezelmarkt, first held in 1434, is one of Europe's oldest Christmas markets. In which German city is it held?"
        a: "Dresden"
        level: 3
        source: {title: "Europe's oldest continuously operating Christmas market", publisher: "Islands", url: "https://www.islands.com/1730165/europe-oldest-continuously-operated-open-christmas-market-enchant-locals-tourists-germany-striezelmarkt"}
        checked: 2026-10-24
      - q: "Since 1966 the Swedish town of Gävle has built a giant Christmas goat each year. What is it made of?"
        a: "Straw"
        note: "It stands about 13 metres tall, and more often than not it is burned, stolen or vandalised before Christmas is over."
        level: 2
        source: {title: "Swedish straw goat survives third Christmas in a row", publisher: "The Local Sweden", url: "https://www.thelocal.se/20200102/new-year-record-swedish-straw-goat-survives-third-christmas-in-a-row"}
        checked: 2026-10-24
      - q: "The poinsettia, with its bright red leaves, grows wild in which country?"
        a: "Mexico"
        note: "It is named after Joel Poinsett, the first US ambassador to Mexico."
        level: 3
        source: {title: "Poinsettia | Home & Garden Information Center", publisher: "Clemson University Cooperative Extension", url: "https://hgic.clemson.edu/factsheet/poinsettia/"}
        checked: 2026-11-07
      - q: "In Iceland, what do children put on the windowsill each night before Christmas for the Yule Lads to fill?"
        a: "A shoe"
        note: "Good children find a small present in it. Naughty ones might find a raw potato."
        level: 1
        source: {title: "The 13 Yule Lads and Christmas in Iceland", publisher: "Icelandic Tourist Board", url: "https://www.ferdamalastofa.is/en/news/the-13-yule-lads-and-christmas-in-iceland-1"}
        checked: 2026-10-24
      - q: "In Alpine folklore, the demon Krampus punishes naughty children. Which saint does he travel with?"
        a: "St Nicholas"
        note: "Krampus Night is 5 December, the eve of St Nicholas's Day."
        level: 2
        source: {title: "Krampusnacht", publisher: "USC Digital Folklore Archives", url: "https://folklore.usc.edu/krampusnacht/"}
        checked: 2026-11-06
      - q: "In Sydney, Australia, which season is it on Christmas Day?"
        a: "Summer"
        note: "Australian summer runs from December to February."
        level: 1
        source: {title: "Solstices, equinoxes and the seasons", publisher: "Bureau of Meteorology", url: "https://www.bom.gov.au/news-and-media/solstices-equinoxes-and-the-seasons"}
        checked: 2026-10-24

  - id: a-very-british-christmas
    title: A very British Christmas
    editions: [uk]
    intro: "Cards, crackers, kings and Dickens: where our Christmas came from."
    questions:
      - q: "In 1843 Henry Cole, later the first director of the V&A, had 1,000 copies of a picture printed to save himself writing letters. What had he invented?"
        a: "The Christmas card"
        note: "Designed by his friend John Callcott Horsley, they sold for a shilling each and were a commercial flop."
        level: 1
        source: {title: "The first Christmas card", publisher: "Victoria and Albert Museum", url: "https://www.vam.ac.uk/articles/the-first-christmas-card"}
        checked: 2026-10-24
      - q: "Which London confectioner, inspired by French sugared almonds, made the Christmas cracker popular from the 1840s?"
        a: "Tom Smith"
        note: "He probably did not invent the cracker, but he turned it into a mass-produced Christmas fixture."
        level: 2
        source: {title: "The Christmas cracker memorial in Finsbury Square", publisher: "ianVisits", url: "https://www.ianvisits.co.uk/blog/2021/12/08/the-christmas-cracker-memorial-in-finsbury-square/"}
        checked: 2026-10-24
      - q: "Which king gave the first royal Christmas broadcast, by radio from Sandringham in 1932?"
        a: "George V"
        level: 2
        source: {title: "The Christmas Broadcast", publisher: "The Royal Family (royal.uk)", url: "https://www.royal.uk/the-christmas-broadcast"}
        checked: 2026-10-24
      - q: "Which author of The Jungle Book wrote the words of that first royal Christmas broadcast?"
        a: "Rudyard Kipling"
        level: 3
        source: {title: "The Christmas Broadcast", publisher: "The Royal Family (royal.uk)", url: "https://www.royal.uk/the-christmas-broadcast"}
        checked: 2026-10-24
      - q: "In which year was the royal Christmas message first shown on television: 1937, 1957 or 1967?"
        a: "1957"
        note: "Queen Elizabeth II, broadcast live."
        level: 2
        source: {title: "The Christmas Broadcast", publisher: "The Royal Family (royal.uk)", url: "https://www.royal.uk/the-christmas-broadcast"}
        checked: 2026-10-24
      - q: "Which Charles Dickens story, first published in 1843, introduced the world to Scrooge?"
        a: "A Christmas Carol"
        level: 1
        source: {title: "Charles Dickens's A Christmas Carol", publisher: "The Morgan Library & Museum", url: "https://www.themorgan.org/exhibitions/charles-dickenss-christmas-carol"}
        checked: 2026-11-07
      - q: "In pantomime, the comic older woman, such as Widow Twankey, is traditionally played by whom?"
        a: "A man"
        note: "The most famous Victorian dame, Dan Leno, played at Drury Lane every Christmas for 15 years."
        level: 1
        source: {title: "The story of pantomime", publisher: "Victoria and Albert Museum", url: "https://www.vam.ac.uk/articles/the-story-of-pantomime"}
        checked: 2026-10-24
      - q: "Boxing Day, 26 December, is also the feast day of which saint?"
        a: "St Stephen"
        note: "Remembered as the first Christian martyr."
        level: 2
        source: {title: "Boxing Day", publisher: "The Canadian Encyclopedia", url: "https://thecanadianencyclopedia.ca/en/article/boxing-day"}
        checked: 2026-10-24
      - q: "Prince Albert usually gets the credit, but which earlier queen, the German-born wife of George III, put up a Christmas tree at Windsor in December 1800?"
        a: "Queen Charlotte"
        note: "Hers was a potted yew, set up for a children's party at Queen's Lodge: the first known Christmas tree in England."
        level: 3
        source: {title: "The First Christmas Tree", publisher: "History Today", url: "https://www.historytoday.com/archive/history-matters/first-christmas-tree"}
        checked: 2026-11-07
      - q: "Early mince pies contained an ingredient that today's almost never do. What was it?"
        a: "Meat"
        accept: "Minced beef, mutton or pork; tongue"
        note: "A recipe of 1591 uses lean mutton or beef. The suet is the last trace of it."
        level: 2
        source: {title: "Recipe for real mince pies", publisher: "English Heritage", url: "https://www.english-heritage.org.uk/visit/inspire-me/blog/blog-posts/recipe-for-real-mince-pies/"}
        checked: 2026-10-24

  - id: winter-animals
    title: Winter animals
    kind: junior
    editions: [uk, us]
    intro: "A round for the youngest players. Grown-ups, no shouting out!"
    questions:
      - q: "True or false: only boy reindeer grow antlers."
        a: "False"
        note: "Both male and female reindeer grow antlers, unlike most other deer."
        level: 1
        source: {title: "Fun facts about reindeer and caribou", publisher: "US Food and Drug Administration", url: "https://www.fda.gov/animal-veterinary/animal-health-literacy/fun-facts-about-reindeer-and-caribou"}
        checked: 2026-10-26
      - q: "Reindeer dig through the snow with their hooves to find food. Is it carrots, lichen or grass?"
        a: "Lichen"
        note: "It is also called reindeer moss."
        level: 1
        source: {title: "Fun facts about reindeer and caribou", publisher: "US Food and Drug Administration", url: "https://www.fda.gov/animal-veterinary/animal-health-literacy/fun-facts-about-reindeer-and-caribou"}
        checked: 2026-10-26
      - q: "In North America, wild reindeer are called by another name. What is it?"
        a: "Caribou"
        level: 2
        source: {title: "Fun facts about reindeer and caribou", publisher: "US Food and Drug Administration", url: "https://www.fda.gov/animal-veterinary/animal-health-literacy/fun-facts-about-reindeer-and-caribou"}
        checked: 2026-10-26
      - q: "Polar bears look white. What colour is the skin under their fur?"
        a: "Black"
        level: 1
        source: {title: "Why do polar bears have white fur? And 10 other polar bear facts", publisher: "WWF (World Wildlife Fund)", url: "https://www.worldwildlife.org/resources/facts/why-do-polar-bears-have-white-fur-and-10-other-polar-bear-facts/"}
        checked: 2026-10-26
      - q: "Do polar bears live near the North Pole or the South Pole?"
        a: "The North Pole (the Arctic)"
        level: 1
        source: {title: "Why do polar bears have white fur? And 10 other polar bear facts", publisher: "WWF (World Wildlife Fund)", url: "https://www.worldwildlife.org/resources/facts/why-do-polar-bears-have-white-fur-and-10-other-polar-bear-facts/"}
        checked: 2026-10-26
      - q: "What is a polar bear's favourite food: fish, seals or berries?"
        a: "Seals"
        note: "Mostly ringed seals, which give them lots of fat."
        level: 1
        source: {title: "Why do polar bears have white fur? And 10 other polar bear facts", publisher: "WWF (World Wildlife Fund)", url: "https://www.worldwildlife.org/resources/facts/why-do-polar-bears-have-white-fur-and-10-other-polar-bear-facts/"}
        checked: 2026-10-26
      - q: "Emperor penguins keep their egg warm on their feet all through the Antarctic winter. Is it the mum or the dad who does it?"
        a: "The dad"
        note: "For about two months, eating nothing but snow, while the mum goes to sea to feed."
        level: 1
        source: {title: "Male emperor penguins and their eggs", publisher: "EarthSky", url: "https://earthsky.org/earth/male-penguin-eggs"}
        checked: 2026-10-26
      - q: "Which of these animals sleeps through the winter: a hedgehog, a fox or a badger?"
        a: "A hedgehog"
        note: "In the UK only hedgehogs, dormice and bats truly hibernate. Foxes and badgers stay less active and spend more time in their setts and dens."
        level: 1
        source: {title: "The Big Sleep", publisher: "Herts and Middlesex Wildlife Trust", url: "https://www.hertswildlifetrust.org.uk/node/2345"}
        checked: 2026-11-07
      - q: "In summer the Arctic fox is brown and black. What colour does its coat turn in winter?"
        a: "White"
        level: 1
        source: {title: "Arctic fox", publisher: "US National Park Service (Kobuk Valley)", url: "https://www.nps.gov/kova/learn/nature/arctic-fox.htm"}
        checked: 2026-10-26
      - q: "Some birds, such as swallows, leave before winter. Where do they go?"
        a: "Somewhere warmer (they fly south)"
        accept: "South; a warmer country; Africa"
        level: 2
        source: {title: "Swallow", publisher: "North Wales Wildlife Trust", url: "https://northwaleswildlifetrust.org.uk/cy/wildlife-explorer/birds/swallows-swift-martins-and-nightjar/swallow"}
        checked: 2026-11-07

  - id: the-night-sky
    title: The night sky
    editions: [uk, us]
    intro: "Long winter nights are the best time to look up."
    questions:
      - q: "How many stars make up Orion's Belt?"
        a: "Three"
        note: "Alnitak, Alnilam and Mintaka."
        level: 1
        source: {title: "Discovering the universe through the constellation Orion", publisher: "NASA Science", url: "https://science.nasa.gov/universe/discovering-the-universe-through-the-constellation-orion"}
        checked: 2026-10-26
      - q: "Who was the first person to walk on the Moon, in July 1969?"
        a: "Neil Armstrong"
        level: 1
        source: {title: "Apollo 11", publisher: "NASA", url: "https://www.nasa.gov/mission/apollo-11/"}
        checked: 2026-10-26
      - q: "Polaris is the star sailors used to find north. What is its everyday name?"
        a: "The North Star"
        accept: "The Pole Star"
        level: 1
        source: {title: "Ursa Minor, the Little Bear, and Polaris", publisher: "Royal Museums Greenwich", url: "https://www.rmg.co.uk/stories/space-astronomy/ursa-minor-little-bear-polaris"}
        checked: 2026-10-26
      - q: "In Greek myth, who or what was Orion?"
        a: "A hunter"
        level: 2
        source: {title: "Discovering the universe through the constellation Orion", publisher: "NASA Science", url: "https://science.nasa.gov/universe/discovering-the-universe-through-the-constellation-orion"}
        checked: 2026-10-26
      - q: "The North Star sits at the end of the tail of which constellation: the Little Bear, the Great Bear or the Swan?"
        a: "The Little Bear (Ursa Minor)"
        note: "In North America it is called the Little Dipper. To find it, follow the two end stars of the Plough (Big Dipper)."
        level: 2
        source: {title: "Ursa Minor, the Little Bear, and Polaris", publisher: "Royal Museums Greenwich", url: "https://www.rmg.co.uk/stories/space-astronomy/ursa-minor-little-bear-polaris"}
        checked: 2026-10-26
      - q: "About how long does sunlight take to reach Earth: 8 seconds, 8 minutes or 8 hours?"
        a: "8 minutes"
        note: "About 8 minutes and 20 seconds, across roughly 150 million kilometres (93 million miles)."
        level: 2
        source: {title: "How long does it take light from the Sun to get to Earth?", publisher: "Smithsonian National Air and Space Museum", url: "https://howthingsfly.si.edu/ask-an-explainer/how-long-does-it-take-light-sun-get-earth"}
        checked: 2026-10-26
      - q: "Every mid-December, a meteor shower seems to come from the constellation Gemini. What is it called?"
        a: "The Geminids"
        note: "Up to 120 an hour in perfect conditions. They come from an asteroid, 3200 Phaethon, not a comet."
        level: 2
        source: {title: "Geminids", publisher: "NASA Science", url: "https://science.nasa.gov/solar-system/meteors-meteorites/geminids"}
        checked: 2026-10-26
      - q: "What is the most common colour of the northern lights?"
        a: "Green"
        note: "It comes from oxygen about 60 miles above the Earth."
        level: 2
        source: {title: "What are the Northern Lights and what causes them?", publisher: "Met Office", url: "https://www.metoffice.gov.uk/blog/2025/what-causes-the-northern-lights"}
        checked: 2026-10-26
      - q: "Mercury is closest to the Sun, but which planet is the hottest? (It is also the brightest planet in our sky.)"
        a: "Venus"
        note: "About 480°C (900°F) at the surface."
        level: 3
        source: {title: "Venus: our twin planet", publisher: "timeanddate.com", url: "https://www.timeanddate.com/astronomy/planets/venus"}
        checked: 2026-10-26
      - q: "What was the name of Apollo 11's lunar module, the craft that landed on the Moon?"
        a: "Eagle"
        note: "Michael Collins stayed in orbit while Armstrong and Aldrin landed."
        level: 3
        source: {title: "Apollo 11", publisher: "NASA", url: "https://www.nasa.gov/mission/apollo-11/"}
        checked: 2026-10-26

  - id: christmas-food
    title: Christmas food
    editions: [uk, us]
    intro: "Where the things on the table came from."
    questions:
      - q: "Turkeys first came from which continent?"
        a: "North America"
        note: "Wild turkeys lived across the present-day US and Mexico. People in Mexico were keeping them more than 2,000 years ago."
        level: 1
        source: {title: "Native Americans domesticated turkeys long before the Pilgrims arrived", publisher: "Audubon", url: "https://www.audubon.org/news/native-americans-domesticated-turkeys-long-pilgrims-arrived"}
        checked: 2026-10-26
      - q: "How do Brussels sprouts grow: under the ground, up a tall stalk, or on a tree?"
        a: "Up a tall stalk"
        note: "The stem grows 2 to 3 feet tall, with sprouts all the way up it."
        level: 1
        source: {title: "Brussels sprouts", publisher: "Encyclopaedia Britannica", url: "https://www.britannica.com/plant/Brussels-sprouts"}
        checked: 2026-10-26
      - q: "In which fairy tale, collected by the Brothers Grimm, do two children find a house covered in sweets?"
        a: "Hansel and Gretel"
        note: "Some say it inspired German bakers to make the first gingerbread houses."
        level: 1
        source: {title: "The history of the gingerbread house", publisher: "The Bubble", url: "https://www.thebubble.org.uk/?p=44420"}
        checked: 2026-10-26
      - q: "Brussels sprouts are a kind of which bigger vegetable?"
        a: "Cabbage"
        note: "They are the same species as cabbage, Brassica oleracea."
        level: 2
        source: {title: "Brussels sprouts", publisher: "Encyclopaedia Britannica", url: "https://www.britannica.com/plant/Brussels-sprouts"}
        checked: 2026-10-26
      - q: "Cranberry growers flood their fields at harvest time. Why?"
        a: "Ripe cranberries float, so they can be gathered off the top of the water"
        accept: "They float"
        note: "The berries have tiny air pockets inside. They grow on dry beds the rest of the year."
        level: 2
        source: {title: "Cranberries don't grow underwater, so why are the bogs flooded every fall?", publisher: "Farmers' Almanac", url: "https://www.farmersalmanac.com/why-are-cranberries-harvested-underwater"}
        checked: 2026-10-26
      - q: "Panettone, the tall Christmas bread full of candied fruit, comes from which Italian city?"
        a: "Milan"
        level: 2
        source: {title: "A Culinary History of Panettone, the Italian and South American Christmas Treat", publisher: "Smithsonian Magazine", url: "https://www.smithsonianmag.com/arts-culture/culinary-history-panettone-180971058/"}
        checked: 2026-11-07
      - q: "The bûche de Noël, a chocolate cake made to look like a log, is a Christmas favourite in which country?"
        a: "France"
        level: 2
        source: {title: "What is a yule log, the Christmas dessert?", publisher: "National Geographic", url: "https://www.nationalgeographic.com/travel/article/what-is-yule-log-christmas-dessert"}
        checked: 2026-10-26
      - q: "True or false: the candy cane was invented in 1670 by a choirmaster in Cologne, to keep children quiet in church."
        a: "False, as far as anyone can prove"
        accept: "False"
        note: "It is a popular story, but no record of it has been found. The first mentions of candy canes come from the 1800s."
        level: 2
        source: {title: "Is the Christmas candy cane a religious symbol? Fact check", publisher: "That's Nonsense", url: "https://www.thatsnonsense.com/is-the-christmas-candy-cane-a-religious-symbol-fact-check/"}
        checked: 2026-11-06
      - q: "Germany's Christmas stollen is said to be shaped to look like what?"
        a: "The baby Jesus wrapped in swaddling clothes"
        level: 3
        source: {title: "Christmas classic: the stollen", publisher: "deutschland.de", url: "https://www.deutschland.de/en/topic/life/lifestyle-cuisine/christmas-classic-the-stollen"}
        checked: 2026-10-26
      - q: "The yule log cake copies a much older custom with a real log. What was done with it?"
        a: "It was burned"
        note: "Lit on Christmas Eve and kept burning until Twelfth Night."
        level: 3
        source: {title: "What is a yule log, the Christmas dessert?", publisher: "National Geographic", url: "https://www.nationalgeographic.com/travel/article/what-is-yule-log-christmas-dessert"}
        checked: 2026-10-26

  - id: dinosaurs
    title: Dinosaurs
    kind: junior
    editions: [uk, us]
    intro: "A round for the youngest players, about the giants that ruled the Earth. Grown-ups, no shouting out!"
    questions:
      - q: "The word dinosaur comes from Greek. Does it mean terrible lizard, giant bird or old dragon?"
        a: "Terrible lizard"
        note: "The man who coined the name, Richard Owen, also called them 'fearfully great', because they were so big."
        level: 1
        source: {title: "Dinosauria: How the 'terrible lizards' got their name", publisher: "Natural History Museum", url: "https://www.nhm.ac.uk/discover/how-dinosaurs-got-their-name.html"}
        checked: 2026-10-27
      - q: "Triceratops means three-horned face. Did it eat plants or meat?"
        a: "Plants"
        note: "It had a beak for plucking low plants, and jaws strong enough to cut through small trees."
        level: 1
        source: {title: "Triceratops", publisher: "Redpath Museum, McGill University", url: "https://www.mcgill.ca/redpath/education/resources/dinosaurs/triceratops"}
        checked: 2026-10-27
      - q: "Tyrannosaurus rex had tiny arms. How many fingers, or claws, were on each hand: two, three or five?"
        a: "Two"
        note: "Scientists once thought it had three. A skeleton found in 1988, with its arms complete, showed it had only two."
        level: 1
        source: {title: "How T. rex Lost Its Third Claw", publisher: "American Museum of Natural History", url: "https://www.amnh.org/explore/news-blogs/t-rex-third-claw"}
        checked: 2026-10-27
      - q: "Most scientists say one group of dinosaurs is still alive today. You may see one out of the window. What are they?"
        a: "Birds"
        level: 1
        source: {title: "Dinosaurs Among Us Opens at the American Museum of Natural History", publisher: "American Museum of Natural History", url: "https://www.amnh.org/about/press-center/dinosaurs-among-us-opens-at-the-american-museum-of-natural-history"}
        checked: 2026-10-27
      - q: "What crashed into the Earth 66 million years ago and ended the age of the dinosaurs: an asteroid, the Moon or a comet made of ice?"
        a: "An asteroid"
        note: "It ended the reign of all the dinosaurs except the birds."
        level: 1
        source: {title: "The Last American Dinosaurs: Discovering a Lost World", publisher: "Smithsonian National Museum of Natural History", url: "https://naturalhistory.si.edu/exhibits/last-american-dinosaurs-discovering-lost-world"}
        checked: 2026-10-27
      - q: "Iguanodon's spiky thumb was first put in the wrong place. Where: on its nose, its tail or its back?"
        a: "On its nose"
        note: "They thought the spike was a horn. Only in the 1870s was it shown to be a thumb."
        level: 1
        source: {title: "Iguanodon: the teeth that led to a dinosaur discovery", publisher: "Natural History Museum", url: "https://www.nhm.ac.uk/discover/the-discovery-of-iguanodon.html"}
        checked: 2026-10-27
      - q: "As a girl, Mary Anning dug a skeleton out of the beach at Lyme Regis. Was it a dinosaur, a sea reptile or a giant fish?"
        a: "A sea reptile"
        accept: "An ichthyosaur"
        note: "Her brother spotted the skull in 1811, when she was 12. It was an ichthyosaur, 'neither fish nor lizard, but a marine reptile', the first ever studied by scientists."
        level: 1
