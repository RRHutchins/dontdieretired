# The guidance engine's library of sources (RUNBOOK §6r). Every source here was opened and read on its `opened` date.
# tier = how much weight its guidance carries (the engine ranks by this, then by how many independent sources agree):
#   5  official health body or government guidance (NHS, UK Chief Medical Officers, UKHSA/NaTHNaC, CDC), or an
#      international expert consensus statement
#   4  peer-reviewed systematic review, meta-analysis or large prospective study
#   3  national governing body, national coaching body, or the authority that runs the route or event
#   2  recognised coach or elite athlete, published by a governing body or reputable outlet
#   1  general media, commercial or personal sites (used only to find better sources; never enough on its own)
# `independent` groups sources that are really one voice (e.g. two NHS pages): agreement counts once per group.
