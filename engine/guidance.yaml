# The guidance engine's statements (RUNBOOK §6r). Each is written in our own words and says only what its sources say.
# applies: which kinds of challenge it covers: all, endurance, running, walking, hill, multiday, altitude
# for: sources that support it. against: sources that say otherwise (the engine weighs both and reports the result).
# use: how a plan uses it (rule = shapes the schedule; advice = printed in the plan; safety = printed in the safety box).
guidance:
  # ---------- before you start ----------
  - id: health-check-first
    topic: before you start
    applies: [all]
    use: safety
    text: If you have a health condition or are worried about your health, speak to your GP (family doctor) before you start training.
    for: [nhs-c25k, nathnac-altitude]
  - id: start-where-you-are
    topic: before you start
    applies: [all]
    use: rule
    text: Start from your current level and build up gradually; repeating a week is fine and is part of the plan, not a failure.
    for: [cmo-2019, nhs-c25k]

  # ---------- how hard and how much ----------
  - id: mostly-easy
    topic: intensity
    applies: [endurance]
    use: rule
    text: Do most of your training at an easy, conversational effort, about 2 to 3 out of 10, where you could hold a full conversation. Keep a small share for harder work.
    for: [ea-training-pace, ijspp-2010-intensity, higdon-novice1]
  - id: easy-means-easy
    topic: intensity
    applies: [endurance]
    use: advice
    text: Keep easy days truly easy. Drifting into a steadier pace on easy days leaves you more tired for the sessions that matter and takes away their benefit.
    for: [ea-training-pace]
  - id: no-big-jumps
    topic: progression
    applies: [endurance]
    use: rule
    text: Increase your training a little at a time. Big week-to-week jumps (more than about 30 per cent) were linked with more overuse injuries in a study of 874 new runners; the familiar 10 per cent rule is a sensible cap but is not firmly proven.
    for: [nielsen-2014, nhs-c25k]
  - id: cutback-weeks
    topic: progression
    applies: [endurance]
    use: rule
    text: Every third or fourth week, ease back on volume to let your body absorb the work before building again; older runners and people under other stress may do best with every third week.
    for: [higdon-novice1, rc-down-weeks]
  - id: long-session
    topic: key session
    applies: [endurance]
    use: rule
    text: Build one long session a week at an easy effort, growing towards the length and duration of the challenge itself.
    for: [higdon-novice1, bmc-hill-fit]
  - id: specific-training
    topic: key session
    applies: [hill, walking]
    use: rule
    text: Train for the ground you will cover. For hill challenges walk hills fast, or use stairs, and add short hill repeats of 50 to 100 metres of climb, four to six times, coming down slowly.
    for: [bmc-hill-fit, ydnpa-three-peaks]
  - id: route-demands
    topic: key session
    applies: [all]
    use: rule
    text: Know the real demands of your challenge (distance, total climb, time on your feet, altitude) and make sure your plan builds towards them.
    for: [ydnpa-three-peaks, bmc-hill-fit]
  - id: cross-training
    topic: key session
    applies: [endurance]
    use: advice
    text: Low-impact exercise such as cycling, swimming or rowing builds fitness with less pounding and is useful for everyone, not just the injured.
    for: [ea-training-pace, higdon-novice1]
  - id: rest-days
    topic: recovery
    applies: [all]
    use: rule
    text: Plan rest days into every week, and take an easier day when your legs are heavy.
    for: [nhs-c25k, higdon-novice1, bmc-long-distance]

  # ---------- maintaining the body ----------
  - id: strength-twice-weekly
    topic: body maintenance
    applies: [all]
    use: rule
    text: Do strength exercises for the whole body on at least two days a week. In trials, strength training cut sports injuries to about a third.
    for: [cmo-2019, lauersen-2014, bmc-hill-fit]
    against: [higdon-novice1]
    note: Higdon's beginner marathon plan suggests people new to weights wait. The official guidance and the injury evidence carry more weight, so plans include strength work, starting light with body weight.
  - id: balance-work
    topic: body maintenance
    applies: [all]
    use: advice
    text: Include balance work; for older adults the official guidance pairs it with strength on two days a week, and balance (proprioception) training also reduced injuries in trials.
    for: [cmo-2019, lauersen-2014]
  - id: legs-and-core
    topic: body maintenance
    applies: [hill, walking, running]
    use: advice
    text: Squats and lunges for the legs and hips, plus core work for balance, are the backbone of strength training for hill days.
    for: [bmc-hill-fit]
  - id: stretching-not-protective
    topic: body maintenance
    applies: [all]
    use: advice
    text: Stretch after a long day if it feels good, but do not rely on stretching to prevent injury; trials found it made no difference, unlike strength and balance work.
    for: [lauersen-2014, bmc-hill-fit]
  - id: weight-bearing-bones
    topic: body maintenance
    applies: [all]
    use: advice
    text: Weight-bearing activity such as walking and running helps keep bones strong.
    for: [cmo-2019]
  - id: sleep-routine
    topic: recovery
    applies: [endurance]
    use: advice
    text: Keep a regular sleep routine through training; good sleep is part of recovery, and on multi-day trips a warm enough sleeping bag and mat matter more than people expect.
    for: [ea-pavey-marathon, bmc-long-distance]
  - id: dont-chase-missed
    topic: recovery
    applies: [all]
    use: advice
    text: If you miss a session, do not worry about it; carry on with the plan, or repeat a week if you need to.
    for: [ea-pavey-marathon, nhs-c25k]

  # ---------- fuel, drink, feet, kit ----------
  - id: drink-to-thirst
    topic: fuel and drink
    applies: [endurance]
    use: safety
    text: Drink when you are thirsty rather than to a schedule. Drinking far more than you need can dilute the body's sodium, which can be dangerous; it affects walkers and recreational exercisers as well as racers.
    for: [eah-consensus-2015]
  - id: snack-little-often
    topic: fuel and drink
    applies: [endurance]
    use: advice
    text: On long days eat regularly on the move, a little and often from a variety of foods, rather than one big meal before you start.
    for: [bmc-hill-fit, issn-ultra-2019]
  - id: practise-fuel
    topic: fuel and drink
    applies: [endurance]
    use: advice
    text: Use your long sessions to practise exactly what you will eat and drink on the day, building up gradually so your stomach gets used to it. Nothing new on the day.
    for: [ea-pavey-marathon, issn-ultra-2019]
  - id: feet-first
    topic: feet
    applies: [walking, running, multiday]
    use: advice
    text: Train in the footwear you will use on the day and break new shoes in gradually. Wear moisture-wicking socks and change them if your feet sweat.
    for: [nhs-blisters, ea-pavey-marathon, bmc-long-distance]
  - id: blisters
    topic: feet
    applies: [walking, running, multiday]
    use: advice
    text: Deal with a hot spot as soon as you feel it. Cover a blister with a soft or padded plaster and do not burst it; get advice if it shows signs of infection.
    for: [nhs-blisters, bmc-long-distance]
  - id: kit-practice
    topic: kit
    applies: [hill, walking, multiday]
    use: rule
    text: In the later weeks, train with the pack and the kit you will carry on the day so nothing is new.
    for: [bmc-hill-fit, ydnpa-three-peaks, wanderlust-trek-prep]
  - id: navigation
    topic: kit
    applies: [hill]
    use: advice
    text: Carry a map and compass and know how to use them; do not rely on signs or a phone, whose signal and battery can fail.
    for: [ydnpa-three-peaks, bmc-hill-fit]

  # ---------- the event itself ----------
  - id: taper
    topic: taper
    applies: [endurance]
    use: rule
    text: In the final two weeks, cut your training volume by roughly 40 to 60 per cent while keeping the same number of sessions and some of the same effort, so you arrive fresh.
    for: [bosquet-2007, ea-pavey-marathon, higdon-novice1]
    note: The meta-analysis studied competitive athletes and found two weeks best; Higdon's beginner plan uses three. Plans use two to three weeks depending on length.
  - id: pace-the-start
    topic: on the day
    applies: [endurance]
    use: advice
    text: Start slower than you think you need to; early miles feel easy and are where most people overdo it.
    for: [ea-pavey-marathon, ea-training-pace]
  - id: weather-daylight
    topic: on the day
    applies: [hill]
    use: safety
    text: Check the forecast, walk in daylight, leave your route with someone, and turn back if conditions get beyond you. Summits are colder than valleys.
    for: [ydnpa-three-peaks]

  # ---------- multi-day ----------
  - id: back-to-back
    topic: key session
    applies: [multiday]
    use: rule
    text: Before a multi-day trip, practise long days back to back.
    for: [bmc-long-distance]
  - id: multiday-pacing
    topic: on the day
    applies: [multiday]
    use: advice
    text: On a multi-day trip keep the first few days shorter while you find your rhythm, let the daily distance flex with the terrain and how you feel, and build in easier days or full rest days.
    for: [bmc-long-distance, wanderlust-trek-prep]
  - id: build-day-walks
    topic: key session
    applies: [multiday, walking]
    use: rule
    text: Build your training walks from a few miles up to a full day's distance, carrying the pack you will use.
    for: [wanderlust-trek-prep, bmc-hill-fit]

  # ---------- altitude ----------
  - id: altitude-ascent-rate
    topic: altitude
    applies: [altitude]
    use: safety
    text: Above 3,000 metres, sleep no more than 500 metres higher than the night before and take a rest day at the same height every three or four days. Avoid going from below 1,200 metres to above 3,500 metres in a day.
    for: [nhs-altitude, nathnac-altitude, tanapa-kili]
  - id: altitude-fitness-not-protective
    topic: altitude
    applies: [altitude]
    use: safety
    text: Being fit does not protect you from altitude sickness. Choose an itinerary with acclimatisation days and climb slowly however strong you feel.
    for: [nathnac-altitude, tanapa-kili]
  - id: altitude-symptoms
    topic: altitude
    applies: [altitude]
    use: safety
    text: Headache with nausea, dizziness or tiredness can be altitude sickness. Stop climbing and rest; if it gets worse or has not improved after a day, go down. Confusion, poor balance, breathlessness at rest or a wet cough are emergencies; descend at once and get help.
    for: [nhs-altitude, nathnac-altitude]
  - id: altitude-see-gp
    topic: altitude
    applies: [altitude]
    use: safety
    text: See your GP or a travel clinic before a high-altitude trip, especially if you have a health condition or have had altitude sickness before; they can discuss preventive medicine. Make sure your insurance covers evacuation.
    for: [nhs-altitude, nathnac-altitude]

  # ---------- warning signs ----------
  - id: emergency-heart
    topic: warning signs
    applies: [all]
    use: safety
    text: Call 999 (911 in the US) for tight or squeezing chest pain, pain spreading to the arms, neck or jaw, severe breathlessness, or if someone collapses. Do not drive yourself to hospital.
    for: [nhs-heart-attack]
  - id: stop-if-wrong
    topic: warning signs
    applies: [all]
    use: safety
    text: Stop if something does not feel right, and get it checked rather than training through it.
    for: [nhs-c25k, ea-pavey-marathon]
