# The guidance engine's statements (RUNBOOK §6r). Each is written in our own words and says only what its sources say.
# applies: which kinds of challenge it covers: all, endurance, running, walking, hill, multiday, altitude
# for: sources that support it. against: sources that say otherwise (the engine weighs both and reports the result).
# events: optional; limits a statement to those event profiles (e.g. advice only about a 10k).
# use: how a plan uses it (rule = shapes the schedule; advice = printed in the plan; safety = printed in the safety box).
guidance:
  # ---------- before you start ----------
  - id: health-check-first
    topic: before you start
    applies: [all]
    use: safety
    text: If you have a health condition or are worried about your health, speak to your GP (family doctor) before you start training.
    for: [nhs-c25k, nathnac-altitude]
  - id: start-where-you-are
    topic: before you start
    applies: [all]
    use: rule
    text: Start from your current level and build up gradually; repeating a week is fine and is part of the plan, not a failure.
    for: [cmo-2019, nhs-c25k, who-2011-older]

  # ---------- how hard and how much ----------
  - id: mostly-easy
    topic: intensity
    applies: [endurance]
    use: rule
    text: Do most of your training at an easy, conversational effort, about 2 to 3 out of 10, where you could hold a full conversation. Keep a small share for harder work.
    for: [ea-training-pace, ijspp-2010-intensity, higdon-novice1, cyclinguk-100km]
  - id: easy-means-easy
    topic: intensity
    applies: [endurance]
    use: advice
    text: Keep easy days truly easy. Drifting into a steadier pace on easy days leaves you more tired for the sessions that matter and takes away their benefit.
    for: [ea-training-pace]
  - id: no-big-jumps
    topic: progression
    applies: [endurance]
    use: rule
    text: Increase your training a little at a time. Big week-to-week jumps (more than about 30 per cent) were linked with more overuse injuries in a study of 874 new runners; the familiar 10 per cent rule is a sensible cap but is not firmly proven.
    for: [nielsen-2014, nhs-c25k, greatrun-how-to-half]
  - id: cutback-weeks
    topic: progression
    applies: [endurance]
    use: rule
    text: Every third or fourth week, ease back on volume to let your body absorb the work before building again; older runners and people under other stress may do best with every third week.
    for: [higdon-novice1, rc-down-weeks]
  - id: long-session
    topic: key session
    applies: [endurance]
    use: rule
    text: Build one long session a week at an easy effort, growing towards the length and duration of the challenge itself.
    for: [higdon-novice1, bmc-hill-fit, emf-half-beginner]
  - id: specific-training
    topic: key session
    applies: [hill, walking]
    use: rule
    text: Train for the ground you will cover. For hill challenges walk hills fast, or use stairs, and add short hill repeats of 50 to 100 metres of climb, four to six times, coming down slowly.
    for: [bmc-hill-fit, ydnpa-three-peaks]
  - id: route-demands
    topic: key session
    applies: [all]
    use: rule
    text: Know the real demands of your challenge (distance, total climb, time on your feet, altitude) and make sure your plan builds towards them.
    for: [ydnpa-three-peaks, bmc-hill-fit]
  - id: cross-training
    topic: key session
    applies: [endurance]
    use: advice
    text: Low-impact exercise such as cycling, swimming or rowing builds fitness with less pounding and is useful for everyone, not just the injured.
    for: [ea-training-pace, higdon-novice1]
  - id: rest-days
    topic: recovery
    applies: [all]
    use: rule
    text: Plan rest days into every week, and take an easier day when your legs are heavy.
    for: [nhs-c25k, higdon-novice1, bmc-long-distance]

  # ---------- maintaining the body ----------
  - id: strength-twice-weekly
    topic: body maintenance
    applies: [all]
    use: rule
    text: Do strength exercises for the whole body on at least two days a week. In trials, strength training cut sports injuries to about a third.
    for: [cmo-2019, lauersen-2014, bmc-hill-fit, who-2011-older, nhs-bones-65, cdc-older-adults]
    against: [higdon-novice1]
    note: Higdon's beginner marathon plan suggests people new to weights wait. The official guidance and the injury evidence carry more weight, so plans include strength work, starting light with body weight.
  - id: balance-work
    topic: body maintenance
    applies: [all]
    use: advice
    text: Include balance work; for older adults the official guidance pairs it with strength on two days a week, the NHS says balance and flexibility work twice a week can reduce the risk of falling, and balance (proprioception) training also reduced injuries in trials.
    for: [cmo-2019, lauersen-2014, who-2011-older, nhs-bones-65, cdc-older-adults]
  - id: legs-and-core
    topic: body maintenance
    applies: [hill, walking, running]
    use: advice
    text: Squat-type exercises are the backbone of leg and hip strength. Start with sit-to-stand and mini-squats, adding repetitions gradually, then move on to squats and lunges, with core work for balance on rough ground.
    for: [bmc-hill-fit, nhs-strength-exercises]
  - id: stretching-not-protective
    topic: body maintenance
    applies: [all]
    use: advice
    text: Stretch after a long day if it feels good, but do not rely on stretching to prevent injury; trials found it made no difference, unlike strength and balance work.
    for: [lauersen-2014, bmc-hill-fit]
  - id: weight-bearing-bones
    topic: body maintenance
    applies: [all]
    use: advice
    text: Weight-bearing activity such as walking and running helps keep bones strong.
    for: [cmo-2019]
  - id: bones-impact-caution
    topic: body maintenance
    applies: [all]
    use: safety
    text: If you have osteoporosis or a high risk of fractures, ask your GP (family doctor) whether high-impact exercise is right for you before adding it.
    for: [nhs-bones-65]
  - id: falls-exercise
    topic: body maintenance
    applies: [all]
    use: advice
    text: Exercise that challenges your balance and builds functional strength, progressed regularly and kept up over time, helps prevent falls as you get older; tai chi is another option. A review of 108 trials found exercise cut the rate of falls by about a quarter, and balance and functional exercises combined with strength work probably cut it by about a third.
    for: [sherrington-2019, who-falls]
  - id: sleep-routine
    topic: recovery
    applies: [endurance]
    use: advice
    text: Keep a regular sleep routine through training, going to bed and getting up at around the same time each day; good sleep is part of recovery, and on multi-day trips a warm enough sleeping bag and mat matter more than people expect.
    for: [ea-pavey-marathon, bmc-long-distance, nhs-emm-sleep]
  - id: dont-chase-missed
    topic: recovery
    applies: [all]
    use: advice
    text: If you miss a session, do not worry about it; carry on with the plan, or repeat a week if you need to.
    for: [ea-pavey-marathon, nhs-c25k]

  # ---------- fuel, drink, feet, kit ----------
  - id: drink-to-thirst
    topic: fuel and drink
    applies: [endurance]
    use: safety
    text: Drink when you are thirsty rather than to a schedule. Drinking far more than you need can dilute the body's sodium, which can be dangerous; it affects walkers and recreational exercisers as well as racers.
    for: [eah-consensus-2015]
    against: [bc-sofa-50km]
    note: British Cycling's beginner plan suggests sipping every 10 to 15 minutes on a ride. The international consensus statement outranks it, so plans say drink to thirst and the cycling statement on fuel does not set a drinking schedule.
  - id: snack-little-often
    topic: fuel and drink
    applies: [endurance]
    use: advice
    text: On long days eat regularly on the move, a little and often from a variety of foods, rather than one big meal before you start.
    for: [bmc-hill-fit, issn-ultra-2019]
  - id: practise-fuel
    topic: fuel and drink
    applies: [endurance]
    use: advice
    text: Use your long sessions to practise exactly what you will eat and drink on the day, building up gradually so your stomach gets used to it. Nothing new on the day.
    for: [ea-pavey-marathon, issn-ultra-2019]
  - id: feet-first
    topic: feet
    applies: [walking, running, multiday]
    use: advice
    text: Train in the footwear you will use on the day and break new shoes in gradually. Wear moisture-wicking socks and change them if your feet sweat.
    for: [nhs-blisters, ea-pavey-marathon, bmc-long-distance]
  - id: blisters
    topic: feet
    applies: [walking, running, multiday]
    use: advice
    text: Deal with a hot spot as soon as you feel it. Cover a blister with a soft or padded plaster and do not burst it; get advice if it shows signs of infection.
    for: [nhs-blisters, bmc-long-distance]
  - id: kit-practice
    topic: kit
    applies: [hill, walking, multiday]
    use: rule
    text: In the later weeks, train with the pack and the kit you will carry on the day so nothing is new.
    for: [bmc-hill-fit, ydnpa-three-peaks, wanderlust-trek-prep]
  - id: navigation
    topic: kit
    applies: [hill]
    use: advice
    text: Carry a map and compass and know how to use them; do not rely on signs or a phone, whose signal and battery can fail.
    for: [ydnpa-three-peaks, bmc-hill-fit, mrew-safety, pcta-safety-tips]

  # ---------- the event itself ----------
  - id: taper
    topic: taper
    applies: [endurance]
    use: rule
    text: In the final two weeks, cut your training volume by roughly 40 to 60 per cent while keeping the same number of sessions and some of the same effort, so you arrive fresh.
    for: [bosquet-2007, ea-pavey-marathon, higdon-novice1, greatrun-half-plan, emf-half-beginner]
    note: The meta-analysis studied competitive athletes and found two weeks best; Higdon's beginner plan uses three. Plans use two to three weeks depending on length.
  - id: pace-the-start
    topic: on the day
    applies: [endurance]
    use: advice
    text: Start slower than you think you need to; early miles feel easy and are where most people overdo it.
    for: [ea-pavey-marathon, ea-training-pace]
  - id: weather-daylight
    topic: on the day
    applies: [hill]
    use: safety
    text: Check the forecast and conditions, walk in daylight, leave your route and return time with someone, and turn back if conditions get beyond you; the mountain will be there another day. Summits are colder than valleys.
    for: [ydnpa-three-peaks, nhfg-hiking-safety, mwo-higher-summits]
  - id: storms-off-summit-early
    topic: on the day
    applies: [hill]
    events: [mount-whitney]
    use: safety
    text: Thunderstorms and lightning are a serious hazard on a high mountain. If storms are forecast, plan to be off the summit by noon, and at the first sign of lightning leave the summit and any exposed ridge. Be ready for high wind, freezing temperatures, rain or snow in any month.
    for: [inyo-whitney-leaflet]
  - id: mountain-afternoon-storms
    topic: on the day
    applies: [hill]
    events: [mount-whitney]
    use: safety
    text: In high mountains thunderstorms usually build in the afternoon. Check the forecast before you go and stay away if a high chance of thunderstorms is forecast; start early and plan to be down by noon; keep off hilltops and ridge tops in a storm, and at the first sign of one get below the treeline. Carry rain gear and warm layers.
    for: [nws-lightning-outdoors, usfs-elbert]
  - id: whitney-snow-season
    topic: before you start
    applies: [hill]
    events: [mount-whitney]
    use: safety
    text: Plan for the snow-free season, usually July to late September. When snow or ice is on the mountain it needs winter mountaineering skills and equipment.
    for: [inyo-whitney, inyo-whitney-leaflet]

  # ---------- multi-day ----------
  - id: back-to-back
    topic: key session
    applies: [multiday]
    use: rule
    text: Before a multi-day trip, practise long days back to back, such as a long walk on Saturday and another on Sunday, so you know how your body copes with the second day.
    for: [bmc-long-distance, ldwa-trailwalker]
  - id: multiday-pacing
    topic: on the day
    applies: [multiday]
    use: advice
    text: On a multi-day trip keep the first few days shorter while you find your rhythm, let the daily distance flex with the terrain and how you feel, and build in easier days or full rest days.
    for: [bmc-long-distance, wanderlust-trek-prep]
  - id: multiday-heat
    topic: on the day
    applies: [multiday]
    use: advice
    text: In hot, humid weather start walking early to avoid the midday heat, carry water and refill it before you set off each day, and take breaks when you need them, in the shade where you can, rather than treating the walk as a race.
    for: [tanabe-kumano-tips, nps-heat-illness]
  - id: build-day-walks
    topic: key session
    applies: [multiday, walking]
    use: rule
    text: Build your training walks from a few miles up to a full day's distance, carrying the pack you will use.
    for: [wanderlust-trek-prep, bmc-hill-fit]

  # ---------- altitude ----------
  - id: altitude-ascent-rate
    topic: altitude
    applies: [altitude]
    use: safety
    text: Above 3,000 metres, sleep no more than 500 metres higher than the night before and take a rest day at the same height every three or four days. Avoid going from below 1,200 metres to above 3,500 metres in a day.
    for: [nhs-altitude, nathnac-altitude, tanapa-kili, cdc-altitude]
  - id: altitude-fitness-not-protective
    topic: altitude
    applies: [altitude]
    use: safety
    text: Being fit does not protect you from altitude sickness. Choose an itinerary with acclimatisation days and climb slowly however strong you feel.
    for: [nathnac-altitude, tanapa-kili, cdc-altitude]
  - id: altitude-symptoms
    topic: altitude
    applies: [altitude]
    use: safety
    text: Headache with nausea, dizziness or tiredness can be altitude sickness. Stop climbing and rest; if it gets worse or has not improved after a day, go down. Confusion, poor balance, breathlessness at rest or a wet cough are emergencies; descend at once and get help.
    for: [nhs-altitude, nathnac-altitude, cdc-altitude, inyo-whitney-leaflet]
  - id: altitude-see-gp
    topic: altitude
    applies: [altitude]
    use: safety
    text: See your GP or a travel clinic before a high-altitude trip, especially if you have a health condition or have had altitude sickness before; they can discuss preventive medicine. Make sure your insurance covers evacuation.
    for: [nhs-altitude, nathnac-altitude, cdc-altitude]
  - id: altitude-arrive-early
    topic: altitude
    applies: [altitude]
    use: safety
    text: If you fly or drive straight to a high town, rest there for a day or two before you walk any higher, drink enough water, and avoid alcohol for the first two days.
    for: [nhs-altitude, cdc-altitude, promperu-inca]

  # ---------- warning signs ----------
  - id: emergency-heart
    topic: warning signs
    applies: [all]
    use: safety
    text: Call 999 (911 in the US) for tight or squeezing chest pain, pain spreading to the arms, neck or jaw, severe breathlessness, or if someone collapses. Do not drive yourself to hospital.
    for: [nhs-heart-attack]
  - id: stop-if-wrong
    topic: warning signs
    applies: [all]
    use: safety
    text: Stop if something does not feel right, and get it checked rather than training through it.
    for: [nhs-c25k, ea-pavey-marathon]

  - id: mountain-rescue-call
    topic: warning signs
    applies: [hill]
    use: safety
    text: In the hills, leave your route and expected return time with someone. In an emergency in the UK call 999 or 112 and ask for Police, then Mountain Rescue (911 in the US); if you have registered for emergency SMS, you can text 999.
    for: [mrew-safety, ms-hypothermia, pcta-safety-tips]
  - id: hill-hypothermia
    topic: warning signs
    applies: [hill]
    use: safety
    text: In cold, wet or windy weather watch yourself and others for hypothermia. Shivering, slurred speech, confusion or clumsiness, and someone going quiet or drowsy are warning signs; drowsiness after the shivering stops is an emergency. Get them out of the wind and wet, replace wet clothes with dry layers and cover their head, and give a warm, sweet, non-alcoholic drink and sugary food if they are fully awake. Do not rub their arms and legs or use hot water bottles, and call 999 (Police, then Mountain Rescue, in the hills).
    for: [nhs-hypothermia, ms-hypothermia]
  - id: c2c-low-level
    topic: before you start
    applies: [multiday]
    events: [coast-to-coast]
    use: safety
    text: The Coast to Coast is a demanding trail, hardest at the western end through the Lake District, where waymarks usually stop above the fell wall. Some high sections may be difficult in winter or bad weather; know the low-level options and use them when the weather is poor.
    for: [govuk-c2c]
  - id: coast-cliff-safety
    topic: on the day
    applies: [walking]
    events: [coast-to-coast]
    use: safety
    text: On cliff-top stretches keep to the path and away from the edge, especially in wind or when the grass is wet, know the tide times so you are not cut off, and on the coast call 999 or 112 and ask for the Coastguard.
    for: [swcpa-safety, wcp-safety]
  - id: coast-tide-cutoff
    topic: on the day
    applies: [walking]
    events: [coast-to-coast]
    use: safety
    text: Before walking on a beach or below cliffs, check the tide times (ask someone who knows the area if you cannot read a tide table), keep an eye on which way the tide is moving, and plan to be back on safe ground well before you could be cut off. Carry a charged phone. If you are cut off, stay where you are rather than going into the water, and call 999 and ask for the Coastguard.
    for: [rnli-tidal-wales-2026, swcpa-safety, wcp-safety]

  # ---------- why each part of a plan is there (use: why; `role` ties it to a session; `short` is the one-line weekly version) ----------
  - id: why-long
    topic: why
    role: long
    applies: [endurance]
    use: why
    text: The long session prepares you for the length of the day itself. Its pace does not matter; covering the time or distance does, so keep it at a conversational effort.
    short: it gets you used to the hours you will spend out on the day; pace does not matter
    for: [higdon-novice1, bmc-hill-fit, ydnpa-three-peaks]
  - id: why-easy
    topic: why
    role: easy
    applies: [endurance]
    use: why
    text: Easy sessions add fitness without leaving you too tired for the long session. Top endurance athletes do about four in five of their sessions at this low effort.
    short: it adds fitness while leaving you fresh for the long session
    for: [ea-training-pace, ijspp-2010-intensity]
  - id: why-specific
    topic: why
    role: specific
    applies: [hill]
    use: why
    text: Hill repeats practise exactly what a hill challenge asks of you, climbing again and again, then coming down slowly and with control.
    short: it practises the climbing and the controlled descents the challenge is made of
    for: [bmc-hill-fit, ydnpa-three-peaks]
  - id: why-strength
    topic: why
    role: strength
    applies: [all]
    use: why
    text: Strength and balance work is what keeps you in one piece. In trials it cut sports injuries to about a third, it is part of the official guidance for everyone on at least two days a week, and core and balance work helps on rough ground.
    short: it protects you from injury (about a third of the injuries in trials) and keeps you steady on rough ground
    for: [lauersen-2014, cmo-2019, bmc-hill-fit]
  - id: why-rest
    topic: why
    role: rest
    applies: [all]
    use: why
    text: Rest days are when your body recovers from the work and adapts to it. The NHS's beginner running plan puts a rest day between every run.
    short: your body recovers and adapts on the days you rest, not the days you train
    for: [nhs-c25k, rc-down-weeks]
  - id: why-cutback
    topic: why
    role: cutback
    applies: [endurance]
    use: why
    text: An easier week every third week lets the tiredness of the previous weeks clear, so your fitness can rebound before you build again.
    short: it lets the last two weeks' tiredness clear so your fitness can catch up
    for: [rc-down-weeks, higdon-novice1]
  - id: why-pack
    topic: why
    role: pack
    applies: [walking, multiday]
    use: why
    text: Training with your loaded pack matches the conditions of the day and shows you what you really need to carry.
    short: it matches the conditions of the day and shows you what you really need to carry
    for: [wanderlust-trek-prep, bmc-hill-fit]
  - id: why-taper
    topic: why
    role: taper
    applies: [endurance]
    use: why
    text: Cutting back in the final weeks lets your muscles recover and your body refuel, so you arrive fresh rather than tired. In research, a two-week taper improved performance.
    short: your muscles recover and your body refuels, so you arrive fresh
    for: [bosquet-2007, ea-pavey-marathon]

  # ---------- running: half marathon and 10k (added 27 Oct 2026) ----------
  - id: run-three-times
    topic: key session
    applies: [running]
    use: rule
    text: Run at least three times a week, with rest days in between; beginner plans from the NHS and from Great Run both start with three runs a week.
    for: [nhs-c25k, greatrun-how-to-half, greatrun-half-plan]
  - id: long-run-by-time
    events: [half-marathon]
    topic: key session
    applies: [running]
    use: advice
    text: For a first half marathon, think of the long run in minutes rather than miles, at an easy pace, building to about 80 minutes by two weeks before the race.
    for: [greatrun-half-plan]
  - id: warm-up-dynamic
    topic: on the day
    applies: [running]
    use: advice
    text: Warm up for about 5 to 10 minutes before you run with moving exercises, such as marching on the spot, knee lifts and gentle knee bends, rather than held stretches.
    for: [greatrun-how-to-half, nhs-warm-up]

  # ---------- 10k (added 2 Nov 2026) ----------
  - id: tenk-long-run
    events: [first-10k]
    topic: key session
    applies: [running]
    use: advice
    text: For a first 10k, measure your runs in minutes rather than miles, at an easy pace; Great Run's beginner plan builds the longest run to 50 minutes and its improver plan to 60.
    for: [greatrun-10k-plans]
  - id: tenk-allow-time
    events: [first-10k]
    topic: before you start
    applies: [running]
    use: advice
    text: If you are new to running, give yourself 8 to 12 weeks to get ready for a 10k rather than 6, and if time is short use a run-walk approach.
    for: [greatrun-10k-how-long, greatrun-10k-plans]

  # ---------- open water swimming (added 1 Nov 2026) ----------
  - id: ow-never-alone
    topic: on the day
    applies: [swimming]
    use: safety
    text: Never swim alone in open water. Swim with a friend, a club or at a supervised venue, and tell someone on land where you are going and when you will be back.
    for: [rnli-cold-water-2025, swimeng-stay-safe, usms-open-water, swimeng-hot-weather]
  - id: ow-cold-shock
    topic: warning signs
    applies: [swimming]
    use: safety
    text: In water of 15°C (59°F) or below, cold water shock makes you gasp and breathe fast. Walk in slowly rather than jumping or diving, and give your breathing 60 to 90 seconds to settle before you swim. If you get into difficulty, lean back and float until it passes.
    for: [rnli-cold-water-2025, swimeng-stay-safe, rnli-float, swimeng-hot-weather, oss-cold-water]
  - id: ow-cold-muscles
    topic: warning signs
    applies: [swimming]
    use: safety
    text: Get out if your stroke slows, weakens or loses its rhythm, or if you are shivering or slurring your words; these are signs that you are getting too cold.
    for: [swimeng-stay-safe, usms-open-water, nhs-hypothermia]
  - id: ow-emergency
    topic: warning signs
    applies: [swimming]
    use: safety
    text: If you or someone else is in trouble in the water, call 999 or 112 and ask for the Coastguard (911 in the US). Do not go in after them; tell them to float and throw them something that floats.
    for: [rnli-cold-water-2025, swimeng-stay-safe]
  - id: ow-be-seen
    topic: kit
    applies: [swimming]
    use: advice
    text: Wear a brightly coloured swim cap and tow a float, so boats and other water users can see you and you have something to hold if you tire.
    for: [rnli-cold-water-2025, usms-open-water, swimeng-stay-safe]
  - id: ow-check-conditions
    topic: on the day
    applies: [swimming]
    use: advice
    text: Before you get in, check the forecast, tides, currents and the water itself, and plan where you will get in and out, with a second exit in case.
    for: [rnli-cold-water-2025, swimeng-stay-safe, usms-open-water]
  - id: ow-cold-gradually
    topic: key session
    applies: [swimming]
    use: advice
    text: Keep your first cold-water swims short and close to the shore. Tolerance of cold builds with repeated exposure (a 2024 review of the research found the gasp and fast breathing of cold water shock eased after about four immersions), so keep swimming outdoors as the water cools rather than starting in the coldest months.
    for: [usms-open-water, barwood-2024, oss-cold-water]
  - id: ow-pool-skills
    topic: key session
    applies: [swimming]
    use: rule
    text: Use the pool to practise what open water needs and a pool does not teach you, looking up to sight every five to ten strokes and breathing to both sides, and learn to tread water so you can rest.
    for: [usms-open-water, swimeng-pool-prep]
  - id: ow-float-practise
    topic: key session
    applies: [swimming]
    events: [open-water-mile]
    use: rule
    text: Practise floating on your back at a supervised pool or venue so you can do it without thinking. Tilt your head back with your ears under the water, spread your arms and legs, and keep your breathing calm; your legs may sink, and that is fine. If cold water takes your breath away, float for about a minute until your breathing is under control, then call for help or swim to safety.
    for: [rnli-float, swimeng-hot-weather]
  - id: ow-afterdrop
    topic: on the day
    applies: [swimming]
    events: [open-water-mile]
    use: advice
    text: Your body temperature can keep falling for a while after you get out of cold water (afterdrop), so dry off and get into warm, windproof clothes and a hat as soon as you are out, and move about to make heat. After a short swim a warm shower is enough; avoid very hot water, and do not hold a hot water bottle against numb skin, which burns easily.
    for: [oss-cold-water, rlss-safer-open-water, knechtle-2020]
  - id: ow-rip-current
    topic: on the day
    applies: [swimming]
    events: [open-water-mile]
    use: safety
    text: In the sea, choose a lifeguarded beach and swim between the red and yellow flags. If a rip current carries you out, do not swim against it. If you can stand, wade; if not, float. Then swim or wade parallel to the shore until you are out of the rip before heading in, and raise your hand and shout for help.
    for: [rnli-rip-currents]
  - id: why-specific-swim
    topic: why
    role: specific
    applies: [swimming]
    use: why
    text: Sighting and breathing to both sides are what open water asks of you that a pool does not, and practising them in the pool makes them a habit before you need them.
    short: it turns sighting and two-sided breathing into habits before you need them outdoors
    for: [usms-open-water]

  # ---------- cycling (added 1 Nov 2026) ----------
  - id: cyc-long-ride
    topic: key session
    applies: [cycling]
    use: rule
    text: Build one long ride a week at an easy pace, growing gradually towards the distance of the event; Cycling UK's plan for a 100 km ride takes the long ride from 15 to 25 km up to 90 to 100 km over nine weeks.
    for: [cyclinguk-100km, bc-sofa-50km]
  - id: cyc-talk-test
    topic: intensity
    applies: [cycling]
    use: advice
    text: Judge effort by talking. On easy rides you can hold a conversation, on steady efforts you can manage short sentences, and only the short hard efforts should leave you out of breath.
    for: [cyclinguk-100km, bc-sofa-50km]
  - id: cyc-bike-check
    topic: kit
    applies: [cycling]
    use: advice
    text: Make sure your bike is the right size, comfortable and working, check tyres, brakes and chain before each ride, and carry a spare inner tube, repair kit and pump.
    for: [cyclinguk-100km, bc-sofa-50km]
  - id: cyc-fuel-on-bike
    topic: fuel and drink
    applies: [cycling]
    use: advice
    text: On long rides eat something every 20 to 30 minutes, and carry enough food and drink for the whole ride rather than relying on finding a shop.
    for: [bc-sofa-50km, cyclinguk-100km]
  - id: cyc-warm-up
    topic: on the day
    applies: [cycling]
    use: advice
    text: Start every ride easy, for at least the first five minutes, and build up to your riding pace gradually rather than setting off fast; finish with five to ten minutes of easy, slower riding.
    for: [cyclinguk-100km, bc-warm-up-cool-down]

  # ---------- triathlon (added 3 Nov 2026) ----------
  - id: tri-start-short
    events: [sprint-triathlon]
    topic: before you start
    applies: [swimming]
    use: advice
    text: For a first triathlon, start with a super sprint or a sprint rather than a longer race. A sprint is a 400 metre pool swim or 750 metre open water swim, a 20 km (12.4 mile) ride and a 5 km (3.1 mile) run, and usually takes 75 to 90 minutes.
    for: [britri-distances, tri-ireland-first]
  - id: tri-week-mix
    events: [sprint-triathlon]
    topic: key session
    applies: [swimming]
    use: rule
    text: With three days a week, swim once or twice working on technique, ride once at a steady pace and run twice, one easy and one a little faster. Regular sessions of 30 to 45 minutes are enough to start, rather than long, hard ones.
    for: [tri-ireland-first]
  - id: tri-brick
    events: [sprint-triathlon]
    topic: key session
    applies: [swimming]
    use: rule
    text: Practise running straight after riding (a brick session), starting with about 10 minutes of easy running after a ride. Running off the bike feels heavy and uncoordinated at first, and practising it helps your pacing, your transitions and your confidence.
    for: [tri-ireland-first, usat-brick]
  - id: tri-run-off-bike
    events: [sprint-triathlon]
    topic: on the day
    applies: [swimming]
    use: advice
    text: Ride the last part of the bike leg in an easier gear, then shorten your stride and keep the first half mile to a mile of the run controlled rather than fast.
    for: [usat-brick]
  - id: tri-helmet
    events: [sprint-triathlon]
    topic: on the day
    applies: [swimming]
    use: safety
    text: In transition, put your helmet on and fasten it before you touch your bike, get on only after the mount line, and take it off only once the bike is back on the rack.
    for: [britri-beginners-wales]
  - id: tri-water-confidence
    events: [sprint-triathlon]
    topic: before you start
    applies: [swimming]
    use: advice
    text: Build water confidence in the pool first, working on calm breathing, with lessons if you need them; move to open water later with a wetsuit, a tow float and someone watching.
    for: [tri-ireland-first, usms-open-water]
